name: ClimaAR Predicción Histórica

on:
  workflow_dispatch:
    inputs:
      fecha_inicio:
        description: "Fecha inicial YYYY-MM-DD"
        required: true
        type: string
      fecha_fin:
        description: "Fecha final YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: climaar-historico
  cancel-in-progress: false

jobs:
  prediccion-historica:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar fechas
        env:
          FECHA_INICIO: ${{ inputs.fecha_inicio }}
          FECHA_FIN: ${{ inputs.fecha_fin }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from datetime import date

          inicio = os.environ["FECHA_INICIO"]
          fin = os.environ["FECHA_FIN"]

          try:
              fecha_inicio = date.fromisoformat(inicio)
              fecha_fin = date.fromisoformat(fin)
          except ValueError as exc:
              raise SystemExit(
                  "ERROR: las fechas deben tener formato YYYY-MM-DD"
              ) from exc

          if fecha_inicio > fecha_fin:
              raise SystemExit(
                  "ERROR: fecha_inicio no puede ser posterior a fecha_fin"
              )

          print("Fecha inicial:", fecha_inicio)
          print("Fecha final:", fecha_fin)
          PY

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar/historico \
            data/radar/seguimiento \
            data/ia \
            data/meteorologia \
            logs

      - name: Ejecutar predicción histórica
        env:
          FECHA_INICIO: ${{ inputs.fecha_inicio }}
          FECHA_FIN: ${{ inputs.fecha_fin }}
        run: |
          set -euo pipefail

          if [ ! -f scripts/prediccion_historica.py ]; then
            echo "ERROR: no existe scripts/prediccion_historica.py"
            exit 1
          fi

          python scripts/prediccion_historica.py \
            --fecha-inicio "$FECHA_INICIO" \
            --fecha-fin "$FECHA_FIN"

      - name: Verificar resultados históricos
        run: |
          set -euo pipefail

          encontrados=0

          for archivo in \
            data/radar/seguimiento/prediccion_historica.json \
            data/radar/seguimiento/prediccion_ml_historica.json \
            data/ia/prediccion_historica.json
          do
            if [ -s "$archivo" ]; then
              echo "Resultado encontrado: $archivo"
              encontrados=$((encontrados + 1))
            fi
          done

          if [ "$encontrados" -eq 0 ]; then
            echo "ERROR: no se generó ningún resultado histórico."
            exit 1
          fi

      - name: Validar JSON históricos
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          archivos = [
              Path("data/radar/seguimiento/prediccion_historica.json"),
              Path("data/radar/seguimiento/prediccion_ml_historica.json"),
              Path("data/ia/prediccion_historica.json"),
          ]

          encontrados = 0

          for path in archivos:
              if not path.is_file() or path.stat().st_size == 0:
                  continue

              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: JSON inválido en {path}: {exc}"
                  )

              if not isinstance(data, (dict, list)):
                  raise SystemExit(
                      f"ERROR: estructura inválida en {path}"
                  )

              print(f"OK: {path}")
              encontrados += 1

          if encontrados == 0:
              raise SystemExit(
                  "ERROR: no hay resultados históricos válidos."
              )
          PY

      - name: Validar integridad ClimaAR
        run: |
          set -euo pipefail

          if [ -f scripts/validar_integridad_climaar.py ]; then
            python scripts/validar_integridad_climaar.py
          else
            echo "ERROR: falta scripts/validar_integridad_climaar.py"
            exit 1
          fi

      - name: Preparar artefacto histórico
        run: |
          set -euo pipefail

          rm -rf /tmp/climaar-historico

          mkdir -p /tmp/climaar-historico

          cp -a \
            data/radar \
            /tmp/climaar-historico/

          cp -a \
            data/ia \
            /tmp/climaar-historico/ \
            2>/dev/null || true

          cp -a \
            data/meteorologia \
            /tmp/climaar-historico/ \
            2>/dev/null || true

          cp -a \
            logs \
            /tmp/climaar-historico/ \
            2>/dev/null || true

      - name: Publicar resultados históricos
        uses: actions/upload-artifact@v4
        with:
          name: climaar-prediccion-historica
          path: /tmp/climaar-historico
          retention-days: 30
