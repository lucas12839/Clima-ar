name: Probar Radar SMN

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. DIRECTORIOS
      # ============================================================

      - name: Preparar directorios
        shell: bash
        run: |
          set -e

          mkdir -p data/radar
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar/mascaras


      # ============================================================
      # 3. DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            requests \
            numpy \
            scipy \
            opencv-python-headless \
            Pillow \
            pandas \
            joblib \
            scikit-learn \
            playwright

          playwright install --with-deps chromium


      # ============================================================
      # 4. BUSCAR ÚLTIMO WORKFLOW EXITOSO
      # ============================================================

      - name: Buscar último workflow exitoso
        id: ultimo_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          RUN_ID="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/probar-radar-smn.yml/runs?status=success&per_page=20" \
              --jq ".workflow_runs | map(select(.id != ${GITHUB_RUN_ID})) | .[0].id // empty"
          )"

          if [ -z "$RUN_ID" ]; then
            echo "No existe un workflow exitoso anterior."
            echo "run_id=" >> "$GITHUB_OUTPUT"
          else
            echo "Último workflow exitoso: $RUN_ID"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi


      # ============================================================
      # 5. DESCARGAR HISTORIAL ANTERIOR
      # ============================================================

      - name: Descargar historial anterior
        if: steps.ultimo_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: radar-rma10
          path: /tmp/radar_anterior
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ultimo_run.outputs.run_id }}


      # ============================================================
      # 6. INTEGRAR ESTADO ANTERIOR
      # ============================================================

      - name: Integrar estado anterior
        shell: bash
        run: |
          set -e

          if [ -d "/tmp/radar_anterior/historico" ]; then
            find /tmp/radar_anterior/historico \
              -maxdepth 1 \
              -type f \
              -name "*.png" \
              -exec cp -f {} data/radar/historico/ \;
          fi

          if [ -f "/tmp/radar_anterior/radar_timestamp.txt" ]; then
            cp -f \
              /tmp/radar_anterior/radar_timestamp.txt \
              data/radar/radar_timestamp.txt
          fi

          if [ -f "/tmp/radar_anterior/seguimiento/estado.json" ]; then
            cp -f \
              /tmp/radar_anterior/seguimiento/estado.json \
              data/radar/seguimiento/estado.json
          fi

          if [ -f "/tmp/radar_anterior/seguimiento/seguimiento_temporal.json" ]; then
            cp -f \
              /tmp/radar_anterior/seguimiento/seguimiento_temporal.json \
              data/radar/seguimiento/seguimiento_temporal.json
          fi

          if [ -f "/tmp/radar_anterior/seguimiento/prediccion_ml_rma10.json" ]; then
            cp -f \
              /tmp/radar_anterior/seguimiento/prediccion_ml_rma10.json \
              data/radar/seguimiento/prediccion_ml_rma10.json
          fi

          if [ -f "/tmp/radar_anterior/seguimiento/prediccion_evolucion.json" ]; then
            cp -f \
              /tmp/radar_anterior/seguimiento/prediccion_evolucion.json \
              data/radar/seguimiento/prediccion_evolucion.json
          fi

          if [ -f "/tmp/radar_anterior/seguimiento/predicciones_pendientes.json" ]; then
            cp -f \
              /tmp/radar_anterior/seguimiento/predicciones_pendientes.json \
              data/radar/seguimiento/predicciones_pendientes.json
          fi

          echo "======================================"
          echo "ESTADO ANTERIOR INTEGRADO"
          echo "======================================"

          echo ""
          echo "Frames históricos:"

          find data/radar/historico \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | sort \
            | tail -20

          echo ""
          echo "Archivos de seguimiento:"

          find data/radar/seguimiento \
            -maxdepth 1 \
            -type f \
            | sort


      # ============================================================
      # 7. GUARDAR TIMESTAMP ANTERIOR
      # ============================================================

      - name: Guardar timestamp anterior
        shell: bash
        run: |
          set -e

          rm -f /tmp/radar_timestamp_anterior.txt

          if [ -f "data/radar/radar_timestamp.txt" ]; then
            cp -f \
              data/radar/radar_timestamp.txt \
              /tmp/radar_timestamp_anterior.txt

            echo "Timestamp anterior:"
            cat /tmp/radar_timestamp_anterior.txt
          else
            echo "No existe timestamp anterior."
          fi


      # ============================================================
      # 8. CAPTURAR RMA10
      # ============================================================

      - name: Capturar radar RMA10
        id: captura
        timeout-minutes: 8
        shell: bash
        run: |
          set -e

          python scraper/capturar_radar_smn.py


      # ============================================================
      # 9. DETERMINAR SI HAY FRAME NUEVO
      # ============================================================

      - name: Determinar estado de captura
        id: frame
        if: steps.captura.outcome == 'success'
        shell: bash
        run: |
          set -e

          STATUS="data/radar/captura_estado.txt"

          if [ ! -f "$STATUS" ]; then
            echo "ERROR: falta captura_estado.txt"
            exit 1
          fi

          echo "======================================"
          echo "ESTADO DE CAPTURA"
          echo "======================================"

          cat "$STATUS"

          if grep -q "^NUEVO" "$STATUS"; then
            echo "new_frame=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "FRAME NUEVO."
            echo "Continúa el procesamiento."

          elif grep -q "^SIN_CAMBIO" "$STATUS"; then
            echo "new_frame=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "SIN CAMBIO."
            echo "Se conserva el radar actual."
            echo "No se reprocesará."

          else
            echo "ERROR: estado de captura desconocido."
            exit 1
          fi


      # ============================================================
      # 10. VERIFICAR FRAME NUEVO
      # ============================================================

      - name: Verificar captura nueva
        if: >
          steps.captura.outcome == 'success' &&
          steps.frame.outputs.new_frame == 'true'
        shell: bash
        run: |
          set -e

          test -f data/radar/actual.png
          test -f data/radar/radar_timestamp.txt

          COUNT=$(
            find data/radar/historico \
              -maxdepth 1 \
              -type f \
              -name "*.png" \
              | wc -l
          )

          echo "Frames históricos: $COUNT"

          if [ "$COUNT" -lt 3 ]; then
            echo "ERROR: menos de 3 frames históricos."
            exit 1
          fi


      # ============================================================
      # 11. GENERAR MÁSCARA ESTÁTICA
      # ============================================================

      - name: Generar máscara estática
        if: steps.frame.outputs.new_frame == 'true'
        timeout-minutes: 3
        shell: bash
        run: |
          set -e

          python scripts/generar_mascara_estatica.py


      # ============================================================
      # 12. PROCESAR RADAR
      # ============================================================

      - name: Procesar radar
        if: steps.frame.outputs.new_frame == 'true'
        timeout-minutes: 3
        shell: bash
        run: |
          set -e

          python scripts/procesador_radar.py


      # ============================================================
      # 13. VERIFICAR CONTINUIDAD
      # ============================================================

      - name: Verificar continuidad
        id: continuidad
        if: steps.frame.outputs.new_frame == 'true'
        shell: bash
        run: |

          set -e

          python - <<'PY'

          import os

          from pathlib import Path
          from datetime import datetime, timezone


          anterior_path = Path(
              "/tmp/radar_timestamp_anterior.txt"
          )

          radar_path = Path(
              "data/radar/radar_timestamp.txt"
          )

          salida = os.environ[
              "GITHUB_OUTPUT"
          ]


          def parse_ts(value):

              if not value:
                  return None

              value = str(
                  value
              ).strip()

              if value.endswith("Z"):

                  value = (
                      value[:-1]
                      + "+00:00"
                  )

              try:

                  dt = datetime.fromisoformat(
                      value
                  )

              except Exception:

                  return None

              if dt.tzinfo is None:

                  dt = dt.replace(
                      tzinfo=timezone.utc
                  )

              return dt.astimezone(
                  timezone.utc
              )


          anterior_ts = None
          radar_ts = None


          if anterior_path.exists():

              anterior_ts = parse_ts(
                  anterior_path.read_text(
                      encoding="utf-8"
                  )
              )


          if radar_path.exists():

              radar_ts = parse_ts(
                  radar_path.read_text(
                      encoding="utf-8"
                  )
              )


          print(
              "Timestamp anterior:",
              anterior_ts
          )

          print(
              "Timestamp radar nuevo:",
              radar_ts
          )


          accepted = False


          if radar_ts is None:

              print(
                  "ERROR: timestamp radar inválido."
              )

          elif anterior_ts is None:

              accepted = True

              print(
                  "No había timestamp anterior."
              )

              print(
                  "Radar aceptado como inicio."
              )

          else:

              intervalo = (
                  radar_ts -
                  anterior_ts
              ).total_seconds() / 60.0

              print(
                  f"Intervalo: {intervalo:.1f} min"
              )


              if intervalo <= 0:

                  print(
                      "RADAR DESCARTADO:"
                      " repetido o atrasado."
                  )

                  Path(
                      "data/radar/FRAME_DESCARTADO.txt"
                  ).write_text(
                      (
                          "Radar descartado.\n"
                          f"Anterior: "
                          f"{anterior_ts.isoformat()}\n"
                          f"Radar: "
                          f"{radar_ts.isoformat()}\n"
                          f"Intervalo: "
                          f"{intervalo:.1f} min\n"
                      ),
                      encoding="utf-8"
                  )

              else:

                  accepted = True

                  print(
                      "RADAR ACEPTADO."
                  )


          Path(
              "data/radar/continuidad.txt"
          ).write_text(
              (
                  "accepted="
                  + (
                      "true"
                      if accepted
                      else
                      "false"
                  )
                  + "\n"
              ),
              encoding="utf-8"
          )


          with open(
              salida,
              "a",
              encoding="utf-8"
          ) as f:

              f.write(
                  "accepted="
                  + (
                      "true"
                      if accepted
                      else
                      "false"
                  )
                  + "\n"
              )


          print(
              "Continuidad aceptada:",
              accepted
          )

          PY


      # ============================================================
      # 14. PREPARAR HISTORIAL CONTINUO
      # ============================================================

      - name: Preparar historial continuo
        if: steps.continuidad.outputs.accepted == 'true'
        shell: bash
        run: |

          set -e

          python - <<'PY'

          from pathlib import Path
          from datetime import datetime, timezone

          import shutil


          HIST = Path(
              "data/radar/historico"
          )

          BACKUP = Path(
              "data/radar/historico_tracking_backup"
          )


          BACKUP.mkdir(
              parents=True,
              exist_ok=True
          )


          ts_file = Path(
              "data/radar/radar_timestamp.txt"
          )


          raw = ts_file.read_text(
              encoding="utf-8"
          ).strip()


          if raw.endswith("Z"):

              raw = (
                  raw[:-1]
                  + "+00:00"
              )


          radar_ts = datetime.fromisoformat(
              raw
          )


          if radar_ts.tzinfo is None:

              radar_ts = radar_ts.replace(
                  tzinfo=timezone.utc
              )


          radar_ts = radar_ts.astimezone(
              timezone.utc
          )


          def parse_filename(path):

              name = path.stem

              formatos = (
                  "%Y%m%d%H%M%S",
                  "%Y%m%d_%H%M%S",
              )

              for formato in formatos:

                  try:

                      return datetime.strptime(
                          name,
                          formato
                      ).replace(
                          tzinfo=timezone.utc
                      )

                  except ValueError:

                      pass

              return None


          frames = []


          for path in HIST.glob(
              "*.png"
          ):

              stamp = parse_filename(
                  path
              )

              if stamp is None:
                  continue

              if stamp > radar_ts:
                  continue

              frames.append(
                  (
                      stamp,
                      path
                  )
              )


          frames.sort(
              key=lambda x: x[0],
              reverse=True
          )


          seleccionados = []

          anterior = radar_ts


          for stamp, path in frames:

              diferencia = (
                  anterior -
                  stamp
              ).total_seconds() / 60.0


              if diferencia < 0:
                  continue


              if diferencia > 60:

                  print(
                      "CORTE:",
                      f"{diferencia:.1f} min"
                  )

                  break


              seleccionados.append(
                  path
              )

              anterior = stamp


              if len(
                  seleccionados
              ) >= 6:

                  break


          usados = {
              p.resolve()
              for p in seleccionados
          }


          print()
          print(
              "Frames seleccionados:"
          )


          for path in reversed(
              seleccionados
          ):

              print(
                  " ",
                  path.name
              )


          print(
              "Total:",
              len(seleccionados)
          )


          for stamp, path in frames:

              if path.resolve() in usados:
                  continue

              destino = (
                  BACKUP /
                  path.name
              )

              if destino.exists():

                  destino.unlink()

              shutil.move(
                  str(path),
                  str(destino)
              )


          print(
              "Historial listo."
          )

          PY


      # ============================================================
      # 15. SEGUIMIENTO TEMPORAL
      # ============================================================

      - name: Seguimiento temporal
        id: seguimiento
        if: steps.continuidad.outputs.accepted == 'true'
        timeout-minutes: 4
        shell: bash
        run: |

          set -e

          python seguimiento_temporal.py


      # ============================================================
      # 16. RESTAURAR HISTORIAL
      # ============================================================

      - name: Restaurar historial
        if: steps.continuidad.outputs.accepted == 'true'
        shell: bash
        run: |

          set -e

          BACKUP="data/radar/historico_tracking_backup"
          HIST="data/radar/historico"


          if [ -d "$BACKUP" ]; then

            find "$BACKUP" \
              -maxdepth 1 \
              -type f \
              -name "*.png" \
              -exec mv -f {} "$HIST/" \;

          fi


          rm -rf "$BACKUP"


          echo "Historial restaurado."


      # ============================================================
      # 17. PREDICCIÓN ML
      # ============================================================

      - name: Predicción ML
        id: prediccion_ml
        if: steps.continuidad.outputs.accepted == 'true'
        timeout-minutes: 5
        shell: bash
        run: |

          set -e

          if [ -f "scripts/prediccion_rma10_ml.py" ]; then

            python scripts/prediccion_rma10_ml.py

          else

            echo "No existe scripts/prediccion_rma10_ml.py"

          fi


      # ============================================================
      # 18. PREDICCIÓN DE EVOLUCIÓN
      # ============================================================

      - name: Predicción de evolución
        id: prediccion_evolucion
        if: steps.continuidad.outputs.accepted == 'true'
        timeout-minutes: 5
        shell: bash
        run: |

          set -e

          if [ -f "scripts/prediccion_evolucion.py" ]; then

            python scripts/prediccion_evolucion.py

          else

            echo "No existe scripts/prediccion_evolucion.py"

          fi


      # ============================================================
      # 19. RESUMEN FINAL
      # ============================================================

      - name: Resumen final
        if: always()
        shell: bash
        run: |

          echo "======================================"
          echo "RESUMEN FINAL RMA10"
          echo "======================================"


          if [ -f "data/radar/radar_timestamp.txt" ]; then

            echo "RADAR:"

            cat data/radar/radar_timestamp.txt

          fi


          if [ -f "data/radar/captura_estado.txt" ]; then

            echo ""
            echo "CAPTURA:"

            cat data/radar/captura_estado.txt

          fi


          if [ -f "data/radar/continuidad.txt" ]; then

            echo ""
            echo "CONTINUIDAD:"

            cat data/radar/continuidad.txt

          fi


          if [ -f "data/radar/resultado_procesamiento.json" ]; then

            echo ""
            echo "PROCESAMIENTO:"

            python - <<'PY'

          import json

          from pathlib import Path


          p = Path(
              "data/radar/resultado_procesamiento.json"
          )


          try:

              d = json.loads(
                  p.read_text(
                      encoding="utf-8"
                  )
              )


              print(
                  "Núcleos:",
                  d.get(
                      "nucleos_detectados",
                      0
                  )
              )


              print(
                  "Núcleos dinámicos:",
                  d.get(
                      "nucleos_dinamicos",
                      0
                  )
              )


              print(
                  "Estado:",
                  d.get(
                      "estado_general",
                      "SIN_DATOS"
                  )
              )


          except Exception as exc:

              print(
                  "No se pudo leer resultado:",
                  exc
              )

          PY

          fi


          if [ -f "data/radar/seguimiento/estado.json" ]; then

            echo ""
            echo "SEGUIMIENTO: ESTADO DISPONIBLE"

          else

            echo ""
            echo "SEGUIMIENTO: SIN ESTADO"

          fi


          ML_FILE="data/radar/seguimiento/prediccion_ml_rma10.json"


          if [ -f "$ML_FILE" ]; then

            echo "PREDICCIÓN ML: DISPONIBLE"

            python - <<'PY'

          import json

          from pathlib import Path


          p = Path(
              "data/radar/seguimiento/prediccion_ml_rma10.json"
          )


          try:

              d = json.loads(
                  p.read_text(
                      encoding="utf-8"
                  )
              )

              print(
                  "Tracks analizados:",
                  d.get(
                      "tracks_analizados",
                      0
                  )
              )

              print(
                  "Horizontes:",
                  d.get(
                      "horizontes_min",
                      []
                  )
              )

          except Exception as exc:

              print(
                  "No se pudo leer predicción ML:",
                  exc
              )

          PY

          else

            echo "PREDICCIÓN ML: NO GENERADA"

          fi


          EVOLUTION_FILE="data/radar/seguimiento/prediccion_evolucion.json"


          if [ -f "$EVOLUTION_FILE" ]; then

            echo "PREDICCIÓN DE EVOLUCIÓN: DISPONIBLE"

            python - <<'PY'

          import json

          from pathlib import Path


          p = Path(
              "data/radar/seguimiento/prediccion_evolucion.json"
          )


          try:

              d = json.loads(
                  p.read_text(
                      encoding="utf-8"
                  )
              )

              print(
                  "Predicciones:",
                  len(
                      d.get(
                          "predicciones",
                          []
                      )
                  )
              )

              print(
                  "Validaciones:",
                  len(
                      d.get(
                          "validaciones",
                          []
                      )
                  )
              )

          except Exception as exc:

              print(
                  "No se pudo leer predicción de evolución:",
                  exc
              )

          PY

          else

            echo "PREDICCIÓN DE EVOLUCIÓN: NO GENERADA"

          fi


          PENDING_FILE="data/radar/seguimiento/predicciones_pendientes.json"


          if [ -f "$PENDING_FILE" ]; then

            echo "PREDICCIONES PENDIENTES: DISPONIBLES"

            python - <<'PY'

          import json

          from pathlib import Path


          p = Path(
              "data/radar/seguimiento/predicciones_pendientes.json"
          )


          try:

              d = json.loads(
                  p.read_text(
                      encoding="utf-8"
                  )
              )

              if isinstance(
                  d,
                  list
              ):

                  print(
                      "Pendientes:",
                      len(d)
                  )

              elif isinstance(
                  d,
                  dict
              ):

                  items = d.get(
                      "predicciones",
                      d.get(
                          "pendientes",
                          []
                      )
                  )

                  print(
                      "Pendientes:",
                      len(items)
                      if isinstance(
                          items,
                          list
                      )
                      else 0
                  )

          except Exception as exc:

              print(
                  "No se pudo leer pendientes:",
                  exc
              )

          PY

          else

            echo "PREDICCIONES PENDIENTES: NO EXISTEN"

          fi


      # ============================================================
      # 20. GUARDAR ARTEFACTO RMA10
      # ============================================================

      - name: Guardar artefacto RMA10
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: data/radar
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # 21. GUARDAR ESTADO EN REPOSITORIO
      # ============================================================

      - name: Guardar estado en repositorio
        if: steps.frame.outputs.new_frame == 'true'
        shell: bash
        run: |

          set -e


          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          FILES=(

            "data/radar/actual.png"

            "data/radar/radar_timestamp.txt"

            "data/radar/captura_estado.txt"

            "data/radar/continuidad.txt"

            "data/radar/resultado_procesamiento.json"

            "data/radar/mascara_ecos_estaticos.json"

            "data/radar/mascara_ecos_estaticos.png"

            "data/radar/mascara_ecos_estaticos_confianza.png"

            "data/radar/seguimiento/estado.json"

            "data/radar/seguimiento/seguimiento_temporal.json"

            "data/radar/seguimiento/prediccion_ml_rma10.json"

            "data/radar/seguimiento/prediccion_evolucion.json"

            "data/radar/seguimiento/predicciones_pendientes.json"

          )


          for FILE in "${FILES[@]}"; do

            if [ -f "$FILE" ]; then

              echo "Agregando: $FILE"

              git add "$FILE"

            else

              echo "No existe, se omite: $FILE"

            fi

          done


          if git diff --cached --quiet; then

            echo "No hay cambios para guardar."

          else

            git commit \
              -m "Actualizar estado RMA10"

            git push

          fi
