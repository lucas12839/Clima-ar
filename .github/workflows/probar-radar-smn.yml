name: Probar Radar SMN

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: radar-rma10
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sincronizar main antes de restaurar estado
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          echo "Commit utilizado:"
          git rev-parse HEAD

          if [ -f .climaar/estado_rma10.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          p = Path(".climaar/estado_rma10.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          print("timestamp:", d.get("ultimo_radar_timestamp"))
          print("tracks:", len(d.get("tracks", [])))
          print("siguiente_track_id:", d.get("siguiente_track_id"))
          PY
          else
            echo "No existe estado persistente previo."
          fi

      - name: Preparar directorios
        run: |
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar/procesado
          mkdir -p data/radar/prediccion
          mkdir -p .climaar

      - name: Restaurar estado persistente
        run: |
          set -e

          if [ -f .climaar/estado_rma10.json ]; then
            cp \
              .climaar/estado_rma10.json \
              data/radar/seguimiento/estado.json

            echo "Estado persistente restaurado."

            python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/radar/seguimiento/estado.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          print("timestamp restaurado:", d.get("ultimo_radar_timestamp"))
          print("tracks restaurados:", len(d.get("tracks", [])))
          print("siguiente_track_id:", d.get("siguiente_track_id"))
          PY
          else
            echo "No existe estado persistente previo. Se inicia estado nuevo."
          fi

      - name: Recuperar histórico desde artefactos anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf /tmp/radar_artifacts
          mkdir -p /tmp/radar_artifacts

          gh run list \
            --workflow probar-radar-smn.yml \
            --limit 20 \
            --json databaseId,status,conclusion \
            --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' \
            > /tmp/radar_runs.txt || true

          while read -r run_id; do
            [ -z "$run_id" ] && continue

            gh run download "$run_id" \
              -n radar-rma10 \
              -D "/tmp/radar_artifacts/$run_id" \
              2>/dev/null || true
          done < /tmp/radar_runs.txt

          find /tmp/radar_artifacts \
            -type f \
            -path '*/historico/*.png' \
            -exec cp -n {} data/radar/historico/ \; \
            2>/dev/null || true

          find /tmp/radar_artifacts \
            -type f \
            -name 'predicciones_pendientes.json' \
            -exec cp -n {} data/radar/seguimiento/ \; \
            2>/dev/null || true

          echo "Histórico disponible:"
          find data/radar/historico \
            -maxdepth 1 \
            -type f \
            -name '*.png' | wc -l

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capturar radar RMA10
        run: |
          set -e

          python scraper/capturar_radar_smn.py

          test -f data/radar/actual.png

          cp \
            data/radar/actual.png \
            data/radar/latest.png

          echo "Radar capturado correctamente."

          ls -lh data/radar/actual.png
          ls -lh data/radar/latest.png

          echo "Timestamp capturado:"
          cat data/radar/radar_timestamp.txt

      - name: Aprender ecos estáticos
        run: |
          set -e

          python scripts/generar_mascara_estatica.py

          test -f data/radar/mascara_ecos_estaticos.png
          test -f data/radar/mascara_ecos_estaticos.json
          test -f data/radar/mascara_ecos_estaticos_confianza.png

      - name: Procesar radar
        run: |
          set -e

          python scripts/procesador_radar.py

          test -s data/radar/resultado_procesamiento.json

          echo "Resultado de procesamiento generado correctamente."

          ls -lh \
            data/radar/resultado_procesamiento.json

      - name: Verificar continuidad antes del seguimiento
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime

          estado = Path(
              "data/radar/seguimiento/estado.json"
          )

          timestamp = Path(
              "data/radar/radar_timestamp.txt"
          )

          if not estado.exists():
              print("No existe estado previo.")
              raise SystemExit(0)

          if not timestamp.exists():
              print("No existe timestamp del radar.")
              raise SystemExit(1)

          d = json.loads(
              estado.read_text(
                  encoding="utf-8"
              )
          )

          anterior = d.get(
              "ultimo_radar_timestamp"
          )

          actual = timestamp.read_text(
              encoding="utf-8"
          ).strip()

          print(
              "Timestamp estado:",
              anterior
          )

          print(
              "Timestamp radar:",
              actual
          )

          if anterior:
              dt_anterior = datetime.fromisoformat(
                  anterior.replace(
                      "Z",
                      "+00:00"
                  )
              )

              dt_actual = datetime.fromisoformat(
                  actual.replace(
                      "Z",
                      "+00:00"
                  )
              )

              intervalo = (
                  dt_actual - dt_anterior
              ).total_seconds() / 60

              print(
                  "Intervalo:",
                  round(intervalo, 2),
                  "minutos"
              )

              if intervalo < 0:
                  raise SystemExit(
                      "ERROR: el radar está atrasado respecto al estado."
                  )

              if intervalo > 30:
                  print(
                      "AVISO: intervalo mayor a 30 minutos."
                  )

          print(
              "Tracks antes del seguimiento:",
              len(d.get("tracks", []))
          )

          print(
              "Siguiente ID:",
              d.get("siguiente_track_id")
          )
          PY

      - name: Seguimiento temporal
        run: |
          set -e

          python seguimiento_temporal.py

          test -s \
            data/radar/seguimiento/estado.json

          test -s \
            data/radar/seguimiento/seguimiento_temporal.json

      - name: Mostrar resultado del seguimiento
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/radar/seguimiento/estado.json"
          )

          d = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          tracks = d.get(
              "tracks",
              []
          )

          activos = [
              t
              for t in tracks
              if t.get("activo")
          ]

          mov = [
              t
              for t in activos
              if t.get(
                  "velocidad_pixeles_min",
                  0
              ) > 0
          ]

          print(
              "timestamp:",
              d.get(
                  "ultimo_radar_timestamp"
              )
          )

          print(
              "tracks:",
              len(tracks)
          )

          print(
              "activos:",
              len(activos)
          )

          print(
              "con movimiento:",
              len(mov)
          )

          print(
              "siguiente_track_id:",
              d.get(
                  "siguiente_track_id"
              )
          )
          PY

      - name: Predicción de evolución
        run: |
          set -e

          python prediccion_evolucion.py

          test -s \
            data/radar/seguimiento/prediccion_evolucion.json

      - name: Preparar archivos generados
        run: |
          set -e

          mkdir -p /tmp/climaar_radar_generado

          cp \
            data/radar/seguimiento/estado.json \
            /tmp/climaar_radar_generado/estado_rma10.json

          cp \
            data/radar/mascara_ecos_estaticos.json \
            /tmp/climaar_radar_generado/mascara_ecos_estaticos.json

          cp \
            data/radar/mascara_ecos_estaticos.png \
            /tmp/climaar_radar_generado/mascara_ecos_estaticos.png

          cp \
            data/radar/mascara_ecos_estaticos_confianza.png \
            /tmp/climaar_radar_generado/mascara_ecos_estaticos_confianza.png

          cp \
            data/radar/radar_timestamp.txt \
            /tmp/climaar_radar_generado/radar_timestamp.txt

          echo "Archivos generados protegidos."

      - name: Sincronizar main antes de guardar
        run: |
          set -e

          git fetch origin main
          git reset --hard origin/main

          mkdir -p .climaar
          mkdir -p data/radar

          cp \
            /tmp/climaar_radar_generado/estado_rma10.json \
            .climaar/estado_rma10.json

          cp \
            /tmp/climaar_radar_generado/mascara_ecos_estaticos.json \
            data/radar/mascara_ecos_estaticos.json

          cp \
            /tmp/climaar_radar_generado/mascara_ecos_estaticos.png \
            data/radar/mascara_ecos_estaticos.png

          cp \
            /tmp/climaar_radar_generado/mascara_ecos_estaticos_confianza.png \
            data/radar/mascara_ecos_estaticos_confianza.png

          cp \
            /tmp/climaar_radar_generado/radar_timestamp.txt \
            data/radar/radar_timestamp.txt

          echo "Archivos generados restaurados sobre main actualizado."

      - name: Guardar estado persistente
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .climaar/estado_rma10.json \
            data/radar/mascara_ecos_estaticos.json \
            data/radar/mascara_ecos_estaticos.png \
            data/radar/mascara_ecos_estaticos_confianza.png \
            data/radar/radar_timestamp.txt

          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit \
              -m "Actualizar estado RMA10"
          fi

          for intento in 1 2 3; do
            echo "Intento de push $intento/3"

            if git push origin HEAD:main; then
              echo "Estado RMA10 guardado correctamente."
              exit 0
            fi

            echo "Push rechazado. Sincronizando nuevamente..."

            git fetch origin main

            git reset --hard origin/main

            cp \
              /tmp/climaar_radar_generado/estado_rma10.json \
              .climaar/estado_rma10.json

            cp \
              /tmp/climaar_radar_generado/mascara_ecos_estaticos.json \
              data/radar/mascara_ecos_estaticos.json

            cp \
              /tmp/climaar_radar_generado/mascara_ecos_estaticos.png \
              data/radar/mascara_ecos_estaticos.png

            cp \
              /tmp/climaar_radar_generado/mascara_ecos_estaticos_confianza.png \
              data/radar/mascara_ecos_estaticos_confianza.png

            cp \
              /tmp/climaar_radar_generado/radar_timestamp.txt \
              data/radar/radar_timestamp.txt

            git add \
              .climaar/estado_rma10.json \
              data/radar/mascara_ecos_estaticos.json \
              data/radar/mascara_ecos_estaticos.png \
              data/radar/mascara_ecos_estaticos_confianza.png \
              data/radar/radar_timestamp.txt

            git commit \
              -m "Actualizar estado RMA10"

            sleep 2
          done

          echo "No se pudo guardar el estado."
          exit 1

      - name: Verificar estado final
        run: |
          set -e

          test -s \
            .climaar/estado_rma10.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              ".climaar/estado_rma10.json"
          )

          d = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          print("=== ESTADO FINAL ===")

          print(
              "timestamp:",
              d.get(
                  "ultimo_radar_timestamp"
              )
          )

          print(
              "tracks:",
              len(
                  d.get(
                      "tracks",
                      []
                  )
              )
          )

          print(
              "siguiente_track_id:",
              d.get(
                  "siguiente_track_id"
              )
          )
          PY

      - name: Subir artefacto radar-rma10
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/actual.png
            data/radar/latest.png
            data/radar/radar_timestamp.txt
            data/radar/resultado_procesamiento.json
            data/radar/mascara_ecos_estaticos.json
            data/radar/mascara_ecos_estaticos.png
            data/radar/mascara_ecos_estaticos_confianza.png
            data/radar/historico/*.png
            data/radar/seguimiento/**
            data/radar/procesado/**
            data/radar/prediccion/**
          retention-days: 7
