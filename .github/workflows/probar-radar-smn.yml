name: Probar Radar SMN

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: radar-rma10
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sincronizar main y preparar estado
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p \
            data/radar \
            data/radar/historico \
            data/radar/seguimiento \
            data/radar/procesado \
            data/radar/prediccion \
            data/radar/mascaras \
            .climaar

          if [ -f .climaar/estado_rma10.json ]; then
            cp .climaar/estado_rma10.json \
              data/radar/seguimiento/estado.json
          fi

      - name: Recuperar histórico desde ejecuciones anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf /tmp/radar_artifacts
          mkdir -p /tmp/radar_artifacts

          gh run list \
            --workflow probar-radar-smn.yml \
            --limit 20 \
            --json databaseId,status,conclusion \
            --jq '.[] |
              select(.status == "completed" and .conclusion == "success") |
              .databaseId' \
            > /tmp/radar_runs.txt || true

          while read -r run_id; do
            [ -z "$run_id" ] && continue

            gh run download "$run_id" \
              -n radar-rma10 \
              -D "/tmp/radar_artifacts/$run_id" \
              2>/dev/null || true
          done < /tmp/radar_runs.txt

          find /tmp/radar_artifacts \
            -type f \
            -path '*/historico/*.png' \
            -exec cp -n {} data/radar/historico/ \; \
            2>/dev/null || true

          find /tmp/radar_artifacts \
            -type f \
            -name 'predicciones_pendientes.json' \
            -exec cp -n {} data/radar/seguimiento/ \; \
            2>/dev/null || true

          echo "Frames históricos: $(find data/radar/historico -maxdepth 1 -type f -name '*.png' | wc -l)"

      - name: Instalar dependencias
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capturar radar RMA10
        run: |
          set -e

          python scraper/capturar_radar_smn.py

          test -s data/radar/actual.png
          cp data/radar/actual.png data/radar/latest.png

          test -s data/radar/radar_timestamp.txt

          echo "Radar: $(cat data/radar/radar_timestamp.txt)"

      - name: Determinar si existe frame nuevo
        id: frame
        shell: bash
        run: |
          set -e

          NEW_TS="$(cat data/radar/radar_timestamp.txt)"
          OLD_TS=""

          if [ -f data/radar/ultimo_radar_timestamp.txt ]; then
            OLD_TS="$(cat data/radar/ultimo_radar_timestamp.txt)"
          fi

          echo "Anterior: ${OLD_TS:-ninguno}"
          echo "Nuevo: $NEW_TS"

          if [ -n "$OLD_TS" ] && [ "$NEW_TS" = "$OLD_TS" ]; then
            echo "new_frame=false" >> "$GITHUB_OUTPUT"
            echo "No hay frame nuevo."
          else
            echo "new_frame=true" >> "$GITHUB_OUTPUT"
            echo "Hay frame nuevo."
          fi

      - name: Verificar frame capturado
        if: steps.frame.outputs.new_frame == 'true'
        run: |
          set -e

          test -s data/radar/actual.png
          test -s data/radar/latest.png
          test -s data/radar/radar_timestamp.txt

      - name: Verificar continuidad temporal
        id: continuidad
        if: steps.frame.outputs.new_frame == 'true'
        shell: bash
        run: |
          set -e

          NEW_TS="$(cat data/radar/radar_timestamp.txt)"
          OLD_TS=""

          if [ -f data/radar/ultimo_radar_timestamp.txt ]; then
            OLD_TS="$(cat data/radar/ultimo_radar_timestamp.txt)"
          fi

          if [ -z "$OLD_TS" ]; then
            echo "Primer frame disponible."
            echo "accepted=true" >> "$GITHUB_OUTPUT"
            echo "intervalo_segundos=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_EPOCH="$(date -u -d "$NEW_TS" +%s)"
          OLD_EPOCH="$(date -u -d "$OLD_TS" +%s)"

          INTERVALO=$((NEW_EPOCH - OLD_EPOCH))

          echo "Intervalo temporal: ${INTERVALO}s"

          if [ "$INTERVALO" -le 0 ]; then
            echo "ERROR: timestamp no avanza."
            echo "accepted=false" >> "$GITHUB_OUTPUT"
            echo "intervalo_segundos=$INTERVALO" >> "$GITHUB_OUTPUT"

            {
              echo "Frame descartado."
              echo "Anterior: $OLD_TS"
              echo "Nuevo: $NEW_TS"
              echo "Intervalo: $INTERVALO segundos"
            } > data/radar/FRAME_DESCARTADO.txt

            exit 1
          fi

          if [ "$INTERVALO" -gt 1800 ]; then
            echo "ERROR: salto temporal excesivo: ${INTERVALO}s"
            echo "accepted=false" >> "$GITHUB_OUTPUT"
            echo "intervalo_segundos=$INTERVALO" >> "$GITHUB_OUTPUT"

            {
              echo "Frame descartado por salto temporal."
              echo "Anterior: $OLD_TS"
              echo "Nuevo: $NEW_TS"
              echo "Intervalo: $INTERVALO segundos"
            } > data/radar/FRAME_DESCARTADO.txt

            exit 1
          fi

          echo "accepted=true" >> "$GITHUB_OUTPUT"
          echo "intervalo_segundos=$INTERVALO" >> "$GITHUB_OUTPUT"

          echo "$NEW_TS" > data/radar/continuidad.txt

      - name: Guardar timestamp aceptado
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          cp data/radar/radar_timestamp.txt \
             data/radar/ultimo_radar_timestamp.txt

      - name: Generar máscara estática
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          set -e

          python scripts/generar_mascara_estatica.py

          test -s data/radar/mascara_ecos_estaticos.json
          test -s data/radar/mascara_ecos_estaticos.png
          test -s data/radar/mascara_ecos_estaticos_confianza.png

      - name: Procesar radar
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          set -e

          python scripts/procesar_radar.py

          test -s data/radar/resultado_procesamiento.json

      - name: Preparar historial continuo
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          set -e

          cp data/radar/actual.png \
             "data/radar/historico/$(cat data/radar/radar_timestamp.txt | tr ': ' '__').png"

          ls -lah data/radar/historico | tail -20

      - name: Seguimiento temporal
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          set -e

          python seguimiento_temporal.py

          test -s data/radar/seguimiento/seguimiento_temporal.json

      - name: Restaurar estado de seguimiento
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          set -e

          if [ -f data/radar/seguimiento/estado.json ]; then
            cp data/radar/seguimiento/estado.json \
               .climaar/estado_rma10.json
          fi

      - name: Predicción ML RMA10
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          set -e

          python scripts/prediccion_rma10_ml.py

          test -s data/radar/seguimiento/prediccion_evolucion.json

      - name: Evolución temporal
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          set -e

          if [ -f scripts/prediccion_evolucion.py ]; then
            python scripts/prediccion_evolucion.py
          else
            echo "prediccion_evolucion.py no disponible; se conserva la salida ML existente."
          fi

      - name: Resumen
        if: always()
        run: |
          echo "========================================"
          echo "CLIMAAR RMA10"
          echo "========================================"

          if [ -f data/radar/radar_timestamp.txt ]; then
            echo "Radar: $(cat data/radar/radar_timestamp.txt)"
          fi

          echo "Frame nuevo: ${{ steps.frame.outputs.new_frame }}"
          echo "Continuidad: ${{ steps.continuidad.outputs.accepted }}"
          echo "Intervalo: ${{ steps.continuidad.outputs.intervalo_segundos }}s"

          echo "========================================"

      - name: Preparar artefacto
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          set -e

          mkdir -p /tmp/radar-rma10

          cp -a data/radar/. /tmp/radar-rma10/

          if [ -f .climaar/estado_rma10.json ]; then
            mkdir -p /tmp/radar-rma10/.climaar
            cp .climaar/estado_rma10.json \
               /tmp/radar-rma10/.climaar/
          fi

      - name: Subir artefacto RMA10
        if: steps.continuidad.outputs.accepted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: /tmp/radar-rma10
          retention-days: 7

      - name: Guardar estado en repositorio
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          set -e

          mkdir -p .climaar

          if [ -f data/radar/seguimiento/estado.json ]; then
            cp data/radar/seguimiento/estado.json \
               .climaar/estado_rma10.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/radar/actual.png \
            data/radar/latest.png \
            data/radar/radar_timestamp.txt \
            data/radar/ultimo_radar_timestamp.txt \
            data/radar/continuidad.txt \
            data/radar/resultado_procesamiento.json \
            data/radar/mascara_ecos_estaticos.json \
            data/radar/mascara_ecos_estaticos.png \
            data/radar/mascara_ecos_estaticos_confianza.png \
            data/radar/seguimiento \
            data/radar/prediccion \
            data/radar/procesado \
            data/radar/historico \
            .climaar/estado_rma10.json

          git diff --cached --quiet || \
            git commit -m "ClimaAR: actualizar RMA10"

          git push
