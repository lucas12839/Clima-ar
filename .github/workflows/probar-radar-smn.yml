name: Probar Radar SMN

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DIRECTORIOS
      # ============================================================

      - name: Preparar directorios
        run: |
          mkdir -p data/radar
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar/mascaras

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            numpy \
            scipy \
            opencv-python-headless \
            Pillow \
            pandas \
            joblib \
            scikit-learn \
            playwright

          playwright install --with-deps chromium

      # ============================================================
      # RECUPERAR HISTORIAL DEL ÚLTIMO ARTIFACT EXITOSO
      #
      # Esto ocurre ANTES de capturar/procesar el nuevo radar.
      #
      # El artifact anterior contiene el historial completo de RMA10.
      # ============================================================

      - name: Recuperar historial radar anterior
        id: recuperar_historial
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Buscando último workflow exitoso..."

          RUN_ID=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/probar-radar-smn.yml/runs?status=success&per_page=10" \
            | jq -r '
                .workflow_runs
                | map(select(.id != '"${GITHUB_RUN_ID}"'))
                | .[0].id // empty
              ')

          if [ -z "$RUN_ID" ]; then
            echo "No se encontró un workflow exitoso anterior."
            echo "Se utilizará el historial existente en el checkout."
            exit 0
          fi

          echo "Workflow anterior encontrado: ${RUN_ID}"

          ARTIFACT_ID=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | jq -r '
                .artifacts[]
                | select(.name == "radar-rma10")
                | select(.expired == false)
                | .id
              ' \
            | head -n 1)

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No se encontró artifact radar-rma10 válido."
            echo "Se utilizará el historial existente en el checkout."
            exit 0
          fi

          echo "Artifact encontrado: ${ARTIFACT_ID}"

          mkdir -p /tmp/radar_anterior

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/radar_anterior/radar.zip

          echo "Artifact descargado."

          unzip -q \
            /tmp/radar_anterior/radar.zip \
            -d /tmp/radar_anterior/contenido

          echo "Contenido del artifact:"
          find /tmp/radar_anterior/contenido -maxdepth 4 -type f | head -100

          # --------------------------------------------------------
          # Recuperar historial PNG
          # --------------------------------------------------------

          FOUND=0

          while IFS= read -r -d '' FILE; do

            cp "$FILE" data/radar/historico/

            FOUND=$((FOUND + 1))

          done < <(
            find /tmp/radar_anterior/contenido \
              -type f \
              -path "*/historico/*.png" \
              -print0
          )

          echo ""
          echo "Frames históricos recuperados: ${FOUND}"

          # --------------------------------------------------------
          # Si el artifact tiene estado persistente,
          # recuperarlo solamente si no existe uno local.
          # --------------------------------------------------------

          if [ ! -f data/radar/seguimiento/estado.json ]; then

            STATE=$(find \
              /tmp/radar_anterior/contenido \
              -type f \
              -path "*/seguimiento/estado.json" \
              | head -n 1)

            if [ -n "$STATE" ]; then

              cp \
                "$STATE" \
                data/radar/seguimiento/estado.json

              echo "Estado persistente recuperado."

            fi
          fi

          echo ""
          echo "Total de frames disponibles después de recuperar historial:"

          find data/radar/historico \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | wc -l

      # ============================================================
      # CAPTURA RADAR RMA10
      # ============================================================

      - name: Capturar radar RMA10
        id: captura
        run: |
          python scraper/capturar_radar_smn.py

      # ============================================================
      # VERIFICAR HISTORIAL ANTES DE MÁSCARA
      # ============================================================

      - name: Verificar historial
        if: steps.captura.outcome == 'success'
        run: |
          COUNT=$(find data/radar/historico \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | wc -l)

          echo "Frames históricos disponibles: ${COUNT}"

          if [ "${COUNT}" -lt 3 ]; then
            echo ""
            echo "ERROR: hay menos de 3 frames históricos."
            echo "La máscara estática necesita al menos 3."
            exit 1
          fi

      # ============================================================
      # MÁSCARA DE ECOS ESTÁTICOS
      #
      # IMPORTANTE:
      # Se utiliza el historial completo.
      # NO se limita a 60 minutos.
      # ============================================================

      - name: Generar máscara de ecos estáticos
        if: steps.captura.outcome == 'success'
        run: |
          python scripts/generar_mascara_estatica.py

      # ============================================================
      # PROCESAR RADAR
      # ============================================================

      - name: Procesar radar
        if: steps.captura.outcome == 'success'
        run: |
          python scripts/procesador_radar.py

      # ============================================================
      # VERIFICAR CONTINUIDAD DEL ESTADO
      # ============================================================

      - name: Verificar continuidad
        id: continuidad
        if: steps.captura.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          estado_path = Path(
              "data/radar/seguimiento/estado.json"
          )

          radar_ts_path = Path(
              "data/radar/radar_timestamp.txt"
          )

          output_path = os.environ["GITHUB_OUTPUT"]

          def parse_ts(value):

              if not value:
                  return None

              value = str(value).strip()

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              dt = datetime.fromisoformat(value)

              if dt.tzinfo is None:
                  dt = dt.replace(
                      tzinfo=timezone.utc
                  )

              return dt.astimezone(
                  timezone.utc
              )

          estado_ts = None
          radar_ts = None

          # --------------------------------------------------------
          # ESTADO
          # --------------------------------------------------------

          if estado_path.exists():

              try:

                  estado = json.loads(
                      estado_path.read_text(
                          encoding="utf-8"
                      )
                  )

                  estado_ts = parse_ts(
                      estado.get(
                          "ultimo_radar_timestamp"
                      )
                  )

              except Exception as exc:

                  print(
                      "ADVERTENCIA: no se pudo leer "
                      f"estado.json: {exc}"
                  )

          # --------------------------------------------------------
          # RADAR
          # --------------------------------------------------------

          if radar_ts_path.exists():

              try:

                  radar_ts = parse_ts(
                      radar_ts_path.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception as exc:

                  print(
                      "ERROR: no se pudo leer "
                      f"radar_timestamp.txt: {exc}"
                  )

          print(
              f"Estado: {estado_ts}"
          )

          print(
              f"Radar:  {radar_ts}"
          )

          # --------------------------------------------------------
          # SIN TIMESTAMP
          # --------------------------------------------------------

          if radar_ts is None:

              print(
                  "ERROR: no existe timestamp válido del radar."
              )

              Path(
                  "data/radar/continuidad.txt"
              ).write_text(
                  "accepted=false\n",
                  encoding="utf-8"
              )

              with open(
                  output_path,
                  "a",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "accepted=false\n"
                  )

              raise SystemExit(0)

          # --------------------------------------------------------
          # SIN ESTADO
          # --------------------------------------------------------

          if estado_ts is None:

              print(
                  "No existe estado persistente previo."
              )

              print(
                  "El radar se acepta como nuevo inicio."
              )

              Path(
                  "data/radar/continuidad.txt"
              ).write_text(
                  "accepted=true\n",
                  encoding="utf-8"
              )

              with open(
                  output_path,
                  "a",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "accepted=true\n"
                  )

              raise SystemExit(0)

          # --------------------------------------------------------
          # INTERVALO
          # --------------------------------------------------------

          intervalo_min = (
              radar_ts - estado_ts
          ).total_seconds() / 60.0

          print(
              f"Intervalo: {intervalo_min:.1f} min"
          )

          # --------------------------------------------------------
          # RADAR ANTERIOR
          # --------------------------------------------------------

          if intervalo_min < 0:

              print(
                  "RADAR DESCARTADO"
              )

              Path(
                  "data/radar/FRAME_DESCARTADO.txt"
              ).write_text(
                  (
                      "Radar descartado por timestamp "
                      "anterior al estado persistente.\n"
                      f"Estado: {estado_ts.isoformat()}\n"
                      f"Radar: {radar_ts.isoformat()}\n"
                      f"Intervalo: {intervalo_min:.1f} min\n"
                  ),
                  encoding="utf-8"
              )

              Path(
                  "data/radar/continuidad.txt"
              ).write_text(
                  "accepted=false\n",
                  encoding="utf-8"
              )

              with open(
                  output_path,
                  "a",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "accepted=false\n"
                  )

          else:

              print(
                  "RADAR ACEPTADO"
              )

              Path(
                  "data/radar/continuidad.txt"
              ).write_text(
                  "accepted=true\n",
                  encoding="utf-8"
              )

              with open(
                  output_path,
                  "a",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "accepted=true\n"
                  )

          PY

      # ============================================================
      # PREPARAR SOLO EL HISTORIAL CONTINUO PARA TRACKING
      #
      # IMPORTANTE:
      # La máscara ya utilizó el historial completo.
      #
      # Aquí sí se limita el historial:
      # - máximo 6 frames
      # - máximo 60 min entre frames
      # - ningún frame futuro
      # ============================================================

      - name: Preparar historial continuo para tracking
        id: preparar_tracking
        if: steps.continuidad.outputs.accepted == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          HIST = Path(
              "data/radar/historico"
          )

          BACKUP = Path(
              "data/radar/historico_tracking_backup"
          )

          BACKUP.mkdir(
              parents=True,
              exist_ok=True
          )

          timestamp_file = Path(
              "data/radar/radar_timestamp.txt"
          )

          raw = timestamp_file.read_text(
              encoding="utf-8"
          ).strip()

          if raw.endswith("Z"):
              raw = raw[:-1] + "+00:00"

          radar_ts = datetime.fromisoformat(
              raw
          )

          if radar_ts.tzinfo is None:
              radar_ts = radar_ts.replace(
                  tzinfo=timezone.utc
              )

          radar_ts = radar_ts.astimezone(
              timezone.utc
          )

          frames = []

          for path in HIST.glob("*.png"):

              try:

                  stamp = datetime.strptime(
                      path.stem,
                      "%Y%m%d_%H%M%S"
                  ).replace(
                      tzinfo=timezone.utc
                  )

              except ValueError:

                  continue

              frames.append(
                  (stamp, path)
              )

          frames.sort(
              key=lambda item: item[0]
          )

          # --------------------------------------------------------
          # SOLO FRAMES <= RADAR ACTUAL
          # --------------------------------------------------------

          validos = [
              item
              for item in frames
              if item[0] <= radar_ts
          ]

          validos.sort(
              key=lambda item: item[0],
              reverse=True
          )

          seleccionados = []

          anterior = radar_ts

          for stamp, path in validos:

              diferencia = (
                  anterior - stamp
              ).total_seconds() / 60.0

              if diferencia < 0:
                  continue

              if diferencia > 60.0:

                  print(
                      "CORTE DE CONTINUIDAD:"
                  )

                  print(
                      f"{diferencia:.1f} min entre "
                      f"{anterior.isoformat()} y "
                      f"{stamp.isoformat()}"
                  )

                  break

              seleccionados.append(
                  path
              )

              anterior = stamp

              if len(seleccionados) >= 6:
                  break

          seleccionados_set = {
              path.resolve()
              for path in seleccionados
          }

          print("")
          print(
              "RADAR ACTUAL:",
              radar_ts.isoformat()
          )

          print("")
          print(
              "FRAMES UTILIZADOS PARA TRACKING:"
          )

          for path in reversed(
              seleccionados
          ):

              print(
                  "  ",
                  path.name
              )

          print("")
          print(
              "Cantidad de frames continuos:",
              len(seleccionados)
          )

          # --------------------------------------------------------
          # APARTAR FRAMES NO CONTINUOS
          # --------------------------------------------------------

          for _, path in frames:

              if (
                  path.resolve()
                  not in seleccionados_set
              ):

                  destino = (
                      BACKUP / path.name
                  )

                  if destino.exists():
                      destino.unlink()

                  path.rename(
                      destino
                  )

          print("")
          print(
              "Historial preparado para tracking."
          )

          PY

      # ============================================================
      # SEGUIMIENTO TEMPORAL
      # ============================================================

      - name: Seguimiento temporal
        id: seguimiento
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          python seguimiento_temporal.py

      # ============================================================
      # RESTAURAR HISTORIAL COMPLETO
      #
      # Siempre se ejecuta.
      # ============================================================

      - name: Restaurar historial completo
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          HIST = Path(
              "data/radar/historico"
          )

          BACKUP = Path(
              "data/radar/historico_tracking_backup"
          )

          if not BACKUP.exists():

              print(
                  "No existe backup temporal."
              )

              raise SystemExit(0)

          for path in BACKUP.glob("*.png"):

              destino = (
                  HIST / path.name
              )

              if destino.exists():
                  destino.unlink()

              path.rename(
                  destino
              )

          print(
              "Historial completo restaurado."
          )

          try:
              BACKUP.rmdir()
          except OSError:
              pass

          PY

      # ============================================================
      # PREDICCIÓN ML
      #
      # SOLO SI TRACKING TERMINÓ BIEN.
      # ============================================================

      - name: Predicción ML RMA10
        if: >
          steps.continuidad.outputs.accepted == 'true' &&
          steps.seguimiento.outcome == 'success'
        run: |
          python scripts/prediccion_rma10_ml.py

      # ============================================================
      # PREDICCIÓN DE EVOLUCIÓN
      # ============================================================

      - name: Predicción de evolución
        if: >
          steps.continuidad.outputs.accepted == 'true' &&
          steps.seguimiento.outcome == 'success'
        run: |
          if [ -f scripts/prediccion_evolucion.py ]; then
            python scripts/prediccion_evolucion.py
          else
            echo "prediccion_evolucion.py no encontrado."
          fi

      # ============================================================
      # GUARDAR RESULTADOS
      # ============================================================

      - name: Guardar resultados
        if: always() && steps.captura.outcome == 'success'
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/radar

          if git diff --cached --quiet; then

            echo "No hay cambios para guardar."

          else

            git commit \
              -m "Actualizar radar RMA10 y seguimiento"

            git push

          fi

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Subir resultados radar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/radar_timestamp.txt
            data/radar/resultado_procesamiento.json
            data/radar/continuidad.txt
            data/radar/FRAME_DESCARTADO.txt
            data/radar/seguimiento/
            data/radar/historico/
            data/radar/mascaras/
          if-no-files-found: warn
