name: Probar Radar SMN

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: climaar-production-writes
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sincronizar main y preparar estado
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          mkdir -p \
            data/radar/historico \
            data/radar/seguimiento \
            data/radar/procesado \
            data/radar/prediccion \
            data/radar/mascaras \
            .climaar

          if [ -f .climaar/estado_rma10.json ]; then
            cp \
              .climaar/estado_rma10.json \
              data/radar/seguimiento/estado.json
          fi

      - name: Recuperar histórico desde artefactos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf /tmp/radar_artifacts
          mkdir -p /tmp/radar_artifacts

          gh run list \
            --workflow probar-radar-smn.yml \
            --limit 20 \
            --json databaseId,status,conclusion \
            --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' \
            > /tmp/radar_runs.txt || true

          while read -r run_id; do
            [ -z "$run_id" ] && continue

            gh run download \
              "$run_id" \
              -n radar-rma10 \
              -D "/tmp/radar_artifacts/$run_id" \
              2>/dev/null || true
          done < /tmp/radar_runs.txt

          find /tmp/radar_artifacts \
            -type f \
            -path '*/historico/*.png' \
            -exec cp -n {} data/radar/historico/ \; \
            2>/dev/null || true

          find /tmp/radar_artifacts \
            -type f \
            -name 'predicciones_pendientes.json' \
            -exec cp -n {} data/radar/seguimiento/ \; \
            2>/dev/null || true

          echo "Frames históricos: $(find data/radar/historico -maxdepth 1 -type f -name '*.png' | wc -l)"

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

          python -m playwright install --with-deps chromium

      - name: Capturar radar RMA10
        run: |
          set -euo pipefail

          python scraper/capturar_radar_smn.py

          test -s data/radar/actual.png
          test -s data/radar/radar_timestamp.txt

          cp \
            data/radar/actual.png \
            data/radar/latest.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path("data/radar/actual.png")

          if path.stat().st_size <= 1024:
              raise SystemExit("ERROR: PNG demasiado pequeño")

          with Image.open(path) as image:
              if image.format != "PNG":
                  raise SystemExit("ERROR: la captura no es PNG")

              image.verify()

          print("PNG válido")
          print(
              "Radar:",
              Path(
                  "data/radar/radar_timestamp.txt"
              ).read_text(
                  encoding="utf-8"
              ).strip()
          )
          PY

      - name: Validar frame nuevo, fresco y no repetido
        id: frame
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import os

          ts = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          text = (
              ts[:-1] + "+00:00"
              if ts.endswith("Z")
              else ts
          )

          dt = datetime.fromisoformat(text)

          if dt.tzinfo is None:
              raise SystemExit(
                  "ERROR: timestamp sin zona horaria"
              )

          dt = dt.astimezone(timezone.utc)

          age = (
              datetime.now(timezone.utc) - dt
          ).total_seconds() / 60.0

          if age < -2:
              raise SystemExit(
                  f"ERROR: timestamp futuro: {age:.2f} min"
              )

          if age > 45:
              raise SystemExit(
                  f"ERROR: radar demasiado viejo: {age:.2f} min"
              )

          current_ts = ts

          old_ts_path = Path(
              "data/radar/ultimo_radar_timestamp.txt"
          )

          old_ts = (
              old_ts_path.read_text(
                  encoding="utf-8"
              ).strip()
              if old_ts_path.exists()
              else ""
          )

          current_hash = hashlib.sha256(
              Path(
                  "data/radar/actual.png"
              ).read_bytes()
          ).hexdigest()

          old_hash_path = Path(
              "data/radar/ultimo_radar_sha256.txt"
          )

          old_hash = (
              old_hash_path.read_text(
                  encoding="utf-8"
              ).strip()
              if old_hash_path.exists()
              else ""
          )

          if old_ts and current_ts == old_ts:
              accepted = "false"
              motivo = "timestamp_repetido"

          elif old_hash and current_hash == old_hash:
              accepted = "false"
              motivo = "imagen_repetida"

          else:
              accepted = "true"
              motivo = "nuevo_frame"

          output_path = os.environ["GITHUB_OUTPUT"]

          with open(
              output_path,
              "a",
              encoding="utf-8"
          ) as output:
              output.write(
                  f"accepted={accepted}\n"
              )
              output.write(
                  f"motivo={motivo}\n"
              )

          print(
              f"Timestamp anterior: "
              f"{old_ts or 'ninguno'}"
          )
          print(
              f"Timestamp nuevo: {current_ts}"
          )
          print(
              f"Edad: {age:.2f} min"
          )
          print(
              f"SHA256: {current_hash}"
          )
          print(
              f"Resultado: {motivo}"
          )
          PY

      - name: Detener limpiamente si no hay frame nuevo
        if: steps.frame.outputs.accepted != 'true'
        run: |
          echo "No se procesará un frame repetido."
          exit 0

      - name: Guardar timestamp y hash aceptados
        if: steps.frame.outputs.accepted == 'true'
        run: |
          set -euo pipefail

          cp \
            data/radar/radar_timestamp.txt \
            data/radar/ultimo_radar_timestamp.txt

          sha256sum \
            data/radar/actual.png \
            | awk '{print $1}' \
            > data/radar/ultimo_radar_sha256.txt

          cat \
            data/radar/radar_timestamp.txt \
            > data/radar/continuidad.txt

      - name: Generar máscara estática
        if: steps.frame.outputs.accepted == 'true'
        run: |
          set -euo pipefail

          python scripts/generar_mascara_estatica.py

          test -s \
            data/radar/mascara_ecos_estaticos.json

          test -s \
            data/radar/mascara_ecos_estaticos.png

          test -s \
            data/radar/mascara_ecos_estaticos_confianza.png

      - name: Procesar radar
        if: steps.frame.outputs.accepted == 'true'
        run: |
          set -euo pipefail

          python scripts/procesador_radar.py

          test -s \
            data/radar/resultado_procesamiento.json

      - name: Guardar frame en historial
        if: steps.frame.outputs.accepted == 'true'
        run: |
          set -euo pipefail

          HISTORIAL_NOMBRE="$(
            python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          ts = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          dt = datetime.fromisoformat(
              ts.replace("Z", "+00:00")
          )

          if dt.tzinfo is None:
              raise SystemExit(
                  "timestamp sin zona horaria"
              )

          print(
              dt.astimezone(timezone.utc)
              .strftime("%Y%m%d%H%M%S.png")
          )
          PY
          )"

          cp \
            data/radar/actual.png \
            "data/radar/historico/$HISTORIAL_NOMBRE"

          echo \
            "Historial guardado: $HISTORIAL_NOMBRE"

      - name: Seguimiento temporal
        if: steps.frame.outputs.accepted == 'true'
        run: |
          set -euo pipefail

          python seguimiento_temporal.py

          test -s \
            data/radar/seguimiento/seguimiento_temporal.json

          if [ -f data/radar/seguimiento/estado.json ]; then
            cp \
              data/radar/seguimiento/estado.json \
              .climaar/estado_rma10.json
          fi

      - name: Predicción ML RMA10
        if: steps.frame.outputs.accepted == 'true'
        run: |
          set -euo pipefail

          python scripts/prediccion_rma10_ml.py

          test -s \
            data/radar/seguimiento/prediccion_ml_rma10.json

      - name: Evolución temporal
        if: steps.frame.outputs.accepted == 'true'
        run: |
          set -euo pipefail

          if [ -f scripts/prediccion_evolucion.py ]; then
            python scripts/prediccion_evolucion.py
          fi

          test -s \
            data/radar/seguimiento/prediccion_evolucion.json

      - name: Preparar artefacto
        if: steps.frame.outputs.accepted == 'true'
        run: |
          set -euo pipefail

          rm -rf /tmp/radar-rma10

          mkdir -p \
            /tmp/radar-rma10

          cp -a \
            data/radar/. \
            /tmp/radar-rma10/

          if [ -f .climaar/estado_rma10.json ]; then
            mkdir -p \
              /tmp/radar-rma10/.climaar

            cp \
              .climaar/estado_rma10.json \
              /tmp/radar-rma10/.climaar/
          fi

      - name: Subir artefacto RMA10
        if: steps.frame.outputs.accepted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: /tmp/radar-rma10
          retention-days: 7

      - name: Guardar estado en repositorio con rebase y retry
        if: steps.frame.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Incluir TODOS los cambios generados por el procesamiento.
          # El error anterior se producía porque había cambios
          # modificados que no estaban incluidos en el git add.
          git add -A data/radar .climaar

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: actualizar RMA10"

          # Después del commit no deben quedar cambios locales.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "ERROR: quedaron cambios sin confirmar después del commit."
            git status --short
            exit 1
          fi

          for intento in 1 2 3; do
            echo "Intento de sincronización: $intento"

            git fetch origin main

            # El checkout ya está limpio.
            # Si otro workflow publicó mientras procesábamos,
            # rebaseamos nuestro commit encima de main.
            if git rebase origin/main; then
              echo "Rebase correcto."
            else
              echo "Rebase falló."

              git rebase --abort 2>/dev/null || true

              if [ "$intento" -eq 3 ]; then
                git status --short
                exit 1
              fi

              git reset --hard HEAD
              sleep 2
              continue
            fi

            # Comprobar nuevamente que el rebase dejó el árbol limpio.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: el rebase dejó cambios locales."
              git status --short

              if [ "$intento" -eq 3 ]; then
                exit 1
              fi

              git reset --hard HEAD
              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push exitoso en intento $intento."
              exit 0
            fi

            echo "Push falló en intento $intento."

            if [ "$intento" -eq 3 ]; then
              git status --short
              exit 1
            fi

            sleep 2
          done
