name: Probar Radar SMN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar artifacts persistentes
        run: |
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar/mascaras

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            numpy \
            scipy \
            opencv-python-headless \
            Pillow \
            pandas \
            joblib \
            scikit-learn

      # ============================================================
      # CAPTURA DEL RADAR
      # ============================================================

      - name: Capturar radar RMA10
        run: |
          python scripts/capturar_radar_smn.py

      # ============================================================
      # MÁSCARA ESTÁTICA
      #
      # IMPORTANTE:
      # Esta etapa conserva todo el historial disponible.
      # NO se limita a 60 minutos.
      # ============================================================

      - name: Generar máscara de ecos estáticos
        run: |
          python scripts/generar_mascara_estatica.py

      # ============================================================
      # PROCESAMIENTO DEL RADAR
      # ============================================================

      - name: Procesar radar
        run: |
          python scripts/procesador_radar.py

      # ============================================================
      # VERIFICAR CONTINUIDAD
      #
      # El radar nunca debe retroceder respecto del estado persistente.
      # ============================================================

      - name: Verificar continuidad
        id: continuidad
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          estado_path = Path("data/radar/seguimiento/estado.json")
          radar_ts_path = Path("data/radar/radar_timestamp.txt")

          def parse_ts(value):
              if not value:
                  return None

              value = str(value).strip()

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              dt = datetime.fromisoformat(value)

              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)

              return dt.astimezone(timezone.utc)

          estado_ts = None
          radar_ts = None

          if estado_path.exists():
              try:
                  estado = json.loads(
                      estado_path.read_text(encoding="utf-8")
                  )

                  estado_ts = parse_ts(
                      estado.get("ultimo_radar_timestamp")
                  )

              except Exception as exc:
                  print(f"ADVERTENCIA: no se pudo leer estado.json: {exc}")

          if radar_ts_path.exists():
              try:
                  radar_ts = parse_ts(
                      radar_ts_path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  print(
                      f"ERROR: no se pudo leer radar_timestamp.txt: {exc}"
                  )

          print(f"Estado: {estado_ts}")
          print(f"Radar:  {radar_ts}")

          if radar_ts is None:
              print("ERROR: no existe timestamp válido del radar.")
              print("accepted=false")
              with open(
                  Path.home() / "continuidad_dummy.txt",
                  "w",
                  encoding="utf-8"
              ):
                  pass

              with open(
                  "${GITHUB_OUTPUT}",
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write("accepted=false\n")

              raise SystemExit(0)

          if estado_ts is None:
              print("No existe estado persistente previo.")
              print("Se acepta el radar como nuevo inicio.")

              with open(
                  "${GITHUB_OUTPUT}",
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write("accepted=true\n")

              Path("data/radar/continuidad.txt").write_text(
                  "accepted=true\n",
                  encoding="utf-8"
              )

              raise SystemExit(0)

          intervalo_min = (
              radar_ts - estado_ts
          ).total_seconds() / 60.0

          print(f"Intervalo: {intervalo_min:.1f} min")

          if intervalo_min < 0:
              print("RADAR DESCARTADO")
              print("El timestamp del radar es anterior al estado.")

              Path("data/radar/FRAME_DESCARTADO.txt").write_text(
                  (
                      "Radar descartado por timestamp anterior "
                      "al estado persistente.\n"
                      f"Estado: {estado_ts.isoformat()}\n"
                      f"Radar: {radar_ts.isoformat()}\n"
                      f"Intervalo: {intervalo_min:.1f} min\n"
                  ),
                  encoding="utf-8"
              )

              Path("data/radar/continuidad.txt").write_text(
                  "accepted=false\n",
                  encoding="utf-8"
              )

              with open(
                  "${GITHUB_OUTPUT}",
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write("accepted=false\n")

          else:
              print("RADAR ACEPTADO")

              Path("data/radar/continuidad.txt").write_text(
                  "accepted=true\n",
                  encoding="utf-8"
              )

              with open(
                  "${GITHUB_OUTPUT}",
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write("accepted=true\n")
          PY

      # ============================================================
      # PREPARAR HISTORIAL PARA TRACKING
      #
      # La máscara estática YA fue calculada usando el historial
      # completo.
      #
      # Para tracking solamente se permite una cadena temporal
      # continua de máximo 60 minutos entre frames.
      #
      # Los archivos apartados se restauran después.
      # ============================================================

      - name: Preparar historial continuo para tracking
        if: steps.continuidad.outputs.accepted == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          HIST = Path("data/radar/historico")
          BACKUP = Path("data/radar/historico_tracking_backup")

          BACKUP.mkdir(parents=True, exist_ok=True)

          ts_file = Path("data/radar/radar_timestamp.txt")

          if not ts_file.exists():
              raise SystemExit(
                  "No existe data/radar/radar_timestamp.txt"
              )

          raw = ts_file.read_text(
              encoding="utf-8"
          ).strip()

          if raw.endswith("Z"):
              raw = raw[:-1] + "+00:00"

          radar_ts = datetime.fromisoformat(raw)

          if radar_ts.tzinfo is None:
              radar_ts = radar_ts.replace(
                  tzinfo=timezone.utc
              )

          radar_ts = radar_ts.astimezone(timezone.utc)

          frames = []

          for path in HIST.glob("*.png"):
              try:
                  stamp = datetime.strptime(
                      path.stem,
                      "%Y%m%d_%H%M%S"
                  ).replace(tzinfo=timezone.utc)
              except ValueError:
                  continue

              frames.append((stamp, path))

          frames.sort(key=lambda x: x[0])

          # Nunca utilizar frames posteriores al radar actual.
          validos = [
              item
              for item in frames
              if item[0] <= radar_ts
          ]

          if not validos:
              print("No hay frames históricos válidos.")
              raise SystemExit(0)

          # Buscar el frame actual y caminar hacia atrás.
          # Se corta cuando aparece un salto > 60 minutos.
          validos.sort(key=lambda x: x[0], reverse=True)

          seleccionados = []

          anterior = radar_ts

          for stamp, path in validos:

              diferencia = (
                  anterior - stamp
              ).total_seconds() / 60.0

              if diferencia < 0:
                  continue

              if diferencia > 60.0:
                  print(
                      "CORTE DE CONTINUIDAD:",
                      f"{diferencia:.1f} min entre",
                      anterior.isoformat(),
                      "y",
                      stamp.isoformat()
                  )
                  break

              seleccionados.append(path)

              anterior = stamp

              if len(seleccionados) >= 6:
                  break

          seleccionados_set = {
              path.resolve()
              for path in seleccionados
          }

          print("")
          print("RADAR ACTUAL:", radar_ts.isoformat())
          print("")
          print("Frames utilizados para tracking:")

          for path in reversed(seleccionados):
              print("  ", path.name)

          print("")
          print(
              "Cantidad de frames continuos:",
              len(seleccionados)
          )

          # Guardar lista para restauración.
          lista = []

          for _, path in frames:
              if path.exists():
                  lista.append(path.name)

          (BACKUP / "lista.txt").write_text(
              "\n".join(lista),
              encoding="utf-8"
          )

          # Apartar todo lo que NO pertenece al segmento continuo.
          for _, path in frames:
              if path.resolve() not in seleccionados_set:
                  destino = BACKUP / path.name

                  if destino.exists():
                      destino.unlink()

                  path.rename(destino)

          print("")
          print("Historial preparado para tracking.")
          PY

      # ============================================================
      # TRACKING
      # ============================================================

      - name: Seguimiento temporal
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          python seguimiento_temporal.py

      # ============================================================
      # RESTAURAR HISTORIAL COMPLETO
      #
      # MUY IMPORTANTE:
      # El historial completo vuelve antes de ML y antes de guardar
      # los artifacts para no perder frames útiles para la máscara.
      # ============================================================

      - name: Restaurar historial completo
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          HIST = Path("data/radar/historico")
          BACKUP = Path("data/radar/historico_tracking_backup")

          if not BACKUP.exists():
              print("No existe backup temporal.")
              raise SystemExit(0)

          for path in BACKUP.glob("*.png"):
              destino = HIST / path.name

              if destino.exists():
                  destino.unlink()

              path.rename(destino)

          print("Historial completo restaurado.")

          try:
              (BACKUP / "lista.txt").unlink()
          except FileNotFoundError:
              pass

          try:
              BACKUP.rmdir()
          except OSError:
              pass
          PY

      # ============================================================
      # PREDICCIÓN ML
      # ============================================================

      - name: Predicción ML RMA10
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          python scripts/prediccion_rma10_ml.py

      # ============================================================
      # PREDICCIÓN DE EVOLUCIÓN
      # ============================================================

      - name: Predicción de evolución
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          if [ -f scripts/prediccion_evolucion.py ]; then
            python scripts/prediccion_evolucion.py
          else
            echo "prediccion_evolucion.py no encontrado. Se continúa."
          fi

      # ============================================================
      # BACKUP DE RESULTADOS GENERADOS
      # ============================================================

      - name: Proteger resultados generados
        if: always()
        run: |
          mkdir -p /tmp/climaar_generated

          for file in \
            data/radar/resultado_procesamiento.json \
            data/radar/radar_timestamp.txt \
            data/radar/FRAME_DESCARTADO.txt \
            data/radar/continuidad.txt \
            data/radar/seguimiento/estado.json \
            data/radar/seguimiento/seguimiento_temporal.json \
            data/radar/seguimiento/prediccion_ml_rma10.json
          do
            if [ -f "$file" ]; then
              mkdir -p "/tmp/climaar_generated/$(dirname "$file")"
              cp "$file" "/tmp/climaar_generated/$file"
            fi
          done

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/radar

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualizar radar RMA10 y seguimiento"
            git push
          fi

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Subir resultados radar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/radar_timestamp.txt
            data/radar/resultado_procesamiento.json
            data/radar/continuidad.txt
            data/radar/FRAME_DESCARTADO.txt
            data/radar/seguimiento/
            data/radar/historico/
            data/radar/mascaras/
          if-no-files-found: warn
