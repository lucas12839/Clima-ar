name: Probar Radar SMN

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: climaar-production-writes
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Sincronizar main y preparar estado
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags --depth=1 origin main
          git reset --hard origin/main

          mkdir -p \
            data/radar/historico \
            data/radar/seguimiento \
            data/radar/procesado \
            data/radar/prediccion \
            data/radar/mascaras \
            .climaar

          if [ -f .climaar/estado_rma10.json ]; then
            cp \
              .climaar/estado_rma10.json \
              data/radar/seguimiento/estado.json
          fi

      - name: Recuperar histórico desde el último artefacto válido
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/radar_artifacts
          mkdir -p /tmp/radar_artifacts

          gh run list \
            --workflow probar-radar-smn.yml \
            --limit 20 \
            --json databaseId,status,conclusion \
            --jq '
              .[]
              | select(.status == "completed" and .conclusion == "success")
              | .databaseId
            ' \
            | head -n 1 \
            > /tmp/radar_run_id.txt

          RUN_ID="$(cat /tmp/radar_run_id.txt || true)"

          if [ -n "$RUN_ID" ]; then
            echo "Recuperando artefacto del run: $RUN_ID"

            gh run download \
              "$RUN_ID" \
              -n radar-rma10 \
              -D /tmp/radar_artifacts \
              2>/dev/null || true
          else
            echo "No existe un run exitoso anterior."
          fi

          if [ -d /tmp/radar_artifacts ]; then
            find /tmp/radar_artifacts \
              -type f \
              -path '*/historico/*.png' \
              -exec cp -n {} data/radar/historico/ \; \
              2>/dev/null || true

            find /tmp/radar_artifacts \
              -type f \
              -name 'predicciones_pendientes.json' \
              -exec cp {} data/radar/seguimiento/ \; \
              2>/dev/null || true
          fi

          echo "Frames históricos: $(find data/radar/historico -maxdepth 1 -type f -name '*.png' | wc -l)"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capturar radar RMA10
        shell: bash
        run: |
          set -euo pipefail

          python scraper/capturar_radar_smn.py

          test -s data/radar/actual.png
          test -s data/radar/radar_timestamp.txt

          cp \
            data/radar/actual.png \
            data/radar/latest.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path("data/radar/actual.png")

          if path.stat().st_size <= 1024:
              raise SystemExit("ERROR: PNG demasiado pequeño")

          with Image.open(path) as image:
              if image.format != "PNG":
                  raise SystemExit("ERROR: la captura no es PNG")

              image.verify()

          timestamp = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          if not timestamp:
              raise SystemExit(
                  "ERROR: timestamp del radar vacío"
              )

          print("PNG válido")
          print("Radar:", timestamp)
          PY

      - name: Validar frame nuevo, fresco y no repetido
        id: frame
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import os

          timestamp_path = Path(
              "data/radar/radar_timestamp.txt"
          )

          ts = timestamp_path.read_text(
              encoding="utf-8"
          ).strip()

          if not ts:
              raise SystemExit(
                  "ERROR: timestamp vacío"
              )

          text = (
              ts[:-1] + "+00:00"
              if ts.endswith("Z")
              else ts
          )

          try:
              dt = datetime.fromisoformat(text)
          except ValueError as exc:
              raise SystemExit(
                  f"ERROR: timestamp inválido: {ts}"
              ) from exc

          if dt.tzinfo is None:
              raise SystemExit(
                  "ERROR: timestamp sin zona horaria"
              )

          dt = dt.astimezone(timezone.utc)

          age = (
              datetime.now(timezone.utc) - dt
          ).total_seconds() / 60.0

          if age < -2:
              raise SystemExit(
                  f"ERROR: timestamp futuro: {age:.2f} min"
              )

          if age > 45:
              raise SystemExit(
                  f"ERROR: radar demasiado viejo: {age:.2f} min"
              )

          current_hash = hashlib.sha256(
              Path(
                  "data/radar/actual.png"
              ).read_bytes()
          ).hexdigest()

          old_ts_path = Path(
              "data/radar/ultimo_radar_timestamp.txt"
          )

          old_ts = (
              old_ts_path.read_text(
                  encoding="utf-8"
              ).strip()
              if old_ts_path.exists()
              else ""
          )

          old_hash_path = Path(
              "data/radar/ultimo_radar_sha256.txt"
          )

          old_hash = (
              old_hash_path.read_text(
                  encoding="utf-8"
              ).strip()
              if old_hash_path.exists()
              else ""
          )

          if old_ts and ts == old_ts:
              accepted = "false"
              motivo = "timestamp_repetido"

          elif old_hash and current_hash == old_hash:
              accepted = "false"
              motivo = "imagen_repetida"

          else:
              accepted = "true"
              motivo = "nuevo_frame"

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(
                  f"accepted={accepted}\n"
              )
              output.write(
                  f"motivo={motivo}\n"
              )

          print(
              f"Timestamp anterior: "
              f"{old_ts or 'ninguno'}"
          )

          print(
              f"Timestamp nuevo: {ts}"
          )

          print(
              f"Edad: {age:.2f} min"
          )

          print(
              f"SHA256: {current_hash}"
          )

          print(
              f"Resultado: {motivo}"
          )
          PY

      - name: Detener limpiamente si no hay frame nuevo
        if: steps.frame.outputs.accepted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No se procesará un frame repetido."

      - name: Guardar timestamp y hash aceptados
        if: steps.frame.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cp \
            data/radar/radar_timestamp.txt \
            data/radar/ultimo_radar_timestamp.txt

          sha256sum \
            data/radar/actual.png \
            | awk '{print $1}' \
            > data/radar/ultimo_radar_sha256.txt

          cp \
            data/radar/radar_timestamp.txt \
            data/radar/continuidad.txt

      - name: Generar máscara estática
        if: steps.frame.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python scripts/generar_mascara_estatica.py

          test -s data/radar/mascara_ecos_estaticos.json
          test -s data/radar/mascara_ecos_estaticos.png
          test -s data/radar/mascara_ecos_estaticos_confianza.png

      - name: Procesar radar
        if: steps.frame.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python scripts/procesador_radar.py

          test -s data/radar/resultado_procesamiento.json

      - name: Guardar frame en historial
        if: steps.frame.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail

          HISTORIAL_NOMBRE="$(
            python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          ts = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          text = (
              ts[:-1] + "+00:00"
              if ts.endswith("Z")
              else ts
          )

          dt = datetime.fromisoformat(text)

          if dt.tzinfo is None:
              raise SystemExit(
                  "timestamp sin zona horaria"
              )

          print(
              dt.astimezone(timezone.utc)
              .strftime("%Y%m%d%H%M%S.png")
          )
          PY
          )"

          cp \
            data/radar/actual.png \
            "data/radar/historico/$HISTORIAL_NOMBRE"

          echo \
            "Historial guardado: $HISTORIAL_NOMBRE"

      - name: Seguimiento temporal
        if: steps.frame.outputs.accepted == 'true'
        shell: bash
        run: |
          set
