name: Probar Radar SMN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-radar:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. DESCARGAR REPOSITORIO
      # =========================================================
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # 2. CONFIGURAR PYTHON
      # =========================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 3. INSTALAR DEPENDENCIAS
      # =========================================================
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # =========================================================
      # 4. RECUPERAR MÁSCARA ESTÁTICA
      # =========================================================
      - name: Recuperar mascara estatica
        id: mascara
        uses: actions/cache@v4
        with:
          path: |
            data/radar/mascara_ecos_estaticos.png
            data/radar/mascara_ecos_estaticos.json
          key: climaar-rma10-mascara-estatica-v1

      # =========================================================
      # 5. PREPARAR DIRECTORIOS
      # =========================================================
      - name: Preparar directorios
        run: |
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar/historico
          mkdir -p .climaar

      # =========================================================
      # 6. RECUPERAR ESTADO PERSISTENTE
      # =========================================================
      - name: Recuperar estado persistente
        run: |
          if [ -f .climaar/estado_rma10.json ]; then
            echo "======================================"
            echo "ESTADO ANTERIOR ENCONTRADO"
            echo "======================================"

            cp .climaar/estado_rma10.json \
              data/radar/seguimiento/estado.json

            python - <<'PY'
          import json

          p = "data/radar/seguimiento/estado.json"

          with open(p, "r", encoding="utf-8") as f:
              d = json.load(f)

          print("schema_version:", d.get("schema_version"))
          print("ultimo_radar_timestamp:",
                d.get("ultimo_radar_timestamp"))
          print("tracks:",
                len(d.get("tracks", [])))
          print("tracks_activos:",
                len(d.get("tracks_activos", [])))
          PY

          else
            echo "======================================"
            echo "NO EXISTE ESTADO ANTERIOR"
            echo "SE CREARÁ PRIMER FRAME"
            echo "======================================"
          fi

      # =========================================================
      # 7. DESCARGAR RADAR
      # =========================================================
      - name: Descargar radar RMA10
        env:
          CLIMAAR_CAPTURE_MODE: ${{ steps.mascara.outputs.cache-hit == 'true' && 'rapido' || 'inicial' }}
        run: |
          python scraper/capturar_radar_smn.py

      # =========================================================
      # 8. GENERAR MÁSCARA SI NO EXISTE
      # =========================================================
      - name: Generar mascara estatica inicial
        if: steps.mascara.outputs.cache-hit != 'true'
        run: |
          python scripts/generar_mascara_estatica.py

      # =========================================================
      # 9. PROCESAR RADAR
      # =========================================================
      - name: Procesar radar
        run: |
          python procesador_radar.py

      # =========================================================
      # 10. SEGUIMIENTO TEMPORAL
      # =========================================================
      - name: Seguimiento temporal
        run: |
          python seguimiento_temporal.py

      # =========================================================
      # 11. PREDICCIÓN
      # =========================================================
      - name: Prediccion de evolucion
        run: |
          python prediccion_evolucion.py

      # =========================================================
      # 12. GUARDAR NUEVO ESTADO PERSISTENTE
      # =========================================================
      - name: Guardar estado persistente
        if: success()
        run: |
          if [ -f data/radar/seguimiento/estado.json ]; then
            cp data/radar/seguimiento/estado.json \
              .climaar/estado_rma10.json

            echo "======================================"
            echo "NUEVO ESTADO GUARDADO"
            echo "======================================"

            python - <<'PY'
          import json

          p = ".climaar/estado_rma10.json"

          with open(p, "r", encoding="utf-8") as f:
              d = json.load(f)

          print("schema_version:", d.get("schema_version"))
          print("ultimo_radar_timestamp:",
                d.get("ultimo_radar_timestamp"))
          print("tracks:",
                len(d.get("tracks", [])))
          print("tracks_activos:",
                len(d.get("tracks_activos", [])))
          PY
          else
            echo "ERROR: no se generó estado.json"
            exit 1
          fi

      # =========================================================
      # 13. COMPROBAR CAMBIOS
      # =========================================================
      - name: Comprobar estado Git
        if: always()
        run: |
          echo "======================================"
          echo "ESTADO GIT"
          echo "======================================"

          git status --short

          echo ""
          echo "======================================"
          echo "ESTADO PERSISTENTE"
          echo "======================================"

          if [ -f .climaar/estado_rma10.json ]; then
            ls -lh .climaar/estado_rma10.json
          else
            echo "NO EXISTE .climaar/estado_rma10.json"
          fi

      # =========================================================
      # 14. COMMIT + PUSH
      # =========================================================
      - name: Persistir estado en GitHub
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .climaar/estado_rma10.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualizar estado temporal RMA10"
            git push
          fi

      # =========================================================
      # 15. MOSTRAR SEGUIMIENTO
      # =========================================================
      - name: Mostrar seguimiento
        if: always()
        run: |
          echo "======================================"
          echo "SEGUIMIENTO TEMPORAL"
          echo "======================================"

          if [ -f data/radar/seguimiento/seguimiento_temporal.json ]; then
            cat data/radar/seguimiento/seguimiento_temporal.json
          else
            echo "No existe seguimiento_temporal.json"
          fi

      # =========================================================
      # 16. SUBIR ARTEFACTOS
      # =========================================================
      - name: Subir radar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/actual.png
            data/radar/historico/
            data/radar/mascara_ecos_estaticos.png
            data/radar/mascara_ecos_estaticos.json
            data/radar/resultado_procesamiento.json
            data/radar/seguimiento/
            data/radar/radar_timestamp.txt
          if-no-files-found: warn

      # =========================================================
      # 17. MOSTRAR ARCHIVOS
      # =========================================================
      - name: Mostrar archivos generados
        if: always()
        run: |
          echo "======================================"
          echo "ARCHIVOS GENERADOS"
          echo "======================================"

          find data/radar -type f -print 2>/dev/null || true
