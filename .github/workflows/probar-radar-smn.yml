name: Probar Radar SINARAME RMA10

on:
  workflow_dispatch:

jobs:
  capturar-radar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Capturar radar SINARAME
        run: |
          python scraper/capturar_radar_smn.py

      - name: Subir diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinarame-rma10-debug
          path: |
            data/radar/sinarame_network.txt
            data/radar/sinarame_rma10.png
            data/radar/sinarame_rma10.html
          if-no-files-found: warn

      - name: Mostrar resultado
        if: always()
        run: |
          echo "======================================"
          echo "ARCHIVOS GENERADOS"
          echo "======================================"
          find data/radar -type f -print 2>/dev/null || true

          echo ""
          echo "======================================"
          echo "NETWORK"
          echo "======================================"
          cat data/radar/sinarame_network.txt 2>/dev/null || true
