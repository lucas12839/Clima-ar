name: Probar Radar SMN

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. DIRECTORIOS
      # ============================================================

      - name: Preparar directorios
        run: |
          set -e

          mkdir -p data/radar
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar/mascaras

      # ============================================================
      # 3. DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            requests \
            numpy \
            scipy \
            opencv-python-headless \
            Pillow \
            pandas \
            joblib \
            scikit-learn \
            playwright

          playwright install --with-deps chromium

      # ============================================================
      # 4. BUSCAR ÚLTIMO WORKFLOW EXITOSO
      # ============================================================

      - name: Buscar último workflow exitoso
        id: ultimo_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          RUN_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/probar-radar-smn.yml/runs?status=success&per_page=10" \
            --jq '.workflow_runs
              | map(select(.id != '\"${GITHUB_RUN_ID}\"'))
              | .[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No hay workflow exitoso anterior."
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Último workflow exitoso: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. RECUPERAR HISTORIAL ANTERIOR
      # ============================================================

      - name: Descargar historial anterior
        if: steps.ultimo_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: radar-rma10
          path: /tmp/radar_anterior
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ultimo_run.outputs.run_id }}

      # ============================================================
      # 6. RESTAURAR HISTORIAL
      # ============================================================

      - name: Integrar historial anterior
        shell: bash
        run: |
          set -e

          if [ -d "/tmp/radar_anterior/historico" ]; then

            cp -f \
              /tmp/radar_anterior/historico/*.png \
              data/radar/historico/ \
              2>/dev/null || true

          fi

          if [ ! -f "data/radar/seguimiento/estado.json" ] &&
             [ -f "/tmp/radar_anterior/seguimiento/estado.json" ]; then

            cp -f \
              /tmp/radar_anterior/seguimiento/estado.json \
              data/radar/seguimiento/estado.json

          fi

          echo "Historial recuperado:"

          find data/radar/historico \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | sort \
            | tail -20

      # ============================================================
      # 7. CAPTURAR RADAR
      # ============================================================

      - name: Capturar radar RMA10
        id: captura
        timeout-minutes: 8
        run: |
          set -e

          python scraper/capturar_radar_smn.py

      # ============================================================
      # 8. VERIFICAR CAPTURA
      # ============================================================

      - name: Verificar captura
        if: steps.captura.outcome == 'success'
        shell: bash
        run: |
          set -e

          test -f data/radar/actual.png
          test -f data/radar/radar_timestamp.txt

          COUNT=$(find data/radar/historico \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | wc -l)

          echo "Frames históricos: $COUNT"

          if [ "$COUNT" -lt 3 ]; then
            echo "ERROR: menos de 3 frames históricos."
            exit 1
          fi

      # ============================================================
      # 9. MÁSCARA ESTÁTICA
      # ============================================================

      - name: Generar máscara estática
        if: steps.captura.outcome == 'success'
        timeout-minutes: 3
        run: |
          set -e

          python scripts/generar_mascara_estatica.py

      # ============================================================
      # 10. PROCESAR RADAR
      # ============================================================

      - name: Procesar radar
        if: steps.captura.outcome == 'success'
        timeout-minutes: 3
        run: |
          set -e

          python scripts/procesador_radar.py

      # ============================================================
      # 11. VERIFICAR CONTINUIDAD
      # ============================================================

      - name: Verificar continuidad
        id: continuidad
        if: steps.captura.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          estado_path = Path(
              "data/radar/seguimiento/estado.json"
          )

          radar_path = Path(
              "data/radar/radar_timestamp.txt"
          )

          salida = os.environ["GITHUB_OUTPUT"]

          def parse_ts(value):
              if not value:
                  return None

              value = str(value).strip()

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              try:
                  dt = datetime.fromisoformat(value)
              except Exception:
                  return None

              if dt.tzinfo is None:
                  dt = dt.replace(
                      tzinfo=timezone.utc
                  )

              return dt.astimezone(
                  timezone.utc
              )

          estado_ts = None
          radar_ts = None

          if estado_path.exists():
              try:
                  data = json.loads(
                      estado_path.read_text(
                          encoding="utf-8"
                      )
                  )

                  estado_ts = parse_ts(
                      data.get(
                          "ultimo_radar_timestamp"
                      )
                  )

              except Exception as exc:
                  print(
                      "Aviso estado.json:",
                      exc
                  )

          if radar_path.exists():
              radar_ts = parse_ts(
                  radar_path.read_text(
                      encoding="utf-8"
                  )
              )

          print("Estado:", estado_ts)
          print("Radar :", radar_ts)

          if radar_ts is None:
              print(
                  "ERROR: timestamp radar inválido."
              )

              Path(
                  "data/radar/continuidad.txt"
              ).write_text(
                  "accepted=false\n",
                  encoding="utf-8"
              )

              with open(
                  salida,
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "accepted=false\n"
                  )

              raise SystemExit(0)

          if estado_ts is None:
              print(
                  "Sin estado anterior."
              )
              print(
                  "Radar aceptado como inicio."
              )

              accepted = True

          else:
              intervalo = (
                  radar_ts - estado_ts
              ).total_seconds() / 60.0

              print(
                  f"Intervalo: {intervalo:.1f} min"
              )

              if intervalo <= 0:
                  print(
                      "RADAR DESCARTADO: "
                      "repetido o atrasado."
                  )
                  accepted = False

                  Path(
                      "data/radar/FRAME_DESCARTADO.txt"
                  ).write_text(
                      (
                          "Radar descartado.\n"
                          f"Estado: {estado_ts.isoformat()}\n"
                          f"Radar: {radar_ts.isoformat()}\n"
                          f"Intervalo: {intervalo:.1f} min\n"
                      ),
                      encoding="utf-8"
                  )

              else:
                  accepted = True

          Path(
              "data/radar/continuidad.txt"
          ).write_text(
              f"accepted={'true' if accepted else 'false'}\n",
              encoding="utf-8"
          )

          with open(
              salida,
              "a",
              encoding="utf-8"
          ) as f:
              f.write(
                  f"accepted={'true' if accepted else 'false'}\n"
              )

          print(
              "Continuidad aceptada:",
              accepted
          )
          PY

      # ============================================================
      # 12. PREPARAR HISTORIAL PARA TRACKING
      #
      # Acepta:
      #   YYYYMMDDHHMMSS.png
      #
      # También acepta:
      #   YYYYMMDD_HHMMSS.png
      #
      # Así no perdemos históricos antiguos.
      #
      # Máximo 6 frames.
      # Máximo 60 minutos entre frames consecutivos.
      # ============================================================

      - name: Preparar historial continuo
        id: preparar_tracking
        if: steps.continuidad.outputs.accepted == 'true'
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import shutil

          HIST = Path(
              "data/radar/historico"
          )

          BACKUP = Path(
              "data/radar/historico_tracking_backup"
          )

          BACKUP.mkdir(
              parents=True,
              exist_ok=True
          )

          ts_file = Path(
              "data/radar/radar_timestamp.txt"
          )

          raw = ts_file.read_text(
              encoding="utf-8"
          ).strip()

          if raw.endswith("Z"):
              raw = raw[:-1] + "+00:00"

          radar_ts = datetime.fromisoformat(
              raw
          )

          if radar_ts.tzinfo is None:
              radar_ts = radar_ts.replace(
                  tzinfo=timezone.utc
              )

          radar_ts = radar_ts.astimezone(
              timezone.utc
          )

          def parse_filename(path):

              name = path.stem

              formatos = (
                  "%Y%m%d%H%M%S",
                  "%Y%m%d_%H%M%S",
              )

              for formato in formatos:
                  try:
                      return datetime.strptime(
                          name,
                          formato
                      ).replace(
                          tzinfo=timezone.utc
                      )
                  except ValueError:
                      pass

              return None

          frames = []

          for path in HIST.glob("*.png"):

              stamp = parse_filename(path)

              if stamp is None:
                  continue

              if stamp > radar_ts:
                  continue

              frames.append(
                  (stamp, path)
              )

          frames.sort(
              key=lambda x: x[0],
              reverse=True
          )

          seleccionados = []

          anterior = radar_ts

          for stamp, path in frames:

              diferencia = (
                  anterior - stamp
              ).total_seconds() / 60.0

              if diferencia < 0:
                  continue

              if diferencia > 60:
                  print(
                      "CORTE:",
                      f"{diferencia:.1f} min"
                  )
                  break

              seleccionados.append(
                  path
              )

              anterior = stamp

              if len(seleccionados) >= 6:
                  break

          usados = {
              p.resolve()
              for p in seleccionados
          }

          print()
          print(
              "Frames seleccionados:"
          )

          for p in reversed(
              seleccionados
          ):
              print(
                  " ",
                  p.name
              )

          print(
              "Total:",
              len(seleccionados)
          )

          # Guardar los que no serán usados.
          for stamp, path in frames:

              if path.resolve() in usados:
                  continue

              destino = BACKUP / path.name

              if destino.exists():
                  destino.unlink()

              shutil.move(
                  str(path),
                  str(destino)
              )

          print(
              "Historial listo para tracking."
          )
          PY

      # ============================================================
      # 13. TRACKING
      # ============================================================

      - name: Seguimiento temporal
        id: seguimiento
        if: steps.continuidad.outputs.accepted == 'true'
        timeout-minutes: 4
        run: |
          set -e

          python seguimiento_temporal.py

      # ============================================================
      # 14. RESTAURAR HISTORIAL
      # ============================================================

      - name: Restaurar historial
        if: always()
        shell: bash
        run: |
          set +e

          if [ -d "data/radar/historico_tracking_backup" ]; then

            cp -f \
              data/radar/historico_tracking_backup/*.png \
              data/radar/historico/ \
              2>/dev/null || true

          fi

          rm -rf \
            data/radar/historico_tracking_backup

      # ============================================================
      # 15. ML
      # ============================================================

      - name: Predicción ML
        if: >
          steps.continuidad.outputs.accepted == 'true' &&
          steps.seguimiento.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -e

          python scripts/prediccion_rma10_ml.py

      # ============================================================
      # 16. EVOLUCIÓN
      # ============================================================

      - name: Predicción de evolución
        if: >
          steps.continuidad.outputs.accepted == 'true' &&
          steps.seguimiento.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -e

          python scripts/prediccion_evolucion.py

      # ============================================================
      # 17. MOSTRAR RESULTADOS
      # ============================================================

      - name: Resumen final
        if: always()
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       RESULTADO CLIMAAR RMA10"
          echo "======================================"
          echo ""

          if [ -f data/radar/radar_timestamp.txt ]; then
            echo "Radar:"
            cat data/radar/radar_timestamp.txt
          fi

          echo ""

          if [ -f data/radar/continuidad.txt ]; then
            echo "Continuidad:"
            cat data/radar/continuidad.txt
          fi

          echo ""

          if [ -f data/radar/resultado_procesamiento.json ]; then
            echo "Procesamiento:"
            python - <<'PY'
          import json

          path = "data/radar/resultado_procesamiento.json"

          try:
              data = json.load(
                  open(
                      path,
                      encoding="utf-8"
                  )
              )

              print(
                  "Núcleos:",
                  data.get(
                      "nucleos_detectados"
                  )
              )

              print(
                  "Dinámicos:",
                  data.get(
                      "pixeles_dinamicos"
                  )
              )

              print(
                  "Estado:",
                  data.get(
                      "estado_general"
                  )
              )

          except Exception as exc:
              print(
                  "No se pudo leer:",
                  exc
              )
          PY
          fi

      # ============================================================
      # 18. GUARDAR ESTADO EN GIT
      # ============================================================

      - name: Guardar resultados
        if: always()
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/radar/actual.png \
            data/radar/radar_timestamp.txt \
            data/radar/resultado_procesamiento.json \
            data/radar/continuidad.txt \
            data/radar/FRAME_DESCARTADO.txt \
            data/radar/mascara_ecos_estaticos.png \
            data/radar/mascara_ecos_estaticos_confianza.png \
            data/radar/mascara_ecos_estaticos.json \
            data/radar/seguimiento \
            .climaar/estado_rma10.json \
            2>/dev/null

          git commit \
            -m "Actualizar radar RMA10 ClimaAR" \
            2>/dev/null || true

          git push \
            2>/dev/null || true

      # ============================================================
      # 19. ARTIFACTO LIVIANO
      # ============================================================

      - name: Guardar historial radar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/historico/
            data/radar/actual.png
            data/radar/radar_timestamp.txt
            data/radar/resultado_procesamiento.json
            data/radar/continuidad.txt
            data/radar/seguimiento/
          if-no-files-found: ignore
          retention-days: 7
