name: Probar Radar SMN

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: radar-rma10
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar directorios
        run: |
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar/procesado
          mkdir -p data/radar/prediccion
          mkdir -p .climaar

      - name: Restaurar estado persistente
        run: |
          if [ -f .climaar/estado_rma10.json ]; then
            cp .climaar/estado_rma10.json data/radar/seguimiento/estado.json
            echo "Estado persistente restaurado."
          else
            echo "No existe estado persistente previo. Se inicia estado nuevo."
          fi

      - name: Recuperar histórico desde artefactos anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf /tmp/radar_artifacts
          mkdir -p /tmp/radar_artifacts

          gh run list \
            --workflow probar-radar-smn.yml \
            --limit 20 \
            --json databaseId,status,conclusion \
            --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' \
            > /tmp/radar_runs.txt || true

          while read -r run_id; do
            [ -z "$run_id" ] && continue

            gh run download "$run_id" \
              -n radar-rma10 \
              -D "/tmp/radar_artifacts/$run_id" \
              2>/dev/null || true
          done < /tmp/radar_runs.txt

          find /tmp/radar_artifacts \
            -type f \
            -path '*/historico/*.png' \
            -exec cp -n {} data/radar/historico/ \; \
            2>/dev/null || true

          find /tmp/radar_artifacts \
            -type f \
            -name 'predicciones_pendientes.json' \
            -exec cp -n {} data/radar/seguimiento/ \; \
            2>/dev/null || true

          echo "Histórico disponible:"
          find data/radar/historico \
            -maxdepth 1 \
            -type f \
            -name '*.png' | wc -l

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capturar radar RMA10
        run: |
          python scraper/capturar_radar_smn.py

          test -f data/radar/actual.png
          cp data/radar/actual.png data/radar/latest.png

          echo "Radar capturado correctamente."
          ls -lh data/radar/actual.png
          ls -lh data/radar/latest.png

      - name: Aprender ecos estáticos
        run: |
          python scripts/generar_mascara_estatica.py

      - name: Procesar radar
        run: |
          python scripts/procesar_radar.py

      - name: Seguimiento temporal
        run: |
          python seguimiento_temporal.py

      - name: Predicción de evolución
        run: |
          python prediccion_evolucion.py

      - name: Guardar predicciones normales como pendientes
        run: |
          python guardar_predicciones_pendientes.py

      - name: Guardar estado persistente
        run: |
          set -e

          test -f data/radar/seguimiento/estado.json

          cp \
            data/radar/seguimiento/estado.json \
            .climaar/estado_rma10.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .climaar/estado_rma10.json

          if git diff --cached --quiet; then
            echo "Estado sin cambios para guardar."
          else
            git commit -m "Actualizar estado RMA10"
            git push
          fi

      - name: Mostrar resultado
        run: |
          echo "=== TIMESTAMP RADAR ==="
          cat data/radar/radar_timestamp.txt || true

          echo "=== SEGUIMIENTO ==="

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/radar/seguimiento/estado.json")

          if p.exists():
              d = json.loads(p.read_text())

              tracks = d.get("tracks", [])

              activos = [
                  t for t in tracks
                  if t.get("activo")
              ]

              mov = [
                  t for t in activos
                  if t.get("velocidad_pixeles_min", 0) > 0
              ]

              print("timestamp:", d.get("ultimo_radar_timestamp"))
              print("tracks:", len(tracks))
              print("activos:", len(activos))
              print("con movimiento:", len(mov))
          PY

      - name: Persistir estado y máscara
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .climaar/estado_rma10.json \
            data/radar/seguimiento/mascara_estatica.json \
            data/radar/seguimiento/mascara_estatica.png \
            data/radar/radar_timestamp.txt \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Sin cambios adicionales para persistir."
          else
            git commit -m "Actualizar estado y mascara RMA10"
            git push
          fi

      - name: Subir artefacto radar-rma10
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/actual.png
            data/radar/latest.png
            data/radar/radar_timestamp.txt
            data/radar/historico/*.png
            data/radar/seguimiento/**
            data/radar/procesado/**
            data/radar/prediccion/**
          retention-days: 7
