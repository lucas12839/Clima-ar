name: ClimaAR Radar RMA10

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: climaar-production-writes
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      # ============================================================
      # PLAYWRIGHT
      # ============================================================

      - name: Instalar Chromium para Playwright
        run: |
          set -euo pipefail

          python -m pip show playwright
          sudo apt-get update
          python -m playwright install-deps chromium \
            || sudo "$(command -v python)" -m playwright install-deps chromium
          python -m playwright install chromium

      # ============================================================
      # DIRECTORIOS
      # ============================================================

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar \
            data/radar/historico \
            data/radar/seguimiento \
            logs

      # ============================================================
      # VERIFICAR ARCHIVOS REALES
      # ============================================================

      - name: Verificar componentes reales
        run: |
          set -euo pipefail

          test -f scraper/capturar_radar_smn.py
          test -f scripts/procesador_radar.py
          test -f seguimiento_temporal.py

          echo "======================================"
          echo "COMPONENTES RMA10"
          echo "======================================"
          echo "Capturador:"
          echo "  scraper/capturar_radar_smn.py"
          echo
          echo "Procesador:"
          echo "  scripts/procesador_radar.py"
          echo
          echo "Tracking:"
          echo "  seguimiento_temporal.py"
          echo "======================================"

      # ============================================================
      # CAPTURA
      # ============================================================

      - name: Ejecutar captura RMA10
        run: |
          set -euo pipefail

          python scraper/capturar_radar_smn.py

      # ============================================================
      # VALIDAR FRAME
      # ============================================================

      - name: Validar frame RMA10
        run: |
          set -euo pipefail

          test -s data/radar/actual.png
          test -s data/radar/radar_timestamp.txt

          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image

          image_path = Path(
              "data/radar/actual.png"
          )

          timestamp_path = Path(
              "data/radar/radar_timestamp.txt"
          )

          # --------------------------------------------------
          # PNG
          # --------------------------------------------------

          try:
              with Image.open(image_path) as image:
                  image.verify()
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: PNG RMA10 inválido: {exc}"
              ) from exc

          # --------------------------------------------------
          # TIMESTAMP
          # --------------------------------------------------

          raw = timestamp_path.read_text(
              encoding="utf-8"
          ).strip()

          if not raw:
              raise SystemExit(
                  "ERROR: radar_timestamp.txt está vacío."
              )

          texto = raw

          if texto.endswith("Z"):
              texto = texto[:-1] + "+00:00"

          try:
              dt = datetime.fromisoformat(texto)
          except ValueError as exc:
              raise SystemExit(
                  f"ERROR: timestamp RMA10 inválido: {raw!r}"
              ) from exc

          if dt.tzinfo is None:
              raise SystemExit(
                  "ERROR: timestamp RMA10 sin zona horaria."
              )

          dt = dt.astimezone(timezone.utc)

          ahora = datetime.now(timezone.utc)

          edad = (
              ahora - dt
          ).total_seconds()

          print(
              "Timestamp RMA10:",
              dt.isoformat()
          )

          print(
              "Edad del frame:",
              round(edad),
              "segundos"
          )

          if edad < -120:
              raise SystemExit(
                  "ERROR: timestamp RMA10 "
                  "está más de 2 minutos en el futuro."
              )

          if edad > 2700:
              # SINARAME dejó de publicar: se continúa con el último
              # radar válido para que Intelligence siga estimando con
              # meteorología actual hasta recibir un radar nuevo.
              print(
                  "ADVERTENCIA: RMA10 sin actualizar hace "
                  f"{round(edad / 60)} min; se usa el último radar válido."
              )

          print(
              "FRAME RMA10: OK"
          )
          PY

      # ============================================================
      # PROCESAMIENTO RADAR
      # ============================================================

      - name: Procesar radar
        run: |
          set -euo pipefail

          python scripts/procesador_radar.py

      # ============================================================
      # VALIDAR PROCESAMIENTO
      # ============================================================

      - name: Validar resultado del procesamiento
        run: |
          set -euo pipefail

          test -s data/radar/resultado_procesamiento.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/radar/resultado_procesamiento.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: resultado_procesamiento.json "
                  "no contiene un objeto JSON."
              )

          required = (
              "nucleos",
              "nucleos_dinamicos",
              "nucleos_estaticos",
              "clasificacion_severidad",
          )

          for key in required:

              if key not in data:

                  raise SystemExit(
                      f"ERROR: falta campo {key!r} "
                      "en resultado_procesamiento.json."
                  )

          if not isinstance(
              data["nucleos"],
              list
          ):

              raise SystemExit(
                  "ERROR: resultado.nucleos "
                  "no es una lista."
              )

          if not isinstance(
              data["nucleos_dinamicos"],
              int
          ):

              raise SystemExit(
                  "ERROR: nucleos_dinamicos "
                  "no es entero."
              )

          if not isinstance(
              data["nucleos_estaticos"],
              list
          ):

              raise SystemExit(
                  "ERROR: nucleos_estaticos "
                  "no es una lista."
              )

          # --------------------------------------------------
          # Ecos estáticos
          # --------------------------------------------------

          for nucleo in data["nucleos"]:

              if not isinstance(
                  nucleo,
                  dict
              ):

                  raise SystemExit(
                      "ERROR: núcleo operativo inválido."
                  )

              if str(
                  nucleo.get(
                      "estado",
                      ""
                  )
              ).upper() == "ECO_ESTATICO":

                  raise SystemExit(
                      "ERROR: ECO_ESTATICO "
                      "entró en resultado.nucleos."
                  )

          # --------------------------------------------------
          # Cantidad dinámica
          # --------------------------------------------------

          if (
              data["nucleos_dinamicos"]
              != len(data["nucleos"])
          ):

              raise SystemExit(
                  "ERROR: nucleos_dinamicos "
                  "no coincide con resultado.nucleos."
              )

          # --------------------------------------------------
          # Radar != severidad
          # --------------------------------------------------

          if data.get(
              "radar_intensidad_es_senal_no_severidad"
          ) is not True:

              raise SystemExit(
                  "ERROR: el procesador no declara "
                  "correctamente que radar ≠ severidad."
              )

          print(
              "======================================"
          )

          print(
              "PROCESAMIENTO RADAR: OK"
          )

          print(
              "Núcleos operativos:",
              len(data["nucleos"])
          )

          print(
              "Núcleos estáticos:",
              len(data["nucleos_estaticos"])
          )

          print(
              "Estado radar:",
              data.get("estado_general")
          )

          print(
              "Clasificación severidad:",
              data.get("clasificacion_severidad")
          )

          print(
              "======================================"
          )
          PY

      # ============================================================
      # TRACKING
      # ============================================================

      - name: Ejecutar seguimiento temporal
        run: |
          set -euo pipefail

          python seguimiento_temporal.py

      # ============================================================
      # VALIDAR RADAR → TRACKING
      # ============================================================

      - name: Validar cadena Radar → Tracking
        run: |
          set -euo pipefail

          test -s data/radar/radar_timestamp.txt
          test -s data/radar/resultado_procesamiento.json
          test -s data/radar/seguimiento/estado.json
          test -s data/radar/seguimiento/seguimiento_temporal.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = Path(
              "data/radar"
          )

          radar_path = (
              BASE / "radar_timestamp.txt"
          )

          resultado_path = (
              BASE / "resultado_procesamiento.json"
          )

          estado_path = (
              BASE
              / "seguimiento"
              / "estado.json"
          )

          seguimiento_path = (
              BASE
              / "seguimiento"
              / "seguimiento_temporal.json"
          )

          # ==================================================
          # TIMESTAMP
          # ==================================================

          def parse_timestamp(
              value,
              name
          ):

              if value is None:

                  raise SystemExit(
                      f"ERROR: falta timestamp en {name}."
                  )

              text = str(
                  value
              ).strip()

              if not text:

                  raise SystemExit(
                      f"ERROR: timestamp vacío en {name}."
                  )

              if text.endswith("Z"):

                  text = (
                      text[:-1]
                      + "+00:00"
                  )

              try:

                  dt = datetime.fromisoformat(
                      text
                  )

              except ValueError as exc:

                  raise SystemExit(
                      f"ERROR: timestamp inválido "
                      f"en {name}: {value!r}"
                  ) from exc

              if dt.tzinfo is None:

                  raise SystemExit(
                      f"ERROR: timestamp sin "
                      f"zona horaria en {name}."
                  )

              return dt.astimezone(
                  timezone.utc
              )

          radar_raw = (
              radar_path
              .read_text(
                  encoding="utf-8"
              )
              .strip()
          )

          radar_dt = parse_timestamp(
              radar_raw,
              "radar_timestamp.txt"
          )

          # ==================================================
          # JSON
          # ==================================================

          resultado = json.loads(
              resultado_path.read_text(
                  encoding="utf-8"
              )
          )

          estado = json.loads(
              estado_path.read_text(
                  encoding="utf-8"
              )
          )

          seguimiento = json.loads(
              seguimiento_path.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(
              resultado,
              dict
          ):

              raise SystemExit(
                  "ERROR: resultado_procesamiento.json inválido."
              )

          if not isinstance(
              estado,
              dict
          ):

              raise SystemExit(
                  "ERROR: estado.json inválido."
              )

          if not isinstance(
              seguimiento,
              dict
          ):

              raise SystemExit(
                  "ERROR: seguimiento_temporal.json inválido."
              )

          # ==================================================
          # TIMESTAMP RADAR → TRACKING
          #
          # IMPORTANTE:
          # timestamp_procesamiento NO se compara.
          # Es la hora de ejecución del procesador.
          #
          # El timestamp meteorológico real es:
          # radar_timestamp.txt
          #
          # Tracking conserva ese mismo timestamp.
          # ==================================================

          tracking_ts = parse_timestamp(
              seguimiento.get(
                  "radar_timestamp"
              ),
              "seguimiento_temporal.radar_timestamp"
          )

          estado_ts = parse_timestamp(
              estado.get(
                  "ultimo_radar_timestamp"
              ),
              "estado.ultimo_radar_timestamp"
          )

          if tracking_ts != radar_dt:

              raise SystemExit(
                  "ERROR: timestamp desincronizado "
                  "Radar → Tracking: "
                  f"radar={radar_dt.isoformat()} "
                  f"tracking={tracking_ts.isoformat()}"
              )

          if estado_ts != radar_dt:

              raise SystemExit(
                  "ERROR: timestamp desincronizado "
                  "Radar → estado Tracking: "
                  f"radar={radar_dt.isoformat()} "
                  f"estado={estado_ts.isoformat()}"
              )

          # ==================================================
          # NÚCLEOS
          # ==================================================

          nucleos_radar = (
              resultado.get(
                  "nucleos"
              )
          )

          nucleos_tracking = (
              seguimiento.get(
                  "nucleos"
              )
          )

          if not isinstance(
              nucleos_radar,
              list
          ):

              raise SystemExit(
                  "ERROR: resultado.nucleos inválido."
              )

          if not isinstance(
              nucleos_tracking,
              list
          ):

              raise SystemExit(
                  "ERROR: tracking.nucleos inválido."
              )

          cantidad_radar = len(
              nucleos_radar
          )

          cantidad_tracking = len(
              nucleos_tracking
          )

          if cantidad_radar != cantidad_tracking:

              raise SystemExit(
                  "ERROR: cantidad de núcleos "
                  "Radar != Tracking: "
                  f"{cantidad_radar} != "
                  f"{cantidad_tracking}"
              )

          # ==================================================
          # TRACK PRINCIPAL
          # ==================================================

          principal = (
              seguimiento.get(
                  "track_principal_candidato_id"
              )
          )

          def same_id(
              a,
              b
          ):
              return str(a) == str(b)

          # --------------------------------------------------
          # Caso SIN núcleos operativos:
          #
          # No existe amenaza principal.
          # Esto es válido.
          # --------------------------------------------------

          if cantidad_tracking == 0:

              if principal is not None:

                  raise SystemExit(
                      "ERROR: no hay núcleos operativos "
                      "pero Tracking declaró "
                      "un principal."
                  )

              print(
                  "No hay núcleos operativos."
              )

              print(
                  "Principal: NINGUNO — válido."
              )

          # --------------------------------------------------
          # Caso CON núcleos:
          #
          # Tiene que existir exactamente un candidato
          # principal válido.
          # --------------------------------------------------

          else:

              if principal is None:

                  raise SystemExit(
                      "ERROR: existen núcleos operativos "
                      "pero Tracking no definió "
                      "track_principal_candidato_id."
                  )

              principal_nucleo = None

              for nucleo in nucleos_tracking:

                  if not isinstance(
                      nucleo,
                      dict
                  ):

                      continue

                  if same_id(
                      nucleo.get(
                          "track_id"
                      ),
                      principal
                  ):

                      principal_nucleo = nucleo

                      break

              if principal_nucleo is None:

                  raise SystemExit(
                      "ERROR: el principal "
                      f"{principal!r} no existe "
                      "en tracking.nucleos."
                  )

              # ------------------------------------------------
              # Estado persistente
              # ------------------------------------------------

              tracks = estado.get(
                  "tracks",
                  []
              )

              if not isinstance(
                  tracks,
                  list
              ):

                  raise SystemExit(
                      "ERROR: estado.tracks "
                      "no es una lista."
                  )

              principal_track = None

              for track in tracks:

                  if not isinstance(
                      track,
                      dict
                  ):

                      continue

                  if same_id(
                      track.get(
                          "track_id"
                      ),
                      principal
                  ):

                      principal_track = track

                      break

              if principal_track is None:

                  raise SystemExit(
                      "ERROR: principal "
                      f"{principal!r} no existe "
                      "en estado.tracks."
                  )

              if principal_track.get(
                  "activo"
              ) is not True:

                  raise SystemExit(
                      "ERROR: principal "
                      f"{principal!r} no está activo."
                  )

              if principal_track.get(
                  "presente_en_ultimo_frame"
              ) is not True:

                  raise SystemExit(
                      "ERROR: principal "
                      f"{principal!r} no está presente "
                      "en el último frame."
                  )

              print(
                  "Track principal:",
                  principal
              )

              print(
                  "Principal activo: OK"
              )

              print(
                  "Principal presente: OK"
              )

          # ==================================================
          # ECOS ESTÁTICOS
          # ==================================================

          for nucleo in nucleos_tracking:

              if not isinstance(
                  nucleo,
                  dict
              ):

                  raise SystemExit(
                      "ERROR: núcleo inválido "
                      "en tracking."
                  )

              if str(
                  nucleo.get(
                      "estado",
                      ""
                  )
              ).upper() == "ECO_ESTATICO":

                  raise SystemExit(
                      "ERROR: ECO_ESTATICO "
                      "llegó al tracking."
                  )

          # ==================================================
          # RESULTADO
          # ==================================================

          print(
              "======================================"
          )

          print(
              "CADENA RADAR → TRACKING: OK"
          )

          print(
              "======================================"
          )

          print(
              "Frame UTC:",
              radar_dt.isoformat()
          )

          print(
              "Núcleos Radar:",
              cantidad_radar
          )

          print(
              "Núcleos Tracking:",
              cantidad_tracking
          )

          print(
              "Timestamp Radar = Tracking: OK"
          )

          print(
              "Ecos estáticos excluidos: OK"
          )

          print(
              "======================================"
          )
          PY

      # ============================================================
      # ARTEFACTO
      # ============================================================

      - name: Preparar artefacto Radar RMA10
        run: |
          set -euo pipefail

          rm -rf /tmp/radar-rma10

          mkdir -p \
            /tmp/radar-rma10/data/radar

          cp -a \
            data/radar/. \
            /tmp/radar-rma10/data/radar/

      - name: Publicar artefacto Radar RMA10
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: /tmp/radar-rma10
          retention-days: 7

      - name: Disparar Intelligence con el artefacto recién publicado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RADAR_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh workflow run climaar-intelligence.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f radar_run_id="$RADAR_RUN_ID"

      # ============================================================
      # PERSISTENCIA ROBUSTA
      # ============================================================

      - name: Persistir resultados
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # --------------------------------------------------
          # IMPORTANTE
          #
          # No agregamos solamente data/radar.
          #
          # El fallo anterior demostró que el job podía terminar
          # con modificaciones fuera de esa ruta.
          #
          # Por eso primero dejamos TODO el árbol limpio mediante
          # un commit de los cambios producidos por el pipeline.
          # --------------------------------------------------

          git add -A

          if git diff --cached --quiet; then

            echo "No hay cambios para publicar."

            exit 0

          fi

          git commit \
            -m "ClimaAR: actualizar Radar RMA10"

          # --------------------------------------------------
          # Comprobar que el commit dejó el árbol limpio.
          # --------------------------------------------------

          if [ -n "$(git status --porcelain)" ]; then

            echo
            echo "ERROR: el árbol sigue sucio después del commit."
            echo
            git status --short
            echo

            exit 1

          fi

          # --------------------------------------------------
          # Sincronización robusta con main.
          #
          # --autostash evita el error:
          #
          # "cannot rebase: You have unstaged changes"
          #
          # aunque aparezca alguna modificación durante la
          # sincronización.
          # --------------------------------------------------

          for intento in 1 2 3; do

            echo
            echo "======================================"
            echo "SINCRONIZACIÓN — INTENTO $intento"
            echo "======================================"

            git fetch origin main

            if git rebase --autostash origin/main; then

              echo "Rebase exitoso."

            else

              echo "Rebase falló."

              git rebase --abort 2>/dev/null || true

              if [ "$intento" -eq 3 ]; then

                echo
                echo "ERROR: no se pudo sincronizar main."
                echo
                git status --short

                exit 1

              fi

              sleep 3

              continue

            fi

            # ------------------------------------------------
            # Verificación después del rebase.
            # ------------------------------------------------

            if [ -n "$(git status --porcelain)" ]; then

              echo
              echo "Se detectaron cambios después del rebase."
              echo "Se incorporan al commit de resultados."
              echo

              git add -A

              if ! git diff --cached --quiet; then

                git commit \
                  -m "ClimaAR: completar persistencia Radar RMA10"

              fi

            fi

            # ------------------------------------------------
            # Push
            # ------------------------------------------------

            if git push origin HEAD:main; then

              echo
              echo "======================================"
              echo "PERSISTENCIA: OK"
              echo "======================================"

              exit 0

            fi

            echo
            echo "Push rechazado."
            echo "El remoto pudo avanzar durante el proceso."
            echo "Se reintentará."
            echo

            sleep 3

          done

          echo
          echo "ERROR: agotados los intentos de sincronización."
          exit 1
