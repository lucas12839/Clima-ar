name: Probar Radar SMN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-radar:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. DESCARGAR REPOSITORIO
      # =========================================================
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # 2. CONFIGURAR PYTHON
      # =========================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 3. INSTALAR DEPENDENCIAS
      # =========================================================
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # =========================================================
      # 4. RECUPERAR MÁSCARA ESTÁTICA
      # =========================================================
      - name: Recuperar mascara estatica
        id: mascara
        uses: actions/cache@v4
        with:
          path: |
            data/radar/mascara_ecos_estaticos.png
            data/radar/mascara_ecos_estaticos.json
          key: climaar-rma10-mascara-estatica-v1

      # =========================================================
      # 5. CREAR DIRECTORIOS TEMPORALES
      # =========================================================
      - name: Preparar directorios
        run: |
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar/historico

      # =========================================================
      # 6. DESCARGAR RADAR RMA10
      # =========================================================
      - name: Descargar radar RMA10
        env:
          CLIMAAR_CAPTURE_MODE: ${{ steps.mascara.outputs.cache-hit == 'true' && 'rapido' || 'inicial' }}
        run: |
          python scraper/capturar_radar_smn.py

      # =========================================================
      # 7. GENERAR MÁSCARA SI NO EXISTE
      # =========================================================
      - name: Generar mascara estatica inicial
        if: steps.mascara.outputs.cache-hit != 'true'
        run: |
          python scripts/generar_mascara_estatica.py

      # =========================================================
      # 8. PROCESAR RADAR
      # =========================================================
      - name: Procesar radar
        run: |
          python procesador_radar.py

      # =========================================================
      # 9. SEGUIMIENTO TEMPORAL
      #
      # estado.json ya está en el repositorio.
      # seguimiento_temporal.py lo recupera automáticamente.
      # =========================================================
      - name: Seguimiento temporal
        run: |
          python seguimiento_temporal.py

      # =========================================================
      # 10. PREDICCIÓN DE EVOLUCIÓN
      # =========================================================
      - name: Prediccion de evolucion
        run: |
          python prediccion_evolucion.py

      # =========================================================
      # 11. MOSTRAR ESTADO
      # =========================================================
      - name: Mostrar estado temporal
        if: always()
        run: |
          echo "======================================"
          echo "ESTADO TEMPORAL"
          echo "======================================"

          if [ -f data/radar/seguimiento/estado.json ]; then
            cat data/radar/seguimiento/estado.json
          else
            echo "No existe estado.json"
          fi

          echo ""
          echo "======================================"
          echo "SEGUIMIENTO"
          echo "======================================"

          if [ -f data/radar/seguimiento/seguimiento_temporal.json ]; then
            cat data/radar/seguimiento/seguimiento_temporal.json
          else
            echo "No existe seguimiento_temporal.json"
          fi

      # =========================================================
      # 12. GUARDAR ESTADO EN GITHUB
      #
      # Esto es lo importante.
      # El siguiente Action recuperará este estado.
      # =========================================================
      - name: Guardar estado temporal
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/radar/seguimiento/estado.json

          if git diff --cached --quiet; then
            echo "No hay cambios en el estado temporal."
          else
            git commit -m "Actualizar estado temporal RMA10"
            git push
          fi

      # =========================================================
      # 13. SUBIR ARTEFACTOS
      # =========================================================
      - name: Subir radar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/actual.png
            data/radar/historico/
            data/radar/mascara_ecos_estaticos.png
            data/radar/mascara_ecos_estaticos.json
            data/radar/resultado_procesamiento.json
            data/radar/seguimiento/
            data/radar/radar_timestamp.txt
          if-no-files-found: warn

      # =========================================================
      # 14. MOSTRAR ARCHIVOS
      # =========================================================
      - name: Mostrar archivos generados
        if: always()
        run: |
          echo "======================================"
          echo "ARCHIVOS GENERADOS"
          echo "======================================"
          find data/radar -type f -print 2>/dev/null || true
