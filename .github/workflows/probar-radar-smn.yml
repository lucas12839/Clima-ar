name: Probar Radar SINARAME RMA10

on:
  workflow_dispatch:

jobs:
  capturar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Capturar radar SINARAME
        continue-on-error: true
        run: |
          python scraper/capturar_radar_smn.py

      - name: Subir diagnostico SINARAME
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinarame-debug
          path: |
            data/radar/sinarame.html
            data/radar/sinarame_debug.txt
          if-no-files-found: warn

      - name: Mostrar archivos generados
        if: always()
        run: |
          echo "======================================"
          echo "ARCHIVOS GENERADOS"
          echo "======================================"
          find data/radar -maxdepth 2 -type f -print 2>/dev/null || true
