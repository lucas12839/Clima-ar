name: Probar Radar SMN

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  descargar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Recuperar máscara estática
        id: mascara
        uses: actions/cache@v4
        with:
          path: |
            data/radar/mascara_ecos_estaticos.png
            data/radar/mascara_ecos_estaticos.json
            data/radar/mascara_ecos_estaticos_confianza.png
          key: climaar-rma10-mascara-estatica-v2

      - name: Preparar directorios
        run: |
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar/historico
          mkdir -p .climaar

      - name: Recuperar historial de radar del último artefacto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=radar-rma10&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id')

          if [ "$ARTIFACT_ID" != "null" ] && [ -n "$ARTIFACT_ID" ]; then
            echo "Recuperando artefacto anterior: $ARTIFACT_ID"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > /tmp/radar_anterior.zip

            mkdir -p /tmp/radar_anterior
            unzip -q /tmp/radar_anterior.zip -d /tmp/radar_anterior

            find /tmp/radar_anterior -type f \
              -path "*/historico/*.png" \
              -exec cp -n {} data/radar/historico/ \; || true
          else
            echo "No hay artefacto anterior disponible."
          fi

          echo "Frames históricos disponibles:"
          find data/radar/historico -type f -name '*.png' | wc -l

      - name: Recuperar estado persistente
        run: |
          if [ -f .climaar/estado_rma10.json ]; then
            cp .climaar/estado_rma10.json \
              data/radar/seguimiento/estado.json
            echo "Estado anterior recuperado."
          else
            echo "No existe estado anterior. Se creará primer frame."
          fi

      - name: Descargar radar RMA10
        env:
          CLIMAAR_CAPTURE_MODE: ${{ steps.mascara.outputs.cache-hit == 'true' && 'rapido' || 'inicial' }}
        run: |
          python scraper/capturar_radar_smn.py

      - name: Aprender ecos estáticos
        if: steps.mascara.outputs.cache-hit != 'true'
        run: |
          python scripts/generar_mascara_estatica.py

      - name: Procesar radar
        run: |
          python procesador_radar.py

      - name: Seguimiento temporal
        run: |
          python seguimiento_temporal.py

      - name: Predicción de evolución
        run: |
          python prediccion_evolucion.py

      - name: Guardar estado persistente
        if: success()
        run: |
          if [ -f data/radar/seguimiento/estado.json ]; then
            cp data/radar/seguimiento/estado.json \
              .climaar/estado_rma10.json
          else
            echo "ERROR: no se generó estado.json"
            exit 1
          fi

      - name: Persistir estado y máscara
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .climaar/estado_rma10.json
          git add -f data/radar/mascara_ecos_estaticos.png
          git add -f data/radar/mascara_ecos_estaticos.json
          git add -f data/radar/mascara_ecos_estaticos_confianza.png

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualizar estado y aprendizaje estatico RMA10"
            git push
          fi

      - name: Mostrar resultado
        if: always()
        run: |
          echo "===== SEGUIMIENTO ====="
          if [ -f data/radar/seguimiento/seguimiento_temporal.json ]; then
            cat data/radar/seguimiento/seguimiento_temporal.json
          fi

          echo ""
          echo "===== PREDICCION ====="
          if [ -f data/radar/seguimiento/prediccion_evolucion.json ]; then
            python - <<'PY'
          import json
          p = "data/radar/seguimiento/prediccion_evolucion.json"
          d = json.load(open(p, encoding="utf-8"))
          print(json.dumps(d.get("resumen", {}), ensure_ascii=False, indent=2))
          PY
          fi

      - name: Subir radar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/actual.png
            data/radar/historico/
            data/radar/mascara_ecos_estaticos.png
            data/radar/mascara_ecos_estaticos.json
            data/radar/mascara_ecos_estaticos_confianza.png
            data/radar/resultado_procesamiento.json
            data/radar/seguimiento/
            data/radar/radar_timestamp.txt
          if-no-files-found: warn

      - name: Mostrar archivos generados
        if: always()
        run: |
          find data/radar -type f -print 2>/dev/null || true
