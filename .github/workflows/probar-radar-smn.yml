name: Probar Radar SMN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DIRECTORIOS
      # ============================================================

      - name: Preparar directorios
        run: |
          mkdir -p data/radar
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar/mascaras

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            numpy \
            scipy \
            opencv-python-headless \
            Pillow \
            pandas \
            joblib \
            scikit-learn \
            playwright

          playwright install --with-deps chromium

      # ============================================================
      # CAPTURA RMA10
      # ============================================================

      - name: Capturar radar RMA10
        id: captura
        run: |
          python scraper/capturar_radar_smn.py

      # ============================================================
      # GENERAR MÁSCARA ESTÁTICA
      #
      # IMPORTANTE:
      # Se utiliza el historial completo.
      # No se limita a 60 minutos.
      # ============================================================

      - name: Generar máscara de ecos estáticos
        if: steps.captura.outcome == 'success'
        run: |
          python scripts/generar_mascara_estatica.py

      # ============================================================
      # PROCESAR RADAR
      # ============================================================

      - name: Procesar radar
        if: steps.captura.outcome == 'success'
        run: |
          python scripts/procesador_radar.py

      # ============================================================
      # VERIFICAR CONTINUIDAD
      # ============================================================

      - name: Verificar continuidad
        id: continuidad
        if: steps.captura.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          estado_path = Path(
              "data/radar/seguimiento/estado.json"
          )

          radar_ts_path = Path(
              "data/radar/radar_timestamp.txt"
          )

          output_path = os.environ["GITHUB_OUTPUT"]

          def parse_ts(value):
              if not value:
                  return None

              value = str(value).strip()

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              dt = datetime.fromisoformat(value)

              if dt.tzinfo is None:
                  dt = dt.replace(
                      tzinfo=timezone.utc
                  )

              return dt.astimezone(
                  timezone.utc
              )

          estado_ts = None
          radar_ts = None

          # --------------------------------------------------------
          # ESTADO PERSISTENTE
          # --------------------------------------------------------

          if estado_path.exists():
              try:
                  estado = json.loads(
                      estado_path.read_text(
                          encoding="utf-8"
                      )
                  )

                  estado_ts = parse_ts(
                      estado.get(
                          "ultimo_radar_timestamp"
                      )
                  )

              except Exception as exc:
                  print(
                      "ADVERTENCIA: no se pudo leer "
                      f"estado.json: {exc}"
                  )

          # --------------------------------------------------------
          # TIMESTAMP DEL RADAR
          # --------------------------------------------------------

          if radar_ts_path.exists():
              try:
                  radar_ts = parse_ts(
                      radar_ts_path.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception as exc:
                  print(
                      "ERROR: no se pudo leer "
                      f"radar_timestamp.txt: {exc}"
                  )

          print(
              f"Estado: {estado_ts}"
          )

          print(
              f"Radar:  {radar_ts}"
          )

          # --------------------------------------------------------
          # SIN TIMESTAMP
          # --------------------------------------------------------

          if radar_ts is None:

              print(
                  "ERROR: no existe timestamp válido "
                  "del radar."
              )

              Path(
                  "data/radar/continuidad.txt"
              ).write_text(
                  "accepted=false\n",
                  encoding="utf-8"
              )

              with open(
                  output_path,
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "accepted=false\n"
                  )

              raise SystemExit(0)

          # --------------------------------------------------------
          # SIN ESTADO PREVIO
          # --------------------------------------------------------

          if estado_ts is None:

              print(
                  "No existe estado persistente previo."
              )

              print(
                  "El radar se acepta como nuevo inicio."
              )

              Path(
                  "data/radar/continuidad.txt"
              ).write_text(
                  "accepted=true\n",
                  encoding="utf-8"
              )

              with open(
                  output_path,
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "accepted=true\n"
                  )

              raise SystemExit(0)

          # --------------------------------------------------------
          # INTERVALO
          # --------------------------------------------------------

          intervalo_min = (
              radar_ts - estado_ts
          ).total_seconds() / 60.0

          print(
              f"Intervalo: {intervalo_min:.1f} min"
          )

          # --------------------------------------------------------
          # RADAR ANTERIOR AL ESTADO
          # --------------------------------------------------------

          if intervalo_min < 0:

              print(
                  "RADAR DESCARTADO"
              )

              print(
                  "El timestamp del radar es anterior "
                  "al estado persistente."
              )

              Path(
                  "data/radar/FRAME_DESCARTADO.txt"
              ).write_text(
                  (
                      "Radar descartado por timestamp "
                      "anterior al estado persistente.\n"
                      f"Estado: {estado_ts.isoformat()}\n"
                      f"Radar: {radar_ts.isoformat()}\n"
                      f"Intervalo: {intervalo_min:.1f} min\n"
                  ),
                  encoding="utf-8"
              )

              Path(
                  "data/radar/continuidad.txt"
              ).write_text(
                  "accepted=false\n",
                  encoding="utf-8"
              )

              with open(
                  output_path,
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "accepted=false\n"
                  )

          else:

              print(
                  "RADAR ACEPTADO"
              )

              Path(
                  "data/radar/continuidad.txt"
              ).write_text(
                  "accepted=true\n",
                  encoding="utf-8"
              )

              with open(
                  output_path,
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "accepted=true\n"
                  )
          PY

      # ============================================================
      # PREPARAR HISTORIAL CONTINUO PARA TRACKING
      #
      # La máscara estática ya utilizó todo el historial.
      #
      # Para tracking:
      # - se excluyen frames futuros
      # - máximo 6 frames
      # - máximo 60 minutos entre frames
      # - se corta ante un salto >60 minutos
      #
      # Después se restaura todo el historial.
      # ============================================================

      - name: Preparar historial continuo para tracking
        id: preparar_tracking
        if: steps.continuidad.outputs.accepted == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          HIST = Path(
              "data/radar/historico"
          )

          BACKUP = Path(
              "data/radar/historico_tracking_backup"
          )

          BACKUP.mkdir(
              parents=True,
              exist_ok=True
          )

          timestamp_file = Path(
              "data/radar/radar_timestamp.txt"
          )

          if not timestamp_file.exists():
              raise SystemExit(
                  "No existe data/radar/radar_timestamp.txt"
              )

          raw = timestamp_file.read_text(
              encoding="utf-8"
          ).strip()

          if raw.endswith("Z"):
              raw = raw[:-1] + "+00:00"

          radar_ts = datetime.fromisoformat(
              raw
          )

          if radar_ts.tzinfo is None:
              radar_ts = radar_ts.replace(
                  tzinfo=timezone.utc
              )

          radar_ts = radar_ts.astimezone(
              timezone.utc
          )

          # --------------------------------------------------------
          # LEER FRAMES
          # --------------------------------------------------------

          frames = []

          for path in HIST.glob("*.png"):

              try:
                  stamp = datetime.strptime(
                      path.stem,
                      "%Y%m%d_%H%M%S"
                  ).replace(
                      tzinfo=timezone.utc
                  )

              except ValueError:
                  continue

              frames.append(
                  (stamp, path)
              )

          frames.sort(
              key=lambda item: item[0]
          )

          # --------------------------------------------------------
          # EXCLUIR FRAMES FUTUROS
          # --------------------------------------------------------

          validos = [
              item
              for item in frames
              if item[0] <= radar_ts
          ]

          if not validos:

              print(
                  "No hay frames históricos "
                  "válidos para tracking."
              )

              raise SystemExit(0)

          # --------------------------------------------------------
          # RECORRER HACIA ATRÁS
          # --------------------------------------------------------

          validos.sort(
              key=lambda item: item[0],
              reverse=True
          )

          seleccionados = []

          anterior = radar_ts

          for stamp, path in validos:

              diferencia = (
                  anterior - stamp
              ).total_seconds() / 60.0

              if diferencia < 0:
                  continue

              # --------------------------------------------------
              # CORTE TEMPORAL
              # --------------------------------------------------

              if diferencia > 60.0:

                  print(
                      "CORTE DE CONTINUIDAD:"
                  )

                  print(
                      f"{diferencia:.1f} min entre "
                      f"{anterior.isoformat()} y "
                      f"{stamp.isoformat()}"
                  )

                  break

              seleccionados.append(
                  path
              )

              anterior = stamp

              if len(seleccionados) >= 6:
                  break

          seleccionados_set = {
              path.resolve()
              for path in seleccionados
          }

          print("")
          print(
              "RADAR ACTUAL:",
              radar_ts.isoformat()
          )

          print("")
          print(
              "FRAMES UTILIZADOS PARA TRACKING:"
          )

          for path in reversed(
              seleccionados
          ):
              print(
                  "  ",
                  path.name
              )

          print("")
          print(
              "Cantidad de frames continuos:",
              len(seleccionados)
          )

          # --------------------------------------------------------
          # APARTAR FRAMES NO CONTINUOS
          # --------------------------------------------------------

          for _, path in frames:

              if (
                  path.resolve()
                  not in seleccionados_set
              ):

                  destino = (
                      BACKUP / path.name
                  )

                  if destino.exists():
                      destino.unlink()

                  path.rename(
                      destino
                  )

          print("")
          print(
              "Historial preparado para tracking."
          )
          PY

      # ============================================================
      # SEGUIMIENTO TEMPORAL
      #
      # ESTE PASO ES EL QUE DEBE TERMINAR BIEN ANTES DE EJECUTAR ML.
      # ============================================================

      - name: Seguimiento temporal
        id: seguimiento
        if: steps.continuidad.outputs.accepted == 'true'
        run: |
          python seguimiento_temporal.py

      # ============================================================
      # RESTAURAR HISTORIAL COMPLETO
      #
      # Se ejecuta incluso si tracking falla.
      # ============================================================

      - name: Restaurar historial completo
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          HIST = Path(
              "data/radar/historico"
          )

          BACKUP = Path(
              "data/radar/historico_tracking_backup"
          )

          if not BACKUP.exists():

              print(
                  "No existe backup temporal."
              )

              raise SystemExit(0)

          for path in BACKUP.glob("*.png"):

              destino = (
                  HIST / path.name
              )

              if destino.exists():
                  destino.unlink()

              path.rename(
                  destino
              )

          print(
              "Historial completo restaurado."
          )

          try:
              BACKUP.rmdir()
          except OSError:
              pass
          PY

      # ============================================================
      # PREDICCIÓN ML
      #
      # SOLO SE EJECUTA SI:
      # 1. El radar fue aceptado.
      # 2. El tracking terminó correctamente.
      # ============================================================

      - name: Predicción ML RMA10
        if: >
          steps.continuidad.outputs.accepted == 'true' &&
          steps.seguimiento.outcome == 'success'
        run: |
          python scripts/prediccion_rma10_ml.py

      # ============================================================
      # PREDICCIÓN DE EVOLUCIÓN
      #
      # SOLO DESPUÉS DE TRACKING CORRECTO.
      # ============================================================

      - name: Predicción de evolución
        if: >
          steps.continuidad.outputs.accepted == 'true' &&
          steps.seguimiento.outcome == 'success'
        run: |
          if [ -f scripts/prediccion_evolucion.py ]; then
            python scripts/prediccion_evolucion.py
          else
            echo "prediccion_evolucion.py no encontrado."
            echo "Se continúa sin este paso."
          fi

      # ============================================================
      # GUARDAR RESULTADOS
      #
      # Solamente si la captura fue correcta.
      # ============================================================

      - name: Guardar resultados
        if: always() && steps.captura.outcome == 'success'
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/radar

          if git diff --cached --quiet; then

            echo "No hay cambios para guardar."

          else

            git commit \
              -m "Actualizar radar RMA10 y seguimiento"

            git push

          fi

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Subir resultados radar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/radar_timestamp.txt
            data/radar/resultado_procesamiento.json
            data/radar/continuidad.txt
            data/radar/FRAME_DESCARTADO.txt
            data/radar/seguimiento/
            data/radar/historico/
            data/radar/mascaras/
          if-no-files-found: warn
