name: Descargar Radar RMA10

on:
  workflow_dispatch:

jobs:
  descargar-radar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Descargar radar RMA10
        run: |
          python scraper/capturar_radar_smn.py

      - name: Procesar radar
        run: |
          python procesador/procesador_radar.py

      - name: Subir radar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/actual.png
            data/radar/historico/
          if-no-files-found: warn

      - name: Mostrar archivos generados
        if: always()
        run: |
          echo "======================================"
          echo "ARCHIVOS GENERADOS"
          echo "======================================"
          find data/radar -type f -print 2>/dev/null || true
