name: ClimaAR Radar RMA10

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: climaar-radar-rma10
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar \
            data/radar/historico \
            data/radar/seguimiento \
            logs

      - name: Ejecutar captura RMA10
        run: |
          set -euo pipefail

          if [ -f scripts/capturar_rma10.py ]; then
            python scripts/capturar_rma10.py
          elif [ -f scripts/descargar_rma10.py ]; then
            python scripts/descargar_rma10.py
          elif [ -f scripts/radar_collector.py ]; then
            python scripts/radar_collector.py
          else
            echo "ERROR: no se encontró el capturador RMA10."
            exit 1
          fi

      - name: Validar frame nuevo
        run: |
          set -euo pipefail

          if [ ! -s data/radar/actual.png ]; then
            echo "ERROR: no existe un frame RMA10 válido."
            exit 1
          fi

          if [ ! -s data/radar/radar_timestamp.txt ]; then
            echo "ERROR: falta radar_timestamp.txt."
            exit 1
          fi

          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          timestamp = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          if timestamp.endswith("Z"):
              timestamp = timestamp[:-1] + "+00:00"

          try:
              dt = datetime.fromisoformat(timestamp)
          except ValueError as exc:
              raise SystemExit(
                  f"ERROR: timestamp inválido: {timestamp!r}"
              ) from exc

          if dt.tzinfo is None:
              raise SystemExit(
                  "ERROR: timestamp sin zona horaria."
              )

          dt = dt.astimezone(timezone.utc)

          ahora = datetime.now(timezone.utc)

          edad = (
              ahora - dt
          ).total_seconds()

          print(
              "Timestamp radar:",
              dt.isoformat()
          )

          print(
              "Edad del frame:",
              round(edad),
              "segundos"
          )

          if edad < 0:
              raise SystemExit(
                  "ERROR: timestamp futuro."
              )

          if edad > 1800:
              raise SystemExit(
                  "ERROR: frame RMA10 demasiado antiguo."
              )

          print("Frame temporalmente válido.")
          PY

      - name: Procesar radar
        run: |
          set -euo pipefail

          if [ -f scripts/procesar_radar.py ]; then
            python scripts/procesar_radar.py
          elif [ -f scripts/procesamiento_radar.py ]; then
            python scripts/procesamiento_radar.py
          else
            echo "ERROR: no se encontró el procesador RMA10."
            exit 1
          fi

      - name: Ejecutar seguimiento temporal
        run: |
          set -euo pipefail

          if [ -f scripts/seguimiento_temporal.py ]; then
            python scripts/seguimiento_temporal.py
          elif [ -f scripts/tracking_temporal.py ]; then
            python scripts/tracking_temporal.py
          else
            echo "ERROR: no se encontró el seguimiento temporal."
            exit 1
          fi

      - name: Validar cadena Radar → Tracking
        run: |
          set -euo pipefail

          test -s data/radar/resultado_procesamiento.json
          test -s data/radar/seguimiento/estado.json
          test -s data/radar/seguimiento/seguimiento_temporal.json

          python - <<'PY'
          import json
          from pathlib import Path

          archivos = [
              Path("data/radar/resultado_procesamiento.json"),
              Path("data/radar/seguimiento/estado.json"),
              Path("data/radar/seguimiento/seguimiento_temporal.json"),
          ]

          for path in archivos:
              try:
                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: JSON inválido: {path}: {exc}"
                  ) from exc

              if not isinstance(data, dict):
                  raise SystemExit(
                      f"ERROR: estructura inválida: {path}"
                  )

              print(f"OK: {path}")

          print(
              "Cadena Radar → Tracking validada."
          )
          PY

      - name: Validar integridad ClimaAR
        run: |
          set -euo pipefail

          test -f scripts/validar_integridad_climaar.py

          python scripts/validar_integridad_climaar.py

      - name: Preparar artefacto Radar RMA10
        run: |
          set -euo pipefail

          rm -rf /tmp/radar-rma10

          mkdir -p /tmp/radar-rma10/data/radar

          cp -a \
            data/radar/. \
            /tmp/radar-rma10/data/radar/

      - name: Publicar artefacto Radar RMA10
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: /tmp/radar-rma10
          retention-days: 7

      - name: Persistir resultados
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/radar

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: actualizar Radar RMA10"

          for intento in 1 2 3; do
            echo "Intento de sincronización: $intento"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true

              if [ "$intento" -eq 3 ]; then
                echo "ERROR: rebase falló."
                exit 1
              fi

              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push exitoso."
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              echo "ERROR: no se pudo publicar Radar RMA10."
              exit 1
            fi

            sleep 2
          done
