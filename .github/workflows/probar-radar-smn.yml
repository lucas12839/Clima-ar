name: ClimaAR Radar RMA10

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: climaar-radar-rma10
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: |
          set -euo pipefail

          python -m playwright install --with-deps chromium

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar \
            data/radar/historico \
            data/radar/seguimiento \
            logs

      - name: Verificar componentes reales
        run: |
          set -euo pipefail

          test -f scraper/capturar_radar_smn.py
          test -f scripts/procesador_radar.py
          test -f seguimiento_temporal.py

          echo "OK - capturador"
          echo "OK - procesador"
          echo "OK - seguimiento temporal"

      - name: Ejecutar captura RMA10
        run: |
          set -euo pipefail

          python scraper/capturar_radar_smn.py

      - name: Validar frame RMA10
        run: |
          set -euo pipefail

          test -s data/radar/actual.png
          test -s data/radar/radar_timestamp.txt

          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image

          image_path = Path(
              "data/radar/actual.png"
          )

          timestamp_path = Path(
              "data/radar/radar_timestamp.txt"
          )

          # --------------------------------------------------
          # Validar imagen
          # --------------------------------------------------

          try:
              with Image.open(image_path) as image:
                  image.verify()
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: PNG RMA10 inválido: {exc}"
              ) from exc

          # --------------------------------------------------
          # Validar timestamp
          # --------------------------------------------------

          raw = timestamp_path.read_text(
              encoding="utf-8"
          ).strip()

          if not raw:
              raise SystemExit(
                  "ERROR: radar_timestamp.txt está vacío."
              )

          texto = raw

          if texto.endswith("Z"):
              texto = texto[:-1] + "+00:00"

          try:
              dt = datetime.fromisoformat(texto)
          except ValueError as exc:
              raise SystemExit(
                  f"ERROR: timestamp RMA10 inválido: {raw!r}"
              ) from exc

          if dt.tzinfo is None:
              raise SystemExit(
                  "ERROR: timestamp RMA10 sin zona horaria."
              )

          dt = dt.astimezone(timezone.utc)

          ahora = datetime.now(timezone.utc)

          edad = (
              ahora - dt
          ).total_seconds()

          print(
              "Timestamp RMA10:",
              dt.isoformat()
          )

          print(
              "Edad del frame:",
              round(edad),
              "segundos"
          )

          if edad < -120:
              raise SystemExit(
                  "ERROR: timestamp RMA10 está "
                  "más de 2 minutos en el futuro."
              )

          if edad > 2700:
              raise SystemExit(
                  "ERROR: frame RMA10 demasiado antiguo."
              )

          print(
              "Frame RMA10 válido."
          )
          PY

      - name: Procesar radar
        run: |
          set -euo pipefail

          python scripts/procesador_radar.py

      - name: Validar resultado del procesamiento
        run: |
          set -euo pipefail

          test -s data/radar/resultado_procesamiento.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/radar/resultado_procesamiento.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: resultado_procesamiento.json "
                  "no contiene un objeto JSON."
              )

          required = (
              "nucleos",
              "nucleos_dinamicos",
              "nucleos_estaticos",
              "clasificacion_severidad",
          )

          for key in required:
              if key not in data:
                  raise SystemExit(
                      f"ERROR: falta campo {key!r} "
                      "en resultado_procesamiento.json."
                  )

          if not isinstance(
              data["nucleos"],
              list
          ):
              raise SystemExit(
                  "ERROR: resultado.nucleos no es una lista."
              )

          if not isinstance(
              data["nucleos_dinamicos"],
              int
          ):
              raise SystemExit(
                  "ERROR: nucleos_dinamicos no es entero."
              )

          if not isinstance(
              data["nucleos_estaticos"],
              list
          ):
              raise SystemExit(
                  "ERROR: nucleos_estaticos no es una lista."
              )

          # Los ecos estáticos pueden existir internamente,
          # pero no deben formar parte de los núcleos operativos.
          for nucleo in data["nucleos"]:
              if not isinstance(nucleo, dict):
                  raise SystemExit(
                      "ERROR: existe un núcleo operativo inválido."
                  )

              if str(
                  nucleo.get("estado", "")
              ).upper() == "ECO_ESTATICO":
                  raise SystemExit(
                      "ERROR: un ECO_ESTATICO "
                      "entró en resultado.nucleos."
                  )

          if (
              data["nucleos_dinamicos"]
              != len(data["nucleos"])
          ):
              raise SystemExit(
                  "ERROR: cantidad de núcleos dinámicos "
                  "no coincide con resultado.nucleos."
              )

          if data.get(
              "radar_intensidad_es_senal_no_severidad"
          ) is not True:
              raise SystemExit(
                  "ERROR: el procesador no declara "
                  "correctamente que radar ≠ severidad."
              )

          print(
              "Resultado de procesamiento válido."
          )

          print(
              "Núcleos operativos:",
              len(data["nucleos"])
          )

          print(
              "Núcleos estáticos:",
              len(data["nucleos_estaticos"])
          )

          print(
              "Estado radar:",
              data.get("estado_general")
          )

          print(
              "Severidad meteorológica:",
              data.get("clasificacion_severidad")
          )
          PY

      - name: Ejecutar seguimiento temporal
        run: |
          set -euo pipefail

          python seguimiento_temporal.py

      - name: Validar cadena Radar → Tracking
        run: |
          set -euo pipefail

          test -s data/radar/radar_timestamp.txt
          test -s data/radar/resultado_procesamiento.json
          test -s data/radar/seguimiento/estado.json
          test -s data/radar/seguimiento/seguimiento_temporal.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = Path("data/radar")

          radar_path = (
              BASE / "radar_timestamp.txt"
          )

          resultado_path = (
              BASE / "resultado_procesamiento.json"
          )

          estado_path = (
              BASE
              / "seguimiento"
              / "estado.json"
          )

          seguimiento_path = (
              BASE
              / "seguimiento"
              / "seguimiento_temporal.json"
          )

          # --------------------------------------------------
          # Timestamp radar
          # --------------------------------------------------

          radar_raw = radar_path.read_text(
              encoding="utf-8"
          ).strip()

          def parse_timestamp(value, name):
              if value is None:
                  raise SystemExit(
                      f"ERROR: falta timestamp en {name}."
                  )

              text = str(value).strip()

              if not text:
                  raise SystemExit(
                      f"ERROR: timestamp vacío en {name}."
                  )

              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              try:
                  dt = datetime.fromisoformat(text)
              except ValueError as exc:
                  raise SystemExit(
                      f"ERROR: timestamp inválido "
                      f"en {name}: {value!r}"
                  ) from exc

              if dt.tzinfo is None:
                  raise SystemExit(
                      f"ERROR: timestamp sin zona horaria "
                      f"en {name}."
                  )

              return dt.astimezone(
                  timezone.utc
              )

          radar_dt = parse_timestamp(
              radar_raw,
              "radar_timestamp.txt"
          )

          # --------------------------------------------------
          # JSON
          # --------------------------------------------------

          resultado = json.loads(
              resultado_path.read_text(
                  encoding="utf-8"
              )
          )

          estado = json.loads(
              estado_path.read_text(
                  encoding="utf-8"
              )
          )

          seguimiento = json.loads(
              seguimiento_path.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(
              resultado,
              dict
          ):
              raise SystemExit(
                  "ERROR: resultado_procesamiento.json inválido."
              )

          if not isinstance(
              estado,
              dict
          ):
              raise SystemExit(
                  "ERROR: estado.json inválido."
              )

          if not isinstance(
              seguimiento,
              dict
          ):
              raise SystemExit(
                  "ERROR: seguimiento_temporal.json inválido."
              )

          # --------------------------------------------------
          # Timestamp único
          #
          # resultado_procesamiento NO genera un timestamp
          # de frame propio. Su timestamp_procesamiento es
          # la hora de ejecución y NO se compara con el radar.
          #
          # Tracking sí conserva radar_timestamp.
          # --------------------------------------------------

          tracking_ts = parse_timestamp(
              seguimiento.get(
                  "radar_timestamp"
              ),
              "seguimiento_temporal.radar_timestamp"
          )

          estado_ts = parse_timestamp(
              estado.get(
                  "ultimo_radar_timestamp"
              ),
              "estado.ultimo_radar_timestamp"
          )

          if tracking_ts != radar_dt:

              raise SystemExit(
                  "ERROR: timestamp desincronizado "
                  "entre Radar y Tracking: "
                  f"radar={radar_dt.isoformat()} "
                  f"tracking={tracking_ts.isoformat()}"
              )

          if estado_ts != radar_dt:

              raise SystemExit(
                  "ERROR: timestamp desincronizado "
                  "entre Radar y estado de Tracking: "
                  f"radar={radar_dt.isoformat()} "
                  f"estado={estado_ts.isoformat()}"
              )

          # --------------------------------------------------
          # Coherencia de cantidad de núcleos
          # --------------------------------------------------

          nucleos_radar = resultado.get(
              "nucleos"
          )

          nucleos_tracking = seguimiento.get(
              "nucleos"
          )

          if not isinstance(
              nucleos_radar,
              list
          ):
              raise SystemExit(
                  "ERROR: resultado.nucleos inválido."
              )

          if not isinstance(
              nucleos_tracking,
              list
          ):
              raise SystemExit(
                  "ERROR: tracking.nucleos inválido."
              )

          cantidad_radar = len(
              nucleos_radar
          )

          cantidad_tracking = len(
              nucleos_tracking
          )

          if cantidad_radar != cantidad_tracking:

              raise SystemExit(
                  "ERROR: cantidad de núcleos "
                  "Radar != Tracking: "
                  f"{cantidad_radar} != "
                  f"{cantidad_tracking}"
              )

          # --------------------------------------------------
          # Principal
          # --------------------------------------------------

          principal = seguimiento.get(
              "track_principal_candidato_id"
          )

          if principal is None:

              raise SystemExit(
                  "ERROR: Tracking no definió "
                  "track_principal_candidato_id."
              )

          def same_id(a, b):
              return str(a) == str(b)

          principal_nucleo = None

          for nucleo in nucleos_tracking:

              if not isinstance(
                  nucleo,
                  dict
              ):
                  continue

              if same_id(
                  nucleo.get("track_id"),
                  principal
              ):
                  principal_nucleo = nucleo
                  break

          if principal_nucleo is None:

              raise SystemExit(
                  "ERROR: el principal "
                  f"{principal!r} no existe "
                  "en tracking.nucleos."
              )

          # --------------------------------------------------
          # Estado persistente
          # --------------------------------------------------

          tracks = estado.get(
              "tracks",
              []
          )

          if not isinstance(
              tracks,
              list
          ):
              raise SystemExit(
                  "ERROR: estado.tracks no es una lista."
              )

          principal_track = None

          for track in tracks:

              if not isinstance(
                  track,
                  dict
              ):
                  continue

              if same_id(
                  track.get("track_id"),
                  principal
              ):
                  principal_track = track
                  break

          if principal_track is None:

              raise SystemExit(
                  "ERROR: principal "
                  f"{principal!r} no existe "
                  "en estado.tracks."
              )

          if principal_track.get(
              "activo"
          ) is not True:

              raise SystemExit(
                  "ERROR: principal "
                  f"{principal!r} no está activo."
              )

          if principal_track.get(
              "presente_en_ultimo_frame"
          ) is not True:

              raise SystemExit(
                  "ERROR: principal "
                  f"{principal!r} no está presente "
                  "en el último frame."
              )

          # --------------------------------------------------
          # Validar que los ecos estáticos no llegaron
          # al tracking.
          # --------------------------------------------------

          for nucleo in nucleos_tracking:

              if not isinstance(
                  nucleo,
                  dict
              ):
                  raise SystemExit(
                      "ERROR: núcleo inválido "
                      "en tracking."
                  )

              if str(
                  nucleo.get("estado", "")
              ).upper() == "ECO_ESTATICO":

                  raise SystemExit(
                      "ERROR: ECO_ESTATICO "
                      "llegó al tracking."
                  )

          # --------------------------------------------------
          # Resultado
          # --------------------------------------------------

          print(
              "======================================"
          )

          print(
              "CADENA RADAR → TRACKING: OK"
          )

          print(
              "======================================"
          )

          print(
              "Frame UTC:",
              radar_dt.isoformat()
          )

          print(
              "Núcleos Radar:",
              cantidad_radar
          )

          print(
              "Núcleos Tracking:",
              cantidad_tracking
          )

          print(
              "Track principal:",
              principal
          )

          print(
              "Principal activo: OK"
          )

          print(
              "Principal presente: OK"
          )

          print(
              "Ecos estáticos excluidos: OK"
          )
          PY

      - name: Preparar artefacto Radar RMA10
        run: |
          set -euo pipefail

          rm -rf /tmp/radar-rma10

          mkdir -p \
            /tmp/radar-rma10/data/radar

          cp -a \
            data/radar/. \
            /tmp/radar-rma10/data/radar/

      - name: Publicar artefacto Radar RMA10
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: /tmp/radar-rma10
          retention-days: 7

      - name: Persistir resultados
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/radar

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: actualizar Radar RMA10"

          for intento in 1 2 3; do

            echo \
              "Intento de sincronización: $intento"

            git fetch origin main

            if ! git rebase origin/main; then

              git rebase --abort 2>/dev/null || true

              if [ "$intento" -eq 3 ]; then
                echo "ERROR: rebase falló."
                exit 1
              fi

              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push exitoso."
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              echo \
                "ERROR: no se pudo publicar Radar RMA10."
              exit 1
            fi

            sleep 2

          done
