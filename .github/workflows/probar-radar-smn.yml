name: ClimaAR Radar RMA10

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: climaar-radar-rma10
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar \
            data/radar/historico \
            data/radar/seguimiento \
            logs

      - name: Verificar componentes reales del repositorio
        run: |
          set -euo pipefail

          test -f scraper/capturar_radar_smn.py
          test -f scripts/procesador_radar.py
          test -f seguimiento_temporal.py
          test -f scripts/validar_integridad_climaar.py

          echo "Capturador: scraper/capturar_radar_smn.py"
          echo "Procesador: scripts/procesador_radar.py"
          echo "Tracking: seguimiento_temporal.py"

      - name: Ejecutar captura RMA10
        run: |
          set -euo pipefail

          python scraper/capturar_radar_smn.py

      - name: Validar frame RMA10
        run: |
          set -euo pipefail

          test -s data/radar/actual.png
          test -s data/radar/radar_timestamp.txt

          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image

          image_path = Path("data/radar/actual.png")
          timestamp_path = Path("data/radar/radar_timestamp.txt")

          try:
              with Image.open(image_path) as image:
                  image.verify()
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: PNG RMA10 inválido: {exc}"
              ) from exc

          timestamp = timestamp_path.read_text(
              encoding="utf-8"
          ).strip()

          if timestamp.endswith("Z"):
              timestamp = timestamp[:-1] + "+00:00"

          try:
              dt = datetime.fromisoformat(timestamp)
          except ValueError as exc:
              raise SystemExit(
                  f"ERROR: timestamp inválido: {timestamp!r}"
              ) from exc

          if dt.tzinfo is None:
              raise SystemExit(
                  "ERROR: timestamp sin zona horaria."
              )

          dt = dt.astimezone(timezone.utc)

          ahora = datetime.now(timezone.utc)

          edad = (
              ahora - dt
          ).total_seconds()

          print(
              "Timestamp radar UTC:",
              dt.isoformat()
          )

          print(
              "Edad del frame:",
              round(edad),
              "segundos"
          )

          if edad < -120:
              raise SystemExit(
                  "ERROR: timestamp futuro fuera de tolerancia."
              )

          if edad > 2700:
              raise SystemExit(
                  "ERROR: frame RMA10 demasiado antiguo."
              )

          print(
              "Frame RMA10 válido."
          )
          PY

      - name: Procesar radar
        run: |
          set -euo pipefail

          python scripts/procesador_radar.py

      - name: Validar resultado del procesamiento
        run: |
          set -euo pipefail

          test -s data/radar/resultado_procesamiento.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/radar/resultado_procesamiento.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: resultado_procesamiento.json "
                  "no es un objeto JSON."
              )

          print(
              "Resultado de procesamiento válido."
          )

          print(
              "Timestamp:",
              data.get("radar_timestamp")
          )

          print(
              "Núcleos:",
              data.get("nucleos_actuales")
          )
          PY

      - name: Ejecutar seguimiento temporal
        run: |
          set -euo pipefail

          python seguimiento_temporal.py

      - name: Validar cadena Radar → Tracking
        run: |
          set -euo pipefail

          test -s data/radar/resultado_procesamiento.json
          test -s data/radar/seguimiento/estado.json
          test -s data/radar/seguimiento/seguimiento_temporal.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          radar_path = Path(
              "data/radar/radar_timestamp.txt"
          )

          resultado_path = Path(
              "data/radar/resultado_procesamiento.json"
          )

          estado_path = Path(
              "data/radar/seguimiento/estado.json"
          )

          seguimiento_path = Path(
              "data/radar/seguimiento/seguimiento_temporal.json"
          )

          radar_ts = radar_path.read_text(
              encoding="utf-8"
          ).strip()

          def parse(value):
              if not value:
                  return None

              texto = str(value)

              if texto.endswith("Z"):
                  texto = texto[:-1] + "+00:00"

              dt = datetime.fromisoformat(
                  texto
              )

              if dt.tzinfo is None:
                  dt = dt.replace(
                      tzinfo=timezone.utc
                  )

              return dt.astimezone(
                  timezone.utc
              )

          radar_dt = parse(
              radar_ts
          )

          resultado = json.loads(
              resultado_path.read_text(
                  encoding="utf-8"
              )
          )

          estado = json.loads(
              estado_path.read_text(
                  encoding="utf-8"
              )
          )

          seguimiento = json.loads(
              seguimiento_path.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(
              resultado,
              dict
          ):
              raise SystemExit(
                  "ERROR: resultado_procesamiento.json inválido."
              )

          if not isinstance(
              estado,
              dict
          ):
              raise SystemExit(
                  "ERROR: seguimiento/estado.json inválido."
              )

          if not isinstance(
              seguimiento,
              dict
          ):
              raise SystemExit(
                  "ERROR: seguimiento_temporal.json inválido."
              )

          timestamps = {
              "radar": radar_dt,
              "resultado": parse(
                  resultado.get(
                      "radar_timestamp"
                  )
                  or
                  resultado.get(
                      "timestamp"
                  )
              ),
              "estado": parse(
                  estado.get(
                      "ultimo_radar_timestamp"
                  )
              ),
              "seguimiento": parse(
                  seguimiento.get(
                      "radar_timestamp"
                  )
              ),
          }

          for nombre, valor in timestamps.items():

              if valor is None:
                  raise SystemExit(
                      f"ERROR: falta timestamp en {nombre}."
                  )

          base = timestamps["radar"]

          for nombre, valor in timestamps.items():

              diferencia = abs(
                  (
                      valor - base
                  ).total_seconds()
              )

              if diferencia > 1:

                  raise SystemExit(
                      "ERROR: timestamp "
                      f"desincronizado: "
                      f"radar={base.isoformat()} "
                      f"{nombre}={valor.isoformat()}"
                  )

          principal = seguimiento.get(
              "track_principal_candidato_id"
          )

          tracks_activos = estado.get(
              "tracks_activos",
              []
          )

          if (
              principal is not None
              and
              principal not in tracks_activos
          ):
              raise SystemExit(
                  "ERROR: el track principal "
                  "candidato no pertenece a "
                  "los tracks activos."
              )

          print(
              "Timestamp único validado:",
              base.isoformat()
          )

          print(
              "Track principal candidato:",
              principal
          )

          print(
              "Tracks activos:",
              tracks_activos
          )

          print(
              "Cadena Radar → Tracking validada."
          )
          PY

      - name: Validar integridad ClimaAR
        run: |
          set -euo pipefail

          python scripts/validar_integridad_climaar.py

      - name: Preparar artefacto Radar RMA10
        run: |
          set -euo pipefail

          rm -rf /tmp/radar-rma10

          mkdir -p \
            /tmp/radar-rma10/data/radar

          cp -a \
            data/radar/. \
            /tmp/radar-rma10/data/radar/

      - name: Publicar artefacto Radar RMA10
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: /tmp/radar-rma10
          retention-days: 7

      - name: Persistir resultados
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/radar

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: actualizar Radar RMA10"

          for intento in 1 2 3; do

            echo \
              "Intento de sincronización: $intento"

            git fetch origin main

            if ! git rebase origin/main; then

              git rebase --abort 2>/dev/null || true

              if [ "$intento" -eq 3 ]; then
                echo "ERROR: rebase falló."
                exit 1
              fi

              sleep 2
              continue
            fi

            if git push origin HEAD:main; then

              echo "Push exitoso."
              exit 0

            fi

            if [ "$intento" -eq 3 ]; then

              echo \
                "ERROR: no se pudo publicar Radar RMA10."

              exit 1

            fi

            sleep 2

          done
