name: Probar Radar SMN

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar directorios
        run: |
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/radar
          mkdir -p .climaar
          echo "Directorio preparado."

      - name: Recuperar histórico desde artefactos anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Buscando artefactos radar-rma10 anteriores..."

          mkdir -p /tmp/radar_artifacts

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            > /tmp/artifacts.json

          IDS=$(jq -r '
            .artifacts[]
            | select(.name == "radar-rma10")
            | select(.expired == false)
            | .id
          ' /tmp/artifacts.json | head -20)

          COUNT=0

          for ID in $IDS; do
            COUNT=$((COUNT + 1))
            echo "Descargando artefacto $COUNT: $ID"

            if gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" \
              > "/tmp/radar_artifacts/${ID}.zip"; then

              mkdir -p "/tmp/radar_artifacts/${ID}"

              unzip -oq "/tmp/radar_artifacts/${ID}.zip" \
                -d "/tmp/radar_artifacts/${ID}" || true

              find "/tmp/radar_artifacts/${ID}" \
                -type f \
                -name "*.png" \
                -path "*/historico/*" \
                -exec cp -n {} data/radar/historico/ \; || true
            fi
          done

          TOTAL=$(find data/radar/historico \
            -maxdepth 1 \
            -type f \
            -name "*.png" | wc -l)

          echo "Artefactos revisados: $COUNT"
          echo "Frames históricos recuperados: $TOTAL"

          if [ "$TOTAL" -gt 0 ]; then
            echo "Últimos frames:"
            find data/radar/historico \
              -maxdepth 1 \
              -type f \
              -name "*.png" \
              -printf "%f\n" | sort | tail -10
          fi

      - name: Restaurar estado persistente
        run: |
          if [ -f ".climaar/estado_rma10.json" ]; then
            cp ".climaar/estado_rma10.json" \
               "data/radar/seguimiento/estado.json"
            echo "Estado persistente restaurado."
          else
            echo "No existe estado persistente previo."
          fi

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy opencv-python-headless Pillow pandas joblib scikit-learn fastapi "uvicorn[standard]" playwright
          playwright install --with-deps chromium

      - name: Capturar radar RMA10
        run: |
          python scraper/capturar_radar_smn.py

      - name: Aprender ecos estáticos
        run: |
          python scripts/generar_mascara_estatica.py

      - name: Procesar radar
        run: |
          python scripts/procesador_radar.py

      - name: Seguimiento temporal
        run: |
          python seguimiento_temporal.py

      - name: Predicción de evolución
        run: |
          python prediccion_evolucion.py

      - name: Guardar estado persistente
        run: |
          if [ -f "data/radar/seguimiento/estado.json" ]; then
            cp "data/radar/seguimiento/estado.json" \
               ".climaar/estado_rma10.json"
            echo "Estado persistente actualizado."
          else
            echo "ERROR: no se generó estado.json"
            exit 1
          fi

      - name: Mostrar resultado
        run: |
          echo "===== TIMESTAMP RADAR ====="
          cat data/radar/radar_timestamp.txt 2>/dev/null || true

          echo "===== HISTÓRICO ====="
          find data/radar/historico \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            -printf "%f\n" | sort | tail -15

          echo "===== ESTADO ====="
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/radar/seguimiento/estado.json")

          if p.exists():
              d = json.loads(p.read_text())

              print("schema_version:", d.get("schema_version"))
              print("tracks:", len(d.get("tracks", [])))
              print("tracks_activos:", len(d.get("tracks_activos", [])))
              print("ultimo_radar_timestamp:", d.get("ultimo_radar_timestamp"))
          else:
              print("estado.json no encontrado")
          PY

          echo "===== PREDICCIÓN ====="

          if [ -f "data/radar/seguimiento/prediccion_evolucion.json" ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/radar/seguimiento/prediccion_evolucion.json")
          d = json.loads(p.read_text())

          print("schema_version:", d.get("schema_version"))
          print("timestamp_radar:", d.get("timestamp_radar"))
          print("timestamp_generacion:", d.get("timestamp_generacion"))

          resumen = d.get("resumen", {})

          print("núcleos evaluados:", resumen.get("nucleos_evaluados"))
          print("pronósticos generados:", resumen.get("pronosticos_generados"))
          print("predicciones validadas:", resumen.get("predicciones_validadas"))
          print("predicciones pendientes:", resumen.get("predicciones_pendientes"))
          print("estimaciones de huecos:", resumen.get("huecos_estimados"))

          print("horizontes disponibles:")

          pronosticos = d.get("pronosticos", {})

          if isinstance(pronosticos, dict):
              for horizonte, cantidad in pronosticos.items():
                  print(f"  {horizonte}: {cantidad}")

          print("================================")
          PY
          else
            echo "ERROR: no existe prediccion_evolucion.json"
            exit 1
          fi

      - name: Persistir estado y máscara
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .climaar/estado_rma10.json
          git add -f data/radar/mascara_ecos_estaticos.png
          git add -f data/radar/mascara_ecos_estaticos_confianza.png
          git add -f data/radar/mascara_ecos_estaticos.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualizar estado y mascara RMA10"
            git push
          fi

      - name: Subir radar
        uses: actions/upload-artifact@v4
        with:
          name: radar-rma10
          path: |
            data/radar/historico/
            data/radar/resultado_procesamiento.json
            data/radar/mascara_ecos_estaticos.png
            data/radar/mascara_ecos_estaticos_confianza.png
            data/radar/mascara_ecos_estaticos.json
            data/radar/seguimiento/
            data/radar/radar_timestamp.txt
          if-no-files-found: warn
          retention-days: 30
