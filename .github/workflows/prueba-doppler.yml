name: Prueba única - estaciones abiertas alrededor de Bahía
on:
  push:
    branches: [prueba-doppler]
permissions:
  contents: read
jobs:
  sondear:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - run: python herramientas/sondear_estaciones_nuevas.py
