name: ClimaAR Auto Radar

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: climaar-auto-radar
  cancel-in-progress: false

jobs:
  dispatch-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Lanzar captura RMA10
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          gh workflow run probar-radar-smn.yml --repo "$GH_REPO" --ref main
          echo "Captura RMA10 solicitada correctamente."
