name: ClimaAR Auto Radar

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: climaar-auto-radar
  cancel-in-progress: false

jobs:
  dispatch-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Lanzar captura RMA10
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e

          gh workflow run climaar-ciclo-radar.yml \
            --repo "$GH_REPO" \
            --ref main

          echo "Ciclo Radar solicitado (ignorado si ya hay uno activo)."
