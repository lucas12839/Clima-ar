name: ClimaAR Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: climaar-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Diagnosticar SINARAME vs ClimaAR
        id: diagnostico
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import re
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          SOURCE_URL = "https://radares.hidricosargentina.gob.ar/"

          GITHUB_TS_URL = (
              "https://raw.githubusercontent.com/"
              "lucas12839/Clima-ar/main/"
              "data/radar/radar_timestamp.txt"
          )

          def get(url, timeout=20):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "ClimaAR-Watchdog/3.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=timeout,
              ) as response:
                  return response.read()

          def parse_iso(value):
              if not value:
                  return None

              text = value.strip()

              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              dt = datetime.fromisoformat(text)

              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)

              return dt.astimezone(timezone.utc)

          clima_ts = None

          for intento in range(3):
              try:
                  url = (
                      GITHUB_TS_URL
                      + "?t="
                      + str(int(time.time()))
                  )

                  raw = get(url).decode(
                      "utf-8",
                      errors="replace",
                  ).strip()

                  clima_ts = parse_iso(raw)

                  if clima_ts:
                      break

              except Exception as exc:
                  print(
                      f"Error leyendo ClimaAR "
                      f"{intento + 1}/3: {exc}"
                  )

                  time.sleep(2)

          if clima_ts is None:
              print(
                  "ERROR: no se pudo determinar "
                  "el último frame de ClimaAR."
              )

              with open(
                  "diagnostico.json",
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      {
                          "ok": False,
                          "motivo": "climaar_timestamp_no_disponible",
                      },
                      f,
                      indent=2,
                  )

              sys.exit(0)

          html = None

          for intento in range(3):
              try:
                  html = get(
                      SOURCE_URL
                  ).decode(
                      "utf-8",
                      errors="replace",
                  )

                  break

              except Exception as exc:
                  print(
                      f"Error leyendo SINARAME "
                      f"{intento + 1}/3: {exc}"
                  )

                  time.sleep(2)

          if not html:
              print(
                  "ERROR: no se pudo consultar SINARAME."
              )
              sys.exit(0)

          patrones = [
              r"/cache/RMA10/[^\"'<>\\s]+?(\\d{14})\\.png",
              r"/cache/RMA10/(\\d{14})\\.png",
              r"RMA10[^\"'<>\\s]*?(\\d{14})\\.png",
          ]

          timestamps = set()

          for patron in patrones:
              for match in re.findall(
                  patron,
                  html,
                  flags=re.IGNORECASE,
              ):
                  if isinstance(match, tuple):
                      match = match[-1]

                  if re.fullmatch(
                      r"\d{14}",
                      match,
                  ):
                      timestamps.add(match)

          if not timestamps:
              print(
                  "SINARAME no expuso un timestamp "
                  "RMA10 detectable."
              )
              sys.exit(0)

          argentina = ZoneInfo(
              "America/Argentina/Buenos_Aires"
          )

          candidatos = []

          for texto in timestamps:
              try:
                  dt = datetime.strptime(
                      texto,
                      "%Y%m%d%H%M%S",
                  ).replace(
                      tzinfo=argentina,
                  ).astimezone(
                      timezone.utc
                  )

                  candidatos.append(
                      (dt, texto)
                  )

              except Exception:
                  pass

          if not candidatos:
              print(
                  "No se pudieron convertir "
                  "los timestamps RMA10."
              )
              sys.exit(0)

          source_dt, source_text = max(
              candidatos,
              key=lambda item: item[0],
          )

          ahora = datetime.now(timezone.utc)

          diferencia = (
              source_dt - clima_ts
          ).total_seconds() / 60.0

          edad_fuente = (
              ahora - source_dt
          ).total_seconds() / 60.0

          edad_climaar = (
              ahora - clima_ts
          ).total_seconds() / 60.0

          print("")
          print("==========================================")
          print("ClimaAR WATCHDOG")
          print("==========================================")
          print(
              "SINARAME:",
              source_dt.isoformat(),
          )
          print(
              "ClimaAR :",
              clima_ts.isoformat(),
          )
          print(
              "Diferencia:",
              f"{diferencia:.2f} minutos",
          )
          print(
              "Edad SINARAME:",
              f"{edad_fuente:.2f} minutos",
          )
          print(
              "Edad ClimaAR:",
              f"{edad_climaar:.2f} minutos",
          )
          print("==========================================")

          resultado = {
              "ok": True,
              "sinarame": source_dt.isoformat(),
              "climaar": clima_ts.isoformat(),
              "diferencia_minutos": round(
                  diferencia,
                  2,
              ),
              "edad_sinarame_minutos": round(
                  edad_fuente,
                  2,
              ),
              "edad_climaar_minutos": round(
                  edad_climaar,
                  2,
              ),
              "frame_sinarame_nombre": source_text,
              "accion_radar": "ninguna",
              "accion_intelligence": "ninguna",
          }

          with open(
              "diagnostico.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  resultado,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )

          if diferencia > 0:
              print("")
              print(
                  "NUEVO FRAME DETECTADO EN SINARAME."
              )

              with open(
                  "nuevo_frame.flag",
                  "w",
              ) as f:
                  f.write("true\n")

          else:
              print("")
              print(
                  "ClimaAR ya posee el último "
                  "frame conocido de SINARAME."
              )
          PY

      - name: Comprobar Radar
        id: radar
        if: steps.diagnostico.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f nuevo_frame.flag ]; then
            echo "No hay frame nuevo."
            echo "running=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNNING="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow probar-radar-smn.yml \
              --limit 20 \
              --json status \
              --jq '
                [
                  .[]
                  | select(
                      .status == "queued"
                      or
                      .status == "in_progress"
                    )
                ]
                | length
              '
          )"

          echo "Radar activo: $RUNNING"

          if [ "$RUNNING" -gt 0 ]; then
            echo "running=true" >> "$GITHUB_OUTPUT"
          else
            echo "running=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lanzar Radar inmediatamente
        if: |
          steps.diagnostico.outcome == 'success' &&
          steps.radar.outputs.running == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "DISPARANDO PROBAR RADAR SMN"

          gh workflow run \
            probar-radar-smn.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          echo "Radar disparado correctamente."

      - name: Radar ya estaba procesando
        if: |
          steps.diagnostico.outcome == 'success' &&
          steps.radar.outputs.running == 'true'
        run: |
          echo "Radar ya estaba ejecutándose."
          echo "No se lanza una segunda ejecución."

      - name: Comprobar cadena Radar → Intelligence
        id: cadena
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AUDITORÍA RADAR → INTELLIGENCE"
          echo "=========================================="

          RADAR_JSON="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow probar-radar-smn.yml \
              --status success \
              --limit 1 \
              --json databaseId,updatedAt \
              --jq '.[0]'
          )"

          if [ -z "$RADAR_JSON" ] || [ "$RADAR_JSON" = "null" ]; then
            echo "No hay Radar exitoso disponible."
            echo "repair=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RADAR_ID="$(
            echo "$RADAR_JSON" |
              jq -r '.databaseId'
          )"

          RADAR_COMPLETED="$(
            echo "$RADAR_JSON" |
              jq -r '.updatedAt'
          )"

          echo "Último Radar exitoso: $RADAR_ID"
          echo "Radar terminado/actualizado: $RADAR_COMPLETED"

          INTEL_ACTIVE="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow climaar-intelligence.yml \
              --limit 20 \
              --json status \
              --jq '
                [
                  .[]
                  | select(
                      .status == "queued"
                      or
                      .status == "in_progress"
                    )
                ]
                | length
              '
          )"

          echo "Intelligence activa: $INTEL_ACTIVE"

          if [ "$INTEL_ACTIVE" -gt 0 ]; then
            echo "Intelligence ya está ejecutándose."
            echo "repair=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INTEL_JSON="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow climaar-intelligence.yml \
              --limit 10 \
              --json databaseId,status,conclusion,createdAt,updatedAt \
              --jq '.[0]'
          )"

          if [ -z "$INTEL_JSON" ] || [ "$INTEL_JSON" = "null" ]; then
            echo "Nunca se ejecutó Intelligence."
            echo "repair=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INTEL_STATUS="$(
            echo "$INTEL_JSON" |
              jq -r '.status'
          )"

          INTEL_CONCLUSION="$(
            echo "$INTEL_JSON" |
              jq -r '.conclusion // ""'
          )"

          INTEL_CREATED="$(
            echo "$INTEL_JSON" |
              jq -r '.createdAt'
          )"

          INTEL_UPDATED="$(
            echo "$INTEL_JSON" |
              jq -r '.updatedAt'
          )"

          echo "Última Intelligence:"
          echo "  estado: $INTEL_STATUS"
          echo "  conclusión: $INTEL_CONCLUSION"
          echo "  creada: $INTEL_CREATED"
          echo "  actualizada: $INTEL_UPDATED"

          export RADAR_COMPLETED
          export INTEL_CREATED
          export INTEL_UPDATED
          export INTEL_CONCLUSION

          python - <<'PY'
          import os
          from datetime import datetime, timezone

          def parse(value):
              if not value:
                  return None

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              return datetime.fromisoformat(
                  value
              ).astimezone(timezone.utc)

          radar = parse(
              os.environ["RADAR_COMPLETED"]
          )

          intel_created = parse(
              os.environ["INTEL_CREATED"]
          )

          intel_updated = parse(
              os.environ["INTEL_UPDATED"]
          )

          conclusion = os.environ.get(
              "INTEL_CONCLUSION",
              "",
          )

          if intel_updated and intel_updated >= radar:
              if conclusion == "success":
                  print(
                      "OK: Intelligence posterior "
                      "al último Radar."
                  )

                  raise SystemExit(0)

              ahora = datetime.now(timezone.utc)

              minutos = (
                  ahora - intel_created
              ).total_seconds() / 60.0

              if minutos < 15:
                  print(
                      "Intelligence falló recientemente."
                  )
                  print(
                      "Se evita un bucle de reintentos."
                  )

                  raise SystemExit(0)

          print(
              "RADAR MÁS NUEVO QUE INTELLIGENCE."
          )

          with open(
              "repair_intelligence.flag",
              "w",
          ) as f:
              f.write("true\n")
          PY

          echo "repair=true" >> "$GITHUB_OUTPUT"

      - name: Reparar Intelligence automáticamente
        if: |
          steps.cadena.outputs.repair == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f repair_intelligence.flag ]; then
            echo "No hace falta reparar Intelligence."
            exit 0
          fi

          echo "DISPARANDO CLIMAAR INTELLIGENCE CENTRAL"

          gh workflow run \
            climaar-intelligence.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          echo "Intelligence disparada correctamente."

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climaar-watchdog
          path: |
            diagnostico.json
            nuevo_frame.flag
            repair_intelligence.flag
            cadena_ok.flag
          retention-days: 3
