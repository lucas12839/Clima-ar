name: ClimaAR Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: climaar-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Diagnosticar SINARAME vs ClimaAR
        id: diagnostico
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import re
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone

          SOURCE_URL = "https://radares.hidricosargentina.gob.ar/"
          GITHUB_TS_URL = (
              "https://raw.githubusercontent.com/"
              "lucas12839/Clima-ar/main/data/radar/radar_timestamp.txt"
          )

          def get(url, timeout=20):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "ClimaAR-Watchdog/1.0"
                  }
              )
              with urllib.request.urlopen(
                  req,
                  timeout=timeout
              ) as response:
                  return response.read()

          def parse_iso(value):
              if not value:
                  return None

              value = value.strip()

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              dt = datetime.fromisoformat(value)

              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)

              return dt.astimezone(timezone.utc)

          # --------------------------------------------------
          # Obtener último frame publicado por ClimaAR
          # --------------------------------------------------

          clima_ts = None

          for intento in range(3):
              try:
                  raw = get(GITHUB_TS_URL).decode(
                      "utf-8",
                      errors="replace"
                  ).strip()

                  clima_ts = parse_iso(raw)

                  if clima_ts:
                      break

              except Exception as exc:
                  print(
                      f"Error leyendo ClimaAR "
                      f"intento {intento + 1}/3: {exc}"
                  )
                  time.sleep(2)

          if clima_ts is None:
              print(
                  "No se pudo determinar el último frame "
                  "publicado por ClimaAR."
              )
              print(
                  "No se ejecutará ninguna acción automática."
              )
              with open(
                  "diagnostico.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      {
                          "ok": False,
                          "motivo": "climaar_timestamp_no_disponible"
                      },
                      f,
                      indent=2
                  )
              sys.exit(0)

          # --------------------------------------------------
          # Obtener frames publicados por SINARAME
          # --------------------------------------------------

          html = None

          for intento in range(3):
              try:
                  html = get(SOURCE_URL).decode(
                      "utf-8",
                      errors="replace"
                  )
                  break

              except Exception as exc:
                  print(
                      f"Error leyendo SINARAME "
                      f"intento {intento + 1}/3: {exc}"
                  )
                  time.sleep(2)

          if not html:
              print(
                  "No se pudo consultar SINARAME."
              )
              print(
                  "No se ejecutará ninguna acción automática."
              )
              sys.exit(0)

          # --------------------------------------------------
          # Buscar timestamps RMA10 directamente en las URLs
          # --------------------------------------------------

          patrones = [
              r"/cache/RMA10/[^\"'<>\s]+?(\d{14})\.png",
              r"/cache/RMA10/(\d{14})\.png",
              r"RMA10[^\"'<>\s]*?(\d{14})\.png",
          ]

          timestamps = set()

          for patron in patrones:
              for match in re.findall(
                  patron,
                  html,
                  flags=re.IGNORECASE
              ):
                  if isinstance(match, tuple):
                      match = match[-1]

                  if re.fullmatch(
                      r"\d{14}",
                      match
                  ):
                      timestamps.add(match)

          if not timestamps:
              print(
                  "SINARAME no expuso un timestamp RMA10 "
                  "detectable en esta consulta."
              )
              print(
                  "No se ejecutará ninguna acción automática."
              )
              sys.exit(0)

          # --------------------------------------------------
          # Convertir timestamps SINARAME
          #
          # El timestamp del nombre de archivo corresponde
          # a hora Argentina. Se convierte explícitamente a UTC.
          # --------------------------------------------------

          candidatos = []

          from zoneinfo import ZoneInfo

          argentina = ZoneInfo(
              "America/Argentina/Buenos_Aires"
          )

          for texto in timestamps:
              try:
                  dt = datetime.strptime(
                      texto,
                      "%Y%m%d%H%M%S"
                  ).replace(
                      tzinfo=argentina
                  ).astimezone(
                      timezone.utc
                  )

                  candidatos.append(
                      (dt, texto)
                  )

              except Exception:
                  pass

          if not candidatos:
              print(
                  "No se pudieron convertir los timestamps "
                  "RMA10 encontrados."
              )
              sys.exit(0)

          source_dt, source_text = max(
              candidatos,
              key=lambda item: item[0]
          )

          # --------------------------------------------------
          # Comparación REAL
          # --------------------------------------------------

          diferencia = (
              source_dt - clima_ts
          ).total_seconds() / 60.0

          ahora = datetime.now(
              timezone.utc
          )

          edad_fuente = (
              ahora - source_dt
          ).total_seconds() / 60.0

          edad_climaar = (
              ahora - clima_ts
          ).total_seconds() / 60.0

          print("")
          print("==========================================")
          print("ClimaAR WATCHDOG")
          print("==========================================")
          print(
              "SINARAME:",
              source_dt.isoformat()
          )
          print(
              "ClimaAR :",
              clima_ts.isoformat()
          )
          print(
              "Diferencia:",
              f"{diferencia:.2f} minutos"
          )
          print(
              "Edad SINARAME:",
              f"{edad_fuente:.2f} minutos"
          )
          print(
              "Edad ClimaAR:",
              f"{edad_climaar:.2f} minutos"
          )
          print("==========================================")

          resultado = {
              "ok": True,
              "sinarame": source_dt.isoformat(),
              "climaar": clima_ts.isoformat(),
              "diferencia_minutos": round(
                  diferencia,
                  2
              ),
              "edad_sinarame_minutos": round(
                  edad_fuente,
                  2
              ),
              "edad_climaar_minutos": round(
                  edad_climaar,
                  2
              ),
              "frame_sinarame_nombre": source_text,
              "accion": "ninguna"
          }

          # --------------------------------------------------
          # Caso normal:
          # ClimaAR ya tiene el mismo o un frame posterior.
          # --------------------------------------------------

          if diferencia <= 0:
              print(
                  "OK: ClimaAR ya tiene el último frame "
                  "conocido de SINARAME."
              )

              resultado["accion"] = (
                  "climaar_al_dia"
              )

          # --------------------------------------------------
          # SINARAME tiene un frame NUEVO.
          # --------------------------------------------------

          else:
              print(
                  "NUEVO FRAME DETECTADO EN SINARAME."
              )
              print(
                  "ClimaAR está atrasado:",
                  f"{diferencia:.2f} minutos"
              )

              resultado["accion"] = (
                  "nuevo_frame_detectado"
              )

          with open(
              "diagnostico.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              "resultado.env",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  f"SINARAME_TS={source_dt.isoformat()}\n"
              )
              f.write(
                  f"CLIMAAR_TS={clima_ts.isoformat()}\n"
              )
              f.write(
                  f"DIFERENCIA={diferencia}\n"
              )

          if diferencia <= 0:
              sys.exit(0)

          # --------------------------------------------------
          # Señal para el siguiente paso.
          # --------------------------------------------------

          with open(
              "nuevo_frame.flag",
              "w"
          ) as f:
              f.write("true\n")
          PY

      - name: Comprobar si Radar ya está ejecutándose
        id: radar
        if: steps.diagnostico.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f nuevo_frame.flag ]; then
            echo "No hay frame nuevo."
            echo "running=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNNING="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow probar-radar-smn.yml \
              --limit 10 \
              --json status,conclusion,createdAt \
              --jq '
                [
                  .[]
                  | select(.status == "queued" or .status == "in_progress")
                ]
                | length
              '
          )"

          echo "Ejecuciones Radar activas: $RUNNING"

          if [ "$RUNNING" -gt 0 ]; then
            echo "running=true" >> "$GITHUB_OUTPUT"
            echo "Radar ya está ejecutándose."
          else
            echo "running=false" >> "$GITHUB_OUTPUT"
            echo "Radar no está ejecutándose."
          fi

      - name: Lanzar Radar inmediatamente
        if: |
          steps.diagnostico.outcome == 'success' &&
          steps.radar.outputs.running == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DISPARANDO PROBAR RADAR SMN"
          echo "=========================================="

          gh workflow run \
            probar-radar-smn.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          echo ""
          echo "Radar disparado correctamente."
          echo "El cron de 10 minutos queda como respaldo."

      - name: Radar ya estaba procesando
        if: |
          steps.diagnostico.outcome == 'success' &&
          steps.radar.outputs.running == 'true'
        run: |
          echo "SINARAME tiene un frame nuevo."
          echo "Pero Probar Radar SMN ya está ejecutándose."
          echo "No se lanza una segunda ejecución."

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climaar-watchdog
          path: |
            diagnostico.json
            resultado.env
          retention-days: 3
