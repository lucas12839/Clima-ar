name: ClimaAR Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: climaar-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Diagnosticar antigüedad del radar
        id: diagnostico
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          URL = (
              "https://raw.githubusercontent.com/"
              "lucas12839/Clima-ar/main/"
              "data/radar/radar_timestamp.txt"
          )

          def obtener():
              req = urllib.request.Request(
                  URL + "?t=" + str(int(time.time())),
                  headers={
                      "User-Agent": "ClimaAR-Watchdog/4.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20,
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  ).strip()

          def parsear(value):
              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              dt = datetime.fromisoformat(value)

              if dt.tzinfo is None:
                  dt = dt.replace(
                      tzinfo=timezone.utc
                  )

              return dt.astimezone(timezone.utc)

          try:
              raw = obtener()
              frame = parsear(raw)
              ahora = datetime.now(timezone.utc)

              edad = (
                  ahora - frame
              ).total_seconds() / 60.0

              print("")
              print("==========================================")
              print("CLIMAAR WATCHDOG")
              print("==========================================")
              print("Frame ClimaAR:", frame.isoformat())
              print(f"Edad: {edad:.2f} minutos")
              print("==========================================")

              with open(
                  "diagnostico.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      {
                          "ok": True,
                          "frame_climaar": frame.isoformat(),
                          "edad_minutos": round(
                              edad,
                              2
                          ),
                      },
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              # Si supera 12 minutos, necesitamos
              # comprobar si el Radar necesita una
              # nueva captura.
              necesita_radar = edad > 12

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8"
              ) as output:
                  output.write(
                      f"necesita_radar={'true' if necesita_radar else 'false'}\n"
                  )

          except Exception as exc:
              print(
                  "ERROR leyendo timestamp de ClimaAR:",
                  exc
              )

              # Ante una lectura imposible,
              # intentar recuperar el radar.
              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8"
              ) as output:
                  output.write(
                      "necesita_radar=true\n"
                  )

      - name: Comprobar si Radar ya está ejecutándose
        id: radar
        if: steps.diagnostico.outputs.necesita_radar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUNNING="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow probar-radar-smn.yml \
              --limit 20 \
              --json status \
              --jq '
                [
                  .[]
                  | select(
                      .status == "queued"
                      or
                      .status == "in_progress"
                    )
                ]
                | length
              '
          )"

          echo "Radar activo: $RUNNING"

          if [ "$RUNNING" -gt 0 ]; then
            echo "running=true" >> "$GITHUB_OUTPUT"
          else
            echo "running=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Evitar ejecuciones demasiado seguidas
        id: frecuencia
        if: |
          steps.diagnostico.outputs.necesita_radar == 'true' &&
          steps.radar.outputs.running == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          raw = subprocess.check_output(
              [
                  "gh",
                  "run",
                  "list",
                  "--repo",
                  os.environ["GITHUB_REPOSITORY"],
                  "--workflow",
                  "probar-radar-smn.yml",
                  "--limit",
                  "5",
                  "--json",
                  "status,updatedAt"
              ],
              text=True
          )

          runs = json.loads(raw)

          ahora = datetime.now(timezone.utc)

          reciente = False

          for run in runs:
              if run.get("status") != "completed":
                  continue

              value = run.get("updatedAt")

              if not value:
                  continue

              dt = datetime.fromisoformat(
                  value.replace(
                      "Z",
                      "+00:00"
                  )
              )

              edad = (
                  ahora - dt
              ).total_seconds() / 60.0

              print(
                  f"Último Radar terminado hace "
                  f"{edad:.2f} min"
              )

              if edad < 8:
                  reciente = True
                  break

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(
                  f"reciente={'true' if reciente else 'false'}\n"
              )
          PY

      - name: Lanzar Radar
        if: |
          steps.diagnostico.outputs.necesita_radar == 'true' &&
          steps.radar.outputs.running == 'false' &&
          steps.frecuencia.outputs.reciente == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "WATCHDOG: DISPARANDO RADAR"
          echo "=========================================="

          gh workflow run \
            probar-radar-smn.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          echo "Radar disparado correctamente."

      - name: Radar ya estaba procesando
        if: |
          steps.diagnostico.outputs.necesita_radar == 'true' &&
          steps.radar.outputs.running == 'true'
        run: |
          echo "Radar ya está ejecutándose."
          echo "No se lanza una segunda ejecución."

      - name: Radar ejecutado recientemente
        if: |
          steps.diagnostico.outputs.necesita_radar == 'true' &&
          steps.radar.outputs.running == 'false' &&
          steps.frecuencia.outputs.reciente == 'true'
        run: |
          echo "Radar terminó hace menos de 8 minutos."
          echo "Se espera la siguiente comprobación."

      - name: Radar dentro del margen
        if: steps.diagnostico.outputs.necesita_radar == 'false'
        run: |
          echo "Radar dentro del margen operativo."
          echo "No se dispara ninguna ejecución."
