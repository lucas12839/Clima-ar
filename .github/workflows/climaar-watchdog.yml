name: ClimaAR Watchdog

# La recuperación automática ahora la hace el cron de
# climaar-ciclo-radar.yml; este diagnóstico queda solo manual.
on:
  workflow_dispatch:

concurrency:
  group: climaar-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Diagnosticar estado del radar
        id: diagnostico
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python -c '
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          URL = (
              "https://raw.githubusercontent.com/"
              "lucas12839/Clima-ar/main/"
              "data/radar/radar_timestamp.txt"
          )

          try:
              request = urllib.request.Request(
                  URL + "?t=" + str(int(time.time())),
                  headers={
                      "User-Agent": "ClimaAR-Watchdog",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20,
              ) as response:
                  raw = response.read().decode(
                      "utf-8",
                      errors="replace",
                  ).strip()

              if raw.endswith("Z"):
                  raw = raw[:-1] + "+00:00"

              frame = datetime.fromisoformat(raw)

              if frame.tzinfo is None:
                  raise ValueError(
                      "timestamp sin zona horaria"
                  )

              frame = frame.astimezone(timezone.utc)

              ahora = datetime.now(timezone.utc)

              edad = (
                  ahora - frame
              ).total_seconds() / 60.0

              if edad < 0:
                  print(
                      f"ERROR: timestamp futuro: {edad:.2f} min"
                  )
                  necesita = True

              else:
                  necesita = edad > 12

              print("")
              print("==========================================")
              print("CLIMAAR WATCHDOG")
              print("==========================================")
              print(
                  "Frame:",
                  frame.isoformat()
              )
              print(
                  f"Edad: {edad:.2f} minutos"
              )
              print(
                  "Necesita Radar:",
                  necesita
              )
              print("==========================================")

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8",
              ) as output:
                  output.write(
                      "necesita_radar="
                      + ("true" if necesita else "false")
                      + "\n"
                  )

          except Exception as exc:
              print(
                  "ERROR leyendo radar_timestamp.txt:",
                  exc
              )

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8",
              ) as output:
                  output.write(
                      "necesita_radar=true\n"
                  )
          '

      - name: Comprobar Radar activo
        id: radar
        if: steps.diagnostico.outputs.necesita_radar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          activos="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow probar-radar-smn.yml \
              --limit 20 \
              --json status \
              --jq '
                [
                  .[]
                  | select(
                      .status == "queued"
                      or
                      .status == "in_progress"
                    )
                ]
                | length
              '
          )"

          echo "Ejecuciones Radar activas: $activos"

          if [ "$activos" -gt 0 ]; then
            echo "running=true" >> "$GITHUB_OUTPUT"
          else
            echo "running=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comprobar Radar recientemente terminado
        id: frecuencia
        if: |
          steps.diagnostico.outputs.necesita_radar == 'true' &&
          steps.radar.outputs.running == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python -c '
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          resultado = subprocess.check_output(
              [
                  "gh",
                  "run",
                  "list",
                  "--repo",
                  os.environ["GITHUB_REPOSITORY"],
                  "--workflow",
                  "probar-radar-smn.yml",
                  "--limit",
                  "10",
                  "--json",
                  "status,conclusion,updatedAt",
              ],
              text=True,
          )

          runs = json.loads(resultado)

          ahora = datetime.now(timezone.utc)

          reciente = False

          for run in runs:

              if run.get("status") != "completed":
                  continue

              if run.get("conclusion") != "success":
                  continue

              actualizado = run.get("updatedAt")

              if not actualizado:
                  continue

              dt = datetime.fromisoformat(
                  actualizado.replace(
                      "Z",
                      "+00:00",
                  )
              )

              edad = (
                  ahora - dt
              ).total_seconds() / 60.0

              print(
                  f"Radar exitoso terminado hace "
                  f"{edad:.2f} minutos"
              )

              if edad < 8:
                  reciente = True
                  break

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  "reciente="
                  + ("true" if reciente else "false")
                  + "\n"
              )
          '

      - name: Lanzar Radar RMA10
        if: |
          steps.diagnostico.outputs.necesita_radar == 'true' &&
          steps.radar.outputs.running == 'false' &&
          steps.frecuencia.outputs.reciente == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "WATCHDOG: ASEGURANDO DETECTOR SINARAME"
          echo "=========================================="

          gh workflow run \
            climaar-ciclo-radar.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          echo "Detector solicitado (si no había uno activo)."

      - name: Radar ya está ejecutándose
        if: |
          steps.diagnostico.outputs.necesita_radar == 'true' &&
          steps.radar.outputs.running == 'true'
        run: |
          echo "Radar ya está ejecutándose."
          echo "No se inicia otra ejecución."

      - name: Radar terminó recientemente
        if: |
          steps.diagnostico.outputs.necesita_radar == 'true' &&
          steps.radar.outputs.running == 'false' &&
          steps.frecuencia.outputs.reciente == 'true'
        run: |
          echo "Radar terminó hace menos de 8 minutos."
          echo "No se inicia otra ejecución."

      - name: Radar operativo
        if: steps.diagnostico.outputs.necesita_radar == 'false'
        run: |
          echo "Radar dentro del margen operativo."
          echo "No se requiere recuperación."
