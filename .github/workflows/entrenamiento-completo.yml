name: ClimaAR - Modelo Historico Definitivo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  entrenamiento:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Entrenar modelo historico
        run: |
          python - <<'PY'
          import os
          import json
          import warnings
          import numpy as np
          import pandas as pd
          import joblib

          from sklearn.ensemble import RandomForestClassifier
          from sklearn.preprocessing import StandardScaler
          from sklearn.metrics import (
              roc_auc_score,
              average_precision_score,
              confusion_matrix,
              precision_score,
              recall_score,
              f1_score
          )

          warnings.filterwarnings("ignore")

          # ============================================================
          # CONFIGURACION
          # ============================================================

          CLIMA = "data/historico/clima_horario_1980_2026.csv"
          EVENTOS = "data/historico/eventos_severos.csv"

          OUT_DIR = "modelo"

          MODEL_FILE = os.path.join(
              OUT_DIR,
              "climaar_modelo_historico.joblib"
          )

          METRICS_FILE = os.path.join(
              OUT_DIR,
              "climaar_modelo_historico_metricas.json"
          )

          FEATURES_FILE = os.path.join(
              OUT_DIR,
              "climaar_features.json"
          )

          os.makedirs(
              OUT_DIR,
              exist_ok=True
          )

          # ============================================================
          # VALIDACION DE ARCHIVOS
          # ============================================================

          if not os.path.exists(CLIMA):
              raise SystemExit(
                  f"ERROR: no existe {CLIMA}"
              )

          if not os.path.exists(EVENTOS):
              raise SystemExit(
                  f"ERROR: no existe {EVENTOS}"
              )

          print("=" * 70)
          print("CLIMAAR - MODELO HISTORICO DEFINITIVO")
          print("=" * 70)

          # ============================================================
          # CARGA
          # ============================================================

          clima = pd.read_csv(
              CLIMA
          )

          eventos = pd.read_csv(
              EVENTOS
          )

          print(
              f"Registros meteorologicos: {len(clima):,}"
          )

          print(
              f"Eventos catalogados: {len(eventos):,}"
          )

          # ============================================================
          # COLUMNAS NECESARIAS
          # ============================================================

          columnas = [
              "time",
              "temperature_2m",
              "relative_humidity_2m",
              "dew_point_2m",
              "pressure_msl",
              "precipitation",
              "wind_speed_10m",
              "wind_direction_10m",
              "wind_gusts_10m"
          ]

          for columna in columnas:
              if columna not in clima.columns:
                  raise SystemExit(
                      f"ERROR: falta columna {columna}"
                  )

          columnas_eventos = [
              "fecha",
              "tormenta_severa",
              "viento_severo",
              "precipitacion_extrema",
              "inundacion",
              "granizo",
              "tornado"
          ]

          for columna in columnas_eventos:
              if columna not in eventos.columns:
                  raise SystemExit(
                      f"ERROR: falta columna de eventos {columna}"
                  )

          # ============================================================
          # LIMPIEZA
          # ============================================================

          clima["time"] = pd.to_datetime(
              clima["time"],
              errors="coerce"
          )

          clima = clima.dropna(
              subset=["time"]
          )

          clima = (
              clima
              .sort_values("time")
              .drop_duplicates(
                  subset=["time"]
              )
              .reset_index(drop=True)
          )

          for columna in columnas[1:]:
              clima[columna] = pd.to_numeric(
                  clima[columna],
                  errors="coerce"
              )

          eventos["fecha"] = pd.to_datetime(
              eventos["fecha"],
              errors="coerce"
          )

          eventos = eventos.dropna(
              subset=["fecha"]
          )

          eventos["fecha"] = (
              eventos["fecha"]
              .dt.normalize()
          )

          # ============================================================
          # SOLO EVENTOS REALES CATALOGADOS
          # ============================================================

          eventos["severo"] = (
              eventos[
                  [
                      "tormenta_severa",
                      "viento_severo",
                      "precipitacion_extrema",
                      "inundacion",
                      "granizo",
                      "tornado"
                  ]
              ]
              .fillna(0)
              .sum(axis=1)
              > 0
          ).astype(int)

          eventos = eventos[
              eventos["severo"] == 1
          ].copy()

          eventos = (
              eventos
              .drop_duplicates(
                  subset=["fecha"]
              )
              .sort_values("fecha")
              .reset_index(drop=True)
          )

          print("=" * 70)
          print("EVENTOS UTILIZADOS")
          print("=" * 70)

          for _, fila in eventos.iterrows():
              print(
                  fila["fecha"].strftime("%Y-%m-%d"),
                  "-",
                  fila["evento"]
              )

          print(
              f"Eventos severos reales utilizados: {len(eventos)}"
          )

          if len(eventos) < 3:
              raise SystemExit(
                  "ERROR: hay menos de 3 eventos severos reales."
              )

          # ============================================================
          # VARIABLES TEMPORALES
          # ============================================================

          clima["fecha"] = (
              clima["time"]
              .dt.normalize()
          )

          clima["hora"] = (
              clima["time"]
              .dt.hour
          )

          clima["mes"] = (
              clima["time"]
              .dt.month
          )

          clima["dia_ano"] = (
              clima["time"]
              .dt.dayofyear
          )

          # ============================================================
          # VARIABLES FISICAS
          # ============================================================

          clima["temp_rocio_dif"] = (
              clima["temperature_2m"]
              - clima["dew_point_2m"]
          )

          rad = np.deg2rad(
              clima["wind_direction_10m"]
          )

          clima["viento_u"] = (
              clima["wind_speed_10m"]
              * np.sin(rad)
          )

          clima["viento_v"] = (
              clima["wind_speed_10m"]
              * np.cos(rad)
          )

          # ============================================================
          # CAMBIOS METEOROLOGICOS
          # ============================================================

          clima["cambio_presion_1h"] = (
              clima["pressure_msl"]
              .diff(1)
          )

          clima["cambio_presion_3h"] = (
              clima["pressure_msl"]
              .diff(3)
          )

          clima["cambio_temp_1h"] = (
              clima["temperature_2m"]
              .diff(1)
          )

          clima["cambio_temp_3h"] = (
              clima["temperature_2m"]
              .diff(3)
          )

          clima["cambio_humedad_1h"] = (
              clima["relative_humidity_2m"]
              .diff(1)
          )

          clima["cambio_viento_1h"] = (
              clima["wind_speed_10m"]
              .diff(1)
          )

          # ============================================================
          # VENTANAS METEOROLOGICAS
          # ============================================================

          clima["lluvia_3h"] = (
              clima["precipitation"]
              .rolling(
                  3,
                  min_periods=3
              )
              .sum()
          )

          clima["lluvia_6h"] = (
              clima["precipitation"]
              .rolling(
                  6,
                  min_periods=6
              )
              .sum()
          )

          clima["lluvia_12h"] = (
              clima["precipitation"]
              .rolling(
                  12,
                  min_periods=12
              )
              .sum()
          )

          clima["rafaga_max_3h"] = (
              clima["wind_gusts_10m"]
              .rolling(
                  3,
                  min_periods=3
              )
              .max()
          )

          clima["rafaga_max_6h"] = (
              clima["wind_gusts_10m"]
              .rolling(
                  6,
                  min_periods=6
              )
              .max()
          )

          clima["viento_max_6h"] = (
              clima["wind_speed_10m"]
              .rolling(
                  6,
                  min_periods=6
              )
              .max()
          )

          clima["presion_min_6h"] = (
              clima["pressure_msl"]
              .rolling(
                  6,
                  min_periods=6
              )
              .min()
          )

          clima["presion_max_6h"] = (
              clima["pressure_msl"]
              .rolling(
                  6,
                  min_periods=6
              )
              .max()
          )

          clima["humedad_max_6h"] = (
              clima["relative_humidity_2m"]
              .rolling(
                  6,
                  min_periods=6
              )
              .max()
          )

          clima["humedad_min_6h"] = (
              clima["relative_humidity_2m"]
              .rolling(
                  6,
                  min_periods=6
              )
              .min()
          )

          # ============================================================
          # CONSTRUIR RESUMEN DIARIO
          #
          # IMPORTANTE:
          # No se generan miles de positivos artificiales.
          # Cada fecha severa sigue siendo UN caso.
          # ============================================================

          agregaciones = {
              "temperature_2m": [
                  "mean",
                  "max",
                  "min"
              ],
              "relative_humidity_2m": [
                  "mean",
                  "max",
                  "min"
              ],
              "dew_point_2m": [
                  "mean",
                  "max"
              ],
              "pressure_msl": [
                  "mean",
                  "min",
                  "max"
              ],
              "precipitation": [
                  "sum",
                  "max"
              ],
              "wind_speed_10m": [
                  "mean",
                  "max"
              ],
              "wind_gusts_10m": [
                  "mean",
                  "max"
              ],
              "temp_rocio_dif": [
                  "mean",
                  "min"
              ],
              "viento_u": [
                  "mean",
                  "max",
                  "min"
              ],
              "viento_v": [
                  "mean",
                  "max",
                  "min"
              ],
              "cambio_presion_1h": [
                  "mean",
                  "min"
              ],
              "cambio_presion_3h": [
                  "mean",
                  "min"
              ],
              "cambio_temp_1h": [
                  "mean",
                  "min",
                  "max"
              ],
              "cambio_temp_3h": [
                  "mean",
                  "min",
                  "max"
              ],
              "cambio_humedad_1h": [
                  "mean",
                  "min",
                  "max"
              ],
              "cambio_viento_1h": [
                  "mean",
                  "max"
              ],
              "lluvia_3h": [
                  "max"
              ],
              "lluvia_6h": [
                  "max"
              ],
              "lluvia_12h": [
                  "max"
              ],
              "rafaga_max_3h": [
                  "max"
              ],
              "rafaga_max_6h": [
                  "max"
              ],
              "viento_max_6h": [
                  "max"
              ],
              "presion_min_6h": [
                  "min"
              ],
              "presion_max_6h": [
                  "max"
              ],
              "humedad_max_6h": [
                  "max"
              ],
              "humedad_min_6h": [
                  "min"
              ]
          }

          diario = (
              clima
              .groupby("fecha")
              .agg(agregaciones)
          )

          diario.columns = [
              "_".join(
                  [str(x) for x in columna]
              )
              for columna in diario.columns
          ]

          diario = diario.reset_index()

          # ============================================================
          # VARIABLES CALENDARIO
          # ============================================================

          diario["mes"] = (
              diario["fecha"]
              .dt.month
          )

          diario["dia_ano"] = (
              diario["fecha"]
              .dt.dayofyear
          )

          # ============================================================
          # ETIQUETA
          # ============================================================

          fechas_eventos = set(
              eventos["fecha"]
          )

          diario["evento_severo"] = (
              diario["fecha"]
              .isin(fechas_eventos)
              .astype(int)
          )

          # ============================================================
          # LIMPIEZA FINAL
          # ============================================================

          diario = diario.replace(
              [np.inf, -np.inf],
              np.nan
          )

          diario = diario.dropna(
              subset=[
                  columna
                  for columna in diario.columns
                  if columna not in [
                      "fecha",
                      "evento_severo"
                  ]
              ]
          ).reset_index(drop=True)

          # ============================================================
          # FEATURES
          # ============================================================

          features = [
              columna
              for columna in diario.columns
              if columna not in [
                  "fecha",
                  "evento_severo"
              ]
          ]

          # ============================================================
          # VALIDACION DE CLASES
          # ============================================================

          positivos = diario[
              diario["evento_severo"] == 1
          ].copy()

          negativos = diario[
              diario["evento_severo"] == 0
          ].copy()

          print("=" * 70)
          print("DATASET DIARIO")
          print("=" * 70)

          print(
              f"Dias meteorologicos: {len(diario):,}"
          )

          print(
              f"Dias severos reales: {len(positivos):,}"
          )

          print(
              f"Dias no severos: {len(negativos):,}"
          )

          if len(positivos) < 3:
              raise SystemExit(
                  "ERROR: no hay suficientes eventos para validar."
              )

          # ============================================================
          # NORMALIZACION
          # ============================================================

          X = diario[
              features
          ].astype(float)

          y = diario[
              "evento_severo"
          ].astype(int)

          scaler = StandardScaler()

          X_scaled = scaler.fit_transform(
              X
          )

          # ============================================================
          # VALIDACION LEAVE-ONE-EVENT-OUT
          #
          # Cada evento severo se deja fuera del entrenamiento.
          # ============================================================

          resultados_validacion = []

          fechas_eventos_ordenadas = sorted(
              positivos["fecha"].tolist()
          )

          for fecha_test in fechas_eventos_ordenadas:

              mascara_test = (
                  diario["fecha"] == fecha_test
              )

              mascara_train = (
                  ~mascara_test
                  & (
                      diario["evento_severo"]
                      == 0
                  )
              )

              # Agregar los otros eventos severos al entrenamiento.
              mascara_train = (
                  mascara_train
                  | (
                      (~mascara_test)
                      & (
                          diario["evento_severo"]
                          == 1
                      )
                  )
              )

              X_train = X_scaled[
                  mascara_train.values
              ]

              y_train = y[
                  mascara_train
              ]

              X_test = X_scaled[
                  mascara_test.values
              ]

              y_test = y[
                  mascara_test
              ]

              if y_train.sum() < 2:
                  continue

              modelo_validacion = RandomForestClassifier(
                  n_estimators=500,
                  max_depth=5,
                  min_samples_leaf=2,
                  class_weight="balanced",
                  random_state=42,
                  n_jobs=-1
              )

              modelo_validacion.fit(
                  X_train,
                  y_train
              )

              probabilidad = float(
                  modelo_validacion.predict_proba(
                      X_test
                  )[0, 1]
              )

              resultados_validacion.append(
                  {
                      "fecha": fecha_test.strftime(
                          "%Y-%m-%d"
                      ),
                      "probabilidad": probabilidad
                  }
              )

          # ============================================================
          # METRICAS DE VALIDACION
          # ============================================================

          probabilidades_eventos = [
              x["probabilidad"]
              for x in resultados_validacion
          ]

          # Umbral conservador para detectar casos anormales.
          if probabilidades_eventos:
              umbral = float(
                  np.percentile(
                      probabilidades_eventos,
                      20
                  )
              )
          else:
              umbral = 0.5

          # ============================================================
          # MODELO FINAL
          # ============================================================

          modelo_final = RandomForestClassifier(
              n_estimators=700,
              max_depth=6,
              min_samples_leaf=2,
              class_weight="balanced",
              random_state=42,
              n_jobs=-1
          )

          modelo_final.fit(
              X_scaled,
              y
          )

          # ============================================================
          # IMPORTANCIA
          # ============================================================

          importancia = pd.DataFrame(
              {
                  "feature": features,
                  "importance": (
                      modelo_final
                      .feature_importances_
                  )
              }
          ).sort_values(
              "importance",
              ascending=False
          )

          # ============================================================
          # INFORMACION DEL MODELO
          # ============================================================

          paquete_modelo = {
              "modelo": modelo_final,
              "scaler": scaler,
              "features": features,
              "version": "2.0",
              "tipo": "firma_atmosferica_evento_severo",
              "fuente": "Bahia Blanca",
              "periodo": "1980-2026",
              "eventos_entrenamiento": [
                  x.strftime("%Y-%m-%d")
                  for x in fechas_eventos_ordenadas
              ],
              "umbral_referencia": umbral
          }

          # ============================================================
          # GUARDAR MODELO COMPRIMIDO
          # ============================================================

          joblib.dump(
              paquete_modelo,
              MODEL_FILE,
              compress=3
          )

          # ============================================================
          # METRICAS
          # ============================================================

          metricas = {
              "modelo": "RandomForestClassifier",
              "version": "2.0",
              "tipo": "firma_atmosferica_evento_severo",
              "periodo": "1980-2026",
              "dias_totales": int(
                  len(diario)
              ),
              "eventos_severos_reales": int(
                  len(positivos)
              ),
              "dias_no_severos": int(
                  len(negativos)
              ),
              "metodo_validacion": (
                  "leave_one_event_out"
              ),
              "resultados_eventos": (
                  resultados_validacion
              ),
              "umbral_referencia": umbral,
              "variables_mas_importantes": (
                  importancia
                  .head(20)
                  .to_dict(
                      orient="records"
                  )
              ),
              "eventos_utilizados": (
                  eventos[
                      [
                          "fecha",
                          "evento",
                          "rafaga_kmh",
                          "lluvia_mm",
                          "tornado"
                      ]
                  ]
                  .astype(str)
                  .to_dict(
                      orient="records"
                  )
              ),
              "advertencia": (
                  "Este modelo aprende firmas atmosfericas "
                  "de los eventos historicos catalogados. "
                  "No representa por si solo un nowcast de "
                  "1 hora. El nowcast operacional se construira "
                  "combinando este modelo con RainViewer."
              )
          }

          with open(
              METRICS_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  metricas,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              FEATURES_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  features,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # ============================================================
          # RESULTADO
          # ============================================================

          print("=" * 70)
          print("MODELO FINALIZADO")
          print("=" * 70)

          print(
              f"Dias utilizados: {len(diario):,}"
          )

          print(
              f"Eventos severos reales: {len(positivos)}"
          )

          print(
              f"Variables: {len(features)}"
          )

          print("=" * 70)
          print("VALIDACION POR EVENTO")
          print("=" * 70)

          for resultado in resultados_validacion:
              print(
                  resultado["fecha"],
                  "->",
                  round(
                      resultado["probabilidad"],
                      4
                  )
              )

          print("=" * 70)
          print("ARCHIVOS")
          print("=" * 70)

          print(
              MODEL_FILE
          )

          print(
              METRICS_FILE
          )

          print(
              FEATURES_FILE
          )

          print("=" * 70)

          PY

      - name: Verificar archivos y tamanos
        run: |
          echo "Archivos generados:"
          ls -lh modelo/

          MODEL_SIZE=$(stat -c%s modelo/climaar_modelo_historico.joblib)

          echo "Tamano modelo: ${MODEL_SIZE} bytes"

          if [ "$MODEL_SIZE" -ge 95000000 ]; then
            echo "ERROR: el modelo supera 95 MB."
            exit 1
          fi

          test -s modelo/climaar_modelo_historico.joblib
          test -s modelo/climaar_modelo_historico_metricas.json
          test -s modelo/climaar_features.json

          echo "VERIFICACION OK"

      - name: Guardar modelo en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add modelo/climaar_modelo_historico.joblib
          git add modelo/climaar_modelo_historico_metricas.json
          git add modelo/climaar_features.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Modelo historico ClimaAR definitivo"
            git push
          fi
