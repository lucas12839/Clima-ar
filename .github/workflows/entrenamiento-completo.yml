name: ClimaAR - Entrenamiento Nowcasting Corregido

on:
  workflow_dispatch:

jobs:
  entrenamiento:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pandas numpy scikit-learn joblib

      - name: Construir muestras pre-evento y validar
        run: |
          python - <<'PY'
          import os
          import json
          import numpy as np
          import pandas as pd
          import joblib

          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import (
              precision_score,
              recall_score,
              f1_score,
              roc_auc_score,
              confusion_matrix
          )

          BASE = "data/historico"
          CLIMA = f"{BASE}/clima_horario_1980_2026.csv"
          EVENTOS = f"{BASE}/eventos_severos.csv"

          if not os.path.exists(CLIMA):
              raise SystemExit(f"No existe {CLIMA}")

          if not os.path.exists(EVENTOS):
              raise SystemExit(f"No existe {EVENTOS}")

          clima = pd.read_csv(CLIMA)
          eventos = pd.read_csv(EVENTOS)

          clima["time"] = pd.to_datetime(
              clima["time"],
              errors="coerce"
          )

          eventos["fecha"] = pd.to_datetime(
              eventos["fecha"],
              errors="coerce"
          )

          clima = (
              clima
              .dropna(subset=["time"])
              .sort_values("time")
              .reset_index(drop=True)
          )

          eventos = (
              eventos
              .dropna(subset=["fecha"])
              .sort_values("fecha")
              .reset_index(drop=True)
          )

          print("Registros meteorologicos:", len(clima))
          print("Eventos severos catalogados:", len(eventos))

          # ==========================================
          # VARIABLES TEMPORALES
          # ==========================================

          clima["hora"] = clima["time"].dt.hour
          clima["mes"] = clima["time"].dt.month
          clima["dia_anio"] = clima["time"].dt.dayofyear

          clima["hora_sin"] = np.sin(
              2 * np.pi * clima["hora"] / 24
          )

          clima["hora_cos"] = np.cos(
              2 * np.pi * clima["hora"] / 24
          )

          clima["mes_sin"] = np.sin(
              2 * np.pi * clima["mes"] / 12
          )

          clima["mes_cos"] = np.cos(
              2 * np.pi * clima["mes"] / 12
          )

          # ==========================================
          # LLUVIA
          # ==========================================

          for h in [1, 3, 6, 12, 24]:

              clima[f"lluvia_{h}h"] = (
                  clima["precipitation"]
                  .rolling(
                      h,
                      min_periods=h
                  )
                  .sum()
              )

          # ==========================================
          # VIENTO
          # ==========================================

          for h in [3, 6, 12, 24]:

              clima[f"rafaga_max_{h}h"] = (
                  clima["wind_gusts_10m"]
                  .rolling(
                      h,
                      min_periods=h
                  )
                  .max()
              )

              clima[f"viento_max_{h}h"] = (
                  clima["wind_speed_10m"]
                  .rolling(
                      h,
                      min_periods=h
                  )
                  .max()
              )

          # ==========================================
          # CAMBIOS METEOROLOGICOS
          # ==========================================

          for h in [1, 3, 6, 12, 24]:

              clima[f"cambio_presion_{h}h"] = (
                  clima["pressure_msl"]
                  - clima["pressure_msl"].shift(h)
              )

              clima[f"cambio_temp_{h}h"] = (
                  clima["temperature_2m"]
                  - clima["temperature_2m"].shift(h)
              )

              clima[f"cambio_humedad_{h}h"] = (
                  clima["relative_humidity_2m"]
                  - clima["relative_humidity_2m"].shift(h)
              )

              clima[f"cambio_viento_{h}h"] = (
                  clima["wind_speed_10m"]
                  - clima["wind_speed_10m"].shift(h)
              )

          # ==========================================
          # INDICADORES
          # ==========================================

          clima["diferencia_temp_rocio"] = (
              clima["temperature_2m"]
              - clima["dew_point_2m"]
          )

          clima["presion_descenso_6h"] = (
              clima["cambio_presion_6h"] < -3
          ).astype(int)

          clima["presion_descenso_12h"] = (
              clima["cambio_presion_12h"] < -5
          ).astype(int)

          clima["lluvia_intensa_1h"] = (
              clima["lluvia_1h"] >= 20
          ).astype(int)

          clima["lluvia_extrema_6h"] = (
              clima["lluvia_6h"] >= 50
          ).astype(int)

          clima["viento_fuerte"] = (
              clima["wind_gusts_10m"] >= 80
          ).astype(int)

          clima["viento_muy_fuerte"] = (
              clima["wind_gusts_10m"] >= 100
          ).astype(int)

          # ==========================================
          # MUESTRAS POSITIVAS
          #
          # SOLO 24 HORAS ANTES DEL EVENTO.
          # NO SE USAN HORAS POSTERIORES.
          # ==========================================

          positivos = []

          for _, ev in eventos.iterrows():

              inicio = (
                  ev["fecha"]
                  - pd.Timedelta(hours=24)
              )

              fin = (
                  ev["fecha"]
                  - pd.Timedelta(hours=1)
              )

              ventana = clima[
                  (clima["time"] >= inicio) &
                  (clima["time"] <= fin)
              ].copy()

              if ventana.empty:
                  print(
                      "Sin datos pre-evento:",
                      ev["fecha"].date()
                  )
                  continue

              ventana["target"] = 1

              ventana["evento_id"] = (
                  ev["fecha"].strftime("%Y-%m-%d")
              )

              ventana["evento_nombre"] = (
                  str(ev["evento"])
              )

              positivos.append(ventana)

          if not positivos:

              raise SystemExit(
                  "No se pudieron construir "
                  "muestras positivas."
              )

          positivos = pd.concat(
              positivos,
              ignore_index=True
          )

          # ==========================================
          # EXCLUIR PERIODOS CERCANOS A EVENTOS
          # PARA LOS NEGATIVOS
          # ==========================================

          excluir = np.zeros(
              len(clima),
              dtype=bool
          )

          for _, ev in eventos.iterrows():

              excluir |= (
                  (clima["time"] >=
                   ev["fecha"] -
                   pd.Timedelta(hours=72))
                  &
                  (clima["time"] <=
                   ev["fecha"] +
                   pd.Timedelta(hours=72))
              )

          disponibles = clima.loc[
              ~excluir
          ].copy()

          disponibles = disponibles.dropna(
              subset=[
                  "temperature_2m",
                  "relative_humidity_2m",
                  "dew_point_2m",
                  "pressure_msl",
                  "precipitation",
                  "wind_speed_10m",
                  "wind_gusts_10m"
              ]
          )

          # ==========================================
          # MUESTRAS NEGATIVAS
          # MISMO MES QUE CADA EVENTO
          # ==========================================

          rng = np.random.RandomState(42)

          negativos_por_evento = []

          for _, ev in eventos.iterrows():

              candidatos = disponibles[
                  disponibles["mes"]
                  .eq(ev["fecha"].month)
              ].copy()

              if len(candidatos) < 24:
                  candidatos = disponibles.copy()

              cantidad = min(
                  24,
                  len(candidatos)
              )

              muestra = candidatos.sample(
                  n=cantidad,
                  random_state=rng
              ).copy()

              muestra["target"] = 0

              muestra["evento_id"] = (
                  ev["fecha"].strftime("%Y-%m-%d")
              )

              muestra["evento_nombre"] = "normal"

              negativos_por_evento.append(
                  muestra
              )

          negativos = pd.concat(
              negativos_por_evento,
              ignore_index=True
          )

          # ==========================================
          # DATASET DE ENTRENAMIENTO
          # ==========================================

          datos = pd.concat(
              [
                  positivos,
                  negativos
              ],
              ignore_index=True
          )

          datos = (
              datos
              .sort_values("time")
              .reset_index(drop=True)
          )

          print(
              "Muestras positivas:",
              int(
                  (datos["target"] == 1).sum()
              )
          )

          print(
              "Muestras negativas:",
              int(
                  (datos["target"] == 0).sum()
              )
          )

          print(
              "Eventos positivos:",
              positivos["evento_id"].nunique()
          )

          # ==========================================
          # VARIABLES DEL MODELO
          # ==========================================

          features = [

              "temperature_2m",
              "relative_humidity_2m",
              "dew_point_2m",
              "pressure_msl",
              "precipitation",

              "wind_speed_10m",
              "wind_direction_10m",
              "wind_gusts_10m",

              "hora",
              "mes",
              "dia_anio",

              "hora_sin",
              "hora_cos",
              "mes_sin",
              "mes_cos",

              "lluvia_1h",
              "lluvia_3h",
              "lluvia_6h",
              "lluvia_12h",
              "lluvia_24h",

              "rafaga_max_3h",
              "rafaga_max_6h",
              "rafaga_max_12h",
              "rafaga_max_24h",

              "viento_max_3h",
              "viento_max_6h",
              "viento_max_12h",
              "viento_max_24h",

              "cambio_presion_1h",
              "cambio_presion_3h",
              "cambio_presion_6h",
              "cambio_presion_12h",
              "cambio_presion_24h",

              "cambio_temp_1h",
              "cambio_temp_3h",
              "cambio_temp_6h",

              "cambio_humedad_1h",
              "cambio_humedad_3h",
              "cambio_humedad_6h",

              "cambio_viento_1h",
              "cambio_viento_3h",
              "cambio_viento_6h",

              "presion_descenso_6h",
              "presion_descenso_12h",

              "lluvia_intensa_1h",
              "lluvia_extrema_6h",

              "viento_fuerte",
              "viento_muy_fuerte"
          ]

          features = [
              c
              for c in features
              if c in datos.columns
          ]

          datos[features] = (
              datos[features]
              .replace(
                  [np.inf, -np.inf],
                  np.nan
              )
              .fillna(0)
          )

          # ==========================================
          # VALIDACION LEAVE-ONE-EVENT-OUT
          # ==========================================

          resultados = []
          matrices = []

          ids_eventos = (
              eventos["fecha"]
              .dt
              .strftime("%Y-%m-%d")
              .tolist()
          )

          for test_event in ids_eventos:

              train = datos[
                  datos["evento_id"] != test_event
              ].copy()

              test = datos[
                  datos["evento_id"] == test_event
              ].copy()

              if train["target"].nunique() < 2:
                  continue

              if test["target"].nunique() < 2:
                  continue

              modelo = RandomForestClassifier(

                  n_estimators=300,

                  max_depth=10,

                  min_samples_leaf=2,

                  class_weight="balanced",

                  random_state=42,

                  n_jobs=-1
              )

              modelo.fit(
                  train[features],
                  train["target"]
              )

              pred = modelo.predict(
                  test[features]
              )

              prob = (
                  modelo
                  .predict_proba(
                      test[features]
                  )[:, 1]
              )

              resultados.append({

                  "evento_test":
                      test_event,

                  "precision":
                      precision_score(
                          test["target"],
                          pred,
                          zero_division=0
                      ),

                  "recall":
                      recall_score(
                          test["target"],
                          pred,
                          zero_division=0
                      ),

                  "f1":
                      f1_score(
                          test["target"],
                          pred,
                          zero_division=0
                      ),

                  "roc_auc":
                      roc_auc_score(
                          test["target"],
                          prob
                      ),

                  "positivos_test":
                      int(
                          test["target"].sum()
                      ),

                  "negativos_test":
                      int(
                          (test["target"] == 0).sum()
                      )
              })

              matrices.append(
                  f"{test_event}: "
                  f"{confusion_matrix("
                  f"test['target'], pred"
                  f").tolist()}"
              )

          if not resultados:

              raise SystemExit(
                  "No fue posible completar "
                  "la validacion por evento."
              )

          validacion = pd.DataFrame(
              resultados
          )

          print()
          print(
              "===================================="
          )

          print(
              "VALIDACION REAL POR EVENTO"
          )

          print(
              "===================================="
          )

          print(
              validacion.to_string(
                  index=False
              )
          )

          print()
          print("PROMEDIOS:")

          print(
              validacion[
                  [
                      "precision",
                      "recall",
                      "f1",
                      "roc_auc"
                  ]
              ].mean()
          )

          # ==========================================
          # MODELO FINAL
          # ==========================================

          modelo_final = RandomForestClassifier(

              n_estimators=400,

              max_depth=10,

              min_samples_leaf=2,

              class_weight="balanced",

              random_state=42,

              n_jobs=-1
          )

          modelo_final.fit(
              datos[features],
              datos["target"]
          )

          os.makedirs(
              "modelo",
              exist_ok=True
          )

          # ==========================================
          # GUARDAR MODELO
          # ==========================================

          joblib.dump(
              modelo_final,
              "modelo/"
              "climaar_modelo_pre_evento.joblib"
          )

          # ==========================================
          # VALIDACION
          # ==========================================

          validacion.to_csv(
              "modelo/"
              "validacion_por_evento.csv",
              index=False
          )

          # ==========================================
          # IMPORTANCIA DE VARIABLES
          # ==========================================

          importancia = pd.DataFrame({

              "variable":
                  features,

              "importancia":
                  modelo_final
                  .feature_importances_

          })

          importancia = (
              importancia
              .sort_values(
                  "importancia",
                  ascending=False
              )
          )

          importancia.to_csv(
              "modelo/"
              "importancia_variables.csv",
              index=False
          )

          # ==========================================
          # RESUMEN
          # ==========================================

          resumen = {

              "tipo":
                  "modelo_pre_evento",

              "ventana_pre_evento_horas":
                  24,

              "eventos_catalogados":
                  int(len(eventos)),

              "muestras_positivas":
                  int(
                      (datos["target"] == 1)
                      .sum()
                  ),

              "muestras_negativas":
                  int(
                      (datos["target"] == 0)
                      .sum()
                  ),

              "precision_media":
                  float(
                      validacion[
                          "precision"
                      ].mean()
                  ),

              "recall_medio":
                  float(
                      validacion[
                          "recall"
                      ].mean()
                  ),

              "f1_medio":
                  float(
                      validacion[
                          "f1"
                      ].mean()
                  ),

              "roc_auc_medio":
                  float(
                      validacion[
                          "roc_auc"
                      ].mean()
                  ),

              "nota":
                  "Validacion leave-one-event-out. "
                  "No representa todavia el rendimiento "
                  "final del nowcasting por radar."
          }

          with open(
              "modelo/resumen_modelo.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resumen,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # ==========================================
          # METRICAS
          # ==========================================

          with open(
              "modelo/metricas.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "CLIMAAR - MODELO PRE-EVENTO\n"
              )

              f.write(
                  "============================\n\n"
              )

              f.write(
                  json.dumps(
                      resumen,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              f.write(
                  "\n\nMATRICES POR EVENTO\n"
              )

              for matriz in matrices:

                  f.write(
                      matriz + "\n"
                  )

          print()
          print(
              "Modelo final guardado."
          )

          print(
              "No se guardan datasets grandes."
          )

          PY

      - name: Guardar resultados
        run: |
          git config user.name "climaar-bot"
          git config user.email "bot@climaar.com.ar"

          git add \
            modelo/climaar_modelo_pre_evento.joblib \
            modelo/validacion_por_evento.csv \
            modelo/importancia_variables.csv \
            modelo/resumen_modelo.json \
            modelo/metricas.txt

          git commit \
            -m "Corregir entrenamiento pre-evento ClimaAR" \
            || echo "sin cambios"

          git push
