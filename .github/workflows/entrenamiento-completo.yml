name: ClimaAR - Modelo Historico Definitivo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  entrenamiento:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn==1.9.1 joblib

      - name: Entrenar modelo historico
        run: |
          python - <<'PY'
          import os
          import json
          import warnings
          import numpy as np
          import pandas as pd
          import joblib

          from sklearn.ensemble import RandomForestClassifier
          from sklearn.preprocessing import StandardScaler

          warnings.filterwarnings("ignore")

          CLIMA = "data/historico/clima_horario_1980_2026.csv"
          EVENTOS = "data/historico/eventos_severos.csv"

          OUT_DIR = "modelo"

          MODEL_FILE = os.path.join(
              OUT_DIR,
              "climaar_modelo_historico.joblib"
          )

          METRICS_FILE = os.path.join(
              OUT_DIR,
              "climaar_modelo_historico_metricas.json"
          )

          FEATURES_FILE = os.path.join(
              OUT_DIR,
              "climaar_features.json"
          )

          os.makedirs(OUT_DIR, exist_ok=True)

          if not os.path.exists(CLIMA):
              raise SystemExit(f"ERROR: no existe {CLIMA}")

          if not os.path.exists(EVENTOS):
              raise SystemExit(f"ERROR: no existe {EVENTOS}")

          print("=" * 70)
          print("CLIMAAR - MODELO HISTORICO DEFINITIVO")
          print("=" * 70)

          clima = pd.read_csv(CLIMA)
          eventos = pd.read_csv(EVENTOS)

          print(f"Registros meteorologicos: {len(clima):,}")
          print(f"Eventos catalogados: {len(eventos):,}")

          columnas = [
              "time",
              "temperature_2m",
              "relative_humidity_2m",
              "dew_point_2m",
              "pressure_msl",
              "precipitation",
              "wind_speed_10m",
              "wind_direction_10m",
              "wind_gusts_10m"
          ]

          for columna in columnas:
              if columna not in clima.columns:
                  raise SystemExit(
                      f"ERROR: falta columna {columna}"
                  )

          columnas_eventos = [
              "fecha",
              "tormenta_severa",
              "viento_severo",
              "precipitacion_extrema",
              "inundacion",
              "granizo",
              "tornado"
          ]

          for columna in columnas_eventos:
              if columna not in eventos.columns:
                  raise SystemExit(
                      f"ERROR: falta columna de eventos {columna}"
                  )

          clima["time"] = pd.to_datetime(
              clima["time"],
              errors="coerce"
          )

          clima = clima.dropna(subset=["time"])

          clima = (
              clima
              .sort_values("time")
              .drop_duplicates(subset=["time"])
              .reset_index(drop=True)
          )

          for columna in columnas[1:]:
              clima[columna] = pd.to_numeric(
                  clima[columna],
                  errors="coerce"
              )

          eventos["fecha"] = pd.to_datetime(
              eventos["fecha"],
              errors="coerce"
          )

          eventos = eventos.dropna(subset=["fecha"])

          eventos["fecha"] = eventos["fecha"].dt.normalize()

          eventos["severo"] = (
              eventos[
                  [
                      "tormenta_severa",
                      "viento_severo",
                      "precipitacion_extrema",
                      "inundacion",
                      "granizo",
                      "tornado"
                  ]
              ]
              .fillna(0)
              .sum(axis=1)
              > 0
          ).astype(int)

          eventos = eventos[
              eventos["severo"] == 1
          ].copy()

          eventos = (
              eventos
              .drop_duplicates(subset=["fecha"])
              .sort_values("fecha")
              .reset_index(drop=True)
          )

          print("=" * 70)
          print("EVENTOS UTILIZADOS")
          print("=" * 70)

          for _, fila in eventos.iterrows():
              print(
                  fila["fecha"].strftime("%Y-%m-%d"),
                  "-",
                  fila.get("evento", "evento")
              )

          print(
              f"Eventos severos reales utilizados: {len(eventos)}"
          )

          if len(eventos) < 3:
              raise SystemExit(
                  "ERROR: hay menos de 3 eventos severos reales."
              )

          clima["fecha"] = clima["time"].dt.normalize()
          clima["hora"] = clima["time"].dt.hour
          clima["mes"] = clima["time"].dt.month
          clima["dia_ano"] = clima["time"].dt.dayofyear

          clima["temp_rocio_dif"] = (
              clima["temperature_2m"]
              - clima["dew_point_2m"]
          )

          rad = np.deg2rad(
              clima["wind_direction_10m"]
          )

          clima["viento_u"] = (
              clima["wind_speed_10m"]
              * np.sin(rad)
          )

          clima["viento_v"] = (
              clima["wind_speed_10m"]
              * np.cos(rad)
          )

          clima["cambio_presion_1h"] = (
              clima["pressure_msl"].diff(1)
          )

          clima["cambio_presion_3h"] = (
              clima["pressure_msl"].diff(3)
          )

          clima["cambio_temp_1h"] = (
              clima["temperature_2m"].diff(1)
          )

          clima["cambio_temp_3h"] = (
              clima["temperature_2m"].diff(3)
          )

          clima["cambio_humedad_1h"] = (
              clima["relative_humidity_2m"].diff(1)
          )

          clima["cambio_viento_1h"] = (
              clima["wind_speed_10m"].diff(1)
          )

          clima["lluvia_3h"] = (
              clima["precipitation"]
              .rolling(3, min_periods=3)
              .sum()
          )

          clima["lluvia_6h"] = (
              clima["precipitation"]
              .rolling(6, min_periods=6)
              .sum()
          )

          clima["lluvia_12h"] = (
              clima["precipitation"]
              .rolling(12, min_periods=12)
              .sum()
          )

          clima["rafaga_max_3h"] = (
              clima["wind_gusts_10m"]
              .rolling(3, min_periods=3)
              .max()
          )

          clima["rafaga_max_6h"] = (
              clima["wind_gusts_10m"]
              .rolling(6, min_periods=6)
              .max()
          )

          clima["viento_max_6h"] = (
              clima["wind_speed_10m"]
              .rolling(6, min_periods=6)
              .max()
          )

          clima["humedad_min_6h"] = (
              clima["relative_humidity_2m"]
              .rolling(6, min_periods=6)
              .min()
          )

          clima["presion_min_6h"] = (
              clima["pressure_msl"]
              .rolling(6, min_periods=6)
              .min()
          )

          # ============================================================
          # VARIABLES UTILIZADAS POR EL MODELO
          # ============================================================

          features = [
              "temperature_2m",
              "relative_humidity_2m",
              "dew_point_2m",
              "pressure_msl",
              "precipitation",
              "wind_speed_10m",
              "wind_direction_10m",
              "wind_gusts_10m",
              "temp_rocio_dif",
              "viento_u",
              "viento_v",
              "cambio_presion_1h",
              "cambio_presion_3h",
              "cambio_temp_1h",
              "cambio_temp_3h",
              "cambio_humedad_1h",
              "cambio_viento_1h",
              "lluvia_3h",
              "lluvia_6h",
              "lluvia_12h",
              "rafaga_max_3h",
              "rafaga_max_6h",
              "viento_max_6h",
              "humedad_min_6h",
              "presion_min_6h",
              "hora",
              "mes",
              "dia_ano"
          ]

          # ============================================================
          # CONSTRUIR PERFIL DIARIO
          # ============================================================

          diario = (
              clima
              .groupby("fecha")
              .agg({
                  "temperature_2m": "mean",
                  "relative_humidity_2m": "mean",
                  "dew_point_2m": "mean",
                  "pressure_msl": "mean",
                  "precipitation": "sum",
                  "wind_speed_10m": "mean",
                  "wind_direction_10m": "mean",
                  "wind_gusts_10m": "max",
                  "temp_rocio_dif": "mean",
                  "viento_u": "mean",
                  "viento_v": "mean",
                  "cambio_presion_1h": "min",
                  "cambio_presion_3h": "min",
                  "cambio_temp_1h": "max",
                  "cambio_temp_3h": "max",
                  "cambio_humedad_1h": "min",
                  "cambio_viento_1h": "max",
                  "lluvia_3h": "max",
                  "lluvia_6h": "max",
                  "lluvia_12h": "max",
                  "rafaga_max_3h": "max",
                  "rafaga_max_6h": "max",
                  "viento_max_6h": "max",
                  "humedad_min_6h": "min",
                  "presion_min_6h": "min",
                  "hora": "mean",
                  "mes": "first",
                  "dia_ano": "first"
              })
              .reset_index()
          )

          diario["evento_severo"] = (
              diario["fecha"]
              .isin(eventos["fecha"])
          ).astype(int)

          diario = diario.dropna(
              subset=features
          ).reset_index(drop=True)

          positivos = diario[
              diario["evento_severo"] == 1
          ].copy()

          negativos = diario[
              diario["evento_severo"] == 0
          ].copy()

          if len(positivos) < 3:
              raise SystemExit(
                  "ERROR: no hay suficientes eventos severos después "
                  "de limpiar los datos."
              )

          X = diario[features].astype(float)
          y = diario["evento_severo"].astype(int)

          scaler = StandardScaler()

          X_scaled = scaler.fit_transform(X)

          # ============================================================
          # VALIDACION LEAVE-ONE-EVENT-OUT
          # ============================================================

          resultados_validacion = []

          fechas_eventos_ordenadas = sorted(
              positivos["fecha"].tolist()
          )

          for fecha_test in fechas_eventos_ordenadas:

              mascara_test = (
                  diario["fecha"] == fecha_test
              )

              mascara_train = (
                  ~mascara_test
                  & (
                      diario["evento_severo"] == 0
                  )
              )

              mascara_train = (
                  mascara_train
                  | (
                      (~mascara_test)
                      & (
                          diario["evento_severo"] == 1
                      )
                  )
              )

              X_train = X_scaled[
                  mascara_train.values
              ]

              y_train = y[
                  mascara_train
              ]

              X_test = X_scaled[
                  mascara_test.values
              ]

              y_test = y[
                  mascara_test
              ]

              if y_train.sum() < 2:
                  continue

              modelo_validacion = RandomForestClassifier(
                  n_estimators=500,
                  max_depth=5,
                  min_samples_leaf=2,
                  class_weight="balanced",
                  random_state=42,
                  n_jobs=-1
              )

              modelo_validacion.fit(
                  X_train,
                  y_train
              )

              probabilidad = float(
                  modelo_validacion.predict_proba(
                      X_test
                  )[0, 1]
              )

              resultados_validacion.append(
                  {
                      "fecha": fecha_test.strftime(
                          "%Y-%m-%d"
                      ),
                      "probabilidad": probabilidad
                  }
              )

          probabilidades_eventos = [
              x["probabilidad"]
              for x in resultados_validacion
          ]

          if probabilidades_eventos:
              umbral = float(
                  np.percentile(
                      probabilidades_eventos,
                      20
                  )
              )
          else:
              umbral = 0.5

          # ============================================================
          # MODELO FINAL
          # ============================================================

          modelo_final = RandomForestClassifier(
              n_estimators=700,
              max_depth=6,
              min_samples_leaf=2,
              class_weight="balanced",
              random_state=42,
              n_jobs=-1
          )

          modelo_final.fit(
              X_scaled,
              y
          )

          importancia = pd.DataFrame(
              {
                  "feature": features,
                  "importance": (
                      modelo_final
                      .feature_importances_
                  )
              }
          ).sort_values(
              "importance",
              ascending=False
          )

          paquete_modelo = {
              "modelo": modelo_final,
              "scaler": scaler,
              "features": features,
              "version": "2.0",
              "tipo": "firma_atmosferica_evento_severo",
              "fuente": "Bahia Blanca",
              "periodo": "1980-2026",
              "eventos_entrenamiento": [
                  x.strftime("%Y-%m-%d")
                  for x in fechas_eventos_ordenadas
              ],
              "umbral_referencia": umbral
          }

          joblib.dump(
              paquete_modelo,
              MODEL_FILE,
              compress=3
          )

          metricas = {
              "modelo": "RandomForestClassifier",
              "version": "2.0",
              "tipo": "firma_atmosferica_evento_severo",
              "periodo": "1980-2026",
              "dias_totales": int(len(diario)),
              "eventos_severos_reales": int(len(positivos)),
              "dias_no_severos": int(len(negativos)),
              "metodo_validacion": "leave_one_event_out",
              "resultados_eventos": resultados_validacion,
              "umbral_referencia": umbral,
              "variables_m
