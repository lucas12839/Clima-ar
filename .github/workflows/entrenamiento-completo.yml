name: ClimaAR - Entrenamiento Historico

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  entrenamiento:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Entrenar modelo historico ClimaAR
        run: |
          python - <<'PY'
          import os
          import json
          import warnings
          import numpy as np
          import pandas as pd
          import joblib

          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import classification_report, confusion_matrix, roc_auc_score

          warnings.filterwarnings("ignore")

          CLIMA = "data/historico/clima_horario_1980_2026.csv"
          EVENTOS = "data/historico/eventos_severos.csv"

          OUT_DIR = "modelo"
          MODEL_FILE = os.path.join(OUT_DIR, "climaar_modelo_historico.joblib")
          METRICS_FILE = os.path.join(OUT_DIR, "climaar_modelo_historico_metricas.json")

          os.makedirs(OUT_DIR, exist_ok=True)

          if not os.path.exists(CLIMA):
              raise SystemExit(f"ERROR: no existe {CLIMA}")

          if not os.path.exists(EVENTOS):
              raise SystemExit(f"ERROR: no existe {EVENTOS}")

          print("=" * 70)
          print("CLIMAAR - ENTRENAMIENTO HISTORICO")
          print("=" * 70)

          clima = pd.read_csv(CLIMA)
          eventos = pd.read_csv(EVENTOS)

          print(f"Registros meteorologicos originales: {len(clima):,}")
          print(f"Eventos historicos catalogados: {len(eventos):,}")

          columnas_requeridas = [
              "time",
              "temperature_2m",
              "relative_humidity_2m",
              "dew_point_2m",
              "pressure_msl",
              "precipitation",
              "wind_speed_10m",
              "wind_direction_10m",
              "wind_gusts_10m"
          ]

          for columna in columnas_requeridas:
              if columna not in clima.columns:
                  raise SystemExit(
                      f"ERROR: falta columna meteorologica: {columna}"
                  )

          columnas_eventos = [
              "fecha",
              "tormenta_severa",
              "viento_severo",
              "precipitacion_extrema",
              "inundacion",
              "granizo",
              "tornado"
          ]

          for columna in columnas_eventos:
              if columna not in eventos.columns:
                  raise SystemExit(
                      f"ERROR: falta columna de eventos: {columna}"
                  )

          clima["time"] = pd.to_datetime(
              clima["time"],
              errors="coerce"
          )

          clima = clima.dropna(
              subset=["time"]
          )

          clima = (
              clima
              .sort_values("time")
              .drop_duplicates(subset=["time"])
              .reset_index(drop=True)
          )

          for columna in columnas_requeridas[1:]:
              clima[columna] = pd.to_numeric(
                  clima[columna],
                  errors="coerce"
              )

          eventos["fecha"] = pd.to_datetime(
              eventos["fecha"],
              errors="coerce"
          )

          eventos = eventos.dropna(
              subset=["fecha"]
          )

          eventos["fecha"] = (
              eventos["fecha"]
              .dt.normalize()
          )

          eventos = (
              eventos
              .drop_duplicates(subset=["fecha"])
              .sort_values("fecha")
              .reset_index(drop=True)
          )

          clima["fecha"] = (
              clima["time"]
              .dt.normalize()
          )

          clima["hora"] = (
              clima["time"]
              .dt.hour
          )

          clima["mes"] = (
              clima["time"]
              .dt.month
          )

          clima["dia_ano"] = (
              clima["time"]
              .dt.dayofyear
          )

          clima["temp_rocio_dif"] = (
              clima["temperature_2m"]
              - clima["dew_point_2m"]
          )

          rad = np.deg2rad(
              clima["wind_direction_10m"]
          )

          clima["viento_u"] = (
              clima["wind_speed_10m"]
              * np.sin(rad)
          )

          clima["viento_v"] = (
              clima["wind_speed_10m"]
              * np.cos(rad)
          )

          clima["cambio_presion_1h"] = (
              clima["pressure_msl"]
              .diff(1)
          )

          clima["cambio_presion_3h"] = (
              clima["pressure_msl"]
              .diff(3)
          )

          clima["cambio_temp_1h"] = (
              clima["temperature_2m"]
              .diff(1)
          )

          clima["cambio_temp_3h"] = (
              clima["temperature_2m"]
              .diff(3)
          )

          clima["cambio_humedad_1h"] = (
              clima["relative_humidity_2m"]
              .diff(1)
          )

          clima["cambio_viento_1h"] = (
              clima["wind_speed_10m"]
              .diff(1)
          )

          clima["lluvia_1h"] = (
              clima["precipitation"]
              .rolling(
                  window=1,
                  min_periods=1
              )
              .sum()
          )

          clima["lluvia_3h"] = (
              clima["precipitation"]
              .rolling(
                  window=3,
                  min_periods=1
              )
              .sum()
          )

          clima["lluvia_6h"] = (
              clima["precipitation"]
              .rolling(
                  window=6,
                  min_periods=3
              )
              .sum()
          )

          clima["lluvia_12h"] = (
              clima["precipitation"]
              .rolling(
                  window=12,
                  min_periods=6
              )
              .sum()
          )

          clima["rafaga_max_3h"] = (
              clima["wind_gusts_10m"]
              .rolling(
                  window=3,
                  min_periods=1
              )
              .max()
          )

          clima["rafaga_max_6h"] = (
              clima["wind_gusts_10m"]
              .rolling(
                  window=6,
                  min_periods=3
              )
              .max()
          )

          clima["viento_max_3h"] = (
              clima["wind_speed_10m"]
              .rolling(
                  window=3,
                  min_periods=1
              )
              .max()
          )

          clima["presion_min_6h"] = (
              clima["pressure_msl"]
              .rolling(
                  window=6,
                  min_periods=3
              )
              .min()
          )

          clima["presion_max_6h"] = (
              clima["pressure_msl"]
              .rolling(
                  window=6,
                  min_periods=3
              )
              .max()
          )

          clima["humedad_max_6h"] = (
              clima["relative_humidity_2m"]
              .rolling(
                  window=6,
                  min_periods=3
              )
              .max()
          )

          clima["humedad_min_6h"] = (
              clima["relative_humidity_2m"]
              .rolling(
                  window=6,
                  min_periods=3
              )
              .min()
          )

          eventos["evento_severo"] = (
              eventos["tormenta_severa"].fillna(0)
              + eventos["viento_severo"].fillna(0)
              + eventos["precipitacion_extrema"].fillna(0)
              + eventos["inundacion"].fillna(0)
              + eventos["granizo"].fillna(0)
              + eventos["tornado"].fillna(0)
              > 0
          ).astype(int)

          fechas_eventos = set(
              eventos.loc[
                  eventos["evento_severo"] == 1,
                  "fecha"
              ]
              .dt.strftime("%Y-%m-%d")
          )

          clima["target_evento_severo"] = (
              clima["fecha"]
              .dt.strftime("%Y-%m-%d")
              .isin(fechas_eventos)
              .astype(int)
          )

          features = [
              "temperature_2m",
              "relative_humidity_2m",
              "dew_point_2m",
              "pressure_msl",
              "precipitation",
              "wind_speed_10m",
              "wind_direction_10m",
              "wind_gusts_10m",
              "hora",
              "mes",
              "dia_ano",
              "temp_rocio_dif",
              "viento_u",
              "viento_v",
              "cambio_presion_1h",
              "cambio_presion_3h",
              "cambio_temp_1h",
              "cambio_temp_3h",
              "cambio_humedad_1h",
              "cambio_viento_1h",
              "lluvia_1h",
              "lluvia_3h",
              "lluvia_6h",
              "lluvia_12h",
              "rafaga_max_3h",
              "rafaga_max_6h",
              "viento_max_3h",
              "presion_min_6h",
              "presion_max_6h",
              "humedad_max_6h",
              "humedad_min_6h"
          ]

          dataset = clima[
              ["time", "fecha"]
              + features
              + ["target_evento_severo"]
          ].copy()

          dataset = dataset.replace(
              [np.inf, -np.inf],
              np.nan
          )

          dataset = (
              dataset
              .dropna(subset=features)
              .sort_values("time")
              .reset_index(drop=True)
          )

          positivos = int(
              dataset["target_evento_severo"].sum()
          )

          negativos = int(
              len(dataset) - positivos
          )

          print(
              f"Registros utilizables: {len(dataset):,}"
          )

          print(
              f"Registros positivos: {positivos:,}"
          )

          print(
              f"Registros negativos: {negativos:,}"
          )

          if positivos == 0:
              raise SystemExit(
                  "ERROR: no se encontraron eventos positivos."
              )

          corte = int(
              len(dataset) * 0.80
          )

          train = dataset.iloc[
              :corte
          ].copy()

          test = dataset.iloc[
              corte:
          ].copy()

          X_train = train[features]
          y_train = train["target_evento_severo"]

          X_test = test[features]
          y_test = test["target_evento_severo"]

          print(
              f"Entrenamiento: {len(train):,}"
          )

          print(
              f"Validacion: {len(test):,}"
          )

          print(
              f"Positivos entrenamiento: "
              f"{int(y_train.sum()):,}"
          )

          print(
              f"Positivos validacion: "
              f"{int(y_test.sum()):,}"
          )

          if y_train.nunique() < 2:
              raise SystemExit(
                  "ERROR: el bloque de entrenamiento "
                  "contiene una sola clase."
              )

          modelo = RandomForestClassifier(
              n_estimators=400,
              max_depth=16,
              min_samples_leaf=3,
              class_weight="balanced_subsample",
              random_state=42,
              n_jobs=-1
          )

          print("Entrenando Random Forest...")

          modelo.fit(
              X_train,
              y_train
          )

          pred = modelo.predict(
              X_test
          )

          prob = modelo.predict_proba(
              X_test
          )[:, 1]

          matriz = confusion_matrix(
              y_test,
              pred,
              labels=[0, 1]
          )

          reporte = classification_report(
              y_test,
              pred,
              labels=[0, 1],
              target_names=[
                  "sin_evento",
                  "evento_severo"
              ],
              output_dict=True,
              zero_division=0
          )

          auc = None

          if len(
              np.unique(y_test)
          ) == 2:
              auc = float(
                  roc_auc_score(
                      y_test,
                      prob
                  )
              )

          importancia = pd.DataFrame({
              "feature": features,
              "importance": modelo.feature_importances_
          }).sort_values(
              "importance",
              ascending=False
          )

          metricas = {
              "modelo": "RandomForestClassifier",
              "version": "1.1",
              "tipo": "riesgo_evento_severo_historico",
              "fuente_meteorologica": (
                  "clima_horario_1980_2026.csv"
              ),
              "fuente_eventos": (
                  "eventos_severos.csv"
              ),
              "registros_totales": int(
                  len(dataset)
              ),
              "registros_entrenamiento": int(
                  len(train)
              ),
              "registros_validacion": int(
                  len(test)
              ),
              "positivos_totales": positivos,
              "negativos_totales": negativos,
              "positivos_entrenamiento": int(
                  y_train.sum()
              ),
              "positivos_validacion": int(
                  y_test.sum()
              ),
              "roc_auc": auc,
              "accuracy": float(
                  reporte["accuracy"]
              ),
              "precision_evento": float(
                  reporte["evento_severo"]["precision"]
              ),
              "recall_evento": float(
                  reporte["evento_severo"]["recall"]
              ),
              "f1_evento": float(
                  reporte["evento_severo"]["f1-score"]
              ),
              "matriz_confusion": matriz.tolist(),
              "features": features,
              "variables_mas_importantes": (
                  importancia
                  .head(15)
                  .to_dict(orient="records")
              ),
              "eventos_usados": (
                  eventos[
                      ["fecha", "evento"]
                  ]
                  .astype(str)
                  .to_dict(
                      orient="records"
                  )
              )
          }

          print("=" * 70)
          print("RESULTADO DEL ENTRENAMIENTO")
          print("=" * 70)

          print(
              json.dumps(
                  metricas,
                  indent=2,
                  ensure_ascii=False
              )
          )

          paquete_modelo = {
              "modelo": modelo,
              "features": features,
              "version": "1.1",
              "tipo": "riesgo_evento_severo_historico",
              "fuente": "Bahia Blanca",
              "periodo": "1980-2026"
          }

          print("Guardando modelo comprimido...")

          joblib.dump(
              paquete_modelo,
              MODEL_FILE,
              compress=3
          )

          with open(
              METRICS_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  metricas,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("=" * 70)
          print("ARCHIVOS GENERADOS")
          print(MODEL_FILE)
          print(METRICS_FILE)
          print("=" * 70)
          print("ENTRENAMIENTO FINALIZADO")
          print("=" * 70)

          PY

      - name: Verificar archivos generados
        run: |
          echo "Contenido de modelo:"
          ls -lh modelo/

          MODEL_SIZE=$(stat -c%s modelo/climaar_modelo_historico.joblib)
          METRICS_SIZE=$(stat -c%s modelo/climaar_modelo_historico_metricas.json)

          echo "Modelo: ${MODEL_SIZE} bytes"
          echo "Metricas: ${METRICS_SIZE} bytes"

          if [ "$MODEL_SIZE" -ge 95000000 ]; then
            echo "ERROR: el modelo supera 95 MB."
            exit 1
          fi

      - name: Guardar modelo en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add modelo/climaar_modelo_historico.joblib
          git add modelo/climaar_modelo_historico_metricas.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Entrenamiento historico ClimaAR"
            git push
          fi
