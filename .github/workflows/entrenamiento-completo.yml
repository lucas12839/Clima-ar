name: ClimaAR - Dataset y Modelo Maestro

on:
  workflow_dispatch:

jobs:
  maestro:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pandas numpy scikit-learn joblib

      - name: Construir dataset y entrenar modelo
        run: |
          python - <<'PY'
          import pandas as pd
          import numpy as np
          import os
          import joblib

          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import (
              classification_report,
              confusion_matrix,
              roc_auc_score
          )

          BASE = "data/historico"

          CLIMA = f"{BASE}/clima_horario_1980_2026.csv"
          EVENTOS = f"{BASE}/eventos_severos.csv"

          if not os.path.exists(CLIMA):
              raise SystemExit(f"No existe {CLIMA}")

          if not os.path.exists(EVENTOS):
              raise SystemExit(f"No existe {EVENTOS}")

          print("Cargando datos meteorologicos...")

          clima = pd.read_csv(CLIMA)
          eventos = pd.read_csv(EVENTOS)

          clima["time"] = pd.to_datetime(
              clima["time"],
              errors="coerce"
          )

          eventos["fecha"] = pd.to_datetime(
              eventos["fecha"],
              errors="coerce"
          )

          clima = clima.dropna(
              subset=["time"]
          )

          eventos = eventos.dropna(
              subset=["fecha"]
          )

          clima = clima.sort_values(
              "time"
          ).reset_index(drop=True)

          print("Registros meteorologicos:", len(clima))
          print("Eventos:", len(eventos))

          # ==========================================
          # VARIABLES TEMPORALES
          # ==========================================

          clima["hora"] = clima["time"].dt.hour
          clima["mes"] = clima["time"].dt.month
          clima["dia_anio"] = clima["time"].dt.dayofyear

          clima["hora_sin"] = np.sin(
              2 * np.pi * clima["hora"] / 24
          )

          clima["hora_cos"] = np.cos(
              2 * np.pi * clima["hora"] / 24
          )

          clima["mes_sin"] = np.sin(
              2 * np.pi * clima["mes"] / 12
          )

          clima["mes_cos"] = np.cos(
              2 * np.pi * clima["mes"] / 12
          )

          # ==========================================
          # LLUVIA ACUMULADA
          # ==========================================

          for horas in [1, 3, 6, 12, 24]:

              clima[f"lluvia_{horas}h"] = (
                  clima["precipitation"]
                  .rolling(
                      horas,
                      min_periods=1
                  )
                  .sum()
              )

          # ==========================================
          # VIENTO
          # ==========================================

          for horas in [3, 6, 12, 24]:

              clima[f"rafaga_max_{horas}h"] = (
                  clima["wind_gusts_10m"]
                  .rolling(
                      horas,
                      min_periods=1
                  )
                  .max()
              )

              clima[f"viento_max_{horas}h"] = (
                  clima["wind_speed_10m"]
                  .rolling(
                      horas,
                      min_periods=1
                  )
                  .max()
              )

          # ==========================================
          # CAMBIOS METEOROLOGICOS
          # ==========================================

          for horas in [1, 3, 6, 12, 24]:

              clima[f"cambio_presion_{horas}h"] = (
                  clima["pressure_msl"]
                  - clima["pressure_msl"].shift(horas)
              )

              clima[f"cambio_temp_{horas}h"] = (
                  clima["temperature_2m"]
                  - clima["temperature_2m"].shift(horas)
              )

              clima[f"cambio_humedad_{horas}h"] = (
                  clima["relative_humidity_2m"]
                  - clima["relative_humidity_2m"].shift(horas)
              )

              clima[f"cambio_viento_{horas}h"] = (
                  clima["wind_speed_10m"]
                  - clima["wind_speed_10m"].shift(horas)
              )

          # ==========================================
          # HUMEDAD / PUNTO DE ROCIO
          # ==========================================

          clima["punto_rocio"] = (
              clima["dew_point_2m"]
          )

          clima["diferencia_temp_rocio"] = (
              clima["temperature_2m"]
              - clima["dew_point_2m"]
          )

          # ==========================================
          # INDICADORES
          # ==========================================

          clima["presion_descenso_6h"] = (
              clima["cambio_presion_6h"] < -3
          ).astype(int)

          clima["presion_descenso_12h"] = (
              clima["cambio_presion_12h"] < -5
          ).astype(int)

          clima["lluvia_intensa_1h"] = (
              clima["lluvia_1h"] >= 20
          ).astype(int)

          clima["lluvia_extrema_6h"] = (
              clima["lluvia_6h"] >= 50
          ).astype(int)

          clima["viento_fuerte"] = (
              clima["wind_gusts_10m"] >= 80
          ).astype(int)

          clima["viento_muy_fuerte"] = (
              clima["wind_gusts_10m"] >= 100
          ).astype(int)

          # ==========================================
          # ETIQUETAS DE EVENTOS
          # ==========================================

          etiquetas = [
              "tormenta_severa",
              "viento_severo",
              "precipitacion_extrema",
              "inundacion",
              "granizo",
              "tornado"
          ]

          for etiqueta in etiquetas:
              clima[etiqueta] = 0

          clima["evento"] = ""
          clima["evento_fecha"] = pd.NaT

          for _, evento in eventos.iterrows():

              fecha = evento["fecha"]

              inicio = (
                  fecha -
                  pd.Timedelta(hours=24)
              )

              fin = (
                  fecha +
                  pd.Timedelta(hours=23)
              )

              mask = (
                  (clima["time"] >= inicio) &
                  (clima["time"] <= fin)
              )

              for etiqueta in etiquetas:

                  if etiqueta in evento.index:

                      valor = evento[etiqueta]

                      if pd.notna(valor):

                          clima.loc[
                              mask,
                              etiqueta
                          ] = int(valor)

              clima.loc[
                  mask,
                  "evento"
              ] = str(evento["evento"])

              clima.loc[
                  mask,
                  "evento_fecha"
              ] = fecha

          clima["evento_severo"] = (
              clima[etiquetas]
              .max(axis=1)
              .astype(int)
          )

          # ==========================================
          # LIMPIEZA
          # ==========================================

          clima = clima.replace(
              [np.inf, -np.inf],
              np.nan
          )

          columnas_base = [
              "temperature_2m",
              "relative_humidity_2m",
              "dew_point_2m",
              "pressure_msl",
              "precipitation",
              "wind_speed_10m",
              "wind_direction_10m",
              "wind_gusts_10m"
          ]

          clima = clima.dropna(
              subset=columnas_base
          )

          # ==========================================
          # TRAIN / TEST TEMPORAL
          # ==========================================

          corte = pd.Timestamp(
              "2018-01-01"
          )

          train = clima[
              clima["time"] < corte
          ].copy()

          test = clima[
              clima["time"] >= corte
          ].copy()

          print("TRAIN:", len(train))
          print("TEST:", len(test))

          print(
              "EVENTOS TRAIN:",
              int(train["evento_severo"].sum())
          )

          print(
              "EVENTOS TEST:",
              int(test["evento_severo"].sum())
          )

          # ==========================================
          # VARIABLES DEL MODELO
          # ==========================================

          columnas = [
              "temperature_2m",
              "relative_humidity_2m",
              "dew_point_2m",
              "pressure_msl",
              "precipitation",
              "wind_speed_10m",
              "wind_direction_10m",
              "wind_gusts_10m",

              "hora",
              "mes",
              "dia_anio",

              "hora_sin",
              "hora_cos",
              "mes_sin",
              "mes_cos",

              "lluvia_1h",
              "lluvia_3h",
              "lluvia_6h",
              "lluvia_12h",
              "lluvia_24h",

              "rafaga_max_3h",
              "rafaga_max_6h",
              "rafaga_max_12h",
              "rafaga_max_24h",

              "viento_max_3h",
              "viento_max_6h",
              "viento_max_12h",
              "viento_max_24h",

              "cambio_presion_1h",
              "cambio_presion_3h",
              "cambio_presion_6h",
              "cambio_presion_12h",
              "cambio_presion_24h",

              "cambio_temp_1h",
              "cambio_temp_3h",
              "cambio_temp_6h",

              "cambio_humedad_1h",
              "cambio_humedad_3h",
              "cambio_humedad_6h",

              "cambio_viento_1h",
              "cambio_viento_3h",
              "cambio_viento_6h",

              "presion_descenso_6h",
              "presion_descenso_12h",

              "lluvia_intensa_1h",
              "lluvia_extrema_6h",

              "viento_fuerte",
              "viento_muy_fuerte"
          ]

          columnas = [
              c for c in columnas
              if c in train.columns
          ]

          X_train = (
              train[columnas]
              .replace(
                  [np.inf, -np.inf],
                  np.nan
              )
              .fillna(0)
          )

          y_train = (
              train["evento_severo"]
              .astype(int)
          )

          X_test = (
              test[columnas]
              .replace(
                  [np.inf, -np.inf],
                  np.nan
              )
              .fillna(0)
          )

          y_test = (
              test["evento_severo"]
              .astype(int)
          )

          if y_train.nunique() < 2:
              raise SystemExit(
                  "ERROR: TRAIN no contiene "
                  "las dos clases necesarias."
              )

          if len(X_test) == 0:
              raise SystemExit(
                  "ERROR: TEST esta vacio."
              )

          # ==========================================
          # ENTRENAMIENTO
          # ==========================================

          print()
          print("====================================")
          print("ENTRENANDO RANDOM FOREST")
          print("====================================")

          modelo = RandomForestClassifier(
              n_estimators=300,
              max_depth=16,
              min_samples_leaf=3,
              class_weight="balanced",
              random_state=42,
              n_jobs=-1
          )

          modelo.fit(
              X_train,
              y_train
          )

          pred = modelo.predict(
              X_test
          )

          prob = modelo.predict_proba(
              X_test
          )[:, 1]

          # ==========================================
          # RESULTADOS
          # ==========================================

          reporte = classification_report(
              y_test,
              pred,
              zero_division=0
          )

          matriz = confusion_matrix(
              y_test,
              pred
          )

          auc = None

          if y_test.nunique() == 2:

              auc = roc_auc_score(
                  y_test,
                  prob
              )

          os.makedirs(
              "modelo",
              exist_ok=True
          )

          # ==========================================
          # GUARDAR MODELO
          # ==========================================

          joblib.dump(
              modelo,
              "modelo/climaar_randomforest.joblib"
          )

          # ==========================================
          # GUARDAR METRICAS
          # ==========================================

          with open(
              "modelo/metricas.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "CLIMAAR - MODELO BASE\n"
              )

              f.write(
                  "====================\n\n"
              )

              f.write(
                  f"TRAIN: {len(train)}\n"
              )

              f.write(
                  f"TEST: {len(test)}\n"
              )

              f.write(
                  f"EVENTOS TRAIN: "
                  f"{int(y_train.sum())}\n"
              )

              f.write(
                  f"EVENTOS TEST: "
                  f"{int(y_test.sum())}\n\n"
              )

              f.write(
                  "VARIABLES UTILIZADAS:\n"
              )

              for c in columnas:
                  f.write(
                      f"- {c}\n"
                  )

              f.write(
                  "\nREPORTE\n\n"
              )

              f.write(reporte)

              f.write(
                  "\nMATRIZ DE CONFUSION\n"
              )

              f.write(
                  str(matriz)
              )

              if auc is not None:

                  f.write(
                      "\n\nROC-AUC: "
                      + str(auc)
                  )

          # ==========================================
          # IMPORTANCIA DE VARIABLES
          # ==========================================

          importancia = pd.DataFrame({
              "variable": columnas,
              "importancia": modelo.feature_importances_
          })

          importancia = importancia.sort_values(
              "importancia",
              ascending=False
          )

          importancia.to_csv(
              "modelo/importancia_variables.csv",
              index=False
          )

          # ==========================================
          # RESUMEN PEQUEÑO
          # ==========================================

          resumen = pd.DataFrame([{
              "train_registros": len(train),
              "test_registros": len(test),
              "eventos_train": int(y_train.sum()),
              "eventos_test": int(y_test.sum()),
              "variables": len(columnas),
              "roc_auc": auc
          }])

          resumen.to_csv(
              "modelo/resumen_modelo.csv",
              index=False
          )

          print()
          print("====================================")
          print("RESULTADO")
          print("====================================")
          print(reporte)
          print("Matriz:")
          print(matriz)

          if auc is not None:
              print("ROC-AUC:", auc)
          else:
              print(
                  "ROC-AUC no calculable: "
                  "TEST tiene una sola clase."
              )

          print()
          print(
              "Modelo guardado correctamente."
          )

          print(
              "NO se guardan train.csv, "
              "test.csv ni dataset_maestro.csv."
          )

          PY

      - name: Guardar resultados pequenos
        run: |
          git config user.name "climaar-bot"
          git config user.email "bot@climaar.com.ar"

          git add \
            modelo/climaar_randomforest.joblib \
            modelo/metricas.txt \
            modelo/importancia_variables.csv \
            modelo/resumen_modelo.csv

          git commit \
            -m "Entrenar modelo base ClimaAR" \
            || echo "sin cambios"

          git push
