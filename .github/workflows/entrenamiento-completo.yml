name: ClimaAR - Entrenamiento Completo Diario

on:
  workflow_dispatch:

jobs:
  entrenamiento:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Entrenar modelo completo
        run: |
          python - <<'PY'
          import os
          import json
          import numpy as np
          import pandas as pd
          import joblib

          from sklearn.ensemble import RandomForestClassifier
          from sklearn.model_selection import StratifiedKFold
          from sklearn.metrics import (
              precision_score,
              recall_score,
              f1_score,
              roc_auc_score,
              confusion_matrix
          )

          CLIMA = "data/historico/clima_horario_1980_2026.csv"
          EVENTOS = "data/historico/eventos_severos.csv"

          if not os.path.exists(CLIMA):
              raise SystemExit(f"ERROR: no existe {CLIMA}")

          if not os.path.exists(EVENTOS):
              raise SystemExit(f"ERROR: no existe {EVENTOS}")

          os.makedirs("modelo", exist_ok=True)

          print("=" * 60)
          print("CLIMAAR - CARGA DEL HISTORICO COMPLETO")
          print("=" * 60)

          clima = pd.read_csv(CLIMA)
          eventos = pd.read_csv(EVENTOS)

          print(f"Registros meteorologicos: {len(clima):,}")
          print(f"Eventos catalogados: {len(eventos)}")

          clima["time"] = pd.to_datetime(
              clima["time"],
              errors="coerce"
          )

          eventos["fecha"] = pd.to_datetime(
              eventos["fecha"],
              errors="coerce"
          )

          clima = (
              clima
              .dropna(subset=["time"])
              .sort_values("time")
              .drop_duplicates(subset=["time"])
              .reset_index(drop=True)
          )

          eventos = (
              eventos
              .dropna(subset=["fecha"])
              .sort_values("fecha")
              .drop_duplicates(subset=["fecha"])
              .reset_index(drop=True)
          )

          columnas_numericas = [
              "temperature_2m",
              "relative_humidity_2m",
              "dew_point_2m",
              "pressure_msl",
              "precipitation",
              "wind_speed_10m",
              "wind_direction_10m",
              "wind_gusts_10m"
          ]

          for columna in columnas_numericas:
              if columna in clima.columns:
                  clima[columna] = pd.to_numeric(
                      clima[columna],
                      errors="coerce"
                  )

          clima["fecha"] = clima["time"].dt.floor("D")
          clima["mes"] = clima["time"].dt.month

          clima["diferencia_temp_rocio"] = (
              clima["temperature_2m"]
              - clima["dew_point_2m"]
          )

          direccion_rad = np.deg2rad(
              clima["wind_direction_10m"]
          )

          clima["viento_u"] = (
              clima["wind_speed_10m"]
              * np.sin(direccion_rad)
          )

          clima["viento_v"] = (
              clima["wind_speed_10m"]
              * np.cos(direccion_rad)
          )

          for horas in [3, 6, 12, 24]:

              clima[f"cambio_presion_{horas}h"] = (
                  clima["pressure_msl"]
                  - clima["pressure_msl"].shift(horas)
              )

              clima[f"cambio_temp_{horas}h"] = (
                  clima["temperature_2m"]
                  - clima["temperature_2m"].shift(horas)
              )

              clima[f"cambio_humedad_{horas}h"] = (
                  clima["relative_humidity_2m"]
                  - clima["relative_humidity_2m"].shift(horas)
              )

              clima[f"cambio_viento_{horas}h"] = (
                  clima["wind_speed_10m"]
                  - clima["wind_speed_10m"].shift(horas)
              )

          for horas in [3, 6, 12, 24]:

              clima[f"lluvia_{horas}h"] = (
                  clima["precipitation"]
                  .rolling(horas, min_periods=1)
                  .sum()
              )

              clima[f"rafaga_max_{horas}h"] = (
                  clima["wind_gusts_10m"]
                  .rolling(horas, min_periods=1)
                  .max()
              )

              clima[f"viento_max_{horas}h"] = (
                  clima["wind_speed_10m"]
                  .rolling(horas, min_periods=1)
                  .max()
              )

          clima["lluvia_1mm"] = (
              clima["precipitation"] >= 1
          ).astype(int)

          clima["lluvia_10mm"] = (
              clima["precipitation"] >= 10
          ).astype(int)

          clima["rafaga_80"] = (
              clima["wind_gusts_10m"] >= 80
          ).astype(int)

          clima["rafaga_100"] = (
              clima["wind_gusts_10m"] >= 100
          ).astype(int)

          print()
          print("Construyendo dataset diario...")

          daily = clima.groupby("fecha").agg(

              temperatura_media=("temperature_2m", "mean"),
              temperatura_min=("temperature_2m", "min"),
              temperatura_max=("temperature_2m", "max"),

              humedad_media=("relative_humidity_2m", "mean"),
              humedad_min=("relative_humidity_2m", "min"),
              humedad_max=("relative_humidity_2m", "max"),

              punto_rocio_medio=("dew_point_2m", "mean"),
              punto_rocio_min=("dew_point_2m", "min"),
              punto_rocio_max=("dew_point_2m", "max"),

              presion_media=("pressure_msl", "mean"),
              presion_min=("pressure_msl", "min"),
              presion_max=("pressure_msl", "max"),

              precipitacion_total=("precipitation", "sum"),
              precipitacion_max_1h=("precipitation", "max"),

              viento_medio=("wind_speed_10m", "mean"),
              viento_max=("wind_speed_10m", "max"),

              rafaga_media=("wind_gusts_10m", "mean"),
              rafaga_max=("wind_gusts_10m", "max"),

              viento_u_medio=("viento_u", "mean"),
              viento_v_medio=("viento_v", "mean"),

              diferencia_rocio_media=(
                  "diferencia_temp_rocio",
                  "mean"
              ),

              lluvia_3h_max=("lluvia_3h", "max"),
              lluvia_6h_max=("lluvia_6h", "max"),
              lluvia_12h_max=("lluvia_12h", "max"),
              lluvia_24h_max=("lluvia_24h", "max"),

              rafaga_max_3h=("rafaga_max_3h", "max"),
              rafaga_max_6h=("rafaga_max_6h", "max"),
              rafaga_max_12h=("rafaga_max_12h", "max"),
              rafaga_max_24h=("rafaga_max_24h", "max"),

              viento_max_3h=("viento_max_3h", "max"),
              viento_max_6h=("viento_max_6h", "max"),
              viento_max_12h=("viento_max_12h", "max"),
              viento_max_24h=("viento_max_24h", "max"),

              cambio_presion_3h_min=(
                  "cambio_presion_3h",
                  "min"
              ),
              cambio_presion_6h_min=(
                  "cambio_presion_6h",
                  "min"
              ),
              cambio_presion_12h_min=(
                  "cambio_presion_12h",
                  "min"
              ),
              cambio_presion_24h_min=(
                  "cambio_presion_24h",
                  "min"
              ),
              cambio_presion_3h_max=(
                  "cambio_presion_3h",
                  "max"
              ),

              cambio_temp_6h_min=("cambio_temp_6h", "min"),
              cambio_temp_6h_max=("cambio_temp_6h", "max"),
              cambio_temp_12h_min=("cambio_temp_12h", "min"),
              cambio_temp_12h_max=("cambio_temp_12h", "max"),
              cambio_temp_24h_min=("cambio_temp_24h", "min"),
              cambio_temp_24h_max=("cambio_temp_24h", "max"),

              cambio_humedad_6h_min=(
                  "cambio_humedad_6h",
                  "min"
              ),
              cambio_humedad_6h_max=(
                  "cambio_humedad_6h",
                  "max"
              ),
              cambio_humedad_12h_min=(
                  "cambio_humedad_12h",
                  "min"
              ),
              cambio_humedad_12h_max=(
                  "cambio_humedad_12h",
                  "max"
              ),
              cambio_humedad_24h_min=(
                  "cambio_humedad_24h",
                  "min"
              ),
              cambio_humedad_24h_max=(
                  "cambio_humedad_24h",
                  "max"
              ),

              cambio_viento_6h_min=(
                  "cambio_viento_6h",
                  "min"
              ),
              cambio_viento_6h_max=(
                  "cambio_viento_6h",
                  "max"
              ),
              cambio_viento_12h_min=(
                  "cambio_viento_12h",
                  "min"
              ),
              cambio_viento_12h_max=(
                  "cambio_viento_12h",
                  "max"
              ),
              cambio_viento_24h_min=(
                  "cambio_viento_24h",
                  "min"
              ),
              cambio_viento_24h_max=(
                  "cambio_viento_24h",
                  "max"
              ),

              horas_lluvia_1mm=("lluvia_1mm", "sum"),
              horas_lluvia_10mm=("lluvia_10mm", "sum"),
              horas_rafaga_80=("rafaga_80", "sum"),
              horas_rafaga_100=("rafaga_100", "sum")

          ).reset_index()

          daily["temperatura_rango"] = (
              daily["temperatura_max"]
              - daily["temperatura_min"]
          )

          daily["humedad_rango"] = (
              daily["humedad_max"]
              - daily["humedad_min"]
          )

          daily["presion_rango"] = (
              daily["presion_max"]
              - daily["presion_min"]
          )

          daily = (
              daily
              .sort_values("fecha")
              .reset_index(drop=True)
          )

          daily["lluvia_3d"] = (
              daily["precipitacion_total"]
              .rolling(3, min_periods=1)
              .sum()
          )

          daily["lluvia_7d"] = (
              daily["precipitacion_total"]
              .rolling(7, min_periods=1)
              .sum()
          )

          daily["rafaga_max_3d"] = (
              daily["rafaga_max"]
              .rolling(3, min_periods=1)
              .max()
          )

          daily["rafaga_max_7d"] = (
              daily["rafaga_max"]
              .rolling(7, min_periods=1)
              .max()
          )

          daily["presion_media_3d"] = (
              daily["presion_media"]
              .rolling(3, min_periods=1)
              .mean()
          )

          daily["temperatura_media_3d"] = (
              daily["temperatura_media"]
              .rolling(3, min_periods=1)
              .mean()
          )

          daily["humedad_media_3d"] = (
              daily["humedad_media"]
              .rolling(3, min_periods=1)
              .mean()
          )

          daily["mes"] = daily["fecha"].dt.month

          daily["mes_sin"] = np.sin(
              2 * np.pi * daily["mes"] / 12
          )

          daily["mes_cos"] = np.cos(
              2 * np.pi * daily["mes"] / 12
          )

          periodo_clima = daily[
              (daily["fecha"] >= "1991-01-01")
              &
              (daily["fecha"] <= "2020-12-31")
          ].copy()

          climatologia = (
              periodo_clima
              .groupby("mes")
              .agg(
                  temp_clim_mean=(
                      "temperatura_media",
                      "mean"
                  ),
                  precip_clim_mean=(
                      "precipitacion_total",
                      "mean"
                  ),
                  presion_clim_mean=(
                      "presion_media",
                      "mean"
                  ),
                  humedad_clim_mean=(
                      "humedad_media",
                      "mean"
                  )
              )
              .reset_index()
          )

          daily = daily.merge(
              climatologia,
              on="mes",
              how="left"
          )

          daily["anomalia_temperatura"] = (
              daily["temperatura_media"]
              - daily["temp_clim_mean"]
          )

          daily["anomalia_precipitacion"] = (
              daily["precipitacion_total"]
              - daily["precip_clim_mean"]
          )

          daily["anomalia_presion"] = (
              daily["presion_media"]
              - daily["presion_clim_mean"]
          )

          daily["anomalia_humedad"] = (
              daily["humedad_media"]
              - daily["humedad_clim_mean"]
          )

          fechas_eventos = set(
              eventos["fecha"]
              .dt.normalize()
              .tolist()
          )

          daily["dia_severo"] = (
              daily["fecha"]
              .isin(fechas_eventos)
              .astype(int)
          )

          mapa_eventos = dict(
              zip(
                  eventos["fecha"].dt.normalize(),
                  eventos["evento"].astype(str)
              )
          )

          daily["evento_referencia"] = (
              daily["fecha"]
              .map(mapa_eventos)
              .fillna("")
          )

          total_dias = len(daily)

          dias_severos = int(
              daily["dia_severo"].sum()
          )

          dias_normales = int(
              (daily["dia_severo"] == 0).sum()
          )

          print()
          print("=" * 60)
          print("RESUMEN")
          print("=" * 60)

          print(
              f"Registros horarios utilizados: {len(clima):,}"
          )
          print(
              f"Dias construidos: {total_dias:,}"
          )
          print(
              f"Dias severos: {dias_severos}"
          )
          print(
              f"Dias normales: {dias_normales:,}"
          )

          if dias_severos != len(eventos):
              raise SystemExit(
                  "ERROR: los dias severos no coinciden "
                  "con los eventos catalogados."
              )

          features = [

              "temperatura_media",
              "temperatura_min",
              "temperatura_max",
              "temperatura_rango",

              "humedad_media",
              "humedad_min",
              "humedad_max",
              "humedad_rango",

              "punto_rocio_medio",
              "punto_rocio_min",
              "punto_rocio_max",
              "diferencia_rocio_media",

              "presion_media",
              "presion_min",
              "presion_max",
              "presion_rango",

              "precipitacion_total",
              "precipitacion_max_1h",

              "lluvia_3h_max",
              "lluvia_6h_max",
              "lluvia_12h_max",
              "lluvia_24h_max",

              "viento_medio",
              "viento_max",
              "rafaga_media",
              "rafaga_max",

              "viento_u_medio",
              "viento_v_medio",

              "rafaga_max_3h",
              "rafaga_max_6h",
              "rafaga_max_12h",
              "rafaga_max_24h",

              "viento_max_3h",
              "viento_max_6h",
              "viento_max_12h",
              "viento_max_24h",

              "cambio_presion_3h_min",
              "cambio_presion_6h_min",
              "cambio_presion_12h_min",
              "cambio_presion_24h_min",
              "cambio_presion_3h_max",

              "cambio_temp_6h_min",
              "cambio_temp_6h_max",
              "cambio_temp_12h_min",
              "cambio_temp_12h_max",
              "cambio_temp_24h_min",
              "cambio_temp_24h_max",

              "cambio_humedad_6h_min",
              "cambio_humedad_6h_max",
              "cambio_humedad_12h_min",
              "cambio_humedad_12h_max",
              "cambio_humedad_24h_min",
              "cambio_humedad_24h_max",

              "cambio_viento_6h_min",
              "cambio_viento_6h_max",
              "cambio_viento_12h_min",
              "cambio_viento_12h_max",
              "cambio_viento_24h_min",
              "cambio_viento_24h_max",

              "horas_lluvia_1mm",
              "horas_lluvia_10mm",

              "horas_rafaga_80",
              "horas_rafaga_100",

              "lluvia_3d",
              "lluvia_7d",

              "rafaga_max_3d",
              "rafaga_max_7d",

              "presion_media_3d",
              "temperatura_media_3d",
              "humedad_media_3d",

              "mes_sin",
              "mes_cos",

              "temp_clim_mean",
              "precip_clim_mean",
              "presion_clim_mean",
              "humedad_clim_mean",

              "anomalia_temperatura",
              "anomalia_precipitacion",
              "anomalia_presion",
              "anomalia_humedad"
          ]

          features = [
              columna
              for columna in features
              if columna in daily.columns
          ]

          if len(features) < 20:
              raise SystemExit(
                  "ERROR: se generaron muy pocas variables."
              )

          X = daily[features].copy()
          y = daily["dia_severo"].copy()

          X = X.replace(
              [np.inf, -np.inf],
              np.nan
          )

          for columna in X.columns:

              mediana = X[columna].median()

              if pd.isna(mediana):
                  mediana = 0

              X[columna] = X[columna].fillna(
                  mediana
              )

          print()
          print("=" * 60)
          print("VALIDACION CRUZADA")
          print("=" * 60)

          cv = StratifiedKFold(
              n_splits=5,
              shuffle=True,
              random_state=42
          )

          resultados = []

          oof_y = []
          oof_prob = []

          for numero_fold, (
              train_idx,
              test_idx
          ) in enumerate(
              cv.split(X, y),
              start=1
          ):

              X_train = X.iloc[train_idx]
              X_test = X.iloc[test_idx]

              y_train = y.iloc[train_idx]
              y_test = y.iloc[test_idx]

              modelo = RandomForestClassifier(
                  n_estimators=300,
                  max_depth=14,
                  min_samples_leaf=2,
                  max_features="sqrt",
                  class_weight="balanced_subsample",
                  random_state=42,
                  n_jobs=-1
              )

              modelo.fit(
                  X_train,
                  y_train
              )

              pred = modelo.predict(
                  X_test
              )

              prob = modelo.predict_proba(
                  X_test
              )[:, 1]

              oof_y.extend(
                  y_test.tolist()
              )

              oof_prob.extend(
                  prob.tolist()
              )

              precision = precision_score(
                  y_test,
                  pred,
                  zero_division=0
              )

              recall = recall_score(
                  y_test,
                  pred,
                  zero_division=0
              )

              f1 = f1_score(
                  y_test,
                  pred,
                  zero_division=0
              )

              auc = roc_auc_score(
                  y_test,
                  prob
              )

              matriz = confusion_matrix(
                  y_test,
                  pred
              )

              resultados.append({
                  "fold": numero_fold,
                  "precision": float(precision),
                  "recall": float(recall),
                  "f1": float(f1),
                  "roc_auc": float(auc),
                  "matriz_confusion": matriz.tolist()
              })

              print(
                  f"Fold {numero_fold}: "
                  f"precision={precision:.4f} "
                  f"recall={recall:.4f} "
                  f"F1={f1:.4f} "
                  f"ROC-AUC={auc:.4f}"
              )

          validacion = pd.DataFrame([
              {
                  "fold": r["fold"],
                  "precision": r["precision"],
                  "recall": r["recall"],
                  "f1": r["f1"],
                  "roc_auc": r["roc_auc"]
              }
              for r in resultados
          ])

          # ============================================================
          # ANALISIS DE UMBRALES
          # ============================================================

          print()
          print("=" * 60)
          print("ANALISIS DE UMBRALES")
          print("=" * 60)

          y_oof = np.asarray(
              oof_y,
              dtype=int
          )

          p_oof = np.asarray(
              oof_prob,
              dtype=float
          )

          filas_umbral = []

          for umbral in np.arange(
              0.01,
              1.00,
              0.01
          ):

              pred_umbral = (
                  p_oof >= umbral
              ).astype(int)

              tn, fp, fn, tp = confusion_matrix(
                  y_oof,
                  pred_umbral,
                  labels=[0, 1]
              ).ravel()

              precision_u = precision_score(
                  y_oof,
                  pred_umbral,
                  zero_division=0
              )

              recall_u = recall_score(
                  y_oof,
                  pred_umbral,
                  zero_division=0
              )

              f1_u = f1_score(
                  y_oof,
                  pred_umbral,
                  zero_division=0
              )

              beta = 2.0

              if (
                  precision_u + recall_u
              ) > 0:

                  f2_u = (
                      (1 + beta ** 2)
                      * precision_u
                      * recall_u
                      / (
                          beta ** 2
                          * precision_u
                          + recall_u
                      )
                  )

              else:

                  f2_u = 0.0

              fpr_u = (
                  fp / (fp + tn)
                  if (fp + tn) > 0
                  else 0.0
              )

              filas_umbral.append({
                  "umbral": float(umbral),
                  "precision": float(precision_u),
                  "recall": float(recall_u),
                  "f1": float(f1_u),
                  "f2": float(f2_u),
                  "fpr": float(fpr_u),
                  "verdaderos_positivos": int(tp),
                  "falsos_positivos": int(fp),
                  "falsos_negativos": int(fn),
                  "verdaderos_negativos": int(tn),
                  "dias_marcados": int(
                      pred_umbral.sum()
                  )
              })

          analisis_umbrales = pd.DataFrame(
              filas_umbral
          )

          analisis_umbrales.to_csv(
              "modelo/analisis_umbrales.csv",
              index=False
          )

          candidatos = analisis_umbrales[
              analisis_umbrales["recall"] >= 0.80
          ].copy()

          if candidatos.empty:

              candidatos = analisis_umbrales[
                  analisis_umbrales["recall"] >= 0.60
              ].copy()

          if candidatos.empty:

              candidatos = analisis_umbrales.copy()

          recomendado = (
              candidatos
              .sort_values(
                  [
                      "f2",
                      "recall",
                      "fpr",
                      "umbral"
                  ],
                  ascending=[
                      False,
                      False,
                      True,
                      False
                  ]
              )
              .iloc[0]
          )

          umbral_info = {

              "umbral_exploratorio":
                  float(
                      recomendado["umbral"]
                  ),

              "precision":
                  float(
                      recomendado["precision"]
                  ),

              "recall":
                  float(
                      recomendado["recall"]
                  ),

              "f1":
                  float(
                      recomendado["f1"]
                  ),

              "f2":
                  float(
                      recomendado["f2"]
                  ),

              "fpr":
                  float(
                      recomendado["fpr"]
                  ),

              "verdaderos_positivos":
                  int(
                      recomendado[
                          "verdaderos_positivos"
                      ]
                  ),

              "falsos_positivos":
                  int(
                      recomendado[
                          "falsos_positivos"
                      ]
                  ),

              "falsos_negativos":
                  int(
                      recomendado[
                          "falsos_negativos"
                      ]
                  ),

              "dias_marcados":
                  int(
                      recomendado[
                          "dias_marcados"
                      ]
                  ),

              "base":
                  "predicciones_out_of_fold",

              "finalidad":
                  "analisis_exploratorio_no_produccion"
          }

          with open(
              "modelo/umbral_operativo.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  umbral_info,
                  archivo,
                  indent=2,
                  ensure_ascii=False
              )

          print(
              f"Umbral exploratorio: "
              f"{umbral_info['umbral_exploratorio']:.2f}"
          )

          print(
              f"Precision: "
              f"{umbral_info['precision']:.4f}"
          )

          print(
              f"Recall: "
              f"{umbral_info['recall']:.4f}"
          )

          print(
              f"F1: "
              f"{umbral_info['f1']:.4f}"
          )

          print(
              f"F2: "
              f"{umbral_info['f2']:.4f}"
          )

          print(
              f"FPR: "
              f"{umbral_info['fpr']:.4f}"
          )

          print(
              f"TP: "
              f"{umbral_info['verdaderos_positivos']} | "
              f"FP: "
              f"{umbral_info['falsos_positivos']} | "
              f"FN: "
              f"{umbral_info['falsos_negativos']} | "
              f"Dias marcados: "
              f"{umbral_info['dias_marcados']}"
          )

          # ============================================================
          # MODELO FINAL
          # ============================================================

          print()
          print("=" * 60)
          print("ENTRENAMIENTO DEL MODELO FINAL")
          print("=" * 60)

          modelo_final = RandomForestClassifier(
              n_estimators=500,
              max_depth=14,
              min_samples_leaf=2,
              max_features="sqrt",
              class_weight="balanced_subsample",
              random_state=42,
              n_jobs=-1
          )

          modelo_final.fit(
              X,
              y
          )

          ruta_modelo = (
              "modelo/"
              "climaar_modelo_dia_severo.joblib"
          )

          joblib.dump(
              {
                  "modelo": modelo_final,
                  "features": features,
                  "tipo": "clasificador_dia_severo",
                  "version": "1.1"
              },
              ruta_modelo,
              compress=3
          )

          importancia = pd.DataFrame({
              "variable": features,
              "importancia":
                  modelo_final.feature_importances_
          })

          importancia = (
              importancia
              .sort_values(
                  "importancia",
                  ascending=False
              )
              .reset_index(drop=True)
          )

          importancia.to_csv(
              "modelo/importancia_variables.csv",
              index=False
          )

          validacion.to_csv(
              "modelo/validacion_diaria.csv",
              index=False
          )

          resumen = {

              "tipo_modelo":
                  "clasificador_dia_severo",

              "version":
                  "1.1",

              "registros_horarios_utilizados":
                  int(len(clima)),

              "dias_utilizados":
                  int(total_dias),

              "dias_severos":
                  int(dias_severos),

              "dias_normales":
                  int(dias_normales),

              "eventos_catalogados":
                  int(len(eventos)),

              "variables_modelo":
                  int(len(features)),

              "precision_media_cv":
                  float(
                      validacion[
                          "precision"
                      ].mean()
                  ),

              "recall_medio_cv":
                  float(
                      validacion[
                          "recall"
                      ].mean()
                  ),

              "f1_medio_cv":
                  float(
                      validacion[
                          "f1"
                      ].mean()
                  ),

              "roc_auc_medio_cv":
                  float(
                      validacion[
                          "roc_auc"
                      ].mean()
                  ),

              "hora_evento_utilizada":
                  False,

              "targets_artificiales_utilizados":
                  False,

              "unidad_entrenamiento":
                  "dia",

              "umbral_exploratorio":
                  float(
                      umbral_info[
                          "umbral_exploratorio"
                      ]
                  )
          }

          with open(
              "modelo/resumen_modelo.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  resumen,
                  archivo,
                  indent=2,
                  ensure_ascii=False
              )

          configuracion = {

              "modelo":
                  "RandomForestClassifier",

              "n_estimators":
                  500,

              "max_depth":
                  14,

              "min_samples_leaf":
                  2,

              "max_features":
                  "sqrt",

              "class_weight":
                  "balanced_subsample",

              "random_state":
                  42,

              "unidad":
                  "dia",

              "features":
                  features,

              "umbral_exploratorio":
                  float(
                      umbral_info[
                          "umbral_exploratorio"
                      ]
                  )
          }

          with open(
              "modelo/configuracion_modelo.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  configuracion,
                  archivo,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              "modelo/metricas.txt",
              "w",
              encoding="utf-8"
          ) as archivo:

              archivo.write(
                  "CLIMAAR - MODELO DIARIO DE EVENTOS SEVEROS\n"
              )

              archivo.write(
                  "============================================\n\n"
              )

              archivo.write(
                  json.dumps(
                      resumen,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              archivo.write(
                  "\n\nVALIDACION\n"
              )

              archivo.write(
                  validacion.to_string(
                      index=False
                  )
              )

              archivo.write(
                  "\n\nANALISIS DE UMBRAL\n"
              )

              archivo.write(
                  json.dumps(
                      umbral_info,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              archivo.write(
                  "\n\nVARIABLES MAS IMPORTANTES\n"
              )

              archivo.write(
                  importancia.head(30).to_string(
                      index=False
                  )
              )

          columnas_a_guardar = [
              "fecha",
              "dia_severo",
              "evento_referencia"
          ] + features

          daily[columnas_a_guardar].to_csv(
              "modelo/dataset_diario_entrenamiento.csv",
              index=False
          )

          # ============================================================
          # CONTROL DE TAMANO
          # ============================================================

          print()
          print("=" * 60)
          print("CONTROL DE TAMANO")
          print("=" * 60)

          archivos_repo = [

              "modelo/climaar_modelo_dia_severo.joblib",

              "modelo/importancia_variables.csv",

              "modelo/validacion_diaria.csv",

              "modelo/resumen_modelo.json",

              "modelo/configuracion_modelo.json",

              "modelo/metricas.txt",

              "modelo/analisis_umbrales.csv",

              "modelo/umbral_operativo.json"
          ]

          for archivo in archivos_repo:

              if not os.path.exists(archivo):
                  raise SystemExit(
                      f"ERROR: falta {archivo}"
                  )

              tamano = os.path.getsize(
                  archivo
              )

              print(
                  f"{archivo}: "
                  f"{tamano / 1024 / 1024:.2f} MB"
              )

              if tamano >= (
                  90 * 1024 * 1024
              ):

                  raise SystemExit(
                      f"ERROR: {archivo} "
                      f"supera 90 MB."
                  )

          print()
          print(
              "OK: ningun archivo del repositorio "
              "supera 90 MB."
          )

          print()
          print("=" * 60)
          print("ENTRENAMIENTO TERMINADO")
          print("=" * 60)

          print(
              f"Registros horarios: "
              f"{len(clima):,}"
          )

          print(
              f"Dias entrenados: "
              f"{total_dias:,}"
          )

          print(
              f"Dias severos: "
              f"{dias_severos}"
          )

          print(
              f"Dias normales: "
              f"{dias_normales:,}"
          )

          print(
              f"Variables: "
              f"{len(features)}"
          )

          print(
              f"ROC-AUC medio: "
              f"{validacion['roc_auc'].mean():.4f}"
          )

          print(
              f"Recall medio: "
              f"{validacion['recall'].mean():.4f}"
          )

          print(
              f"F1 medio: "
              f"{validacion['f1'].mean():.4f}"
          )

          print(
              f"Umbral exploratorio: "
              f"{umbral_info['umbral_exploratorio']:.2f}"
          )

          print(
              f"Modelo: "
              f"{ruta_modelo}"
          )

          PY

      - name: Verificar resultados
        run: |
          echo "=============================================="
          echo "ARCHIVOS GENERADOS"
          echo "=============================================="

          ls -lh modelo/

          echo ""
          echo "=============================================="
          echo "RESUMEN"
          echo "=============================================="

          cat modelo/resumen_modelo.json

          echo ""
          echo "=============================================="
          echo "UMBRAL EXPLORATORIO"
          echo "=============================================="

          cat modelo/umbral_operativo.json

          echo ""
          echo "=============================================="
          echo "VARIABLES MAS IMPORTANTES"
          echo "=============================================="

          head -31 modelo/importancia_variables.csv

      - name: Subir resultados como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: climaar-modelo-diario-completo
          path: |
            modelo/climaar_modelo_dia_severo.joblib
            modelo/validacion_diaria.csv
            modelo/importancia_variables.csv
            modelo/resumen_modelo.json
            modelo/configuracion_modelo.json
            modelo/metricas.txt
            modelo/analisis_umbrales.csv
            modelo/umbral_operativo.json
            modelo/dataset_diario_entrenamiento.csv
          retention-days: 30

      - name: Guardar resultados en GitHub
        run: |
          git config user.name "climaar-bot"
          git config user.email "bot@climaar.com.ar"

          git add \
            modelo/climaar_modelo_dia_severo.joblib \
            modelo/validacion_diaria.csv \
            modelo/importancia_variables.csv \
            modelo/resumen_modelo.json \
            modelo/configuracion_modelo.json \
            modelo/metricas.txt \
            modelo/analisis_umbrales.csv \
            modelo/umbral_operativo.json

          git diff --cached --quiet || git commit \
            -m "Analisis de umbral modelo diario ClimaAR"

          git push
