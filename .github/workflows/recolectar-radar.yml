name: Recolectar radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: recolector-radar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: python -m pip install --quiet requests pillow

      - name: Recolectar radar
        run: |
          python - <<'PY'
          import csv
          import io
          from pathlib import Path
          from datetime import datetime, timezone

          import requests
          from PIL import Image

          API_URL = "https://api.rainviewer.com/public/weather-maps.json"
          COLORS_URL = "https://www.rainviewer.com/files/rainviewer_api_colors_table.csv"

          LAT = -38.7196
          LON = -62.2724

          OUT = Path("data/radar/radar_features.csv")
          OUT.parent.mkdir(parents=True, exist_ok=True)

          session = requests.Session()

          print("Consultando RainViewer...")

          response = session.get(API_URL, timeout=30)
          response.raise_for_status()

          data = response.json()

          frames = data.get("radar", {}).get("past", [])

          if not frames:
              raise SystemExit("No hay frames de radar disponibles")

          host = data["host"]

          print("Frames disponibles:", len(frames))

          print("Descargando tabla Universal Blue...")

          colors_response = session.get(COLORS_URL, timeout=30)
          colors_response.raise_for_status()

          color_map = {}

          reader = csv.reader(
              io.StringIO(colors_response.text)
          )

          next(reader, None)

          for row in reader:
              if len(row) < 4:
                  continue

              dbz_text = row[0].strip()
              rgba_text = row[3].strip().lstrip("#")

              if not dbz_text or not rgba_text:
                  continue

              try:
                  dbz = int(dbz_text)
                  rgba = bytes.fromhex(rgba_text)
              except ValueError:
                  continue

              # La tabla tiene una sección de lluvia
              # y después una sección de nieve.
              # El segundo -32 marca el comienzo de nieve.
              if dbz == -32 and color_map:
                  break

              # Transparente = ausencia de precipitación visible.
              # No se agrega al mapa de colores.
              if len(rgba) != 4 or rgba[3] == 0:
                  continue

              color_map[rgba] = dbz

          if not color_map:
              raise SystemExit(
                  "No se pudo cargar la tabla Universal Blue"
              )

          print(
              "Colores Universal Blue cargados:",
              len(color_map)
          )

          historico = []
          existing = set()

          if OUT.exists():
              with OUT.open(
                  "r",
                  encoding="utf-8",
                  newline=""
              ) as f:

                  for row in csv.DictReader(f):

                      if not row.get("frame_time"):
                          continue

                      historico.append(row)
                      existing.add(row["frame_time"])

          nuevos = []

          for frame in frames:

              frame_time = str(frame["time"])

              if frame_time in existing:
                  continue

              path = frame["path"]

              image_url = (
                  f"{host}{path}/512/7/"
                  f"{LAT}/{LON}/2/0_0.png"
              )

              print(
                  "Descargando frame:",
                  frame_time
              )

              img_response = session.get(
                  image_url,
                  timeout=30
              )

              img_response.raise_for_status()

              image = Image.open(
                  io.BytesIO(img_response.content)
              ).convert("RGBA")

              width, height = image.size
              pixels = image.load()

              valid_pixels = 0
              sum_dbz = 0.0
              max_dbz = None

              pixels_ge_10 = 0
              pixels_ge_20 = 0
              pixels_ge_30 = 0
              pixels_ge_40 = 0

              centroid_x = 0.0
              centroid_y = 0.0
              centroid_count = 0

              for y in range(height):
                  for x in range(width):

                      rgba = bytes(pixels[x, y])

                      dbz = color_map.get(rgba)

                      if dbz is None:
                          continue

                      valid_pixels += 1
                      sum_dbz += dbz

                      if max_dbz is None or dbz > max_dbz:
                          max_dbz = dbz

                      if dbz >= 10:
                          pixels_ge_10 += 1

                      if dbz >= 20:
                          pixels_ge_20 += 1
                          centroid_x += x
                          centroid_y += y
                          centroid_count += 1

                      if dbz >= 30:
                          pixels_ge_30 += 1

                      if dbz >= 40:
                          pixels_ge_40 += 1

              # IMPORTANTE:
              # Un frame completamente transparente no es un error.
              # Significa que no hay precipitación visible en el área.
              # Lo conservamos para mantener continuidad temporal.
              if valid_pixels == 0:
                  print(
                      "Frame sin precipitación visible:",
                      frame_time
                  )

                  mean_dbz = 0.0
                  max_dbz = 0

              else:
                  mean_dbz = round(
                      sum_dbz / valid_pixels,
                      3
                  )

                  if max_dbz == -11:
                      raise SystemExit(
                          "Error: la decodificación produjo -11 dBZ"
                      )

              if centroid_count:
                  center_x = centroid_x / centroid_count
                  center_y = centroid_y / centroid_count
              else:
                  center_x = ""
                  center_y = ""

              frame_utc = datetime.fromtimestamp(
                  int(frame_time),
                  tz=timezone.utc
              ).isoformat()

              generated_utc = datetime.now(
                  timezone.utc
              ).isoformat()

              nuevos.append({
                  "frame_time": frame_time,
                  "frame_utc": frame_utc,
                  "generated_utc": generated_utc,
                  "image_url": image_url,
                  "width": width,
                  "height": height,
                  "valid_pixels": valid_pixels,
                  "mean_dbz": mean_dbz,
                  "max_dbz": max_dbz,
                  "pixels_ge_10dbz": pixels_ge_10,
                  "pixels_ge_20dbz": pixels_ge_20,
                  "pixels_ge_30dbz": pixels_ge_30,
                  "pixels_ge_40dbz": pixels_ge_40,
                  "centroid_x_ge_20dbz": (
                      round(center_x, 3)
                      if center_x != ""
                      else ""
                  ),
                  "centroid_y_ge_20dbz": (
                      round(center_y, 3)
                      if center_y != ""
                      else ""
                  )
              })

          fields = [
              "frame_time",
              "frame_utc",
              "generated_utc",
              "image_url",
              "width",
              "height",
              "valid_pixels",
              "mean_dbz",
              "max_dbz",
              "pixels_ge_10dbz",
              "pixels_ge_20dbz",
              "pixels_ge_30dbz",
              "pixels_ge_40dbz",
              "centroid_x_ge_20dbz",
              "centroid_y_ge_20dbz"
          ]

          todo = historico + nuevos

          todo.sort(
              key=lambda row: int(row["frame_time"])
          )

          with OUT.open(
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()
              writer.writerows(todo)

          print("")
          print("==============================")
          print("RADAR RECOLECTADO CORRECTAMENTE")
          print("Nuevos frames:", len(nuevos))
          print("Total histórico:", len(todo))
          print("Archivo:", OUT)
          print("==============================")
          PY

      - name: Guardar histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/radar/radar_features.csv

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Recolectar histórico de radar"
          git push
