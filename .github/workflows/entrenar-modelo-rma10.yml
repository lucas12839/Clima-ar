name: ClimaAR Entrenamiento Modelo RMA10

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climaar-modelos-rma10
  cancel-in-progress: false

jobs:
  entrenamiento-rma10:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            modelo \
            data/radar \
            data/radar/historico \
            data/radar/seguimiento \
            logs

      - name: Verificar dataset RMA10
        run: |
          set -euo pipefail

          encontrados=0

          for archivo in \
            data/radar/radar_features_rma10.csv \
            data/radar/seguimiento/radar_features_rma10.csv \
            data/radar/historico/radar_features_rma10.csv
          do
            if [ -s "$archivo" ]; then
              echo "Dataset RMA10 encontrado: $archivo"
              echo "DATASET=$archivo" >> "$GITHUB_ENV"
              encontrados=$((encontrados + 1))
              break
            fi
          done

          if [ "$encontrados" -eq 0 ]; then
            echo "ERROR: no se encontró un dataset RMA10 válido."
            exit 1
          fi

      - name: Buscar entrenador RMA10
        run: |
          set -euo pipefail

          candidatos=(
            scripts/entrenar_modelo_rma10.py
            scripts/entrenamiento_rma10.py
            scripts/entrenar_rma10.py
          )

          for archivo in "${candidatos[@]}"; do
            if [ -f "$archivo" ]; then
              echo "ENTRENADOR=$archivo" >> "$GITHUB_ENV"
              echo "Entrenador seleccionado: $archivo"
              exit 0
            fi
          done

          echo "ERROR: no se encontró el entrenador RMA10."
          exit 1

      - name: Entrenar modelo RMA10
        run: |
          set -euo pipefail

          python "$ENTRENADOR"

      - name: Verificar archivos generados
        run: |
          set -euo pipefail

          encontrados=0

          while IFS= read -r -d '' archivo; do
            echo "Archivo generado: $archivo"
            encontrados=$((encontrados + 1))
          done < <(
            find modelo \
              -type f \
              \( \
                -name "*.joblib" \
                -o -name "*.pkl" \
                -o -name "*.json" \
              \) \
              -print0
          )

          if [ "$encontrados" -eq 0 ]; then
            echo "ERROR: el entrenamiento RMA10 no generó modelos."
            exit 1
          fi

          echo "Archivos generados: $encontrados"

      - name: Validar modelo RMA10
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import pickle
          from pathlib import Path

          try:
              import joblib
          except ImportError:
              joblib = None

          modelos = []

          for path in Path("modelo").rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix == ".json":
                  try:
                      data = json.loads(
                          path.read_text(
                              encoding="utf-8"
                          )
                      )
                  except Exception as exc:
                      raise SystemExit(
                          f"ERROR: JSON inválido: {path}: {exc}"
                      ) from exc

                  if not isinstance(data, (dict, list)):
                      raise SystemExit(
                          f"ERROR: estructura JSON inválida: {path}"
                      )

                  print(f"OK JSON: {path}")
                  modelos.append(path)

              elif path.suffix in {".joblib", ".pkl"}:
                  try:
                      if path.suffix == ".joblib" and joblib:
                          objeto = joblib.load(path)
                      else:
                          with path.open("rb") as archivo:
                              objeto = pickle.load(archivo)
                  except Exception as exc:
                      raise SystemExit(
                          f"ERROR: modelo corrupto: {path}: {exc}"
                      ) from exc

                  if objeto is None:
                      raise SystemExit(
                          f"ERROR: modelo vacío: {path}"
                      )

                  print(f"OK modelo: {path}")
                  modelos.append(path)

          if not modelos:
              raise SystemExit(
                  "ERROR: no se validó ningún archivo del modelo RMA10."
              )

          print(
              f"Archivos RMA10 válidos: {len(modelos)}"
          )
          PY

      - name: Validar integridad ClimaAR
        run: |
          set -euo pipefail

          test -f scripts/validar_integridad_climaar.py

          python scripts/validar_integridad_climaar.py

      - name: Publicar artefacto RMA10
        uses: actions/upload-artifact@v4
        with:
          name: climaar-modelo-rma10
          path: modelo/
          retention-days: 30

      - name: Persistir modelo RMA10
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add modelo/

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: actualizar modelo RMA10"

          for intento in 1 2 3; do
            echo "Intento de sincronización: $intento"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true

              if [ "$intento" -eq 3 ]; then
                echo "ERROR: rebase falló definitivamente."
                exit 1
              fi

              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push exitoso."
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              echo "ERROR: push falló definitivamente."
              exit 1
            fi

            sleep 2
          done
