name: Entrenar modelo RMA10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Verificar dataset
        run: |
          test -f data/radar/rma10_dataset_historico.csv
          python - <<'PY'
          import pandas as pd
          p = "data/radar/rma10_dataset_historico.csv"
          df = pd.read_csv(p)
          print("Filas:", len(df))
          print("Tracks:", df["track_id"].nunique())
          print("Horizontes:", sorted(df["horizonte_min"].unique()))
          PY

      - name: Entrenar modelo RMA10
        run: |
          python scripts/entrenar_modelo_rma10.py

      - name: Verificar modelo
        run: |
          test -f data/models/rma10_model.joblib
          test -f data/models/rma10_model_metrics.json
          cat data/models/rma10_model_metrics.json

      - name: Guardar modelo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models/rma10_model.joblib
          git add data/models/rma10_model_metrics.json
          git diff --cached --quiet || git commit -m "Entrenar modelo RMA10"
          git push
