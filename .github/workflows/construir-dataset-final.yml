name: ClimaAR - Construir Dataset Final

on:
  workflow_dispatch:

jobs:
  construir-dataset:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Verificar archivos necesarios
        run: |
          echo "=== ARCHIVOS HISTORICOS ==="
          ls -lh data/historico/
          echo ""
          echo "=== SCRIPT ==="
          ls -lh scripts/build_dataset_final.py

      - name: Construir dataset final
        run: |
          python scripts/build_dataset_final.py

      - name: Verificar resultados
        run: |
          echo "=== RESULTADOS ==="
          ls -lh data/final/
          echo ""
          echo "=== RESUMEN ==="
          cat data/final/resumen_dataset_final.csv

      - name: Subir dataset grande como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: climaar-dataset-final-1980-2026
          path: data/final/climaar_dataset_completo_1980_2026.csv
          compression-level: 0
          retention-days: 30

      - name: Guardar archivos pequeños en GitHub
        run: |
          git config user.name "climaar-bot"
          git config user.email "bot@climaar.com.ar"

          git add data/final/resumen_dataset_final.csv
          git add data/final/catalogo_historico_documental.csv

          git diff --cached --quiet || git commit -m "Guardar resultados dataset final ClimaAR"

          git push
