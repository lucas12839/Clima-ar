name: Radar ClimaAR Legal

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:

  radar:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Bajar código

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      - name: Python

        uses: actions/setup-python@v5

        with:
          python-version: '3.11'


      - name: Instalar librerías

        run: |

          python -m pip install --upgrade pip

          pip install \
            requests \
            Pillow \
            numpy \
            opencv-python-headless


      # ======================================================
      # RESPALDAR HISTORIAL ANTERIOR
      # ======================================================

      - name: Respaldar features anteriores

        run: |

          if [ -s data/radar/radar_features_rainviewer.csv ]; then

            cp \
              data/radar/radar_features_rainviewer.csv \
              /tmp/radar_features_previous.csv

            echo "Historial anterior respaldado."

          else

            echo "No existe historial anterior."

            rm -f \
              /tmp/radar_features_previous.csv

          fi


      # ======================================================
      # RADAR
      # ======================================================

      - name: Procesar radar V7

        run: |

          python \
            scripts/radar_rainviewer.py


      # ======================================================
      # ACUMULAR HISTORIAL
      # ======================================================

      - name: Acumular features radar

        run: |

          python \
            scripts/acumular_features_radar.py \
            /tmp/radar_features_previous.csv


      # ======================================================
      # VERIFICACIÓN
      # ======================================================

      - name: Verificar archivos V7

        run: |

          set -e

          test -s \
            data/radar/radar_nowcast.json

          test -s \
            data/radar/radar_features_rainviewer.csv

          python -m json.tool \
            data/radar/radar_nowcast.json \
            >/dev/null

          echo ""
          echo "================================"
          echo "RADAR V7 OK"
          echo "================================"

          echo ""

          echo "Cantidad de frames acumulados:"

          tail -n +2 \
            data/radar/radar_features_rainviewer.csv \
            | wc -l


      # ======================================================
      # GUARDAR RESULTADOS
      # ======================================================

      - name: Guardar resultados V7

        run: |

          set -e

          git config \
            user.name \
            "climaar-bot"

          git config \
            user.email \
            "bot@climaar.com.ar"


          git add \
            data/radar/radar_nowcast.json \
            data/radar/radar_features_rainviewer.csv \
            data/radar/historico/


          if git diff --cached --quiet; then

            echo "Sin cambios V7."

            exit 0

          fi


          git commit \
            -m "radar V7 nowcast"


          # ==================================================
          # REINTENTAR SI OTRO WORKFLOW MODIFICÓ MAIN
          # ==================================================

          for intento in 1 2 3 4 5; do

            echo ""
            echo "Intento de push: $intento"

            git fetch origin main

            if git rebase origin/main; then

              if git push origin HEAD:main; then

                echo ""
                echo "Push V7 correcto."

                exit 0

              fi

            else

              echo "Rebase con conflicto."

              git rebase --abort || true

            fi

            echo ""
            echo "Otro workflow modificó main."
            echo "Esperando..."

            sleep 10

          done


          echo ""
          echo "No se pudo subir V7 después de 5 intentos."

          exit 1
