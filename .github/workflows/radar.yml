name: Radar RainViewer Manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          pip install -r requirements.txt

      - name: Radar
        run: |
          python scripts/radar_rainviewer.py

      - name: Validar CSV
        run: |
          python - <<'PY'
          import csv

          path = "data/radar/radar_features_rainviewer.csv"

          with open(
              path,
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.reader(f)

              header = next(reader)

              assert len(header) == 21, (
                  f"Header inválido: {len(header)}"
              )

              for n, row in enumerate(
                  reader,
                  start=2
              ):
                  if row:
                      assert len(row) == 21, (
                          f"Línea {n}: {len(row)} columnas"
                      )

          print("CSV CORRECTO")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/radar

          git diff --cached --quiet || \
            git commit -m "Radar RainViewer actualizado"

          git push
