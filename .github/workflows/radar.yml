name: Radar ClimaAR Manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  radar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow numpy opencv-python-headless pandas

      - name: Procesar radar
        run: |
          python scripts/radar_rainviewer.py

      - name: Verificar
        run: |
          test -s data/radar/actual.png
          test -s data/radar/radar_nowcast.json
          test -s data/radar/radar_features_rainviewer.csv

          python -m json.tool \
            data/radar/radar_nowcast.json \
            >/dev/null

          echo "RADAR OK"

          echo "Frames:"
          find data/radar/historico \
            -name "radar_*.png" \
            | wc -l

          echo "Features:"
          wc -l \
            data/radar/radar_features_rainviewer.csv

      - name: Guardar
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/radar/

          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit \
              -m "radar: actualización manual"

            git push origin main
          fi
