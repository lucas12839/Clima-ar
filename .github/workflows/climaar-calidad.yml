name: ClimaAR Calidad

on:
  workflow_run:
    workflows:
      - "ClimaAR Intelligence Central"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxis Python
        run: |
          set -e
          python -m compileall -q .
          echo "Sintaxis Python OK."

      - name: Verificar archivos operativos
        run: |
          set -e
          archivos=(
            "data/radar/radar_timestamp.txt"
            "data/radar/radar_nowcast.json"
            "data/radar/resultado_procesamiento.json"
            "data/radar/seguimiento/seguimiento_temporal.json"
            "data/radar/seguimiento/prediccion_ml_rma10.json"
            "data/radar/seguimiento/prediccion_evolucion.json"
            "data/ia/estado_meteorologico.json"
            "data/ia/inteligencia_tormenta.json"
            "data/ia/resultado_final.json"
          )

          for archivo in "${archivos[@]}"; do
            if [ ! -s "$archivo" ]; then
              echo "ERROR: falta archivo operativo: $archivo"
              exit 1
            fi
            echo "OK: $archivo"
          done

      - name: Verificar JSON operativos
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          archivos = [
              "data/radar/radar_nowcast.json",
              "data/radar/resultado_procesamiento.json",
              "data/radar/seguimiento/seguimiento_temporal.json",
              "data/radar/seguimiento/prediccion_ml_rma10.json",
              "data/radar/seguimiento/prediccion_evolucion.json",
              "data/ia/estado_meteorologico.json",
              "data/ia/inteligencia_tormenta.json",
              "data/ia/resultado_final.json",
          ]

          for archivo in archivos:
              datos = json.loads(
                  Path(archivo).read_text(encoding="utf-8")
              )
              if not isinstance(datos, dict):
                  raise SystemExit(
                      f"ERROR: {archivo} no contiene un objeto JSON."
                  )
              print(f"JSON OK: {archivo}")
          PY

      - name: Verificar sincronización Radar Nowcast ML
        run: |
          set -e
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_utc(value, nombre):
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(
                      f"ERROR: {nombre} no tiene timestamp."
                  )
              text = value.strip()
              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(text)
              except ValueError as exc:
                  raise SystemExit(
                      f"ERROR: {nombre} tiene timestamp inválido: {value}"
                  ) from exc
              if dt.tzinfo is None:
                  raise SystemExit(
                      f"ERROR: {nombre} no tiene zona horaria: {value}"
                  )
              return dt.astimezone(timezone.utc)

          radar_raw = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(encoding="utf-8").strip()

          nowcast = json.loads(
              Path("data/radar/radar_nowcast.json").read_text(
                  encoding="utf-8"
              )
          )

          ml = json.loads(
              Path(
                  "data/radar/seguimiento/prediccion_ml_rma10.json"
              ).read_text(encoding="utf-8")
          )

          if ml.get("ok") is not True:
              raise SystemExit(
                  "ERROR: ML RMA10 no está marcado como válido."
              )

          bloque_nowcast = nowcast.get("nowcast")
          if not isinstance(bloque_nowcast, dict):
              raise SystemExit(
                  "ERROR: radar_nowcast.json no contiene el bloque nowcast."
              )

          radar_ts = parse_utc(radar_raw, "Radar")
          nowcast_ts = parse_utc(
              bloque_nowcast.get("frame_actual_utc"),
              "Nowcast",
          )
          ml_ts = parse_utc(
              ml.get("frame_radar"),
              "ML RMA10",
          )

          print("===== SINCRONIZACIÓN CLIMAAR =====")
          print("Radar:", radar_ts.isoformat())
          print("Nowcast:", nowcast_ts.isoformat())
          print("ML RMA10:", ml_ts.isoformat())

          if not (radar_ts == nowcast_ts == ml_ts):
              raise SystemExit(
                  "ERROR: Radar, Nowcast y ML no corresponden al mismo frame."
              )

          print("Sincronización estricta OK.")
          PY

      - name: Verificar predicción ML
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          datos = json.loads(
              Path(
                  "data/radar/seguimiento/prediccion_ml_rma10.json"
              ).read_text(encoding="utf-8")
          )

          if datos.get("ok") is not True:
              raise SystemExit("ERROR: predicción ML no válida.")

          tracks = datos.get("tracks_analizados", 0)
          predicciones = datos.get("predicciones", [])

          if not isinstance(tracks, int) or tracks < 0:
              raise SystemExit("ERROR: tracks_analizados inválido.")

          if not isinstance(predicciones, list):
              raise SystemExit("ERROR: predicciones ML inválidas.")

          if tracks != len(predicciones):
              raise SystemExit(
                  "ERROR: tracks_analizados no coincide con predicciones."
              )

          print("ML OK:", tracks, "tracks.")
          PY

      - name: Calcular riesgo severo
        run: |
          set -e
          python scripts/riesgo_severo_climaar.py

      - name: Verificar riesgo severo
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          ruta = Path("data/ia/riesgo_severo.json")
          if not ruta.is_file():
              raise SystemExit(
                  "ERROR: no se generó riesgo_severo.json"
              )

          datos = json.loads(
              ruta.read_text(encoding="utf-8")
          )

          if not isinstance(datos, dict):
              raise SystemExit(
                  "ERROR: riesgo_severo.json inválido."
              )

          if "indice_severo" not in datos:
              raise SystemExit(
                  "ERROR: falta indice_severo."
              )

          print("Riesgo severo OK.")
          print("Índice:", datos.get("indice_severo"))
          print("Método:", datos.get("metodo"))
          PY

      - name: Verificar predicción de evolución
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          datos = json.loads(
              Path(
                  "data/radar/seguimiento/prediccion_evolucion.json"
              ).read_text(encoding="utf-8")
          )

          if not isinstance(datos.get("nucleos", []), list):
              raise SystemExit("ERROR: nucleos inválido.")

          if not isinstance(
              datos.get("predicciones_pendientes", []),
              list,
          ):
              raise SystemExit(
                  "ERROR: predicciones_pendientes inválido."
              )

          print("Predicción de evolución OK.")
          print("Núcleos:", len(datos.get("nucleos", [])))
          print(
              "Validaciones:",
              datos.get("validaciones_count", 0),
          )
          PY

      - name: Resultado final
        run: |
          echo "======================================"
          echo "       CLIMAAR CONTROL DE CALIDAD"
          echo "======================================"
          echo "Sintaxis Python: OK"
          echo "Archivos operativos: OK"
          echo "JSON operativos: OK"
          echo "Sincronización Radar/Nowcast/ML: OK"
          echo "ML: OK"
          echo "Riesgo severo: OK"
          echo "Predicción evolución: OK"
          echo "======================================"
