name: ClimaAR Calidad

on:
  workflow_run:
    workflows:
      - "ClimaAR Intelligence Central"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxis Python
        run: |
          set -euo pipefail
          python -m compileall -q .

      - name: Verificar archivos operativos
        run: |
          set -euo pipefail

          archivos=(
            "data/radar/radar_timestamp.txt"
            "data/radar/radar_nowcast.json"
            "data/radar/resultado_procesamiento.json"
            "data/radar/seguimiento/seguimiento_temporal.json"
            "data/radar/seguimiento/prediccion_ml_rma10.json"
            "data/radar/seguimiento/prediccion_evolucion.json"
            "data/ia/estado_meteorologico.json"
            "data/ia/inteligencia_tormenta.json"
            "data/ia/resultado_final.json"
          )

          for archivo in "${archivos[@]}"; do
            test -s "$archivo" || {
              echo "Falta o está vacío: $archivo"
              exit 1
            }
          done

      - name: Verificar JSON operativos
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          archivos = [
              "data/radar/radar_nowcast.json",
              "data/radar/resultado_procesamiento.json",
              "data/radar/seguimiento/seguimiento_temporal.json",
              "data/radar/seguimiento/prediccion_ml_rma10.json",
              "data/radar/seguimiento/prediccion_evolucion.json",
              "data/ia/estado_meteorologico.json",
              "data/ia/inteligencia_tormenta.json",
              "data/ia/resultado_final.json",
          ]

          for archivo in archivos:
              datos = json.loads(
                  Path(archivo).read_text(encoding="utf-8")
              )

              if not isinstance(datos, dict):
                  raise SystemExit(
                      f"{archivo}: no es un objeto JSON"
                  )

          print("JSON operativos OK")
          PY

      - name: Verificar sincronización Radar Nowcast ML
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_utc(value, nombre):
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(
                      f"ERROR: {nombre} inválido: {value!r}"
                  )

              text = value.strip()

              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              try:
                  dt = datetime.fromisoformat(text)
              except ValueError as exc:
                  raise SystemExit(
                      f"ERROR: {nombre} inválido: {value!r}"
                  ) from exc

              if dt.tzinfo is None:
                  raise SystemExit(
                      f"ERROR: {nombre} sin zona horaria: {value!r}"
                  )

              return dt.astimezone(timezone.utc)

          radar = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          nowcast = json.loads(
              Path(
                  "data/radar/radar_nowcast.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          nowcast_data = nowcast.get("nowcast", {})

          ml = json.loads(
              Path(
                  "data/radar/seguimiento/prediccion_ml_rma10.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          radar_dt = parse_utc(
              radar,
              "radar_timestamp"
          )

          nowcast_dt = parse_utc(
              nowcast_data.get("frame_actual_utc"),
              "nowcast.frame_actual_utc"
          )

          ml_dt = parse_utc(
              ml.get("frame_radar"),
              "ML.frame_radar"
          )

          if nowcast_dt != radar_dt:
              raise SystemExit(
                  "ERROR: Nowcast desincronizado: "
                  f"{nowcast_dt.isoformat()} != "
                  f"{radar_dt.isoformat()}"
              )

          if ml_dt != radar_dt:
              raise SystemExit(
                  "ERROR: ML desincronizado: "
                  f"{ml_dt.isoformat()} != "
                  f"{radar_dt.isoformat()}"
              )

          if ml.get("ok") is not True:
              raise SystemExit(
                  "ERROR: ML no válido"
              )

          print(
              "Radar:",
              radar_dt.isoformat()
          )

          print(
              "Nowcast:",
              nowcast_dt.isoformat()
          )

          print(
              "ML:",
              ml_dt.isoformat()
          )

          print(
              "Radar / Nowcast / ML sincronizados"
          )
          PY

      - name: Validar integridad completa de ClimaAR
        run: |
          set -euo pipefail
          python scripts/validar_integridad_climaar.py

      - name: Calcular riesgo severo
        run: |
          set -euo pipefail

          python scripts/riesgo_severo_climaar.py

      - name: Verificar riesgo severo
        run: |
          set -euo pipefail

          test -s data/ia/riesgo_severo.json

          python - <<'PY'
          import json
          from pathlib import Path

          datos = json.loads(
              Path(
                  "data/ia/riesgo_severo.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(datos, dict):
              raise SystemExit(
                  "riesgo_severo.json no es un objeto"
              )

          if "indice_severo" not in datos:
              raise SystemExit(
                  "Falta indice_severo"
              )

          print("Riesgo severo OK")
          PY

      - name: Verificar evolución
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          datos = json.loads(
              Path(
                  "data/radar/seguimiento/prediccion_evolucion.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(
              datos.get("nucleos", []),
              list
          ):
              raise SystemExit(
                  "nucleos inválido"
              )

          if not isinstance(
              datos.get("predicciones_pendientes", []),
              list
          ):
              raise SystemExit(
                  "predicciones_pendientes inválido"
              )

          print("Evolución OK")
          PY

      - name: Probar API y /radar/imagen
        shell: bash
        run: |
          set -euo pipefail

          nohup uvicorn app:app \
            --host 127.0.0.1 \
            --port 8000 \
            > app.log 2>&1 &

          echo $! > app.pid

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:8000/health \
              > /tmp/health.json; then
              break
            fi

            if [ "$i" -eq 30 ]; then
              cat app.log
              exit 1
            fi

            sleep 1
          done

          python - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8000"

          with urllib.request.urlopen(
              base + "/health",
              timeout=10
          ) as response:
              health = json.load(response)

          claves = (
              "status",
              "frame_actual_utc",
              "frame_edad_minutos",
              "estado_radar",
          )

          for clave in claves:
              if clave not in health:
                  raise SystemExit(
                      f"Falta {clave} en /health"
                  )

          endpoints = (
              "/radar",
              "/prediccion/en-vivo",
              "/tormenta",
              "/inteligencia",
              "/secuencia",
          )

          for endpoint in endpoints:
              with urllib.request.urlopen(
                  base + endpoint,
                  timeout=10
              ) as response:
                  if response.status != 200:
                      raise SystemExit(
                          f"{endpoint}: HTTP {response.status}"
                      )

          print("API básica OK")
          PY

          status="$(
            curl -sS \
              -o /tmp/radar.png \
              -w "%{http_code}" \
              http://127.0.0.1:8000/radar/imagen
          )"

          test "$status" = "200"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path("/tmp/radar.png")

          if not path.exists():
              raise SystemExit(
                  "No se recibió radar.png"
              )

          if path.stat().st_size <= 1024:
              raise SystemExit(
                  "PNG demasiado pequeño"
              )

          with Image.open(path) as image:
              if image.format != "PNG":
                  raise SystemExit(
                      f"Formato inválido: {image.format}"
                  )

              image.verify()

          print("Radar PNG válido")
          PY

      - name: Detener API
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi

      - name: Mostrar log API si falló
        if: failure()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

      - name: Resultado final
        run: |
          echo "CLIMAAR CALIDAD: END-TO-END OK"
