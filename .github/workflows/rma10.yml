name: ClimaAR - Captura RMA10 Auto

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: climaar-rma10
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          python -m pip install --quiet requests pillow numpy

      - name: Obtener token oficial del SMN
        env:
          SMN_HOME: https://www.smn.gob.ar/
        run: |
          set -e

          echo "Consultando SMN..."
          HTML=$(curl -fsSL \
            -A "Mozilla/5.0 ClimaAR/2.0" \
            "$SMN_HOME")

          TOKEN=$(printf '%s' "$HTML" \
            | grep -oP "localStorage\.setItem\(['\"]token['\"],\s*['\"]\K[^'\"]+" \
            | tail -1 || true)

          if [ -z "$TOKEN" ]; then
            TOKEN=$(printf '%s' "$HTML" \
              | grep -oP "eyJ[A-Za-z0-9._-]+" \
              | head -1 || true)
          fi

          if [ -z "$TOKEN" ]; then
            echo "ERROR: no se pudo obtener el token del SMN."
            exit 1
          fi

          echo "Token obtenido correctamente."
          echo "SMN_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Consultar radares oficiales
        run: |
          set -e

          curl -fsSL \
            -A "Mozilla/5.0 ClimaAR/2.0" \
            -H "Authorization: JWT $SMN_TOKEN" \
            "https://ws1.smn.gob.ar/v1/weather/radar" \
            -o radar_list.json

          echo "Respuesta recibida:"
          jq . radar_list.json

      - name: Localizar RMA10
        run: |
          set -e

          jq '.. | objects
            | select(
                (.name? == "RMA10") or
                (.id? == "RMA10") or
                (.radar? == "RMA10")
              )' radar_list.json > rma10_meta.json || true

          if [ ! -s rma10_meta.json ]; then
            echo "ERROR: RMA10 no apareció en la respuesta del SMN."
            exit 1
          fi

          echo "RMA10 encontrado:"
          cat rma10_meta.json

      - name: Descargar imagen RMA10
        run: |
          set -e

          mkdir -p data/radar/rma10

          IMG_URL=$(jq -r '
            .. | objects |
            (.url? // .image_url? // .last_image? // empty)
          ' rma10_meta.json | grep -E '^https?://' | head -1 || true)

          if [ -z "$IMG_URL" ]; then
            echo "ERROR: el SMN no entregó una URL de imagen RMA10."
            exit 1
          fi

          echo "URL RMA10 encontrada."

          curl -fsSL
