name: ClimaAR - Captura RMA10 Auto

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: climaar-rma10
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          python -m pip install --quiet playwright pillow numpy requests
          python -m playwright install --with-deps chromium

      - name: Obtener token desde el radar oficial del SMN
        run: |
          set -euo pipefail

          cat > /tmp/get_smn_token.py <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.smn.gob.ar/radar"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              context = browser.new_context(
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140 Safari/537.36"
              )

              page = context.new_page()

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=90000
              )

              page.wait_for_timeout(10000)

              token = page.evaluate(
                  "localStorage.getItem('token')"
              )

              if not token:
                  browser.close()
                  raise SystemExit(
                      "ERROR:
