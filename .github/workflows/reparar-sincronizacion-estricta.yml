name: Reparar sincronizacion estricta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reparar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar reparacion
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path(
              ".github/workflows/climaar-intelligence.yml"
          )

          texto = path.read_text(
              encoding="utf-8"
          )

          marcador = """      - name: Fusionar meteorología
        run: |
"""

          bloque = r'''      - name: Verificar sincronizacion estricta Radar Nowcast ML
        run: |
          set -euo pipefail

          python - <<'PY2'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def normalizar(value, nombre):
              if value is None:
                  raise SystemExit(
                      f"ERROR: {nombre} no contiene timestamp."
                  )

              texto = str(value).strip()

              if not texto:
                  raise SystemExit(
                      f"ERROR: {nombre} contiene timestamp vacío."
                  )

              texto = texto.replace(
                  "Z",
                  "+00:00"
              )

              try:
                  dt = datetime.fromisoformat(
                      texto
                  )
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: timestamp inválido en {nombre}: "
                      f"{value!r}: {exc}"
                  )

              if dt.tzinfo is None:
                  dt = dt.replace(
                      tzinfo=timezone.utc
                  )

              return dt.astimezone(
                  timezone.utc
              )

          radar_path = Path(
              "data/radar/radar_timestamp.txt"
          )

          nowcast_path = Path(
              "data/radar/radar_nowcast.json"
          )

          ml_path = Path(
              "data/radar/seguimiento/prediccion_ml_rma10.json"
          )

          if not radar_path.exists():
              raise SystemExit(
                  "ERROR: no existe radar_timestamp.txt"
              )

          if not nowcast_path.exists():
              raise SystemExit(
                  "ERROR: no existe radar_nowcast.json"
              )

          if not ml_path.exists():
              raise SystemExit(
                  "ERROR: no existe prediccion_ml_rma10.json"
              )

          radar_ts = radar_path.read_text(
              encoding="utf-8"
          ).strip()

          nowcast = json.loads(
              nowcast_path.read_text(
                  encoding="utf-8"
              )
          )

          ml = json.loads(
              ml_path.read_text(
                  encoding="utf-8"
              )
          )

          nowcast_ts = (
              nowcast
              .get("nowcast", {})
              .get("frame_actual_utc")
          )

          if nowcast_ts is None:
              nowcast_ts = nowcast.get(
                  "actualizado"
              )

          ml_ts = ml.get(
              "frame_radar"
          )

          radar_dt = normalizar(
              radar_ts,
              "RADAR"
          )

          nowcast_dt = normalizar(
              nowcast_ts,
              "NOWCAST"
          )

          ml_dt = normalizar(
              ml_ts,
              "ML"
          )

          print(
              "===== SINCRONIZACION ESTRICTA ====="
          )

          print(
              "Radar:",
              radar_dt.isoformat()
          )

          print(
              "Nowcast:",
              nowcast_dt.isoformat()
          )

          print(
              "ML:",
              ml_dt.isoformat()
          )

          if radar_dt != nowcast_dt:
              raise SystemExit(
                  "ERROR: RADAR y NOWCAST no corresponden "
                  "al mismo frame."
              )

          if radar_dt != ml_dt:
              raise SystemExit(
                  "ERROR: RADAR y ML no corresponden "
                  "al mismo frame."
              )

          if nowcast_dt != ml_dt:
              raise SystemExit(
                  "ERROR: NOWCAST y ML no corresponden "
                  "al mismo frame."
              )

          if ml.get("ok") is not True:
              raise SystemExit(
                  "ERROR: el resultado ML no está marcado como válido."
              )

          print(
              "OK: Radar, Nowcast y ML están sincronizados."
          )
          PY2

      - name: Fusionar meteorología
        run: |
'''

          cantidad = texto.count(
              marcador
          )

          if cantidad != 1:
              raise SystemExit(
                  "ERROR: no se encontró exactamente "
                  "un punto de inserción."
              )

          if "Verificar sincronizacion estricta Radar Nowcast ML" in texto:
              raise SystemExit(
                  "ERROR: la reparación ya fue aplicada."
              )

          nuevo = texto.replace(
              marcador,
              bloque,
              1
          )

          path.write_text(
              nuevo,
              encoding="utf-8"
          )

          print(
              "OK: verificación estricta insertada."
          )
          PY

      - name: Verificar cambio
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git diff -- \
            .github/workflows/climaar-intelligence.yml

      - name: Persistir cambios
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/climaar-intelligence.yml

          git diff --cached --check

          git commit \
            -m "ClimaAR: exigir sincronizacion estricta Radar ML"

          git push

      - name: Eliminar workflow temporal
        shell: bash
        run: |
          set -euo pipefail

          git rm \
            .github/workflows/reparar-sincronizacion-estricta.yml

          git commit \
            -m "Eliminar workflow temporal de sincronizacion"

          git push
