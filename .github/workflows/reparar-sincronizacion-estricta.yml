name: Reparar sincronizacion estricta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reparar:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar reparacion
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import py_compile

          path = Path(".github/workflows/climaar-intelligence.yml")

          if not path.exists():
              raise SystemExit(
                  "ERROR: no existe climaar-intelligence.yml"
              )

          texto = path.read_text(
              encoding="utf-8"
          )

          marcador = (
              "      - name: Ejecutar motor de decision integrado\n"
          )

          if texto.count(marcador) != 1:
              raise SystemExit(
                  "ERROR: no se encontro exactamente "
                  "un punto de insercion."
              )

          if (
              "Verificar sincronizacion estricta"
              in texto
          ):
              raise SystemExit(
                  "ERROR: la reparacion ya estaba aplicada."
              )

          bloque = """      - name: Verificar sincronizacion estricta
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY2'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def convertir(value, nombre):
              if value is None:
                  raise SystemExit(
                      f"ERROR: {nombre} no tiene timestamp."
                  )

              texto = str(value).strip()

              if not texto:
                  raise SystemExit(
                      f"ERROR: {nombre} tiene timestamp vacio."
                  )

              texto = texto.replace(
                  "Z",
                  "+00:00"
              )

              try:
                  fecha = datetime.fromisoformat(
                      texto
                  )
              except ValueError as exc:
                  raise SystemExit(
                      f"ERROR: timestamp invalido "
                      f"en {nombre}: {exc}"
                  )

              if fecha.tzinfo is None:
                  fecha = fecha.replace(
                      tzinfo=timezone.utc
                  )

              return fecha.astimezone(
                  timezone.utc
              )

          radar_file = Path(
              "data/radar/radar_timestamp.txt"
          )

          nowcast_file = Path(
              "data/radar/radar_nowcast.json"
          )

          ml_file = Path(
              "data/radar/seguimiento/"
              "prediccion_ml_rma10.json"
          )

          for archivo in (
              radar_file,
              nowcast_file,
              ml_file,
          ):
              if not archivo.exists():
                  raise SystemExit(
                      f"ERROR: falta {archivo}"
                  )

          radar = convertir(
              radar_file.read_text(
                  encoding="utf-8"
              ).strip(),
              "RADAR"
          )

          nowcast = json.loads(
              nowcast_file.read_text(
                  encoding="utf-8"
              )
          )

          ml = json.loads(
              ml_file.read_text(
                  encoding="utf-8"
              )
          )

          nowcast_ts = (
              (nowcast.get("nowcast") or {})
              .get("frame_actual_utc")
          )

          if nowcast_ts is None:
              nowcast_ts = nowcast.get(
                  "actualizado"
              )

          nowcast = convertir(
              nowcast_ts,
              "NOWCAST"
          )

          ml = convertir(
              ml.get("frame_radar"),
              "ML"
          )

          print(
              "===== SINCRONIZACION ====="
          )

          print(
              "RADAR:  ",
              radar.isoformat()
          )

          print(
              "NOWCAST:",
              nowcast.isoformat()
          )

          print(
              "ML:     ",
              ml.isoformat()
          )

          if not (
              radar == nowcast == ml
          ):
              raise SystemExit(
                  "ERROR: Radar, Nowcast y ML "
                  "no corresponden al mismo frame."
              )

          print(
              "OK: los tres corresponden "
              "al mismo frame."
          )
          PY2

          """

          texto = texto.replace(
              marcador,
              bloque + marcador,
              1
          )

          path.write_text(
              texto,
              encoding="utf-8"
          )

          py_compile.compile(
              str(path),
              doraise=True
          )

          print(
              "OK: reparacion aplicada."
          )
          PY

      - name: Verificar diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git diff -- \
            .github/workflows/climaar-intelligence.yml

      - name: Persistir cambios
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/climaar-intelligence.yml

          git diff --cached --check

          git commit \
            -m "ClimaAR: sincronizacion estricta Radar ML"

          git push

      - name: Eliminar workflow temporal
        shell: bash
        run: |
          set -euo pipefail

          git rm \
            .github/workflows/reparar-sincronizacion-estricta.yml

          git commit \
            -m "Eliminar workflow temporal"

          git push
