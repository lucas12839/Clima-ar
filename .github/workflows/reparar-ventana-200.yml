name: Reparar ventana 200 minutos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reparar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar reparación
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import py_compile

          cambios = {
              Path("seguimiento_temporal.py"): (
                  "MAX_INTERVALO = 60.0",
                  "MAX_INTERVALO = 200.0",
              ),
              Path("scripts/adaptar_rma10_intelligence.py"): (
                  "MAX_INTERVALO_TRACKING = 60.0",
                  "MAX_INTERVALO_TRACKING = 200.0",
              ),
          }

          for path, (viejo, nuevo) in cambios.items():
              texto = path.read_text(encoding="utf-8")
              cantidad = texto.count(viejo)

              if cantidad != 1:
                  raise SystemExit(
                      f"{path}: se esperaba exactamente 1 coincidencia de "
                      f"{viejo!r}; encontradas {cantidad}"
                  )

              if nuevo in texto:
                  raise SystemExit(
                      f"{path}: ya contiene la constante nueva; no se modifica"
                  )

              texto = texto.replace(viejo, nuevo, 1)
              path.write_text(texto, encoding="utf-8")

              py_compile.compile(
                  str(path),
                  doraise=True,
              )

              print(f"OK: {path} -> ventana máxima 200 minutos")
          PY

      - name: Verificar diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- seguimiento_temporal.py scripts/adaptar_rma10_intelligence.py

      - name: Persistir cambios
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seguimiento_temporal.py scripts/adaptar_rma10_intelligence.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Unificar ventana temporal RMA10 en 200 minutos"
          git push

      - name: Eliminar workflow temporal
        shell: bash
        run: |
          set -euo pipefail

          git rm .github/workflows/reparar-ventana-200.yml
          git commit -m "Eliminar workflow temporal de reparación"
          git push
