name: Descargar histórico SMN ClimaAR

on:
  workflow_dispatch:

jobs:
  descargar-smn:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Descargar histórico SMN 2016-2025
        run: |
          python descargar_smn.py \
            --desde 2016-01-01 \
            --hasta 2025-12-31 \
            --salida climaar_smn_2016_2025.csv \
            --pausa 1

      - name: Guardar histórico
        uses: actions/upload-artifact@v4
        with:
          name: climaar-smn-2016-2025
          path: climaar_smn_2016_2025.csv
          retention-days: 7
