name: Test Rainbow Radar

on:
  workflow_dispatch:

jobs:
  test-rainbow:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Ejecutar prueba Rainbow
        env:
          RAINBOW_API_TOKEN: ${{ secrets.RAINBOW_API_TOKEN }}
        run: |
          python radar_rainbow.py

      - name: Guardar radar generado
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainbow-radar-test
          path: data/radar/rainbow_bahia_blanca.png
          if-no-files-found: warn
