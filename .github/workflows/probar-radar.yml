name: Probar radar

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar dependencias
        run: python -m pip install --quiet requests pillow

      - name: Analizar un frame real
        run: |
          python - <<'PY'
          import io
          from collections import Counter

          import requests
          from PIL import Image

          API = "https://api.rainviewer.com/public/weather-maps.json"

          LAT = -38.7196
          LON = -62.2724

          print("Consultando RainViewer...")

          r = requests.get(API, timeout=30)
          r.raise_for_status()

          data = r.json()

          frames = data.get("radar", {}).get("past", [])

          if not frames:
              raise SystemExit("ERROR: no hay frames disponibles")

          frame = frames[-1]
          host = data["host"]
          path = frame["path"]

          url = (
              f"{host}{path}/512/7/"
              f"{LAT}/{LON}/2/0_0.png"
          )

          print("Frame:", frame["time"])
          print("URL:", url)

          img_r = requests.get(url, timeout=30)
          img_r.raise_for_status()

          print("HTTP:", img_r.status_code)
          print(
              "Content-Type:",
              img_r.headers.get("content-type")
          )
          print(
              "Bytes:",
              len(img_r.content)
          )

          img = Image.open(
              io.BytesIO(img_r.content)
          )

          print("Formato original:", img.format)
          print("Modo original:", img.mode)
          print("Tamaño:", img.size)

          rgba = img.convert("RGBA")

          colores = Counter(
              rgba.getdata()
          )

          print("")
          print("Colores distintos:", len(colores))

          transparentes = sum(
              cantidad
              for color, cantidad in colores.items()
              if color[3] == 0
          )

          visibles = sum(
              cantidad
              for color, cantidad in colores.items()
              if color[3] > 0
          )

          print("Pixeles transparentes:", transparentes)
          print("Pixeles visibles:", visibles)

          print("")
          print("20 colores más frecuentes:")

          for color, cantidad in colores.most_common(20):
              print(color, cantidad)

          print("")
          print("============================")
          print("PRUEBA DE RADAR COMPLETADA")
          print("============================")
          PY
