name: Auditoria Cache RMA10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget jq

      - name: Auditar recursos RMA10
        run: |
          set -u

          BASE="https://radares.hidricosargentina.gob.ar"
          OUT="auditoria_cache_rma10"

          mkdir -p "$OUT"

          echo "===== SERVIDOR =====" > "$OUT/resultado.txt"
          date -u >> "$OUT/resultado.txt"
          echo >> "$OUT/resultado.txt"

          echo "===== RMA10 PNG CONOCIDO =====" >> "$OUT/resultado.txt"

          for URL in \
            "$BASE/cache/RMA10/20261017012000.png" \
            "$BASE/cache/RMA10/20261017011000.png" \
            "$BASE/cache/RMA10/20261017010000.png"
          do
            echo "--- $URL" >> "$OUT/resultado.txt"
            curl -I -L --max-time 20 "$URL" >> "$OUT/resultado.txt" 2>&1 || true
            echo >> "$OUT/resultado.txt"
          done

          echo "===== BUSQUEDA DE RUTAS =====" >> "$OUT/resultado.txt"

          for PATHNAME in \
            cache/RMA10 \
            cache/RMA10/ \
            cache/RMA10/VRAD \
            cache/RMA10/WRAD \
            cache/RMA10/DBZH \
            cache/VRAD \
            cache/WRAD \
            cache/DBZH \
            radar/RMA10 \
            radar/RMA10/VRAD \
            radar/RMA10/WRAD \
            radar/RMA10/DBZH \
            products/RMA10 \
            products/RMA10/VRAD \
            products/RMA10/WRAD \
            products/RMA10/DBZH \
            data/RMA10 \
            data/RMA10/VRAD
          do
            URL="$BASE/$PATHNAME"

            echo "PROBANDO: $URL" | tee -a "$OUT/resultado.txt"

            curl \
              -L \
              -s \
              -o /dev/null \
              -w "HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download} URL=%{url_effective}\n" \
              --max-time 15 \
              "$URL" >> "$OUT/resultado.txt" 2>&1 || true
          done

          echo "===== ROBOTS =====" >> "$OUT/resultado.txt"
          curl -L -s --max-time 15 "$BASE/robots.txt" \
            > "$OUT/robots.txt" || true

          echo "===== PAGINA PRINCIPAL =====" >> "$OUT/resultado.txt"
          curl -L -s --max-time 30 "$BASE/" \
            > "$OUT/index.html" || true

          echo "===== REFERENCIAS EN HTML =====" >> "$OUT/resultado.txt"

          grep -oiE \
            'https?://[^"'\'' <]+' \
            "$OUT/index.html" \
            | sort -u \
            >> "$OUT/resultado.txt" || true

          grep -oiE \
            '["'\'']?[^"'\'']*(RMA10|VRAD|WRAD|DBZH|H5|ODIM|BUFR)[^"'\'']*["'\'']?' \
            "$OUT/index.html" \
            | sort -u \
            >> "$OUT/resultado.txt" || true

          echo "===== RESULTADO FINAL ====="
          cat "$OUT/resultado.txt"

      - name: Comprimir
        run: |
          zip -r auditoria-cache-rma10.zip auditoria_cache_rma10

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-cache-rma10
          path: auditoria-cache-rma10.zip
          retention-days: 7
