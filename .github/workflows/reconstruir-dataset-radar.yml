name: Reconstruir Dataset Historico Radar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  reconstruir:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pillow opencv-python-headless requests

      - name: Verificar historico radar
        run: |
          set -e

          test -d data/radar/historico

          echo "PNG históricos encontrados:"
          find data/radar/historico \
            -name "radar_*.png" \
            | wc -l

      - name: Reconstruir dataset
        run: |
          set -e

          python scripts/reconstruir_dataset_radar.py

      - name: Verificar dataset generado
        run: |
          set -e

          test -s data/radar/radar_features_rainviewer.csv

          echo ""
          echo "Dataset generado:"
          ls -lh data/radar/radar_features_rainviewer.csv

          echo ""
          echo "Cantidad de filas:"
          wc -l data/radar/radar_features_rainviewer.csv

          echo ""
          echo "Primeras filas:"
          head -5 data/radar/radar_features_rainviewer.csv

      - name: Guardar dataset en GitHub
        run: |
          set -e

          git config user.name "climaar-bot"
          git config user.email "bot@climaar.com.ar"

          git add \
            data/radar/radar_features_rainviewer.csv

          if git diff --cached --quiet; then
            echo "Sin cambios en el dataset."
            exit 0
          fi

          git commit \
            -m "ai: reconstruir dataset historico radar"

          for intento in 1 2 3 4 5; do

            echo ""
            echo "======================================"
            echo "Intento de push: $intento"
            echo "======================================"

            git fetch origin main

            if git rebase -X ours origin/main; then

              echo "Rebase correcto."

              if git push origin HEAD:main; then
                echo "Dataset guardado correctamente."
                exit 0
              fi

            else

              echo "El rebase encontró un conflicto."

              git rebase --abort || true

            fi

            echo ""
            echo "Otro workflow modificó main."
            echo "Esperando 15 segundos..."
            sleep 15

          done

          echo ""
          echo "ERROR: no se pudo guardar el dataset"
          echo "después de 5 intentos."

          exit 1
