name: Reconstruir Dataset Historico Radar

on:
  workflow_dispatch:

jobs:
  reconstruir:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pillow opencv-python-headless requests

      - name: Verificar historico radar
        run: |
          test -d data/radar/historico
          echo "PNG históricos encontrados:"
          find data/radar/historico -name "radar_*.png" | wc -l

      - name: Reconstruir dataset
        run: |
          python scripts/reconstruir_dataset_radar.py

      - name: Verificar dataset generado
        run: |
          test -f data/radar/radar_features_rainviewer.csv

          echo ""
          echo "Dataset generado:"
          ls -lh data/radar/radar_features_rainviewer.csv

          echo ""
          echo "Cantidad de filas:"
          wc -l data/radar/radar_features_rainviewer.csv

          echo ""
          echo "Primeras filas:"
          head -5 data/radar/radar_features_rainviewer.csv

      - name: Guardar dataset en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/radar/radar_features_rainviewer.csv

          git diff --cached --quiet || git commit -m "ai: reconstruir dataset historico radar"

          git push
