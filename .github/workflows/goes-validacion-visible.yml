name: GOES Validacion Visible + ACMF

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climaar-goes-validation
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install boto3 botocore h5py numpy matplotlib

      - name: Ejecutar validacion GOES-19
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -e

          mkdir -p data/goes

          cat > /tmp/validar_goes.py <<'PY'
          import os
          import json
          import math
          from datetime import datetime, timezone, timedelta

          import boto3
          import h5py
          import numpy as np
          import matplotlib.pyplot as plt

          from botocore import UNSIGNED
          from botocore.client import Config

          LAT = -38.72
          LON = -62.27
          BUCKET = "noaa-goes19"

          s3 = boto3.client(
              "s3",
              region_name="us-east-1",
              config=Config(signature_version=UNSIGNED)
          )

          def now_utc():
              return datetime.now(timezone.utc)

          def doy(dt):
              return dt.timetuple().tm_yday

          def parse_goes_time(name):
              try:
                  part = name.split("_s")[1][:13]
                  return datetime.strptime(
                      part,
                      "%Y%j%H%M%S"
                  ).replace(tzinfo=timezone.utc)
              except Exception:
                  return None

          def list_files(prefix, token):
              result = []

              paginator = s3.get_paginator(
                  "list_objects_v2"
              )

              for page in paginator.paginate(
                  Bucket=BUCKET,
                  Prefix=prefix
              ):
                  for obj in page.get("Contents", []):
                      key = obj["Key"]

                      if (
                          token in key
                          and key.endswith(".nc")
                      ):
                          result.append(key)

              return result

          def buscar(producto, token):
              ahora = now_utc()
              candidatos = []

              for h in range(0, 4):
                  t = ahora - timedelta(hours=h)

                  prefix = (
                      f"ABI-L2-{producto}/"
                      f"{t.year:04d}/"
                      f"{doy(t):03d}/"
                      f"{t.hour:02d}/"
                  )

                  print("Buscando:", prefix)

                  archivos = list_files(
                      prefix,
                      token
                  )

                  for key in archivos:
                      ts = parse_goes_time(key)

                      if ts is None:
                          continue

                      edad = abs(
                          (
                              ahora - ts
                          ).total_seconds()
                      )

                      candidatos.append(
                          (edad, ts, key)
                      )

              if not candidatos:
                  raise RuntimeError(
                      f"No se encontró {producto}"
                  )

              candidatos.sort(
                  key=lambda x: x[0]
              )

              edad, ts, key = candidatos[0]

              print("Encontrado:", key)
              print("Frame:", ts.isoformat())
              print("Edad:", edad / 60.0, "min")

              return key, ts

          def descargar(key, path):
              print("Descargando:", key)

              s3.download_file(
                  BUCKET,
                  key,
                  path
              )

              if not os.path.exists(path):
                  raise RuntimeError(
                      f"No existe {path}"
                  )

              size = os.path.getsize(path)

              print(
                  "Archivo:",
                  path,
                  "bytes:",
                  size
              )

              if size < 100000:
                  raise RuntimeError(
                      f"Archivo demasiado pequeño: {path}"
                  )

          def attr_float(obj, name, default=None):
              value = obj.attrs.get(
                  name,
                  default
              )

              if value is None:
                  return default

              if isinstance(
                  value,
                  np.ndarray
              ):
                  if value.size == 0:
                      return default

                  value = value.flat[0]

              try:
                  return float(value)
              except Exception:
                  return default

          def geolocation_arrays(f):
              x = np.asarray(
                  f["x"][:],
                  dtype=np.float64
              )

              y = np.asarray(
                  f["y"][:],
                  dtype=np.float64
              )

              proj = f[
                  "goes_imager_projection"
              ]

              H = attr_float(
                  proj,
                  "perspective_point_height"
              )

              lon0 = math.radians(
                  attr_float(
                      proj,
                      "longitude_of_projection_origin"
                  )
              )

              a = attr_float(
                  proj,
                  "semi_major_axis"
              )

              b = attr_float(
                  proj,
                  "semi_minor_axis"
              )

              if None in (
                  H,
                  a,
                  b
              ):
                  raise RuntimeError(
                      "Proyección GOES incompleta"
                  )

              xx, yy = np.meshgrid(
                  x,
                  y
              )

              sinx = np.sin(xx)
              cosx = np.cos(xx)
              siny = np.sin(yy)
              cosy = np.cos(yy)

              a2 = a * a
              b2 = b * b

              sd = np.sqrt(
                  (
                      H * cosy * cosx
                  ) ** 2
                  -
                  (
                      siny ** 2
                      +
                      (
                          a2 / b2
                      )
                      * cosy ** 2
                      * sinx ** 2
                  )
                  * (
                      H * H - a2
                  )
              )

              sn = (
                  H * cosy * cosx
                  - sd
              )

              s1 = sn * cosy * cosx
              s2 = -sn * siny
              s3 = sn * cosy * sinx

              lat = np.arctan(
                  (
                      a2 / b2
                  )
                  * (
                      s2 /
                      np.sqrt(
                          (H - s1) ** 2
                          + s3 ** 2
                      )
                  )
              )

              lon = (
                  lon0
                  + np.arctan(
                      s3 /
                      (H - s1)
                  )
              )

              return (
                  np.degrees(lat),
                  np.degrees(lon)
              )

          def nearest_pixel(f):
              lat, lon = geolocation_arrays(f)

              distancia = (
                  (lat - LAT) ** 2
                  +
                  (lon - LON) ** 2
              )

              iy, ix = np.unravel_index(
                  np.nanargmin(
                      distancia
                  ),
                  distancia.shape
              )

              return int(iy), int(ix)

          def read_acmf(path):
              with h5py.File(
                  path,
                  "r"
              ) as f:

                  acm = np.asarray(
                      f["ACM"][:]
                  )

                  cloud = np.asarray(
                      f[
                          "Cloud_Probabilities"
                      ][:]
                  )

                  dqf = np.asarray(
                      f["DQF"][:]
                  )

                  iy, ix = nearest_pixel(f)

                  raw_cloud = int(
                      cloud[iy, ix]
                  )

                  raw_acm = int(
                      acm[iy, ix]
                  )

                  raw_dqf = int(
                      dqf[iy, ix]
                  )

                  scale = attr_float(
                      f[
                          "Cloud_Probabilities"
                      ],
                      "scale_factor",
                      1.0
                  )

                  offset = attr_float(
                      f[
                          "Cloud_Probabilities"
                      ],
                      "add_offset",
                      0.0
                  )

                  fill = attr_float(
                      f[
                          "Cloud_Probabilities"
                      ],
                      "_FillValue",
                      65535
                  )

                  if raw_cloud >= fill:
                      probability = None
                  else:
                      probability = (
                          raw_cloud * scale
                          + offset
                      )

                      if not (
                          0 <= probability <= 1
                      ):
                          probability = None

                  return {
                      "clasificacion_acm":
                          raw_acm,
                      "cloud_probability":
                          probability,
                      "cloud_probability_raw":
                          raw_cloud,
                      "dqf":
                          raw_dqf,
                      "pixel": {
                          "x": ix,
                          "y": iy
                      }
                  }

          def read_visible(path):
              with h5py.File(
                  path,
                  "r"
              ) as f:

                  cmi = np.asarray(
                      f["CMI"][:]
                  )

                  dqf = np.asarray(
                      f["DQF"][:]
                  )

                  iy, ix = nearest_pixel(f)

                  raw = cmi[iy, ix]

                  if np.issubdtype(
                      cmi.dtype,
                      np.signedinteger
                  ):
                      raw = int(raw)

                      unsigned = (
                          str(
                              f["CMI"].attrs.get(
                                  "_Unsigned",
                                  ""
                              )
                          ).lower()
                          == "true"
                      )

                      if unsigned and raw < 0:
                          raw += 65536
                  else:
                      raw = int(raw)

                  qf = int(
                      dqf[iy, ix]
                  )

                  scale = attr_float(
                      f["CMI"],
                      "scale_factor",
                      1.0
                  )

                  offset = attr_float(
                      f["CMI"],
                      "add_offset",
                      0.0
                  )

                  fill = attr_float(
                      f["CMI"],
                      "_FillValue",
                      65535
                  )

                  valor = (
                      raw * scale
                      + offset
                  )

                  valido = (
                      raw != int(fill)
                      and qf == 0
                      and np.isfinite(
                          valor
                      )
                  )

                  if not valido:
                      valor = None

                  return {
                      "cmi_raw":
                          raw,
                      "reflectancia_factor":
                          valor,
                      "dqf":
                          qf,
                      "pixel": {
                          "x": ix,
                          "y": iy
                      }
                  }

          acmf_key, acmf_time = buscar(
              "ACMF",
              "M6_G19_"
          )

          visible_key, visible_time = buscar(
              "CMIPF",
              "M6C02_G19_"
          )

          acmf_path = (
              "/tmp/acmf.nc"
          )

          visible_path = (
              "/tmp/visible_c02.nc"
          )

          descargar(
              acmf_key,
              acmf_path
          )

          descargar(
              visible_key,
              visible_path
          )

          acmf = read_acmf(
              acmf_path
          )

          visible = read_visible(
              visible_path
          )

          diferencia = abs(
              (
                  acmf_time
                  - visible_time
              ).total_seconds()
          )

          if (
              acmf["dqf"] != 0
          ):
              estado = (
                  "ACMF_CALIDAD_NO_OPTIMA"
              )

          elif (
              visible[
                  "reflectancia_factor"
              ] is None
          ):
              estado = (
                  "VISIBLE_NO_DISPONIBLE"
              )

          elif (
              acmf[
                  "cloud_probability"
              ] is None
          ):
              estado = (
                  "ACMF_PROBABILIDAD_NO_VALIDA"
              )

          else:
              estado = (
                  "DATOS_VALIDOS_ACMF_VISIBLE"
              )

          resultado = {
              "ok": True,

              "fuente": "GOES-19 NOAA",

              "ciudad": "Bahía Blanca",

              "latitud": LAT,

              "longitud": LON,

              "acmf": {
                  "producto":
                      "ABI-L2-ACMF",
                  "frame_goes_utc":
                      acmf_time.isoformat(),
                  "archivo":
                      acmf_key,
                  "clasificacion_acm":
                      acmf[
                          "clasificacion_acm"
                      ],
                  "cloud_probability":
                      acmf[
                          "cloud_probability"
                      ],
                  "cloud_probability_raw":
                      acmf[
                          "cloud_probability_raw"
                      ],
                  "dqf":
                      acmf["dqf"],
                  "pixel":
                      acmf["pixel"]
              },

              "visible": {
                  "producto":
                      "ABI-L2-CMIPF",
                  "canal":
                      "C02",
                  "longitud_onda_um":
                      0.64,
                  "resolucion":
                      "0.5 km",
                  "frame_goes_utc":
                      visible_time.isoformat(),
                  "archivo":
                      visible_key,
                  "reflectancia_factor":
                      visible[
                          "reflectancia_factor"
                      ],
                  "cmi_raw":
                      visible[
                          "cmi_raw"
                      ],
                  "dqf":
                      visible["dqf"],
                  "pixel":
                      visible["pixel"]
              },

              "diferencia_frames_segundos":
                  diferencia,

              "validacion": {
                  "estado":
                      estado,
                  "dato_acmf_modificado":
                      False,
                  "porcentaje_acmf_modificado":
                      False,
                  "porcentaje_visible_inventado":
                      False
              },

              "generado_utc":
                  now_utc().isoformat()
          }

          salida = (
              "data/goes/"
              "validacion_goes.json"
          )

          with open(
              salida,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # Diagnóstico visible.
          with h5py.File(
              visible_path,
              "r"
          ) as f:

              cmi = np.asarray(
                  f["CMI"][:]
              )

              scale = attr_float(
                  f["CMI"],
                  "scale_factor",
                  1.0
              )

              offset = attr_float(
                  f["CMI"],
                  "add_offset",
                  0.0
              )

              raw = cmi.astype(
                  np.float64
              )

              if str(
                  f["CMI"].attrs.get(
                      "_Unsigned",
                      ""
                  )
              ).lower() == "true":
                  raw[raw < 0] += 65536

              img = (
                  raw * scale
                  + offset
              )

              fill = attr_float(
                  f["CMI"],
                  "_FillValue",
                  65535
              )

              img[
                  raw == fill
              ] = np.nan

          plt.figure(
              figsize=(8, 8)
          )

          vmax = np.nanpercentile(
              img,
              99
          )

          plt.imshow(
              img,
              cmap="gray",
              origin="upper",
              vmin=0,
              vmax=vmax
          )

          plt.title(
              "GOES-19 ABI Band 2 - 0.64 µm\n"
              "Bahía Blanca"
          )

          plt.axis("off")

          png = (
              "data/goes/"
              "validacion_goes_bahia_blanca.png"
          )

          plt.savefig(
              png,
              dpi=150,
              bbox_inches="tight"
          )

          plt.close()

          print()
          print("================================")
          print("RESULTADO VALIDACION GOES")
          print("================================")
          print(
              "ACM:",
              acmf[
                  "clasificacion_acm"
              ]
          )
          print(
              "Cloud Probability:",
              acmf[
                  "cloud_probability"
              ]
          )
          print(
              "ACMF DQF:",
              acmf["dqf"]
          )
          print(
              "Visible C02:",
              visible[
                  "reflectancia_factor"
              ]
          )
          print(
              "Visible DQF:",
              visible["dqf"]
          )
          print(
              "Diferencia:",
              diferencia,
              "segundos"
          )
          print(
              "ESTADO:",
              estado
          )
          print("================================")

          print()
          print("ARCHIVOS GENERADOS:")
          print(
              os.path.abspath(
                  salida
              )
          )
          print(
              os.path.abspath(
                  png
              )
          )
          PY

          python /tmp/validar_goes.py

      - name: Verificar archivos generados
        run: |
          echo "CONTENIDO data/goes:"
          ls -lah data/goes || true

          echo
          echo "JSON:"
          test -f data/goes/validacion_goes.json
          test -s data/goes/validacion_goes.json

          echo
          echo "PNG:"
          test -f data/goes/validacion_goes_bahia_blanca.png
          test -s data/goes/validacion_goes_bahia_blanca.png

          echo
          echo "Validando JSON..."

          python - <<'PY'
          import json

          with open(
              "data/goes/validacion_goes.json",
              encoding="utf-8"
          ) as f:
              d = json.load(f)

          assert d["ok"] is True

          assert (
              d["validacion"][
                  "dato_acmf_modificado"
              ] is False
          )

          assert (
              d["validacion"][
                  "porcentaje_acmf_modificado"
              ] is False
          )

          assert (
              d["validacion"][
                  "porcentaje_visible_inventado"
              ] is False
          )

          print(
              "VALIDACION JSON OK"
          )

          print(
              "ESTADO:",
              d["validacion"]["estado"]
          )

          print(
              "ACM:",
              d["acmf"]["clasificacion_acm"]
          )

          print(
              "CLOUD PROBABILITY:",
              d["acmf"]["cloud_probability"]
          )

          print(
              "VISIBLE:",
              d["visible"][
                  "reflectancia_factor"
              ]
          )
          PY

      - name: Commit resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/goes/validacion_goes.json
          git add data/goes/validacion_goes_bahia_blanca.png

          if git diff --cached --quiet; then
            echo "Sin cambios para commit."
            exit 0
          fi

          git commit -m "GOES: validar ACMF con ABI Band 2 visible"
          git push
