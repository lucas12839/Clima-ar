name: Prueba temporal - ideas 2 y 3 y estaciones nuevas
on:
  push:
    branches: [idea2-aviso-fuerte]
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        caso: [vacia, tormenta]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt pytest pyyaml
      - run: python -m pytest -q
      - name: Estaciones nuevas (lectura real de BCP)
        run: |
          python scripts/estaciones/colector_bcp.py
      - name: Cadena completa en una copia
        run: |
          if [ "${{ matrix.caso }}" = "vacia" ]; then
            bash herramientas/emular_caso_prueba.sh /tmp/copia vacia -
          else
            bash herramientas/emular_caso_prueba.sh /tmp/copia herramientas/casos_prueba/radar_2026-11-20_1750.png herramientas/casos_prueba/estaciones_2026-11-20.json
          fi
