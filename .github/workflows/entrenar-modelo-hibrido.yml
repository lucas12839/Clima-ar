name: ClimaAR - Entrenamiento Hibrido V6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  entrenamiento:
    name: Entrenar modelos ClimaAR
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Verificar datos
        run: |
          echo "=== DATOS HISTORICOS ==="
          test -f data/historico/clima_horario_1980_2026.csv
          echo "OK: histórico meteorológico"

          echo "=== VARIABLES CONVECTIVAS ==="
          test -f data/eventos_severos/variables_convectivas_2023_2025.csv
          echo "OK: variables convectivas"

          echo "=== ENTRENADOR ==="
          test -f scripts/entrenar_modelo_hibrido_v6.py
          echo "OK: entrenador V6"

      - name: Entrenar modelos ClimaAR
        run: |
          set -e
          python scripts/entrenar_modelo_hibrido_v6.py

      - name: Validar artefactos
        run: |
          set -e

          echo "=== VALIDANDO MODELO SUPERFICIE ==="
          test -s modelo/climaar_predictor_hibrido_superficie_v6.joblib

          echo "=== VALIDANDO IMPORTANCIAS SUPERFICIE ==="
          test -s modelo/importancia_hibrido_superficie_v6.csv

          echo "=== VALIDANDO MODELO CONVECTIVO ==="
          test -s modelo/climaar_predictor_convectivo_v2.joblib

          echo "=== VALIDANDO IMPORTANCIAS CONVECTIVAS ==="
          test -s modelo/importancia_convectivo_v2.csv

          echo "=== VALIDANDO REPORTE ==="
          test -s modelo/reporte_modelo_hibrido_v6.json

          echo "TODOS LOS ARTEFACTOS SON VALIDOS."

      - name: Mostrar resumen
        run: |
          echo "=========================================="
          echo "CLIMAAR - ENTRENAMIENTO V6 COMPLETADO"
          echo "=========================================="

          echo ""
          echo "Archivos generados:"
          ls -lh modelo/climaar_predictor_hibrido_superficie_v6.joblib
          ls -lh modelo/climaar_predictor_convectivo_v2.joblib
          ls -lh modelo/importancia_hibrido_superficie_v6.csv
          ls -lh modelo/importancia_convectivo_v2.csv
          ls -lh modelo/reporte_modelo_hibrido_v6.json

          echo ""
          echo "Reporte:"
          cat modelo/reporte_modelo_hibrido_v6.json

      - name: Guardar resultados
        run: |
          git config user.name "climaar-bot"
          git config user.email "climaar-bot@users.noreply.github.com"

          git add modelo/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Entrenamiento ClimaAR Hibrido V6"
            git push
          fi
