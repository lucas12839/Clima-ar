name: ClimaAR - Entrenamiento Hibrido V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  entrenamiento:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Entrenar modelo hibrido
        shell: bash
        run: |
          cat > /tmp/entrenar_modelo.py <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd
          import joblib

          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import (
              roc_auc_score,
              average_precision_score,
              precision_score,
              recall_score,
              f1_score
          )

          LAT = -38.71
          LON = -62.26

          OUT = Path("modelo")
          OUT.mkdir(exist_ok=True)

          EVENTS = {
              "2019-12-30": {
                  "hours": 24,
                  "type": "regional_severe_storm"
              },
              "2023-12-16": {
                  "hours": 24,
                  "type": "damaging_wind"
              },
              "2025-03-07": {
                  "hours": 48,
                  "type": "extreme_rain_flood"
              }
          }

          print("=" * 70)
          print("CLIMAAR - ENTRENAMIENTO HIBRIDO V4")
          print("=" * 70)

          # ============================================================
          # MODELO DE SUPERFICIE
          # ============================================================

          def surface_features(df):

              df = df.copy()

              df["time"] = pd.to_datetime(
                  df["time"],
                  errors="coerce"
              )

              for c in df.columns:
                  if c != "time":
                      df[c] = pd.to_numeric(
                          df[c],
                          errors="coerce"
                      )

              # Componentes U/V del viento
              if {
                  "wind_speed_10m",
                  "wind_direction_10m"
              }.issubset(df.columns):

                  rad = np.deg2rad(
                      df["wind_direction_10m"]
                  )

                  df["wind_u"] = (
                      df["wind_speed_10m"] *
                      np.sin(rad)
                  )

                  df["wind_v"] = (
                      df["wind_speed_10m"] *
                      np.cos(rad)
                  )

              # Diferencia temperatura - punto de rocío
              if {
                  "temperature_2m",
                  "dew_point_2m"
              }.issubset(df.columns):

                  df["dew_spread"] = (
                      df["temperature_2m"] -
                      df["dew_point_2m"]
                  )

              base = [
                  "temperature_2m",
                  "relative_humidity_2m",
                  "dew_point_2m",
                  "pressure_msl",
                  "precipitation",
                  "wind_speed_10m",
                  "wind_gusts_10m",
                  "dew_spread",
                  "wind_u",
                  "wind_v"
              ]

              # Cambios temporales
              for c in base:

                  if c not in df.columns:
                      continue

                  for lag in (1, 3, 6, 12, 24):

                      df[f"{c}_chg{lag}h"] = (
                          df[c] -
                          df[c].shift(lag)
                      )

                  # Promedios móviles
                  for win in (3, 6, 12, 24):

                      df[f"{c}_mean{win}h"] = (
                          df[c]
                          .rolling(
                              win,
                              min_periods=win
                          )
                          .mean()
                      )

              # Acumulaciones de precipitación
              if "precipitation" in df.columns:

                  for win in (3, 6, 12, 24):

                      df[f"rain{win}h"] = (
                          df["precipitation"]
                          .rolling(
                              win,
                              min_periods=win
                          )
                          .sum()
                      )

              # Cambios de presión
              if "pressure_msl" in df.columns:

                  df["pressure_drop6h"] = (
                      df["pressure_msl"] -
                      df["pressure_msl"].shift(6)
                  )

                  df["pressure_drop12h"] = (
                      df["pressure_msl"] -
                      df["pressure_msl"].shift(12)
                  )

              # Variables cíclicas
              df["hour_sin"] = np.sin(
                  2 * np.pi *
                  df["time"].dt.hour / 24
              )

              df["hour_cos"] = np.cos(
                  2 * np.pi *
                  df["time"].dt.hour / 24
              )

              df["month_sin"] = np.sin(
                  2 * np.pi *
                  df["time"].dt.month / 12
              )

              df["month_cos"] = np.cos(
                  2 * np.pi *
                  df["time"].dt.month / 12
              )

              return df


          def label_surface(df):

              df = df.copy()

              df["evento_24h"] = 0

              for date, meta in EVENTS.items():

                  d = pd.Timestamp(date)
                  h = meta["hours"]

                  mask = (
                      (df["time"] >= d - pd.Timedelta(hours=h)) &
                      (df["time"] <= d + pd.Timedelta(hours=h))
                  )

                  df.loc[
                      mask,
                      "evento_24h"
                  ] = 1

              return df


          def train_surface():

              path = Path(
                  "data/historico/clima_horario_1980_2026.csv"
              )

              if not path.exists():

                  raise RuntimeError(
                      f"No existe el histórico: {path}"
                  )

              print("")
              print("MODELO 1 - SUPERFICIE")
              print("-" * 50)

              raw = pd.read_csv(path)

              print(
                  f"Filas originales: {len(raw)}"
              )

              df = surface_features(raw)
              df = label_surface(df)

              exclude = {
                  "time",
                  "evento_24h",
                  "station",
                  "station_id",
                  "station_name",
                  "estacion",
                  "estacion_id",
                  "location",
                  "city",
                  "wmo",
                  "wmo_id",
                  "icao",
                  "icao_code",
                  "_dist_bb"
              }

              features = [
                  c for c in df.columns
                  if c not in exclude
              ]

              df = (
                  df
                  .replace(
                      [np.inf, -np.inf],
                      np.nan
                  )
                  .dropna(
                      subset=features + ["evento_24h"]
                  )
                  .sort_values("time")
                  .reset_index(drop=True)
              )

              positives = int(
                  df["evento_24h"].sum()
              )

              print(
                  f"Filas utilizables: {len(df)}"
              )

              print(
                  f"Positivos: {positives}"
              )

              print(
                  f"Variables: {len(features)}"
              )

              if positives < 30:

                  raise RuntimeError(
                      f"Hay muy pocos positivos: {positives}"
                  )

              # División temporal 80/20
              cutoff = df["time"].quantile(0.80)

              train = df[
                  df["time"] < cutoff
              ]

              test = df[
                  df["time"] >= cutoff
              ]

              print(
                  f"Entrenamiento: {len(train)}"
              )

              print(
                  f"Prueba: {len(test)}"
              )

              print(
                  f"Positivos train: "
                  f"{int(train['evento_24h'].sum())}"
              )

              print(
                  f"Positivos test: "
                  f"{int(test['evento_24h'].sum())}"
              )

              if train["evento_24h"].sum() < 10:

                  raise RuntimeError(
                      "No hay suficientes eventos "
                      "positivos en entrenamiento."
                  )

              if test["evento_24h"].sum() < 5:

                  raise RuntimeError(
                      "No hay suficientes eventos "
                      "positivos en prueba."
                  )

              model = RandomForestClassifier(
                  n_estimators=800,
                  max_features="sqrt",
                  min_samples_leaf=5,
                  class_weight="balanced_subsample",
                  random_state=42,
                  n_jobs=-1
              )

              print("")
              print("Entrenando Random Forest de superficie...")

              model.fit(
                  train[features],
                  train["evento_24h"]
              )

              probability = model.predict_proba(
                  test[features]
              )[:, 1]

              prediction = (
                  probability >= 0.50
              ).astype(int)

              metrics = {
                  "roc_auc": float(
                      roc_auc_score(
                          test["evento_24h"],
                          probability
                      )
                  ),
                  "average_precision": float(
                      average_precision_score(
                          test["evento_24h"],
                          probability
                      )
                  ),
                  "precision_0_50": float(
                      precision_score(
                          test["evento_24h"],
                          prediction,
                          zero_division=0
                      )
                  ),
                  "recall_0_50": float(
                      recall_score(
                          test["evento_24h"],
                          prediction,
                          zero_division=0
                      )
                  ),
                  "f1_0_50": float(
                      f1_score(
                          test["evento_24h"],
                          prediction,
                          zero_division=0
                      )
                  ),
                  "train_rows": int(len(train)),
                  "test_rows": int(len(test)),
                  "train_positive": int(
                      train["evento_24h"].sum()
                  ),
                  "test_positive": int(
                      test["evento_24h"].sum()
                  )
              }

              artifact = {
                  "version":
                      "climaar_predictor_hibrido_superficie_v4",
                  "model": model,
                  "features": features,
                  "horizon_hours": 24,
                  "location": {
                      "name": "Bahia Blanca",
                      "lat": LAT,
                      "lon": LON
                  },
                  "metrics": metrics
              }

              joblib.dump(
                  artifact,
                  OUT /
                  "climaar_predictor_hibrido_superficie_v4.joblib"
              )

              importance = pd.DataFrame({
                  "variable": features,
                  "importancia":
                      model.feature_importances_
              }).sort_values(
                  "importancia",
                  ascending=False
              )

              importance.to_csv(
                  OUT /
                  "importancia_hibrido_superficie_v4.csv",
                  index=False
              )

              print("")
              print("METRICAS SUPERFICIE")
              print(json.dumps(
                  metrics,
                  indent=2
              ))

              return metrics


          # ============================================================
          # MODELO CONVECTIVO
          # ============================================================

          def train_convective():

              path = Path(
                  "data/eventos_severos/"
                  "variables_convectivas_2023_2025.csv"
              )

              if not path.exists():

                  raise RuntimeError(
                      f"No existe el dataset convectivo: {path}"
                  )

              print("")
              print("MODELO 2 - CONVECTIVO")
              print("-" * 50)

              df = pd.read_csv(path)

              df["time"] = pd.to_datetime(
                  df["time"],
                  errors="coerce"
              )

              print(
                  f"Filas convectivas: {len(df)}"
              )

              # Conversión numérica
              for c in df.columns:

                  if c != "time":

                      df[c] = pd.to_numeric(
                          df[c],
                          errors="coerce"
                      )

              # Etiqueta
              df["evento"] = 0

              for date, hours in [
                  ("2023-12-16", 24),
                  ("2025-03-07", 48)
              ]:

                  d = pd.Timestamp(date)

                  mask = (
                      (df["time"] >= d - pd.Timedelta(hours=hours)) &
                      (df["time"] <= d + pd.Timedelta(hours=12))
                  )

                  df.loc[
                      mask,
                      "evento"
                  ] = 1

              # Shear 850-500
              if {
                  "wind_speed_850hPa",
                  "wind_speed_500hPa"
              }.issubset(df.columns):

                  df["shear_speed_850_500"] = (
                      df["wind_speed_850hPa"] -
                      df["wind_speed_500hPa"]
                  ).abs()

              # Diferencia térmica 850-500
              if {
                  "temperature_850hPa",
                  "temperature_500hPa"
              }.issubset(df.columns):

                  df["lapse_850_500"] = (
                      df["temperature_850hPa"] -
                      df["temperature_500hPa"]
                  )

              # Tendencias convectivas
              for c in [
                  "cape",
                  "lifted_index",
                  "convective_inhibition",
                  "freezing_level_height",
                  "boundary_layer_height",
                  "total_column_integrated_water_vapour"
              ]:

                  if c not in df.columns:
                      continue

                  df[f"{c}_chg3h"] = (
                      df[c] -
                      df[c].shift(3)
                  )

              features = [
                  c for c in df.columns
                  if c not in {
                      "time",
                      "evento"
                  }
              ]

              df = (
                  df
                  .replace(
                      [np.inf, -np.inf],
                      np.nan
                  )
                  .dropna(
                      subset=features + ["evento"]
                  )
                  .sort_values("time")
                  .reset_index(drop=True)
              )

              positives = int(
                  df["evento"].sum()
              )

              print(
                  f"Filas utilizables: {len(df)}"
              )

              print(
                  f"Positivos: {positives}"
              )

              print(
                  f"Variables: {len(features)}"
              )

              if positives < 20:

                  raise RuntimeError(
                      "Muy pocos positivos en "
                      "modelo convectivo."
                  )

              # --------------------------------------------------------
              # VALIDACION DEJANDO UN EVENTO AFUERA
              # --------------------------------------------------------

              validation = {}

              for event_date in [
                  "2023-12-16",
                  "2025-03-07"
              ]:

                  d = pd.Timestamp(event_date)

                  event_window = (
                      (df["time"] >= d - pd.Timedelta(hours=72)) &
                      (df["time"] <= d + pd.Timedelta(hours=24))
                  )

                  train = df[
                      ~event_window
                  ]

                  test = df[
                      event_window
                  ]

                  if train["evento"].sum() < 10:
                      continue

                  if test["evento"].sum() < 5:
                      continue

                  model = RandomForestClassifier(
                      n_estimators=500,
                      max_features="sqrt",
                      min_samples_leaf=3,
                      class_weight="balanced_subsample",
                      random_state=42,
                      n_jobs=-1
                  )

                  model.fit(
                      train[features],
                      train["evento"]
                  )

                  probability = model.predict_proba(
                      test[features]
                  )[:, 1]

                  validation[event_date] = {
                      "roc_auc": float(
                          roc_auc_score(
                              test["evento"],
                              probability
                          )
                      ),
                      "average_precision": float(
                          average_precision_score(
                              test["evento"],
                              probability
                          )
                      ),
                      "test_rows": int(
                          len(test)
                      ),
                      "test_positive": int(
                          test["evento"].sum()
                      )
                  }

                  print("")
                  print(
                      f"Validacion {event_date}:"
                  )

                  print(
                      json.dumps(
                          validation[event_date],
                          indent=2
                      )
                  )

              # --------------------------------------------------------
              # MODELO FINAL
              # --------------------------------------------------------

              final_model = RandomForestClassifier(
                  n_estimators=700,
                  max_features="sqrt",
                  min_samples_leaf=3,
                  class_weight="balanced_subsample",
                  random_state=42,
                  n_jobs=-1
              )

              print("")
              print(
                  "Entrenando modelo convectivo final..."
              )

              final_model.fit(
                  df[features],
                  df["evento"]
              )

              artifact = {
                  "version":
                      "climaar_predictor_convectivo_v1",
                  "model": final_model,
                  "features": features,
                  "location": {
                      "name": "Bahia Blanca",
                      "lat": LAT,
                      "lon": LON
                  },
                  "events_used": [
                      "2023-12-16",
                      "2025-03-07"
                  ],
                  "validation":
                      validation
              }

              joblib.dump(
                  artifact,
                  OUT /
                  "climaar_predictor_convectivo_v1.joblib"
              )

              importance = pd.DataFrame({
                  "variable": features,
                  "importancia":
                      final_model.feature_importances_
              }).sort_values(
                  "importancia",
                  ascending=False
              )

              importance.to_csv(
                  OUT /
                  "importancia_convectiva_v1.csv",
                  index=False
              )

              return {
                  "rows": int(len(df)),
                  "positive": positives,
                  "variables": len(features),
                  "validation": validation
              }


          # ============================================================
          # EJECUCION
          # ============================================================

          surface_metrics = train_surface()

          convective_metrics = train_convective()

          report = {
              "version":
                  "climaar_modelo_hibrido_v4",

              "ubicacion": {
                  "nombre": "Bahia Blanca",
                  "latitud": LAT,
                  "longitud": LON
              },

              "eventos": {
                  "2019-12-30":
                      "tormenta severa regional",
                  "2023-12-16":
                      "viento destructivo",
                  "2025-03-07":
                      "lluvia extrema e inundacion"
              },

              "modelo_superficie":
                  surface_metrics,

              "modelo_convectivo":
                  convective_metrics,

              "referencias_oficiales": {
                  "2023_rafaga_max_kmh": 155,
                  "2025_lluvia_6h_mm": 210,
                  "2025_lluvia_12h_mm": 290,
                  "2025_total_evento_mm": 312
              },

              "criterios": [
                  "2019 se utiliza solamente en superficie",
                  "No se inventan variables convectivas para 2019",
                  "La validacion es temporal",
                  "El modelo convectivo utiliza 2023 y 2025",
                  "El radar se incorporara posteriormente "
                  "cuando exista una secuencia suficiente"
              ]
          }

          with open(
              OUT /
              "reporte_modelo_hibrido_v4.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  report,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("=" * 70)
          print("ENTRENAMIENTO COMPLETADO")
          print("=" * 70)

          print(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

          python /tmp/entrenar_modelo.py

      - name: Validar artefactos
        run: |
          test -s modelo/climaar_predictor_hibrido_superficie_v4.joblib
          test -s modelo/climaar_predictor_convectivo_v1.joblib
          test -s modelo/importancia_hibrido_superficie_v4.csv
          test -s modelo/importancia_convectiva_v1.csv
          test -s modelo/reporte_modelo_hibrido_v4.json

      - name: Guardar resultados
        run: |
          git config user.name "climaar-bot"
          git config user.email "climaar-bot@users.noreply.github.com"

          git add modelo

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            git commit -m "Entrenar modelo hibrido V4"
            git push
          fi
