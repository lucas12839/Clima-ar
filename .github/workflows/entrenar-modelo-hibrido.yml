name: Entrenar modelos ClimaAR V8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  entrenar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Verificar datos históricos
        run: |
          test -s data/historico/clima_horario_1980_2026.csv
          test -s data/eventos_severos/variables_convectivas_2023_2025.csv

      - name: Verificar entrenador
        run: |
          test -s scripts/entrenar_modelo_hibrido_v6.py

      - name: Entrenar modelos ClimaAR
        run: |
          python scripts/entrenar_modelo_hibrido_v6.py

      - name: Validar modelos generados
        run: |
          test -s modelo/climaar_predictor_hibrido_superficie_v6.joblib
          test -s modelo/climaar_predictor_formacion_v8.joblib
          test -s modelo/climaar_predictor_intensificacion_v8.joblib
          test -s modelo/climaar_predictor_impacto_v8.joblib

      - name: Validar informes
        run: |
          test -s modelo/importancia_hibrido_superficie_v6.csv
          test -s modelo/reporte_modelo_hibrido_v6.json
          test -s modelo/reporte_modelo_hibrido_v8.json

      - name: Verificar modelos con Python
        run: |
          python - <<'PY'
          import json
          import joblib
          from pathlib import Path

          modelos = [
              "modelo/climaar_predictor_hibrido_superficie_v6.joblib",
              "modelo/climaar_predictor_formacion_v8.joblib",
              "modelo/climaar_predictor_intensificacion_v8.joblib",
              "modelo/climaar_predictor_impacto_v8.joblib",
          ]

          for archivo in modelos:
              ruta = Path(archivo)

              if not ruta.exists():
                  raise SystemExit(f"ERROR: falta {archivo}")

              modelo = joblib.load(ruta)

              if modelo is None:
                  raise SystemExit(f"ERROR: modelo vacío {archivo}")

              print(f"OK: {archivo}")

          reportes = [
              "modelo/reporte_modelo_hibrido_v6.json",
              "modelo/reporte_modelo_hibrido_v8.json",
          ]

          for archivo in reportes:
              ruta = Path(archivo)

              with ruta.open("r", encoding="utf-8") as f:
                  datos = json.load(f)

              if not isinstance(datos, dict):
                  raise SystemExit(
                      f"ERROR: reporte inválido {archivo}"
                  )

              print(f"OK: {archivo}")

          print("====================================")
          print("ENTRENAMIENTO CLIMAAR V8 VALIDADO")
          print("Modelos:", len(modelos))
          print("Reportes:", len(reportes))
          print("====================================")
          PY

      - name: Verificar cambios
        run: |
          git diff --check

      - name: Guardar modelos
        run: |
          git config user.name "ClimaAR Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add modelo/

          if git diff --cached --quiet; then
            echo "No hay nuevos modelos para guardar."
            exit 0
          fi

          git commit -m "Entrenar modelos predictivos ClimaAR V8"

      - name: Sincronizar y publicar
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
