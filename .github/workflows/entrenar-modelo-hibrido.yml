name: ClimaAR - Entrenamiento Hibrido V5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  entrenamiento:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Entrenar modelos ClimaAR
        shell: bash
        run: |
          cat > /tmp/entrenar_modelo.py <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd
          import joblib

          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import (
              roc_auc_score,
              average_precision_score,
              precision_score,
              recall_score,
              f1_score
          )

          LAT = -38.71
          LON = -62.26

          OUT = Path("modelo")
          OUT.mkdir(exist_ok=True)

          EVENT_DATES = [
              pd.Timestamp("2019-12-30"),
              pd.Timestamp("2023-12-16"),
              pd.Timestamp("2025-03-07")
          ]

          EVENT_TYPES = {
              "2019-12-30": "tormenta_severa_regional",
              "2023-12-16": "viento_destructivo",
              "2025-03-07": "lluvia_extrema_inundacion"
          }

          print("=" * 70)
          print("CLIMAAR - ENTRENAMIENTO HIBRIDO V5")
          print("=" * 70)
          print("Bahia Blanca:", LAT, LON)
          print("Eventos:", [str(x.date()) for x in EVENT_DATES])

          # ============================================================
          # FUNCIONES GENERALES
          # ============================================================

          def safe_auc(y, p):
              if len(np.unique(y)) < 2:
                  return None
              return float(
                  roc_auc_score(y, p)
              )


          def safe_ap(y, p):
              if len(np.unique(y)) < 2:
                  return None
              return float(
                  average_precision_score(y, p)
              )


          def metrics_binary(y, p, threshold=0.50):

              pred = (
                  np.asarray(p) >= threshold
              ).astype(int)

              return {
                  "roc_auc": safe_auc(y, p),
                  "average_precision": safe_ap(y, p),
                  "precision": float(
                      precision_score(
                          y,
                          pred,
                          zero_division=0
                      )
                  ),
                  "recall": float(
                      recall_score(
                          y,
                          pred,
                          zero_division=0
                      )
                  ),
                  "f1": float(
                      f1_score(
                          y,
                          pred,
                          zero_division=0
                      )
                  ),
                  "threshold": threshold
              }


          # ============================================================
          # MODELO DE SUPERFICIE
          # ============================================================

          def build_surface_features(df):

              df = df.copy()

              df["time"] = pd.to_datetime(
                  df["time"],
                  errors="coerce"
              )

              for c in df.columns:

                  if c != "time":

                      df[c] = pd.to_numeric(
                          df[c],
                          errors="coerce"
                      )

              # --------------------------------------------------------
              # VIENTO U/V
              # --------------------------------------------------------

              if {
                  "wind_speed_10m",
                  "wind_direction_10m"
              }.issubset(df.columns):

                  rad = np.deg2rad(
                      df["wind_direction_10m"]
                  )

                  df["wind_u"] = (
                      df["wind_speed_10m"] *
                      np.sin(rad)
                  )

                  df["wind_v"] = (
                      df["wind_speed_10m"] *
                      np.cos(rad)
                  )

              # --------------------------------------------------------
              # HUMEDAD / PUNTO DE ROCIO
              # --------------------------------------------------------

              if {
                  "temperature_2m",
                  "dew_point_2m"
              }.issubset(df.columns):

                  df["dew_spread"] = (
                      df["temperature_2m"] -
                      df["dew_point_2m"]
                  )

              base = [
                  "temperature_2m",
                  "relative_humidity_2m",
                  "dew_point_2m",
                  "pressure_msl",
                  "precipitation",
                  "wind_speed_10m",
                  "wind_gusts_10m",
                  "dew_spread",
                  "wind_u",
                  "wind_v"
              ]

              # --------------------------------------------------------
              # CAMBIOS TEMPORALES
              # --------------------------------------------------------

              for c in base:

                  if c not in df.columns:
                      continue

                  for lag in (1, 3, 6, 12, 24):

                      df[f"{c}_chg{lag}h"] = (
                          df[c] -
                          df[c].shift(lag)
                      )

              # --------------------------------------------------------
              # MEDIAS MOVILES
              # --------------------------------------------------------

              for c in base:

                  if c not in df.columns:
                      continue

                  for win in (3, 6, 12, 24):

                      df[f"{c}_mean{win}h"] = (
                          df[c]
                          .rolling(
                              win,
                              min_periods=win
                          )
                          .mean()
                      )

              # --------------------------------------------------------
              # PRECIPITACION ACUMULADA
              # --------------------------------------------------------

              if "precipitation" in df.columns:

                  for win in (3, 6, 12, 24):

                      df[f"rain{win}h"] = (
                          df["precipitation"]
                          .rolling(
                              win,
                              min_periods=win
                          )
                          .sum()
                      )

              # --------------------------------------------------------
              # CAIDA DE PRESION
              # --------------------------------------------------------

              if "pressure_msl" in df.columns:

                  df["pressure_drop3h"] = (
                      df["pressure_msl"] -
                      df["pressure_msl"].shift(3)
                  )

                  df["pressure_drop6h"] = (
                      df["pressure_msl"] -
                      df["pressure_msl"].shift(6)
                  )

                  df["pressure_drop12h"] = (
                      df["pressure_msl"] -
                      df["pressure_msl"].shift(12)
                  )

                  df["pressure_drop24h"] = (
                      df["pressure_msl"] -
                      df["pressure_msl"].shift(24)
                  )

              # --------------------------------------------------------
              # CICLO DIARIO / ANUAL
              # --------------------------------------------------------

              df["hour_sin"] = np.sin(
                  2 * np.pi *
                  df["time"].dt.hour / 24
              )

              df["hour_cos"] = np.cos(
                  2 * np.pi *
                  df["time"].dt.hour / 24
              )

              df["month_sin"] = np.sin(
                  2 * np.pi *
                  df["time"].dt.month / 12
              )

              df["month_cos"] = np.cos(
                  2 * np.pi *
                  df["time"].dt.month / 12
              )

              return df


          def create_surface_target(df):

              df = df.copy()

              df["evento_proximas_24h"] = 0

              # La etiqueta significa:
              # desde esta observacion hasta las proximas 24 h
              # ocurre uno de los eventos conocidos.

              for event_date in EVENT_DATES:

                  start = event_date - pd.Timedelta(hours=24)
                  end = event_date

                  mask = (
                      (df["time"] >= start) &
                      (df["time"] < end)
                  )

                  df.loc[
                      mask,
                      "evento_proximas_24h"
                  ] = 1

              return df


          def train_surface():

              print("")
              print("=" * 70)
              print("MODELO 1 - SUPERFICIE")
              print("=" * 70)

              path = Path(
                  "data/historico/clima_horario_1980_2026.csv"
              )

              if not path.exists():

                  raise RuntimeError(
                      f"No existe: {path}"
                  )

              raw = pd.read_csv(path)

              print(
                  "Filas originales:",
                  len(raw)
              )

              df = build_surface_features(
                  raw
              )

              df = create_surface_target(
                  df
              )

              exclude = {
                  "time",
                  "evento_proximas_24h",
                  "station",
                  "station_id",
                  "station_name",
                  "estacion",
                  "estacion_id",
                  "location",
                  "city",
                  "wmo",
                  "wmo_id",
                  "icao",
                  "icao_code",
                  "_dist_bb"
              }

              features = [
                  c for c in df.columns
                  if c not in exclude
              ]

              df = (
                  df
                  .replace(
                      [np.inf, -np.inf],
                      np.nan
                  )
                  .dropna(
                      subset=features +
                      ["evento_proximas_24h"]
                  )
                  .sort_values("time")
                  .reset_index(drop=True)
              )

              print(
                  "Filas utilizables:",
                  len(df)
              )

              print(
                  "Variables:",
                  len(features)
              )

              print(
                  "Positivos:",
                  int(
                      df["evento_proximas_24h"].sum()
                  )
              )

              # --------------------------------------------------------
              # VALIDACION LEAVE-ONE-EVENT-OUT
              # --------------------------------------------------------

              validation = {}

              for event_date in EVENT_DATES:

                  # Ventana de prueba:
                  # 48 h antes del evento hasta 24 h despues.
                  test_start = (
                      event_date -
                      pd.Timedelta(hours=48)
                  )

                  test_end = (
                      event_date +
                      pd.Timedelta(hours=24)
                  )

                  test_mask = (
                      (df["time"] >= test_start) &
                      (df["time"] <= test_end)
                  )

                  test = df[test_mask]
                  train = df[~test_mask]

                  print("")
                  print(
                      "Validando evento:",
                      event_date.date()
                  )

                  print(
                      "Train:",
                      len(train),
                      "Test:",
                      len(test)
                  )

                  train_pos = int(
                      train[
                          "evento_proximas_24h"
                      ].sum()
                  )

                  test_pos = int(
                      test[
                          "evento_proximas_24h"
                      ].sum()
                  )

                  print(
                      "Positivos train:",
                      train_pos
                  )

                  print(
                      "Positivos test:",
                      test_pos
                  )

                  if train_pos < 10:

                      print(
                          "SKIP: pocos positivos "
                          "para este bloque."
                      )

                      continue

                  if test_pos < 5:

                      print(
                          "SKIP: pocos positivos "
                          "en prueba."
                      )

                      continue

                  model = RandomForestClassifier(
                      n_estimators=600,
                      max_features="sqrt",
                      min_samples_leaf=5,
                      class_weight="balanced_subsample",
                      random_state=42,
                      n_jobs=-1
                  )

                  model.fit(
                      train[features],
                      train[
                          "evento_proximas_24h"
                      ]
                  )

                  probability = (
                      model.predict_proba(
                          test[features]
                      )[:, 1]
                  )

                  m = metrics_binary(
                      test[
                          "evento_proximas_24h"
                      ],
                      probability
                  )

                  m["test_rows"] = int(
                      len(test)
                  )

                  m["train_rows"] = int(
                      len(train)
                  )

                  m["train_positive"] = train_pos
                  m["test_positive"] = test_pos

                  validation[
                      str(event_date.date())
                  ] = m

                  print(
                      json.dumps(
                          m,
                          indent=2
                      )
                  )

              if not validation:

                  raise RuntimeError(
                      "No se pudo validar ningun evento."
                  )

              # --------------------------------------------------------
              # MODELO FINAL
              # --------------------------------------------------------

              print("")
              print(
                  "Entrenando modelo final "
                  "de superficie con los 3 eventos..."
              )

              final_model = RandomForestClassifier(
                  n_estimators=1000,
                  max_features="sqrt",
                  min_samples_leaf=5,
                  class_weight="balanced_subsample",
                  random_state=42,
                  n_jobs=-1
              )

              final_model.fit(
                  df[features],
                  df[
                      "evento_proximas_24h"
                  ]
              )

              artifact = {
                  "version":
                      "climaar_predictor_hibrido_superficie_v5",

                  "model":
                      final_model,

                  "features":
                      features,

                  "horizon_hours":
                      24,

                  "location": {
                      "name":
                          "Bahia Blanca",
                      "lat":
                          LAT,
                      "lon":
                          LON
                  },

                  "events":
                      [
                          str(x.date())
                          for x in EVENT_DATES
                      ],

                  "validation":
                      validation
              }

              joblib.dump(
                  artifact,
                  OUT /
                  "climaar_predictor_hibrido_superficie_v5.joblib"
              )

              importance = pd.DataFrame({
                  "variable":
                      features,
                  "importancia":
                      final_model.feature_importances_
              }).sort_values(
                  "importancia",
                  ascending=False
              )

              importance.to_csv(
                  OUT /
                  "importancia_hibrido_superficie_v5.csv",
                  index=False
              )

              return {
                  "rows":
                      int(len(df)),

                  "positive":
                      int(
                          df[
                              "evento_proximas_24h"
                          ].sum()
                      ),

                  "variables":
                      len(features),

                  "validation":
                      validation
              }


          # ============================================================
          # MODELO CONVECTIVO
          # ============================================================

          def train_convective():

              print("")
              print("=" * 70)
              print("MODELO 2 - CONVECTIVO")
              print("=" * 70)

              path = Path(
                  "data/eventos_severos/"
                  "variables_convectivas_2023_2025.csv"
              )

              if not path.exists():

                  raise RuntimeError(
                      f"No existe: {path}"
                  )

              df = pd.read_csv(path)

              df["time"] = pd.to_datetime(
                  df["time"],
                  errors="coerce"
              )

              for c in df.columns:

                  if c != "time":

                      df[c] = pd.to_numeric(
                          df[c],
                          errors="coerce"
                      )

              print(
                  "Filas originales:",
                  len(df)
              )

              # --------------------------------------------------------
              # ETIQUETA CONVECTIVA
              # --------------------------------------------------------

              df["evento"] = 0

              for event_date, hours in [
                  (
                      pd.Timestamp("2023-12-16"),
                      24
                  ),
                  (
                      pd.Timestamp("2025-03-07"),
                      48
                  )
              ]:

                  start = (
                      event_date -
                      pd.Timedelta(hours=hours)
                  )

                  end = event_date

                  mask = (
                      (df["time"] >= start) &
                      (df["time"] < end)
                  )

                  df.loc[
                      mask,
                      "evento"
                  ] = 1

              # --------------------------------------------------------
              # SHEAR
              # --------------------------------------------------------

              if {
                  "wind_speed_850hPa",
                  "wind_speed_500hPa"
              }.issubset(df.columns):

                  df["shear_speed_850_500"] = (
                      df["wind_speed_850hPa"] -
                      df["wind_speed_500hPa"]
                  ).abs()

              # --------------------------------------------------------
              # GRADIENTE TERMICO
              # --------------------------------------------------------

              if {
                  "temperature_850hPa",
                  "temperature_500hPa"
              }.issubset(df.columns):

                  df["lapse_850_500"] = (
                      df["temperature_850hPa"] -
                      df["temperature_500hPa"]
                  )

              # --------------------------------------------------------
              # TENDENCIAS
              # --------------------------------------------------------

              for c in [
                  "cape",
                  "lifted_index",
                  "convective_inhibition",
                  "freezing_level_height",
                  "boundary_layer_height",
                  "total_column_integrated_water_vapour"
              ]:

                  if c not in df.columns:
                      continue

                  df[f"{c}_chg3h"] = (
                      df[c] -
                      df[c].shift(3)
                  )

              features = [
                  c for c in df.columns
                  if c not in {
                      "time",
                      "evento"
                  }
              ]

              df = (
                  df
                  .replace(
                      [np.inf, -np.inf],
                      np.nan
                  )
                  .dropna(
                      subset=features +
                      ["evento"]
                  )
                  .sort_values("time")
                  .reset_index(drop=True)
              )

              print(
                  "Filas utilizables:",
                  len(df)
              )

              print(
                  "Variables:",
                  len(features)
              )

              print(
                  "Positivos:",
                  int(df["evento"].sum())
              )

              # --------------------------------------------------------
              # LEAVE-ONE-EVENT-OUT
              # --------------------------------------------------------

              validation = {}

              for event_date in [
                  pd.Timestamp("2023-12-16"),
                  pd.Timestamp("2025-03-07")
              ]:

                  test_start = (
                      event_date -
                      pd.Timedelta(hours=72)
                  )

                  test_end = (
                      event_date +
                      pd.Timedelta(hours=24)
                  )

                  test_mask = (
                      (df["time"] >= test_start) &
                      (df["time"] <= test_end)
                  )

                  test = df[test_mask]
                  train = df[~test_mask]

                  train_pos = int(
                      train["evento"].sum()
                  )

                  test_pos = int(
                      test["evento"].sum()
                  )

                  print("")
                  print(
                      "Validando convectivo:",
                      event_date.date()
                  )

                  print(
                      "Train:",
                      len(train),
                      "Test:",
                      len(test)
                  )

                  print(
                      "Positivos train:",
                      train_pos,
                      "Positivos test:",
                      test_pos
                  )

                  if train_pos < 5:
                      continue

                  if test_pos < 5:
                      continue

                  model = RandomForestClassifier(
                      n_estimators=500,
                      max_features="sqrt",
                      min_samples_leaf=3,
                      class_weight="balanced_subsample",
                      random_state=42,
                      n_jobs=-1
                  )

                  model.fit(
                      train[features],
                      train["evento"]
                  )

                  probability = (
                      model.predict_proba(
                          test[features]
                      )[:, 1]
                  )

                  m = metrics_binary(
                      test["evento"],
                      probability
                  )

                  m["train_rows"] = int(
                      len(train)
                  )

                  m["test_rows"] = int(
                      len(test)
                  )

                  m["train_positive"] = train_pos
                  m["test_positive"] = test_pos

                  validation[
                      str(event_date.date())
                  ] = m

                  print(
                      json.dumps(
                          m,
                          indent=2
                      )
                  )

              # --------------------------------------------------------
              # MODELO CONVECTIVO FINAL
              # --------------------------------------------------------

              print("")
              print(
                  "Entrenando modelo convectivo final..."
              )

              final_model = RandomForestClassifier(
                  n_estimators=700,
                  max_features="sqrt",
                  min_samples_leaf=3,
                  class_weight="balanced_subsample",
                  random_state=42,
                  n_jobs=-1
              )

              final_model.fit(
                  df[features],
                  df["evento"]
              )

              artifact = {
                  "version":
                      "climaar_predictor_convectivo_v2",

                  "model":
                      final_model,

                  "features":
                      features,

                  "location": {
                      "name":
                          "Bahia Blanca",
                      "lat":
                          LAT,
                      "lon":
                          LON
                  },

                  "events":
                      [
                          "2023-12-16",
                          "2025-03-07"
                      ],

                  "validation":
                      validation
              }

              joblib.dump(
                  artifact,
                  OUT /
                  "climaar_predictor_convectivo_v2.joblib"
              )

              importance = pd.DataFrame({
                  "variable":
                      features,
                  "importancia":
                      final_model.feature_importances_
              }).sort_values(
                  "importancia",
                  ascending=False
              )

              importance.to_csv(
                  OUT /
                  "importancia_convectiva_v2.csv",
                  index=False
              )

              return {
                  "rows":
                      int(len(df)),

                  "positive":
                      int(
                          df["evento"].sum()
                      ),

                  "variables":
                      len(features),

                  "validation":
                      validation
              }


          # ============================================================
          # EJECUCION FINAL
          # ============================================================

          surface_result = train_surface()

          convective_result = train_convective()

          report = {
              "version":
                  "climaar_modelo_hibrido_v5",

              "ubicacion": {
                  "nombre":
                      "Bahia Blanca",

                  "latitud":
                      LAT,

                  "longitud":
                      LON
              },

              "eventos": EVENT_TYPES,

              "superficie":
                  surface_result,

              "convectivo":
                  convective_result,

              "referencias_oficiales": {
                  "2023_rafaga_max_kmh":
                      155,

                  "2025_lluvia_6h_mm":
                      210,

                  "2025_lluvia_12h_mm":
                      290,

                  "2025_total_evento_mm":
                      312
              },

              "criterios": [
                  "La prediccion de superficie representa "
                  "un evento en las proximas 24 horas.",

                  "La validacion utiliza "
                  "Leave-One-Event-Out.",

                  "2019 se usa como evento regional "
                  "solamente en superficie.",

                  "No se inventan variables convectivas "
                  "para 2019.",

                  "El modelo final se entrena con "
                  "todos los eventos disponibles.",

                  "El radar se incorporara posteriormente "
                  "como capa de nowcasting."
              ]
          }

          with open(
              OUT /
              "reporte_modelo_hibrido_v5.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  report,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("=" * 70)
          print("ENTRENAMIENTO COMPLETADO")
          print("=" * 70)

          print(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

          python /tmp/entrenar_modelo.py

      - name: Validar artefactos
        run: |
          test -s modelo/climaar_predictor_hibrido_superficie_v5.joblib
          test -s modelo/climaar_predictor_convectivo_v2.joblib
          test -s modelo/importancia_hibrido_superficie_v5.csv
          test -s modelo/importancia_convectiva_v2.csv
          test -s modelo/reporte_modelo_hibrido_v5.json

      - name: Guardar resultados
        run: |
          git config user.name "climaar-bot"
          git config user.email "climaar-bot@users.noreply.github.com"

          git add modelo

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Entrenar modelo hibrido V5"
            git push
          fi
