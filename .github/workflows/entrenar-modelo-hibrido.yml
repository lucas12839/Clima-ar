name: ClimaAR Entrenamiento Modelo Híbrido

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climaar-modelos
  cancel-in-progress: false

jobs:
  entrenamiento-hibrido:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar estructura
        run: |
          set -euo pipefail

          if [ ! -d data ]; then
            echo "ERROR: no existe data/"
            exit 1
          fi

          if [ ! -d scripts ]; then
            echo "ERROR: no existe scripts/"
            exit 1
          fi

          echo "Estructura básica válida."

      - name: Buscar entrenador híbrido
        run: |
          set -euo pipefail

          if [ -f scripts/entrenar_modelo_hibrido.py ]; then
            echo "ENTRENADOR=scripts/entrenar_modelo_hibrido.py" >> "$GITHUB_ENV"
          elif [ -f scripts/entrenamiento_hibrido.py ]; then
            echo "ENTRENADOR=scripts/entrenamiento_hibrido.py" >> "$GITHUB_ENV"
          else
            echo "ERROR: no se encontró el entrenador del modelo híbrido."
            exit 1
          fi

          echo "Entrenador seleccionado: $ENTRENADOR"

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            modelo \
            data/radar/seguimiento \
            logs

      - name: Entrenar modelo híbrido
        run: |
          set -euo pipefail

          python "$ENTRENADOR"

      - name: Verificar modelos generados
        run: |
          set -euo pipefail

          encontrados=0

          while IFS= read -r -d '' archivo; do
            echo "Modelo encontrado: $archivo"
            encontrados=$((encontrados + 1))
          done < <(
            find modelo \
              -type f \
              \( \
                -name "*.joblib" \
                -o -name "*.pkl" \
                -o -name "*.json" \
              \) \
              -print0
          )

          if [ "$encontrados" -eq 0 ]; then
            echo "ERROR: el entrenamiento no produjo ningún archivo."
            exit 1
          fi

          echo "Archivos de modelo generados: $encontrados"

      - name: Validar modelos
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import pickle
          from pathlib import Path

          try:
              import joblib
          except ImportError:
              joblib = None

          archivos = list(Path("modelo").rglob("*"))

          validos = 0

          for path in archivos:
              if not path.is_file():
                  continue

              if path.suffix == ".json":
                  try:
                      json.loads(
                          path.read_text(encoding="utf-8")
                      )
                  except Exception as exc:
                      raise SystemExit(
                          f"ERROR: JSON inválido: {path}: {exc}"
                      ) from exc

                  print(f"OK JSON: {path}")
                  validos += 1

              elif path.suffix in {".joblib", ".pkl"}:
                  try:
                      if path.suffix == ".joblib" and joblib:
                          objeto = joblib.load(path)
                      else:
                          with path.open("rb") as archivo:
                              objeto = pickle.load(archivo)
                  except Exception as exc:
                      raise SystemExit(
                          f"ERROR: modelo inválido: {path}: {exc}"
                      ) from exc

                  if objeto is None:
                      raise SystemExit(
                          f"ERROR: modelo vacío: {path}"
                      )

                  print(f"OK modelo: {path}")
                  validos += 1

          if validos == 0:
              raise SystemExit(
                  "ERROR: no se pudo validar ningún modelo."
              )

          print(
              f"Modelos/archivos válidos: {validos}"
          )
          PY

      - name: Validar integridad ClimaAR
        run: |
          set -euo pipefail

          test -f scripts/validar_integridad_climaar.py

          python scripts/validar_integridad_climaar.py

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: climaar-modelo-hibrido
          path: modelo/
          retention-days: 30

      - name: Guardar modelos
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add modelo/

          if git diff --cached --quiet; then
            echo "No hay cambios de modelo para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: actualizar modelo híbrido"

          for intento in 1 2 3; do
            echo "Intento de sincronización: $intento"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true

              if [ "$intento" -eq 3 ]; then
                echo "ERROR: no se pudo completar el rebase."
                exit 1
              fi

              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push exitoso."
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              echo "ERROR: no se pudo publicar el modelo."
              exit 1
            fi

            sleep 2
          done
