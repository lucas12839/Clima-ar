name: Prueba etapa G (temporal)
on:
  push:
    branches: [prueba-etapa-g]
jobs:
  casos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      indices: ${{ steps.c.outputs.indices }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy opencv-python-headless
      - id: c
        run: |
          python herramientas/simular_indicios_eeuu.py casos --anios 2023,2024 --cantidad 60 --salida casos.json
          echo "indices=$(python -c 'import json;print(json.dumps(list(range(len(json.load(open("casos.json")))))))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: casos
          path: casos.json
          retention-days: 3

  caso:
    needs: casos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        i: ${{ fromJson(needs.casos.outputs.indices) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy opencv-python-headless xarray cfgrib eccodes
      - uses: actions/download-artifact@v4
        with:
          name: casos
      - name: Correr el caso
        run: |
          C=$(python -c 'import json,sys;print(json.dumps(json.load(open("casos.json"))[${{ matrix.i }}]))')
          python herramientas/simular_indicios_eeuu.py caso "$C" --salida r.json --envolvente 40
          echo "RESULTADO_G ${{ matrix.i }} $(gzip -c r.json | base64 -w0)"
