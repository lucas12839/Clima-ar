name: Prueba etapa G (temporal)
on:
  push:
    branches: [prueba-etapa-g]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acceso a datos
        run: |
          pip install -q eccodes cfgrib xarray numpy requests 2>&1 | tail -1
          python3 - <<'PY'
          import requests
          for base, modelo in (("https://historical-forecast-api.open-meteo.com/v1/forecast", "ecmwf_ifs025"),
                               ("https://historical-forecast-api.open-meteo.com/v1/forecast", "gfs_seamless"),
                               ("https://archive-api.open-meteo.com/v1/archive", "era5_seamless")):
              q = (f"{base}?latitude=35.2&longitude=-97.4&start_date=2023-06-19&end_date=2023-06-19&models={modelo}"
                   "&hourly=temperature_2m,dew_point_2m,surface_pressure,cape,wind_speed_10m,wind_direction_10m"
                   ",wind_speed_850hPa,wind_direction_850hPa,wind_speed_700hPa,wind_direction_700hPa,wind_speed_500hPa,wind_direction_500hPa")
              r = requests.get(q, timeout=60)
              print(modelo, r.status_code)
              try:
                  d = r.json(); h = d.get("hourly", {})
                  print({k: (v[18:21] if isinstance(v, list) else v) for k, v in h.items()})
              except Exception:
                  print(r.text[:300])
          PY
