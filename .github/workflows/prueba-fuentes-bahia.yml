name: Prueba fuentes Bahía (temporal)
on:
  push:
    branches: [prueba-fuentes-bahia]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Estaciones SIMPARH cerca de Bahía
        run: |
          python3 - <<'PY'
          import json, math, re, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0 ClimaAR/1.0"}
          B = "https://public-map-simparh.ada.gba.gov.ar"
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read().decode("utf-8", "replace")
          h = get(B + "/")
          emas = json.loads(re.search(r"window.MAP_DATA_EMAS = (\[.*?\]);", h, re.S).group(1))
          print("total", len(emas)); print("campos", sorted(emas[0].keys()))
          def km(a, b, c, d):
              p1, p2 = math.radians(a), math.radians(c)
              x = math.sin((p2-p1)/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(math.radians(d-b)/2)**2
              return 2*6371*math.asin(math.sqrt(x))
          cerca = []
          for e in emas:
              lat = e.get("lat") or e.get("latitud"); lon = e.get("lon") or e.get("lng") or e.get("longitud")
              try: d = km(-38.7342, -62.1654, float(lat), float(lon))
              except Exception: continue
              if d <= 130: cerca.append((round(d,1), e))
          cerca.sort(key=lambda x: x[0])
          for d, e in cerca:
              print(f"\n{d} km", json.dumps(e, ensure_ascii=False)[:700])
          print("\n=== estado y datos de las cercanas")
          for d, e in cerca[:25]:
              try:
                  s = get(B + "/api/map-status/" + urllib.parse.quote(str(e["id"])))
                  print(e["id"], d, "km:", s[:500])
              except Exception as x:
                  print(e["id"], "error", x)
          PY
