name: Prueba fuentes Bahía (temporal)
on:
  push:
    branches: [prueba-fuentes-bahia]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mapa SIMPARH
        run: |
          UA="Mozilla/5.0 ClimaAR/1.0"
          B=https://public-map-simparh.ada.gba.gov.ar
          curl -sS -L -m 30 -A "$UA" "$B/" -o i.html
          curl -sS -L -m 30 -A "$UA" "$B/static/js/mapa_interactivo.js" -o a.js
          echo "--- fetch en el js"; grep -n "fetch(\|/api/" a.js | head -30
          echo "--- datos en el html"; grep -n "emas\|EMAS\|estaciones\|JSON.parse\|const data" i.html | cut -c1-300 | head -20
          python3 - <<'PY'
          import re, json
          h = open("i.html", encoding="utf-8", errors="replace").read()
          m = re.search(r"(\[\s*\{[^<]{200,}?\}\s*\])", h, re.S)
          if m:
              txt = m.group(1)
              print("lista embebida, largo", len(txt)); print(txt[:1500])
          PY
          for p in "/api/map-status/1" "/api/emas" "/api/estaciones" "/api/get-chart-data"; do
            echo "=== $p"; curl -sS -m 30 -A "$UA" "$B$p" -w "\nHTTP %{http_code}\n" | head -c 800; echo
          done
