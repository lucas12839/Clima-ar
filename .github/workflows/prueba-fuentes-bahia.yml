name: Prueba fuentes Bahía (temporal)
on:
  push:
    branches: [prueba-fuentes-bahia]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Historial SIMPARH
        run: |
          B=https://public-map-simparh.ada.gba.gov.ar
          curl -sS -m 30 -A "Mozilla/5.0 ClimaAR/1.0" "$B/static/js/mapa_interactivo.js" -o a.js
          sed -n '260,300p;530,560p' a.js
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0 ClimaAR/1.0"}
          B = "https://public-map-simparh.ada.gba.gov.ar"
          def get(p):
              try:
                  return urllib.request.urlopen(urllib.request.Request(B + p, headers=UA), timeout=40).read().decode("utf-8", "replace")
              except Exception as e:
                  return f"ERROR {e}"
          for est in ("CEREAL-29", "SNIH-220272"):
              for q in ({"ema_id": est, "metrica": "precipitaciondiaria", "dias": 30},
                        {"id": est, "metrica": "precipitaciondiaria", "desde": "2026-10-24", "hasta": "2026-11-23"},
                        {"ema": est, "variable": "precipitacion", "fecha_desde": "2026-10-24", "fecha_hasta": "2026-11-23"}):
                  p = "/api/get-chart-data?" + urllib.parse.urlencode(q)
                  r = get(p)
                  print(p, "->", len(r), r[:600])
          PY
