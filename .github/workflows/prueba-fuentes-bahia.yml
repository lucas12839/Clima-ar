name: Prueba fuentes Bahía (temporal)
on:
  push:
    branches: [prueba-fuentes-bahia]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Historial SYNOP del SMN (Bahía Blanca Aero)
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, collections
          U = "https://w2b.smn.gov.ar/oapi/collections/urn%3Awmo%3Amd%3Aar-smn%3Aslt0ci/items"
          def get(q):
              u = U + "?" + urllib.parse.urlencode(q)
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "ClimaAR/1.0"}), timeout=60).read())
          for intervalo in ("2026-11-13T00:00:00Z/2026-11-14T06:00:00Z", "2026-10-24T00:00:00Z/2026-10-25T00:00:00Z"):
              try:
                  d = get({"f": "json", "wigos_station_identifier": "0-20000-0-87750", "datetime": intervalo, "limit": 1000})
              except Exception as e:
                  print(intervalo, "ERROR", e); continue
              f = d.get("features", [])
              print("\n==", intervalo, "features", len(f), "numberMatched", d.get("numberMatched"))
              nombres = collections.Counter(x["properties"].get("name") for x in f)
              print(nombres.most_common(60))
              for x in f:
                  p = x["properties"]
                  n = str(p.get("name"))
                  if any(k in n for k in ("precip", "gust", "wind_speed", "maximum_wind")):
                      print(p.get("phenomenonTime"), n, p.get("value"), p.get("units"))
          PY
