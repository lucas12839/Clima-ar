name: Prueba fuentes Bahía (temporal)
on:
  push:
    branches: [prueba-fuentes-bahia]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Historial de estaciones BCP
        run: |
          UA="ClimaAR/1.0 (proyecto local Bahía Blanca)"
          for u in "https://info.bcp.org.ar/Estaciones/Mapa_NvoBCP.asp?Estacion=104" "https://info.bcp.org.ar/Estaciones/" "https://info.bcp.org.ar/" ; do
            echo "=== $u"
            curl -sS -L -m 30 -A "$UA" -o r.html -w "HTTP %{http_code} %{size_download}\n" "$u" || true
            grep -oiE 'href="[^"]+"' r.html | sort -u | head -60
            grep -oiE '[^<>]{0,80}(hist|descarg|export|csv|excel|serie|registro|datos diarios|horari)[^<>]{0,80}' r.html | sort -u | head -30
          done
