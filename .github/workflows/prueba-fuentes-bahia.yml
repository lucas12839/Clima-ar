name: Prueba fuentes Bahía (temporal)
on:
  push:
    branches: [prueba-fuentes-bahia]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mapa SIMPARH
        run: |
          UA="Mozilla/5.0 ClimaAR/1.0"
          B=https://public-map-simparh.ada.gba.gov.ar
          curl -sS -L -m 30 -A "$UA" "$B/" -o i.html -w "HTTP %{http_code}\n"
          cat i.html | head -c 3000; echo
          for js in $(grep -oE '(src|href)="[^"]+\.js"' i.html | sed -E 's/.*="([^"]+)"/\1/'); do
            case $js in http*) u=$js;; /*) u=$B$js;; *) u=$B/$js;; esac
            echo "=== $u"; curl -sS -L -m 30 -A "$UA" "$u" -o a.js
            grep -oE 'https?://[a-zA-Z0-9./_-]+' a.js | sort -u | head -40
            grep -oE '"/?api[a-zA-Z0-9/_.?=-]*"|`[^`]*api[^`]*`' a.js | sort -u | head -40
          done
