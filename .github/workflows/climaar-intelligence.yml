name: ClimaAR Intelligence Central

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy joblib scikit-learn

      - name: Actualizar observación SAZB
        continue-on-error: true
        run: |
          python scripts/smn_observaciones.py

      - name: Actualizar fusión meteorológica
        run: |
          python scripts/meteorologia_fusion.py

      - name: Verificar datos meteorológicos
        run: |
          test -s data/ia/estado_meteorologico.json
          test -s data/meteorologia/ambiente_futuro.json

      - name: Ejecutar Storm Engine Central
        run: |
          python scripts/tormenta_intelligence.py

      - name: Validar salida de Intelligence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          archivo = Path(
              "data/ia/inteligencia_tormenta.json"
          )

          if not archivo.exists():
              raise SystemExit(
                  "ERROR: no existe inteligencia_tormenta.json"
              )

          if archivo.stat().st_size == 0:
              raise SystemExit(
                  "ERROR: inteligencia_tormenta.json está vacío"
              )

          with archivo.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Archivo Intelligence cargado correctamente"
          )

          if data.get("version") != "4.0.0":
              raise SystemExit(
                  f"ERROR: versión incorrecta: "
                  f"{data.get('version')}"
              )

          if data.get("motor") != (
              "ClimaAR Intelligence - "
              "Storm Engine Central"
          ):
              raise SystemExit(
                  "ERROR: motor incorrecto"
              )

          estados = {
              "sin_tormenta_activa",
              "tormenta_severa_potencial",
              "tormenta_convectiva_en_desarrollo",
              "tormenta_con_lluvia",
              "tormenta_activa",
          }

          severidades = {
              "verde",
              "amarillo",
              "naranja",
              "roja",
          }

          estado = data.get("estado")
          severidad = data.get("severidad")

          if estado not in estados:
              raise SystemExit(
                  f"ERROR: estado inválido: {estado}"
              )

          if severidad not in severidades:
              raise SystemExit(
                  f"ERROR: severidad inválida: "
                  f"{severidad}"
              )

          probabilidades = data.get(
              "probabilidades",
              {}
          )

          for nombre, valor in probabilidades.items():

              if valor is None:
                  continue

              if not isinstance(
                  valor,
                  (int, float)
              ):
                  raise SystemExit(
                      f"ERROR: probabilidad inválida: "
                      f"{nombre}"
                  )

              if not 0 <= float(valor) <= 1:
                  raise SystemExit(
                      f"ERROR: probabilidad fuera "
                      f"de rango: {nombre}"
                  )

          peligros = data.get(
              "peligros",
              {}
          )

          for nombre, valor in peligros.items():

              if not isinstance(
                  valor,
                  (int, float)
              ):
                  raise SystemExit(
                      f"ERROR: peligro inválido: "
                      f"{nombre}"
                  )

              if not 0 <= float(valor) <= 1:
                  raise SystemExit(
                      f"ERROR: peligro fuera "
                      f"de rango: {nombre}"
                  )

          confianza = data.get(
              "confianza_modelo"
          )

          if not isinstance(
              confianza,
              (int, float)
          ):
              raise SystemExit(
                  "ERROR: confianza_modelo inválida"
              )

          if not 0 <= float(confianza) <= 1:
              raise SystemExit(
                  "ERROR: confianza_modelo "
                  "fuera de rango"
              )

          calidad_datos = data.get(
              "calidad_datos"
          )

          if calidad_datos is not None:

              if not isinstance(
                  calidad_datos,
                  (int, float)
              ):
                  raise SystemExit(
                      "ERROR: calidad_datos inválida"
                  )

              if not 0 <= float(
                  calidad_datos
              ) <= 100:
                  raise SystemExit(
                      "ERROR: calidad_datos "
                      "fuera de rango"
                  )

          calidad_tracking = data.get(
              "calidad_tracking"
          )

          if calidad_tracking is not None:

              if not isinstance(
                  calidad_tracking,
                  (int, float)
              ):
                  raise SystemExit(
                      "ERROR: calidad_tracking "
                      "inválida"
                  )

              if not 0 <= float(
                  calidad_tracking
              ) <= 1:
                  raise SystemExit(
                      "ERROR: calidad_tracking "
                      "fuera de rango"
                  )

          razones = data.get(
              "razones"
          )

          if not isinstance(
              razones,
              list
          ):
              raise SystemExit(
                  "ERROR: razones no es una lista"
              )

          ia = data.get(
              "ia_v8",
              {}
          )

          if not isinstance(
              ia,
              dict
          ):
              raise SystemExit(
                  "ERROR: ia_v8 inválido"
              )

          modelo = Path(
              "modelo/"
              "climaar_predictor_impacto_v8.joblib"
          )

          if modelo.exists():

              if ia.get(
                  "disponible"
              ) is not True:
                  raise SystemExit(
                      "ERROR: el modelo V8 existe "
                      "pero no fue cargado"
                  )

              print(
                  "IA V8: modelo cargado "
                  "correctamente"
              )

          else:

              print(
                  "AVISO: todavía no existe "
                  "el modelo V8. "
                  "Storm Engine continúa "
                  "con análisis meteorológico."
              )

          print(
              "===================================="
          )
          print(
              "CLIMAAR INTELLIGENCE VALIDADO"
          )
          print(
              "Versión:",
              data.get("version")
          )
          print(
              "Estado:",
              estado
          )
          print(
              "Severidad:",
              severidad
          )
          print(
              "Confianza:",
              confianza
          )
          print(
              "IA disponible:",
              ia.get("disponible")
          )
          print(
              "Razones:",
              len(razones)
          )
          print(
              "===================================="
          )
          PY

      - name: Verificar cambios
        run: |
          git diff --check -- \
            ':!data/ia/historial_meteorologico.csv'

      - name: Guardar resultados
        run: |
          git config user.name "ClimaAR Bot"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
            exit 0
          fi

          git commit \
            -m "Actualizar ClimaAR Intelligence"

      - name: Sincronizar y publicar
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
