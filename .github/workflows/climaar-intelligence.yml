name: ClimaAR Intelligence Central

on:
  workflow_run:
    workflows: ["Probar Radar SMN"]
    types: [completed]

  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: climaar-intelligence
  cancel-in-progress: false


jobs:

  verificar-radar:

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    outputs:
      ejecutar: ${{ steps.verificar.outputs.ejecutar }}
      run_id: ${{ steps.verificar.outputs.run_id }}

    steps:

      - name: Verificar artefacto RMA10
        id: verificar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

        run: |
          set -e

          RUN_ID=""

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"

            echo "Run Radar recibido: $RUN_ID"

            ARTIFACTO="$(gh api \
              "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name=="radar-rma10" and .expired==false) | .id' \
              | head -n 1)"

            if [ -n "$ARTIFACTO" ]; then
              echo "Artefacto radar-rma10 encontrado."
              echo "ID artefacto: $ARTIFACTO"

              echo "ejecutar=true" >> "$GITHUB_OUTPUT"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "No existe radar-rma10 en este run."
            echo "El Radar terminó correctamente pero no hubo frame nuevo."
            echo "Intelligence no se ejecutará."

            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi


          echo "Ejecución manual de Intelligence."
          echo "Buscando último Radar exitoso con artefacto..."

          while read -r CANDIDATO; do

            [ -z "$CANDIDATO" ] && continue

            echo "Comprobando Radar: $CANDIDATO"

            ARTIFACTO="$(gh api \
              "repos/$GH_REPO/actions/runs/$CANDIDATO/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name=="radar-rma10" and .expired==false) | .id' \
              | head -n 1)"

            if [ -n "$ARTIFACTO" ]; then
              echo "Encontrado artefacto válido."
              echo "Run seleccionado: $CANDIDATO"
              echo "ID artefacto: $ARTIFACTO"

              echo "ejecutar=true" >> "$GITHUB_OUTPUT"
              echo "run_id=$CANDIDATO" >> "$GITHUB_OUTPUT"
              exit 0
            fi

          done < <(
            gh run list \
              --workflow probar-radar-smn.yml \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )


          echo "No se encontró ningún Radar exitoso con artefacto radar-rma10."

          echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          echo "run_id=" >> "$GITHUB_OUTPUT"


  intelligence:

    needs: verificar-radar

    if: needs.verificar-radar.outputs.ejecutar == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 12

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Preparar directorios
        run: |
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/ia
          mkdir -p data/meteorologia
          mkdir -p logs
          mkdir -p /tmp/radar-artifact


      - name: Obtener artefacto del radar
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.verificar-radar.outputs.run_id }}

        run: |
          set -e

          echo "Run radar utilizado: $RUN_ID"

          gh run download "$RUN_ID" \
            --name radar-rma10 \
            --dir /tmp/radar-artifact


          if [ -d /tmp/radar-artifact/data/radar ]; then

            cp -a \
              /tmp/radar-artifact/data/radar/. \
              data/radar/

          else

            cp -a \
              /tmp/radar-artifact/. \
              data/radar/ \
              2>/dev/null || true

          fi


          test -s data/radar/resultado_procesamiento.json

          test -s data/radar/seguimiento/estado.json

          test -s data/radar/seguimiento/seguimiento_temporal.json

          test -s data/radar/seguimiento/prediccion_evolucion.json

          test -s data/radar/radar_timestamp.txt


      - name: Actualizar observación SAZB
        continue-on-error: true

        run: |
          python -m pip install requests
          python scripts/smn_observaciones.py || true


      - name: Dependencias de inteligencia
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Conectar RMA10 con Storm Engine
        run: |
          set -e

          python scripts/adaptar_rma10_intelligence.py

          test -s data/radar/radar_nowcast.json


      - name: Georreferenciar RMA10
        run: |
          set -e

          python scripts/scripts/georreferenciar_rma10.py

          test -s data/radar/radar_nowcast.json

          echo "Georreferenciación RMA10 completada."


      - name: Acumular dataset RMA10
        run: |
          set -e

          python scripts/acumular_features_rma10.py

          test -s data/radar/radar_features_rma10.csv

          python - <<'PY'
          import csv
          from pathlib import Path
          from collections import Counter

          p = Path(
              "data/radar/radar_features_rma10.csv"
          )

          with p.open(
              "r",
              encoding="utf-8",
              newline=""
          ) as f:
              rows = list(
                  csv.DictReader(f)
              )

          if not rows:
              raise SystemExit(
                  "ERROR: dataset RMA10 vacío."
              )

          timestamps = [
              r.get(
                  "frame_time",
                  ""
              ).strip()
              for r in rows
          ]

          timestamps_validos = [
              x
              for x in timestamps
              if x
          ]

          duplicados = [
              x
              for x, n in Counter(
                  timestamps_validos
              ).items()
              if n > 1
          ]

          if duplicados:
              raise SystemExit(
                  "ERROR: existen timestamps duplicados en dataset RMA10."
              )

          print(
              "Registros dataset RMA10:",
              len(rows)
          )

          print(
              "Último frame:",
              timestamps_validos[-1]
              if timestamps_validos
              else "sin timestamp"
          )

          print(
              "Dataset RMA10 correcto."
          )
          PY


      - name: Ejecutar predicción ML RMA10
        run: |
          set -e

          python scripts/prediccion_rma10_ml.py

          test -s \
            data/radar/seguimiento/prediccion_ml_rma10.json

          echo \
            "Predicción ML RMA10 generada correctamente."


      - name: Verificar predicción ML RMA10
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/radar/seguimiento/prediccion_ml_rma10.json"
          )

          data = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          if data.get("ok") is not True:
              raise SystemExit(
                  "ERROR: predicción ML RMA10 no válida."
              )

          tracks = data.get(
              "tracks_analizados",
              0
          )

          predicciones = data.get(
              "predicciones",
              []
          )

          if not isinstance(
              predicciones,
              list
          ):
              raise SystemExit(
                  "ERROR: formato de predicciones ML inválido."
              )

          if tracks != len(
              predicciones
          ):
              raise SystemExit(
                  "ERROR: cantidad de tracks y predicciones no coincide."
              )

          print(
              "===== ML RMA10 ====="
          )

          print(
              "Modelo:",
              data.get("modelo")
          )

          print(
              "Frame:",
              data.get("frame_radar")
          )

          print(
              "Tracks analizados:",
              tracks
          )

          print(
              "Horizontes:",
              data.get("horizontes_min")
          )

          print(
              "Predicción ML RMA10 correcta."
          )
          PY


      - name: Verificar sincronización estricta Radar Nowcast ML
        run: |
          set -e

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_utc(value, nombre):
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"ERROR: {nombre} sin timestamp.")

              text = value.strip()
              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              try:
                  dt = datetime.fromisoformat(text)
              except ValueError as exc:
                  raise SystemExit(
                      f"ERROR: {nombre} tiene timestamp inválido: {value}"
                  ) from exc

              if dt.tzinfo is None:
                  raise SystemExit(
                      f"ERROR: {nombre} no tiene zona horaria: {value}"
                  )

              return dt.astimezone(timezone.utc)

          radar_ts_raw = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(encoding="utf-8").strip()

          nowcast = json.loads(
              Path("data/radar/radar_nowcast.json").read_text(encoding="utf-8")
          )

          ml = json.loads(
              Path(
                  "data/radar/seguimiento/prediccion_ml_rma10.json"
              ).read_text(encoding="utf-8")
          )

          if ml.get("ok") is not True:
              raise SystemExit(
                  "ERROR: ML RMA10 no está marcado como válido."
              )

          nowcast_data = nowcast.get("nowcast")
          if not isinstance(nowcast_data, dict):
              raise SystemExit(
                  "ERROR: radar_nowcast.json no contiene el bloque nowcast."
              )

          radar_ts = parse_utc(radar_ts_raw, "Radar")
          nowcast_ts = parse_utc(
              nowcast_data.get("frame_actual_utc"),
              "Nowcast"
          )
          ml_ts = parse_utc(ml.get("frame_radar"), "ML RMA10")

          print("===== SINCRONIZACIÓN ESTRICTA CLIMAAR =====")
          print("Radar:", radar_ts.isoformat())
          print("Nowcast:", nowcast_ts.isoformat())
          print("ML RMA10:", ml_ts.isoformat())

          if not (radar_ts == nowcast_ts == ml_ts):
              raise SystemExit(
                  "ERROR: Radar, Nowcast y ML no corresponden al mismo frame."
              )

          print("Sincronización estricta OK.")
          PY

      - name: Fusionar meteorología
        run: |
          set -e

          python scripts/meteorologia_fusion.py

          test -s \
            data/ia/estado_meteorologico.json


      - name: Ejecutar Storm Engine
        run: |
          set -e

          python scripts/tormenta_intelligence.py

          test -s \
            data/ia/inteligencia_tormenta.json

          test -s \
            data/ia/historial_inteligencia_tormenta.csv


      - name: Ejecutar motor de decisión integrado
        run: |
          set -e

          python scripts/motor_decision_climaar.py

          test -s \
            data/ia/resultado_final.json


      - name: Sincronizar repositorio antes de persistir
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git pull \
            --rebase \
            --autostash \
            origin main


      - name: Persistir resultados
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            data/radar/radar_nowcast.json \
            data/radar/radar_features_rma10.csv \
            data/radar/seguimiento/prediccion_ml_rma10.json \
            data/ia/estado_meteorologico.json \
            data/ia/inteligencia_tormenta.json \
            data/ia/historial_inteligencia_tormenta.csv \
            data/ia/resultado_final.json \
            data/meteorologia/ambiente_futuro.json \
            data/sazb/status.json \
            scripts/scripts/georreferenciar_rma10.py \
            scripts/motor_decision_climaar.py

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: integrar prediccion ML RMA10"

          for intento in 1 2 3; do

            echo \
              "Intento de push: $intento/3"

            if git push origin HEAD:main; then

              echo \
                "Push realizado correctamente."

              exit 0

            fi

            if [ "$intento" -lt 3 ]; then

              echo \
                "Push rechazado. Sincronizando nuevamente..."

              git pull \
                --rebase \
                --autostash \
                origin main

            fi

          done

          echo \
            "ERROR: no se pudo realizar el push."

          exit 1


      - name: Publicar artefacto de resultado
        uses: actions/upload-artifact@v4

        with:
          name: climaar-resultado-final

          path: |
            data/radar/radar_nowcast.json
            data/radar/radar_features_rma10.csv
            data/radar/seguimiento/prediccion_evolucion.json
            data/radar/seguimiento/prediccion_ml_rma10.json
            data/radar/seguimiento/calibracion_prediccion.json
            data/ia/estado_meteorologico.json
            data/ia/inteligencia_tormenta.json
            data/ia/historial_inteligencia_tormenta.csv
            data/ia/resultado_final.json
            data/meteorologia/ambiente_futuro.json
            data/sazb/status.json

          if-no-files-found: warn
          retention-days: 30


      - name: Verificar resultado final
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/ia/resultado_final.json"
          )

          d = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          ml = json.loads(
              Path(
                  "data/radar/seguimiento/prediccion_ml_rma10.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          m = d.get(
              "motor_decision",
              {}
          )

          r = d.get(
              "resumen_operativo",
              {}
          )

          print(
              "===== CLIMAAR RESULTADO FINAL ====="
          )

          print(
              "Version:",
              d.get("version")
          )

          print(
              "Estado:",
              m.get("estado")
          )

          print(
              "Score integrado:",
              m.get("score_integrado")
          )

          print(
              "Actividad radar:",
              m.get("actividad_radar")
          )

          print(
              "Intensidad radar:",
              m.get(
                  "componentes",
                  {}
              ).get(
                  "radar_intensidad"
              )
          )

          print(
              "Confianza movimiento:",
              m.get(
                  "componentes",
                  {}
              ).get(
                  "radar_movimiento"
              )
          )

          print(
              "IA:",
              m.get(
                  "componentes",
                  {}
              ).get(
                  "ia"
              )
          )

          print(
              "ETA:",
              r.get("eta_minutos")
          )

          print(
              "Distancia:",
              r.get("distancia_km")
          )

          print(
              "ML modelo:",
              ml.get("modelo")
          )

          print(
              "ML tracks:",
              ml.get("tracks_analizados")
          )

          print(
              "===================================="
          )
          PY
