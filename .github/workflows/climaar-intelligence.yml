name: ClimaAR Intelligence Central

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy opencv-python Pillow joblib scikit-learn

      - name: Preparar directorios
        run: |
          mkdir -p data/radar
          mkdir -p data/radar/historico
          mkdir -p data/ia
          mkdir -p logs

      # ============================================================
      # 1. RADAR RAINVIEWER + NOWCAST
      # ============================================================
      - name: Obtener radar RainViewer y generar nowcast
        run: |
          python scripts/radar_rainviewer.py

      - name: Verificar radar RainViewer
        run: |
          echo "=== RADAR ==="
          test -f data/radar/actual.png
          test -f data/radar/radar_nowcast.json
          ls -lh data/radar/actual.png
          cat data/radar/radar_nowcast.json

      # ============================================================
      # 2. REPARADOR / DECODIFICADOR DE RADAR
      # ============================================================
      - name: Analizar radar con decoder ClimaAR
        run: |
          python scripts/radar_repair_decoder.py

      # ============================================================
      # 3. FUSIÓN METEOROLÓGICA
      # ============================================================
      - name: Fusion meteorologica
        run: |
          if [ -f scripts/meteorologia_fusion.py ]; then
            python scripts/meteorologia_fusion.py
          else
            echo "meteorologia_fusion.py no encontrado"
          fi

      # ============================================================
      # 4. INT
