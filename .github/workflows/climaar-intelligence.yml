name: ClimaAR Intelligence Central

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: climaar-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear directorios
        run: |
          mkdir -p data/radar/historico
          mkdir -p data/ia
          mkdir -p logs

      - name: Actualizar radar RainViewer
        run: |
          python scripts/radar_rainviewer.py

      - name: Verificar radar
        run: |
          test -s data/radar/actual.png
          test -s data/radar/radar_nowcast.json
          test -s data/radar/status.json
          test -s data/radar/radar_features_rainviewer.csv

      - name: Verificar estructura CSV
        run: |
          python - <<'PY'
          import csv

          path = "data/radar/radar_features_rainviewer.csv"

          expected = 21

          with open(
              path,
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.reader(f)

              header = next(reader)

              if len(header) != expected:
                  raise SystemExit(
                      f"ERROR: encabezado tiene {len(header)} columnas"
                  )

              rows = 0

              for line, row in enumerate(
                  reader,
                  start=2
              ):
                  if not row:
                      continue

                  if len(row) != expected:
                      raise SystemExit(
                          f"ERROR: línea {line} tiene "
                          f"{len(row)} columnas; "
                          f"esperadas {expected}"
                      )

                  rows += 1

          print(
              f"CSV OK: {rows} filas / {expected} columnas"
          )
          PY

      - name: Decodificador de radar
        run: |
          if [ -f scripts/radar_repair_decoder.py ]; then
            python scripts/radar_repair_decoder.py
          else
            echo "Decoder no encontrado; se continúa."
          fi

      - name: Fusión meteorológica
        run: |
          if [ -f scripts/meteorologia_fusion.py ]; then
            python scripts/meteorologia_fusion.py
          else
            echo "meteorologia_fusion.py no encontrado; se continúa."
          fi

      - name: Inteligencia de tormentas
        run: |
          if [ -f scripts/tormenta_intelligence.py ]; then
            python scripts/tormenta_intelligence.py
          else
            echo "tormenta_intelligence.py no encontrado; se continúa."
          fi

      - name: Verificación final
        run: |
          python - <<'PY'
          import csv
          import os

          path = "data/radar/radar_features_rainviewer.csv"

          with open(
              path,
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.reader(f)

              header = next(reader)

              assert len(header) == 21

              count = 0

              for row in reader:
                  if row:
                      assert len(row) == 21
                      count += 1

          assert os.path.getsize(
              "data/radar/actual.png"
          ) > 0

          print(
              f"VALIDACIÓN OK: {count} filas"
          )
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/radar/actual.png \
            data/radar/radar_nowcast.json \
            data/radar/status.json \
            data/radar/radar_features_rainviewer.csv \
            data/radar/historico \
            data/ia \
            logs

          git diff --cached --quiet || \
            git commit -m "ClimaAR: actualización radar e inteligencia"

      - name: Sincronizar y publicar
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
