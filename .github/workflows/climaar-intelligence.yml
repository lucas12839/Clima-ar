name: ClimaAR Intelligence Central

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  intelligence:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install requests numpy scipy opencv-python Pillow joblib scikit-learn

      - name: Preparar directorios
        run: |
          mkdir -p data/radar/historico
          mkdir -p data/ia
          mkdir -p logs

      - name: Obtener radar RainViewer
        run: |
          python scripts/radar_rainviewer.py

      - name: Verificar radar
        run: |
          test -f data/radar/actual.png
          test -f data/radar/radar_nowcast.json
          ls -lh data/radar/actual.png
          ls -lh data/radar/radar_nowcast.json

      - name: Analizar radar
        run: |
          python scripts/radar_repair_decoder.py

      - name: Fusion meteorologica
        run: |
          if [ -f scripts/meteorologia_fusion.py ]; then
            python scripts/meteorologia_fusion.py
          fi

      - name: Inteligencia de tormenta
        run: |
          if [ -f scripts/tormenta_intelligence.py ]; then
            python scripts/tormenta_intelligence.py
          fi

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/radar/actual.png
          git add -f data/radar/radar_nowcast.json
          git add -f data/radar/status.json
          git add -f data/radar/radar_features_rainviewer.csv
          git add -f data/radar/historico/
          git add -f data/ia/
          git add -f logs/

          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "ClimaAR: actualizar radar e inteligencia"
            git push origin main
          fi

      - name: Verificacion final
        run: |
          echo "================================"
          echo " CLIMAAR OK"
          echo "================================"
          ls -lh data/radar/actual.png
          ls -lh data/radar/radar_nowcast.json
