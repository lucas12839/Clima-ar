name: ClimaAR Intelligence Central

on:
  workflow_dispatch:
    inputs:
      radar_run_id:
        description: "ID del Radar RMA10 que disparó Intelligence"
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: climaar-production-writes
  cancel-in-progress: false

jobs:
  verificar-radar:
    runs-on: ubuntu-latest

    outputs:
      ejecutar: ${{ steps.verificar.outputs.ejecutar }}
      run_id: ${{ steps.verificar.outputs.run_id }}

    steps:
      - name: Verificar artefacto RMA10
        id: verificar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RADAR_RUN_ID: ${{ inputs.radar_run_id }}
        run: |
          set -euo pipefail

          RUN_ID="$INPUT_RADAR_RUN_ID"

          if [ -n "$RUN_ID" ]; then
            echo "Usando exactamente el Radar indicado: $RUN_ID"

            ARTIFACTO="$(
              gh api \
                "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name=="radar-rma10" and .expired==false) | .id] | .[0] // empty'
            )"

            if [ -n "$ARTIFACTO" ]; then
              echo "ejecutar=true" >> "$GITHUB_OUTPUT"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "ERROR: el Radar $RUN_ID no tiene artefacto radar-rma10 válido."
            exit 1
          fi

          echo "No se recibió radar_run_id. Buscando último Radar exitoso."

          while read -r CANDIDATO; do
            [ -z "$CANDIDATO" ] && continue

            ARTIFACTO="$(
              gh api \
                "repos/$GH_REPO/actions/runs/$CANDIDATO/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name=="radar-rma10" and .expired==false) | .id] | .[0] // empty'
            )"

            if [ -n "$ARTIFACTO" ]; then
              echo "Último Radar válido encontrado: $CANDIDATO"

              echo "ejecutar=true" >> "$GITHUB_OUTPUT"
              echo "run_id=$CANDIDATO" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(
            gh run list \
              --workflow probar-radar-smn.yml \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )

          echo "No se encontró ningún Radar válido."

          echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          echo "run_id=" >> "$GITHUB_OUTPUT"

  intelligence:
    needs: verificar-radar

    if: needs.verificar-radar.outputs.ejecutar == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar/historico \
            data/radar/seguimiento \
            data/ia \
            data/meteorologia \
            data/sazb \
            logs \
            /tmp/radar-artifact

      - name: Obtener artefacto del radar
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.verificar-radar.outputs.run_id }}
        run: |
          set -euo pipefail

          echo "Descargando artefacto del Radar: $RUN_ID"

          gh run download \
            "$RUN_ID" \
            --name radar-rma10 \
            --dir /tmp/radar-artifact

          if [ -d /tmp/radar-artifact/data/radar ]; then
            cp -a \
              /tmp/radar-artifact/data/radar/. \
              data/radar/
          else
            cp -a \
              /tmp/radar-artifact/. \
              data/radar/ \
              2>/dev/null || true
          fi

          test -s data/radar/resultado_procesamiento.json
          test -s data/radar/seguimiento/estado.json
          test -s data/radar/seguimiento/seguimiento_temporal.json
          test -s data/radar/radar_timestamp.txt

      - name: Actualizar observación SAZB
        continue-on-error: true
        run: |
          python -m pip install requests
          python scripts/smn_observaciones.py || true

      - name: Dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Conectar RMA10 con Storm Engine
        run: |
          set -euo pipefail

          python scripts/adaptar_rma10_intelligence.py

          test -s data/radar/radar_nowcast.json

      - name: Georreferenciar núcleos RMA10
        run: |
          set -euo pipefail

          test -s data/radar/radar_nowcast.json
          test -s data/radar/actual.png

          python scripts/scripts/georreferenciar_rma10.py

          test -s data/radar/radar_nowcast.json

      - name: Validar georreferenciación RMA10
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("data/radar/radar_nowcast.json")

          if not path.is_file():
              raise SystemExit(
                  "ERROR: no existe data/radar/radar_nowcast.json"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          nowcast = data.get("nowcast")

          if not isinstance(nowcast, dict):
              raise SystemExit(
                  "ERROR: falta el objeto nowcast"
              )

          nuclei = nowcast.get("nucleos")

          if not isinstance(nuclei, list):
              raise SystemExit(
                  "ERROR: nowcast.nucleos no es una lista"
              )

          geo = nowcast.get(
              "nucleos_georreferenciados"
          )

          if not isinstance(geo, list):
              raise SystemExit(
                  "ERROR: falta nowcast.nucleos_georreferenciados"
              )

          if len(geo) != len(nuclei):
              raise SystemExit(
                  "ERROR: cantidad de núcleos georreferenciados "
                  f"({len(geo)}) distinta de núcleos detectados "
                  f"({len(nuclei)})"
              )

          resumen = nowcast.get(
              "georreferenciacion"
          )

          if not isinstance(resumen, dict):
              raise SystemExit(
                  "ERROR: falta nowcast.georreferenciacion"
              )

          if resumen.get("disponible") is not True:
              raise SystemExit(
                  "ERROR: georreferenciación marcada como no disponible"
              )

          if resumen.get("estado") != "VALIDADA_OPERATIVAMENTE":
              raise SystemExit(
                  "ERROR: estado de georreferenciación inválido: "
                  f"{resumen.get('estado')!r}"
              )

          for index, item in enumerate(geo, start=1):

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"ERROR: núcleo georreferenciado #{index} inválido"
                  )

              referencia = item.get(
                  "georreferencia"
              )

              if not isinstance(referencia, dict):
                  raise SystemExit(
                      f"ERROR: falta georreferencia "
                      f"en núcleo #{index}"
                  )

              lat = referencia.get(
                  "latitud"
              )

              lon = referencia.get(
                  "longitud"
              )

              if not isinstance(
                  lat,
                  (int, float)
              ):
                  raise SystemExit(
                      f"ERROR: latitud inválida "
                      f"en núcleo #{index}"
                  )

              if not isinstance(
                  lon,
                  (int, float)
              ):
                  raise SystemExit(
                      f"ERROR: longitud inválida "
                      f"en núcleo #{index}"
                  )

              if not math.isfinite(lat):
                  raise SystemExit(
                      f"ERROR: latitud no finita "
                      f"en núcleo #{index}"
                  )

              if not math.isfinite(lon):
                  raise SystemExit(
                      f"ERROR: longitud no finita "
                      f"en núcleo #{index}"
                  )

              if not -90 <= lat <= 90:
                  raise SystemExit(
                      f"ERROR: latitud fuera de rango "
                      f"en núcleo #{index}: {lat}"
                  )

              if not -180 <= lon <= 180:
                  raise SystemExit(
                      f"ERROR: longitud fuera de rango "
                      f"en núcleo #{index}: {lon}"
                  )

          print(
              f"OK: {len(geo)} / {len(nuclei)} "
              "núcleos georreferenciados"
          )

          print(
              "Estado:",
              resumen.get("estado")
          )

          print(
              "Georreferenciación validada correctamente."
          )
          PY

      - name: Validar timestamp del nowcast
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_utc(value):
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(
                      f"ERROR: timestamp inválido: {value!r}"
                  )

              text = value.strip()

              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              try:
                  dt = datetime.fromisoformat(text)
              except ValueError as exc:
                  raise SystemExit(
                      f"ERROR: timestamp inválido: {value!r}"
                  ) from exc

              if dt.tzinfo is None:
                  raise SystemExit(
                      f"ERROR: timestamp sin zona horaria: {value!r}"
                  )

              return dt.astimezone(timezone.utc)

          radar = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          data = json.loads(
              Path(
                  "data/radar/radar_nowcast.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          nc = data.get("nowcast", {})
          nowcast = nc.get("frame_actual_utc")

          radar_dt = parse_utc(radar)
          nowcast_dt = parse_utc(nowcast)

          if radar_dt != nowcast_dt:
              raise SystemExit(
                  "ERROR: nowcast desincronizado: "
                  f"{nowcast!r} != {radar!r}"
              )

          print(
              "Timestamp radar:",
              radar_dt.isoformat()
          )

          print(
              "Timestamp nowcast:",
              nowcast_dt.isoformat()
          )

          print("Timestamp sincronizado.")
          PY

      - name: Acumular dataset RMA10
        run: |
          set -euo pipefail

          python scripts/acumular_features_rma10.py

          test -s \
            data/radar/radar_features_rma10.csv

      - name: Predicción ML RMA10
        run: |
          set -euo pipefail

          python scripts/prediccion_rma10_ml.py

          test -s \
            data/radar/seguimiento/prediccion_ml_rma10.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path(
              "data/radar/seguimiento/prediccion_ml_rma10.json"
          )

          d = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          if d.get("ok") is not True:
              raise SystemExit(
                  "ERROR: ML no válido"
              )

          if not isinstance(
              d.get("predicciones"),
              list
          ):
              raise SystemExit(
                  "ERROR: predicciones inválidas"
              )

          if d.get("tracks_analizados") != len(d["predicciones"]):
              raise SystemExit(
                  "ERROR: tracks_analizados != predicciones"
              )

          radar = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          def normalize(value):
              if not isinstance(value, str) or not value.strip():
                  return None

              text = value.strip()

              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              dt = datetime.fromisoformat(text)

              if dt.tzinfo is None:
                  return None

              return dt.astimezone(timezone.utc)

          if normalize(
              d.get("frame_radar")
          ) != normalize(radar):
              raise SystemExit(
                  "ERROR: ML desincronizado"
              )
          PY

      - name: Evolución temporal
        run: |
          set -euo pipefail

          if [ -f scripts/prediccion_evolucion.py ]; then
            python scripts/prediccion_evolucion.py
          fi

          test -s \
            data/radar/seguimiento/prediccion_evolucion.json

      - name: Conectar evolución con trayectoria
        run: |
          set -euo pipefail

          test -s data/radar/radar_nowcast.json
          test -s data/radar/seguimiento/prediccion_evolucion.json

          python scripts/conectar_evolucion_trayectoria.py

          test -s data/radar/radar_nowcast.json

          python - <<'PY2'
          import json
          from pathlib import Path

          path = Path("data/radar/radar_nowcast.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          nowcast = data.get("nowcast", {})
          projections = nowcast.get("proyecciones")

          if not isinstance(projections, dict):
              raise SystemExit("ERROR: nowcast.proyecciones no es un objeto")

          required = ("5", "10", "20", "30")
          missing = [key for key in required if key not in projections]

          if missing:
              raise SystemExit(
                  "ERROR: faltan proyecciones: " + ", ".join(missing)
              )

          required_fields = (
              "minutos",
              "timestamp_utc",
              "x",
              "y",
              "latitud",
              "longitud",
          )

          for key in required:
              projection = projections[key]

              if not isinstance(projection, dict):
                  raise SystemExit(
                      f"ERROR: proyección {key} inválida"
                  )

              for field in required_fields:
                  if projection.get(field) is None:
                      raise SystemExit(
                          f"ERROR: falta {field} en proyección {key}"
                      )

          print(
              "OK: proyecciones 5/10/20/30 conectadas y georreferenciadas."
          )
          PY2

      - name: Fusionar meteorología
        run: |
          set -euo pipefail

          python scripts/meteorologia_fusion.py

          test -s \
            data/ia/estado_meteorologico.json

      - name: Ejecutar Storm Engine
        run: |
          set -euo pipefail

          python scripts/tormenta_intelligence_timestamp.py

          test -s \
            data/ia/inteligencia_tormenta.json

      - name: Validar ambiente en trayectoria
        run: |
          set -euo pipefail

          python - <<'PY2'
          import json
          from pathlib import Path

          path = Path("data/ia/inteligencia_tormenta.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          trajectory = data.get("ambiente_en_trayectoria")

          if not isinstance(trajectory, dict):
              raise SystemExit(
                  "ERROR: ambiente_en_trayectoria no es un objeto"
              )

          if not trajectory:
              raise SystemExit(
                  "ERROR: Storm Engine terminó con ambiente_en_trayectoria vacío"
              )

          print(
              "OK: ambiente meteorológico asociado a "
              f"{len(trajectory)} proyecciones."
          )
          PY2

      - name: Ejecutar Decision Engine
        run: |
          set -euo pipefail

          python scripts/motor_decision_climaar.py

          test -s \
            data/ia/resultado_final.json

      - name: Validar integridad completa de ClimaAR
        run: |
          set -euo pipefail
          python scripts/validar_integridad_climaar.py

      - name: Preparar artefacto final
        run: |
          set -euo pipefail

          rm -rf /tmp/climaar-final

          mkdir -p \
            /tmp/climaar-final/radar \
            /tmp/climaar-final/ia \
            /tmp/climaar-final/meteorologia \
            /tmp/climaar-final/sazb

          cp -a \
            data/radar/. \
            /tmp/climaar-final/radar/

          cp -a \
            data/ia/. \
            /tmp/climaar-final/ia/

          cp -a \
            data/meteorologia/. \
            /tmp/climaar-final/meteorologia/ \
            2>/dev/null || true

          cp -a \
            data/sazb/. \
            /tmp/climaar-final/sazb/ \
            2>/dev/null || true

      - name: Publicar artefacto final
        uses: actions/upload-artifact@v4
        with:
          name: climaar-resultado-final
          path: /tmp/climaar-final
          retention-days: 30

      - name: Persistir resultados con rebase y retry
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            data/radar \
            data/ia \
            data/meteorologia \
            data/sazb

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: integrar inteligencia RMA10"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "ERROR: quedaron cambios sin confirmar."
            git status --short
            exit 1
          fi

          for intento in 1 2 3; do
            echo "Intento de sincronización: $intento"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase falló."

              git rebase --abort 2>/dev/null || true
              git reset --hard HEAD

              if [ "$intento" -eq 3 ]; then
                git status --short
                exit 1
              fi

              sleep 2
              continue
            fi

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: el rebase dejó cambios locales."
              git status --short
              git reset --hard HEAD

              if [ "$intento" -eq 3 ]; then
                exit 1
              fi

              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push exitoso en intento $intento."
              exit 0
            fi

            echo "Push falló en intento $intento."

            if [ "$intento" -eq 3 ]; then
              git status --short
              exit 1
            fi

            sleep 2
          done
