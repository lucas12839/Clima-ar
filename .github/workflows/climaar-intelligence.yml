name: ClimaAR Intelligence Central

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: climaar-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear directorios
        run: |
          mkdir -p data/radar/historico
          mkdir -p data/ia
          mkdir -p logs

      - name: Actualizar radar RainViewer
        run: |
          python scripts/radar_rainviewer.py

      - name: Verificar radar
        run: |
          test -s data/radar/actual.png
          test -s data/radar/radar_nowcast.json
          test -s data/radar/status.json
          test -s data/radar/radar_features_rainviewer.csv

      - name: Verificar estructura CSV
        run: |
          python - <<'PY'
          import csv

          path = "data/radar/radar_features_rainviewer.csv"
          expected = 21

          with open(
              path,
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.reader(f)

              try:
                  header = next(reader)
              except StopIteration:
                  raise SystemExit(
                      "ERROR: CSV vacío"
                  )

              if len(header) != expected:
                  raise SystemExit(
                      f"ERROR: encabezado tiene "
                      f"{len(header)} columnas; "
                      f"esperadas {expected}"
                  )

              rows = 0

              for line, row in enumerate(
                  reader,
                  start=2
              ):

                  if not row:
                      continue

                  if len(row) != expected:
                      raise SystemExit(
                          f"ERROR: línea {line} tiene "
                          f"{len(row)} columnas; "
                          f"esperadas {expected}"
                      )

                  rows += 1

          if rows == 0:
              raise SystemExit(
                  "ERROR: CSV sin datos"
              )

          print(
              f"CSV OK: {rows} filas / "
              f"{expected} columnas"
          )
          PY

      - name: Decodificador de radar
        run: |
          if [ -f scripts/radar_repair_decoder.py ]; then
            python scripts/radar_repair_decoder.py
          else
            echo "Decoder no encontrado; se continúa."
          fi

      - name: Fusión meteorológica
        run: |
          if [ -f scripts/meteorologia_fusion.py ]; then
            python scripts/meteorologia_fusion.py
          else
            echo "meteorologia_fusion.py no encontrado; se continúa."
          fi

      - name: Inteligencia de tormentas
        run: |
          if [ -f scripts/tormenta_intelligence.py ]; then
            python scripts/tormenta_intelligence.py
          else
            echo "tormenta_intelligence.py no encontrado; se continúa."
          fi

      - name: Verificación final
        run: |
          python - <<'PY'
          import csv
          import os

          path = "data/radar/radar_features_rainviewer.csv"
          expected = 21

          with open(
              path,
              encoding="utf-8",
              newline=""
          ) as f:

              reader = csv.reader(f)

              try:
                  header = next(reader)
              except StopIteration:
                  raise SystemExit(
                      "ERROR: CSV vacío"
                  )

              if len(header) != expected:
                  raise SystemExit(
                      f"ERROR FINAL: encabezado tiene "
                      f"{len(header)} columnas"
                  )

              count = 0

              for line, row in enumerate(
                  reader,
                  start=2
              ):

                  if not row:
                      continue

                  if len(row) != expected:
                      raise SystemExit(
                          f"ERROR FINAL: línea {line} tiene "
                          f"{len(row)} columnas"
                      )

                  count += 1

          if count == 0:
              raise SystemExit(
                  "ERROR FINAL: CSV sin filas"
              )

          if not os.path.isfile(
              "data/radar/actual.png"
          ):
              raise SystemExit(
                  "ERROR FINAL: falta actual.png"
              )

          if os.path.getsize(
              "data/radar/actual.png"
          ) == 0:
              raise SystemExit(
                  "ERROR FINAL: actual.png está vacío"
              )

          if not os.path.isfile(
              "data/radar/radar_nowcast.json"
          ):
              raise SystemExit(
                  "ERROR FINAL: falta radar_nowcast.json"
              )

          if not os.path.isfile(
              "data/radar/status.json"
          ):
              raise SystemExit(
                  "ERROR FINAL: falta status.json"
              )

          print(
              f"VALIDACIÓN FINAL OK: "
              f"{count} filas / "
              f"{expected} columnas"
          )
          PY

      - name: Preparar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "ClimaAR: actualización radar e inteligencia"
          else
            echo "No hay cambios para guardar."
          fi

      - name: Sincronizar y publicar
        run: |
          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
