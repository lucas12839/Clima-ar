name: ClimaAR Intelligence Central

on:
  workflow_run:
    workflows: ["Probar Radar SMN"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: climaar-production-writes
  cancel-in-progress: false

jobs:
  verificar-radar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ejecutar: ${{ steps.verificar.outputs.ejecutar }}
      run_id: ${{ steps.verificar.outputs.run_id }}

    steps:
      - name: Verificar artefacto RMA10
        id: verificar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RUN_ID=""

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"

            ARTIFACTO="$(
              gh api \
                "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.name=="radar-rma10" and .expired==false) | .id' \
                | head -n 1
            )"

            if [ -n "$ARTIFACTO" ]; then
              echo "ejecutar=true" >> "$GITHUB_OUTPUT"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while read -r CANDIDATO; do
            [ -z "$CANDIDATO" ] && continue

            ARTIFACTO="$(
              gh api \
                "repos/$GH_REPO/actions/runs/$CANDIDATO/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.name=="radar-rma10" and .expired==false) | .id' \
                | head -n 1
            )"

            if [ -n "$ARTIFACTO" ]; then
              echo "ejecutar=true" >> "$GITHUB_OUTPUT"
              echo "run_id=$CANDIDATO" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(
            gh run list \
              --workflow probar-radar-smn.yml \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )

          echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          echo "run_id=" >> "$GITHUB_OUTPUT"

  intelligence:
    needs: verificar-radar
    if: needs.verificar-radar.outputs.ejecutar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar/historico \
            data/radar/seguimiento \
            data/ia \
            data/meteorologia \
            data/sazb \
            logs \
            /tmp/radar-artifact

      - name: Obtener artefacto del radar
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.verificar-radar.outputs.run_id }}
        run: |
          set -euo pipefail

          gh run download \
            "$RUN_ID" \
            --name radar-rma10 \
            --dir /tmp/radar-artifact

          if [ -d /tmp/radar-artifact/data/radar ]; then
            cp -a \
              /tmp/radar-artifact/data/radar/. \
              data/radar/
          else
            cp -a \
              /tmp/radar-artifact/. \
              data/radar/ \
              2>/dev/null || true
          fi

          test -s data/radar/resultado_procesamiento.json
          test -s data/radar/seguimiento/estado.json
          test -s data/radar/seguimiento/seguimiento_temporal.json
          test -s data/radar/radar_timestamp.txt

      - name: Actualizar observación SAZB
        continue-on-error: true
        run: |
          python -m pip install requests
          python scripts/smn_observaciones.py || true

      - name: Dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Conectar RMA10 con Storm Engine
        run: |
          set -euo pipefail

          python scripts/adaptar_rma10_intelligence.py

          test -s data/radar/radar_nowcast.json

      - name: Validar timestamp del nowcast
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          radar = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          data = json.loads(
              Path(
                  "data/radar/radar_nowcast.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          nc = data.get("nowcast", {})

          if nc.get("frame_actual_utc") != radar:
              raise SystemExit(
                  "ERROR: nowcast desincronizado: "
                  f"{nc.get('frame_actual_utc')} != {radar}"
              )
          PY

      - name: Acumular dataset RMA10
        run: |
          set -euo pipefail

          python scripts/acumular_features_rma10.py

          test -s \
            data/radar/radar_features_rma10.csv

      - name: Predicción ML RMA10
        run: |
          set -euo pipefail

          python scripts/prediccion_rma10_ml.py

          test -s \
            data/radar/seguimiento/prediccion_ml_rma10.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/radar/seguimiento/prediccion_ml_rma10.json"
          )

          d = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          if d.get("ok") is not True:
              raise SystemExit(
                  "ERROR: ML no válido"
              )

          if not isinstance(
              d.get("predicciones"),
              list
          ):
              raise SystemExit(
                  "ERROR: predicciones inválidas"
              )

          if d.get(
              "tracks_analizados"
          ) != len(
              d["predicciones"]
          ):
              raise SystemExit(
                  "ERROR: tracks_analizados != predicciones"
              )

          radar = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          if d.get("frame_radar") != radar:
              raise SystemExit(
                  "ERROR: ML desincronizado"
              )
          PY

      - name: Evolución temporal
        run: |
          set -euo pipefail

          if [ -f scripts/prediccion_evolucion.py ]; then
            python scripts/prediccion_evolucion.py
          fi

          test -s \
            data/radar/seguimiento/prediccion_evolucion.json

      - name: Fusionar meteorología
        run: |
          set -euo pipefail

          python scripts/meteorologia_fusion.py

          test -s \
            data/ia/estado_meteorologico.json

      - name: Ejecutar Storm Engine
        run: |
          set -euo pipefail

          python scripts/tormenta_intelligence.py

          test -s \
            data/ia/inteligencia_tormenta.json

      - name: Ejecutar Decision Engine
        run: |
          set -euo pipefail

          python scripts/motor_decision_climaar.py

          test -s \
            data/ia/resultado_final.json

      - name: Sincronizar metadatos de salida
        run: |
          set -euo pipefail

          python scripts/normalizar_salida_inteligencia.py

      - name: Validación end-to-end
        run: |
          set -euo pipefail

          python scripts/auditoria_end_to_end.py

      - name: Preparar artefacto final
        run: |
          set -euo pipefail

          rm -rf /tmp/climaar-final

          mkdir -p \
            /tmp/climaar-final/radar \
            /tmp/climaar-final/ia \
            /tmp/climaar-final/meteorologia \
            /tmp/climaar-final/sazb

          cp -a \
            data/radar/. \
            /tmp/climaar-final/radar/

          cp -a \
            data/ia/. \
            /tmp/climaar-final/ia/

          cp -a \
            data/meteorologia/. \
            /tmp/climaar-final/meteorologia/ \
            2>/dev/null || true

          cp -a \
            data/sazb/. \
            /tmp/climaar-final/sazb/ \
            2>/dev/null || true

      - name: Publicar artefacto final
        uses: actions/upload-artifact@v4
        with:
          name: climaar-resultado-final
          path: /tmp/climaar-final
          retention-days: 30

      - name: Persistir resultados con rebase y retry
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            data/radar/radar_nowcast.json \
            data/radar/radar_features_rma10.csv \
            data/radar/seguimiento/prediccion_ml_rma10.json \
            data/radar/seguimiento/prediccion_evolucion.json \
            data/ia/estado_meteorologico.json \
            data/ia/inteligencia_tormenta.json \
            data/ia/resultado_final.json \
            data/meteorologia/ambiente_futuro.json \
            data/sazb/status.json

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: integrar inteligencia RMA10"

          for intento in 1 2 3; do

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true

              if [ "$intento" -eq 3 ]; then
                exit 1
              fi

              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push exitoso en intento $intento."
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              exit 1
            fi

            sleep 2
          done
