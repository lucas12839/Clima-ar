name: ClimaAR Intelligence Central

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: climaar-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear directorios
        run: |
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/ia
          mkdir -p logs

      - name: Actualizar radar RainViewer
        run: |
          python scripts/radar_rainviewer.py

      - name: Verificar radar
        run: |
          test -s data/radar/actual.png
          test -s data/radar/radar_nowcast.json
          test -s data/radar/status.json
          test -s data/radar/radar_features_rainviewer.csv

      - name: Verificar estructura CSV
        run: |
          python - <<'PY'
          import csv

          path = "data/radar/radar_features_rainviewer.csv"
          expected = 21

          with open(path, encoding="utf-8", newline="") as f:
              reader = csv.reader(f)

              try:
                  header = next(reader)
              except StopIteration:
                  raise SystemExit("ERROR: CSV vacío")

              if len(header) != expected:
                  raise SystemExit(
                      f"ERROR: encabezado tiene {len(header)} columnas; "
                      f"esperadas {expected}"
                  )

              rows = 0

              for line, row in enumerate(reader, start=2):
                  if not row:
                      continue

                  if len(row) != expected:
                      raise SystemExit(
                          f"ERROR: línea {line} tiene {len(row)} columnas; "
                          f"esperadas {expected}"
                      )

                  rows += 1

          if rows == 0:
              raise SystemExit("ERROR: CSV sin datos")

          print(
              f"CSV OK: {rows} filas / {expected} columnas"
          )
          PY

      - name: Procesador de radar ClimaAR
        run: |
          python procesador_radar.py

      - name: Verificar procesamiento
        run: |
          test -s data/radar/resultado_procesamiento.json

      - name: Decodificador de radar
        run: |
          if [ -f scripts/radar_repair_decoder.py ]; then
            python scripts/radar_repair_decoder.py
          else
            echo "Decoder no encontrado; se continúa."
          fi

      - name: Fusión meteorológica
        run: |
          if [ -f scripts/meteorologia_fusion.py ]; then
            python scripts/meteorologia_fusion.py
          else
            echo "meteorologia_fusion.py no encontrado; se continúa."
          fi

      - name: Inteligencia de tormentas
        run: |
          if [ -f scripts/tormenta_intelligence.py ]; then
            python scripts/tormenta_intelligence.py
          else
            echo "tormenta_intelligence.py no encontrado; se continúa."
          fi

      - name: Seguimiento temporal de células
        run: |
          python seguimiento_temporal.py

      - name: Verificar seguimiento temporal
        run: |
          test -s data/radar/seguimiento/seguimiento_temporal.json

      - name: Predicción de evolución
        run: |
          python prediccion_evolucion.py

      - name: Verificar predicción
        run: |
          test -s data/radar/seguimiento/prediccion_evolucion.json
          test -s data/radar/seguimiento/predicciones_pendientes.json

      - name: Verificación final
        run: |
          python - <<'PY'
          import csv
          import os

          csv_path = "data/radar/radar_features_rainviewer.csv"
          expected = 21

          with open(csv_path, encoding="utf-8", newline="") as f:
              reader = csv.reader(f)

              try:
                  header = next(reader)
              except StopIteration:
                  raise SystemExit("ERROR FINAL: CSV vacío")

              if len(header) != expected:
                  raise SystemExit(
                      f"ERROR FINAL: encabezado tiene "
                      f"{len(header)} columnas"
                  )

              count = 0

              for line, row in enumerate(reader, start=2):
                  if not row:
                      continue

                  if len(row) != expected:
                      raise SystemExit(
                          f"ERROR FINAL: línea {line} tiene "
                          f"{len(row)} columnas"
                      )

                  count += 1

          if count == 0:
              raise SystemExit("ERROR FINAL: CSV sin filas")

          required_files = [
              "data/radar/actual.png",
              "data/radar/radar_nowcast.json",
              "data/radar/status.json",
              "data/radar/resultado_procesamiento.json",
              "data/radar/seguimiento/seguimiento_temporal.json",
              "data/radar/seguimiento/prediccion_evolucion.json",
              "data/radar/seguimiento/predicciones_pendientes.json",
          ]

          for path in required_files:
              if not os.path.isfile(path):
                  raise SystemExit(
                      f"ERROR FINAL: falta {path}"
                  )

              if os.path.getsize(path) == 0:
                  raise SystemExit(
                      f"ERROR FINAL: archivo vacío: {path}"
                  )

          print(
              f"VALIDACIÓN FINAL OK: "
              f"{count} filas / {expected} columnas"
          )

          print("Archivos de inteligencia OK:")
          for path in required_files:
              print(f"  OK: {path}")
          PY

      - name: Preparar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "ClimaAR: seguimiento y prediccion de tormentas"
          else
            echo "No hay cambios para guardar."
          fi

      - name: Sincronizar y publicar
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
