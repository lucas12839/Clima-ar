name: ClimaAR - Intelligence Central

on:
  workflow_dispatch:
    inputs:
      radar_run_id:
        description: "ID de la ejecución Radar a procesar"
        required: false
        type: string

concurrency:
  group: climaar-intelligence
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar entorno
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar \
            data/radar/seguimiento \
            data/ia \
            data/meteorologia \
            data/sazb

      - name: Verificar Radar RMA10 disponible
        env:
          RADAR_RUN_ID: ${{ inputs.radar_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "${RADAR_RUN_ID:-}" ]; then
            echo "Procesando ejecución Radar indicada: ${RADAR_RUN_ID}"

            gh run view "${RADAR_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json conclusion,status,workflowName

            CONCLUSION="$(
              gh run view "${RADAR_RUN_ID}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json conclusion \
                --jq '.conclusion'
            )"

            STATUS="$(
              gh run view "${RADAR_RUN_ID}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json status \
                --jq '.status'
            )"

            if [ "${STATUS}" != "completed" ]; then
              echo "ERROR: la ejecución Radar todavía no terminó."
              exit 1
            fi

            if [ "${CONCLUSION}" != "success" ]; then
              echo "ERROR: la ejecución Radar indicada no terminó correctamente."
              exit 1
            fi

            echo "RADAR_RUN_ID=${RADAR_RUN_ID}" >> "${GITHUB_ENV}"
            exit 0
          fi

          echo "Buscando última ejecución Radar exitosa..."

          RADAR_RUN_ID="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "probar-radar-smn.yml" \
              --branch main \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[0].databaseId'
          )"

          if [ -z "${RADAR_RUN_ID}" ] || [ "${RADAR_RUN_ID}" = "null" ]; then
            echo "ERROR: no se encontró una ejecución Radar exitosa."
            exit 1
          fi

          echo "Última ejecución Radar: ${RADAR_RUN_ID}"

          echo "RADAR_RUN_ID=${RADAR_RUN_ID}" >> "${GITHUB_ENV}"

      - name: Descargar artefacto RMA10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf /tmp/radar-artifact
          mkdir -p /tmp/radar-artifact

          gh run download "${RADAR_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name radar-rma10 \
            --dir /tmp/radar-artifact

          if [ ! -d /tmp/radar-artifact ]; then
            echo "ERROR: no se descargó el artefacto Radar."
            exit 1
          fi

          echo "Contenido del artefacto:"
          find /tmp/radar-artifact -maxdepth 4 -type f | sort

      - name: Integrar artefacto RMA10
        run: |
          set -euo pipefail

          if [ -d /tmp/radar-artifact/radar ]; then
            cp -a \
              /tmp/radar-artifact/radar/. \
              data/radar/
          else
            cp -a \
              /tmp/radar-artifact/. \
              data/radar/
          fi

          echo "Radar integrado:"
          find data/radar -maxdepth 3 -type f | sort

      - name: Verificar archivos Radar
        run: |
          set -euo pipefail

          test -s data/radar/radar_nowcast.json
          test -s data/radar/radar_timestamp.txt

          echo "Timestamp Radar:"
          cat data/radar/radar_timestamp.txt

      - name: Actualizar SAZB
        run: |
          set -euo pipefail

          if [ -f scripts/actualizar_sazb.py ]; then
            python scripts/actualizar_sazb.py
          else
            echo "actualizar_sazb.py no disponible; se continúa."
          fi

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Conectar RMA10 con Storm Engine
        run: |
          set -euo pipefail

          python scripts/adaptar_rma10_intelligence.py

          test -s data/radar/radar_nowcast.json

      - name: Georreferenciar núcleos RMA10
        run: |
          set -euo pipefail

          python scripts/scripts/georreferenciar_rma10.py

          test -s data/radar/radar_nowcast.json

      - name: Validar georreferenciación RMA10
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/radar/radar_nowcast.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          nowcast = data.get("nowcast", {})

          nuclei = nowcast.get("nucleos_georreferenciados")

          if not isinstance(nuclei, list):
              raise SystemExit(
                  "ERROR: nucleos_georreferenciados no es una lista"
              )

          if not nuclei:
              raise SystemExit(
                  "ERROR: no hay núcleos georreferenciados"
              )

          total = len(nuclei)

          valid = 0

          for nucleus in nuclei:
              lat = nucleus.get("latitud")
              lon = nucleus.get("longitud")

              if lat is not None and lon is not None:
                  valid += 1

          print(f"Núcleos georreferenciados: {valid}/{total}")

          if valid != total:
              raise SystemExit(
                  "ERROR: existen núcleos sin georreferenciación"
              )

          geo = nowcast.get("georreferenciacion", {})

          if not isinstance(geo, dict):
              raise SystemExit(
                  "ERROR: bloque georreferenciacion inválido"
              )

          print(
              "Estado georreferenciación:",
              geo.get("estado")
          )

          print("OK: georreferenciación 1:1 validada.")
          PY

      - name: Validar timestamp del nowcast
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          nowcast_path = Path("data/radar/radar_nowcast.json")
          timestamp_path = Path("data/radar/radar_timestamp.txt")

          data = json.loads(
              nowcast_path.read_text(encoding="utf-8")
          )

          radar_timestamp = (
              timestamp_path.read_text(
                  encoding="utf-8"
              ).strip()
          )

          frame = (
              data.get("nowcast", {})
                  .get("frame_actual_utc")
          )

          def normalize(value):
              if not isinstance(value, str):
                  return None

              value = value.strip()

              if not value:
                  return None

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              dt = datetime.fromisoformat(value)

              if dt.tzinfo is None:
                  return None

              return dt.astimezone(timezone.utc)

          frame_dt = normalize(frame)
          radar_dt = normalize(radar_timestamp)

          if frame_dt is None:
              raise SystemExit(
                  "ERROR: frame_actual_utc inválido"
              )

          if radar_dt is None:
              raise SystemExit(
                  "ERROR: radar_timestamp.txt inválido"
              )

          if frame_dt != radar_dt:
              raise SystemExit(
                  "ERROR: timestamp del nowcast desincronizado "
                  f"(frame={frame_dt}, radar={radar_dt})"
              )

          print(
              "OK: timestamp sincronizado:",
              frame_dt.isoformat()
          )
          PY

      - name: Acumular dataset RMA10
        run: |
          set -euo pipefail

          if [ -f scripts/acumular_dataset_rma10.py ]; then
            python scripts/acumular_dataset_rma10.py
          elif [ -f scripts/dataset_rma10.py ]; then
            python scripts/dataset_rma10.py
          else
            echo "Script de dataset no encontrado; se continúa."
          fi

      - name: Predicción ML RMA10
        run: |
          set -euo pipefail

          if [ -f scripts/prediccion_ml_rma10.py ]; then
            python scripts/prediccion_ml_rma10.py
          elif [ -f scripts/ml_rma10.py ]; then
            python scripts/ml_rma10.py
          else
            echo "Script ML RMA10 no encontrado; se continúa."
          fi

          if [ -f data/radar/seguimiento/prediccion_ml.json ]; then
            test -s data/radar/seguimiento/prediccion_ml.json
          fi

      - name: Evolución temporal
        run: |
          set -euo pipefail

          if [ -f scripts/prediccion_evolucion.py ]; then
            python scripts/prediccion_evolucion.py
          fi

          test -s \
            data/radar/seguimiento/prediccion_evolucion.json

      - name: Conectar evolución con trayectoria
        run: |
          set -euo pipefail

          test -s data/radar/radar_nowcast.json
          test -s data/radar/seguimiento/prediccion_evolucion.json

          python scripts/conectar_evolucion_trayectoria.py

          test -s data/radar/radar_nowcast.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/radar/radar_nowcast.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          nowcast = data.get("nowcast", {})

          projections = nowcast.get("proyecciones")

          if not isinstance(projections, dict):
              raise SystemExit(
                  "ERROR: nowcast.proyecciones no es un objeto"
              )

          required = ("5", "10", "20", "30")

          missing = [
              key
              for key in required
              if key not in projections
          ]

          if missing:
              raise SystemExit(
                  "ERROR: faltan proyecciones: "
                  + ", ".join(missing)
              )

          for key in required:
              projection = projections[key]

              if not isinstance(projection, dict):
                  raise SystemExit(
                      f"ERROR: proyección {key} inválida"
                  )

              for field in (
                  "minutos",
                  "timestamp_utc",
                  "x",
                  "y",
                  "latitud",
                  "longitud",
              ):
                  if projection.get(field) is None:
                      raise SystemExit(
                          f"ERROR: falta {field} "
                          f"en proyección {key}"
                      )

          print(
              "OK: proyecciones 5/10/20/30 "
              "conectadas y georreferenciadas."
          )
          PY

      - name: Fusionar meteorología
        run: |
          set -euo pipefail

          python scripts/meteorologia_fusion.py

          test -s \
            data/ia/estado_meteorologico.json

      - name: Ejecutar Storm Engine
        run: |
          set -euo pipefail

          python scripts/tormenta_intelligence_timestamp.py

          test -s \
            data/ia/inteligencia_tormenta.json

      - name: Validar ambiente en trayectoria
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/ia/inteligencia_tormenta.json"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          trayectoria = data.get(
              "ambiente_en_trayectoria"
          )

          if not isinstance(trayectoria, dict):
              raise SystemExit(
                  "ERROR: ambiente_en_trayectoria "
                  "no es un objeto"
              )

          if not trayectoria:
              raise SystemExit(
                  "ERROR: Storm Engine terminó con "
                  "ambiente_en_trayectoria vacío"
              )

          print(
              "OK: ambiente meteorológico asociado a "
              f"{len(trayectoria)} proyecciones."
          )
          PY

      - name: Ejecutar Decision Engine
        run: |
          set -euo pipefail

          python scripts/motor_decision_climaar.py

          test -s \
            data/ia/resultado_final.json

      - name: Preparar artefacto final
        run: |
          set -euo pipefail

          rm -rf /tmp/climaar-final

          mkdir -p \
            /tmp/climaar-final/radar \
            /tmp/climaar-final/ia \
            /tmp/climaar-final/meteorologia \
            /tmp/climaar-final/sazb

          cp -a \
            data/radar/. \
            /tmp/climaar-final/radar/

          cp -a \
            data/ia/. \
            /tmp/climaar-final/ia/

          if [ -d data/meteorologia ]; then
            cp -a \
              data/meteorologia/. \
              /tmp/climaar-final/meteorologia/
          fi

          if [ -d data/sazb ]; then
            cp -a \
              data/sazb/. \
              /tmp/climaar-final/sazb/
          fi

          find /tmp/climaar-final \
            -type f \
            -print \
            | sort

      - name: Validar artefacto final
        run: |
          set -euo pipefail

          test -s \
            /tmp/climaar-final/radar/radar_nowcast.json

          test -s \
            /tmp/climaar-final/ia/estado_meteorologico.json

          test -s \
            /tmp/climaar-final/ia/inteligencia_tormenta.json

          test -s \
            /tmp/climaar-final/ia/resultado_final.json

          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("/tmp/climaar-final")

          files = [
              base / "radar" / "radar_nowcast.json",
              base / "ia" / "estado_meteorologico.json",
              base / "ia" / "inteligencia_tormenta.json",
              base / "ia" / "resultado_final.json",
          ]

          for path in files:
              with path.open(
                  "r",
                  encoding="utf-8"
              ) as fh:
                  json.load(fh)

              print("OK:", path)
          PY

      - name: Publicar artefacto final
        uses: actions/upload-artifact@v4
        with:
          name: climaar-intelligence-final
          path: /tmp/climaar-final
          if-no-files-found: error
          retention-days: 7

      - name: Persistir resultados con rebase y retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p data/ia

          cp -a \
            /tmp/climaar-final/ia/. \
            data/ia/

          git add data/ia

          if git diff --cached --quiet; then
            echo "No hay cambios de Intelligence para persistir."
            exit 0
          fi

          git commit \
            -m "Actualizar resultado Intelligence ClimaAR"

          for attempt in 1 2 3; do
            echo "Intento de persistencia ${attempt}/3"

            if git push origin HEAD:main; then
              echo "Persistencia exitosa."
              exit 0
            fi

            echo "Push rechazado; actualizando main..."

            git fetch origin main
            git rebase origin/main || {
              echo "ERROR: conflicto durante rebase."
              git rebase --abort || true
              exit 1
            }
          done

          echo "ERROR: no se pudo persistir después de 3 intentos."
          exit 1
