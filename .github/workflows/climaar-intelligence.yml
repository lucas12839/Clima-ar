name: ClimaAR Intelligence Central

on:
  workflow_run:
    workflows: ["Probar Radar SMN"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: climaar-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar directorios
        run: |
          mkdir -p data/radar/historico
          mkdir -p data/radar/seguimiento
          mkdir -p data/ia
          mkdir -p data/meteorologia
          mkdir -p logs
          mkdir -p /tmp/radar-artifact

      - name: Obtener artefacto del radar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          RUN_ID="${{ github.event.workflow_run.id }}"

          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list \
              --workflow probar-radar-smn.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: no se encontró una ejecución exitosa de Probar Radar SMN."
            exit 1
          fi

          echo "Run radar utilizado: $RUN_ID"

          gh run download "$RUN_ID" \
            --name radar-rma10 \
            --dir /tmp/radar-artifact

          echo "Contenido del artefacto:"
          find /tmp/radar-artifact -maxdepth 4 -type f | sort | head -80

          if [ -d /tmp/radar-artifact/data/radar ]; then
            cp -a /tmp/radar-artifact/data/radar/. data/radar/
          else
            cp -a /tmp/radar-artifact/. data/radar/ 2>/dev/null || true
          fi

          test -s data/radar/resultado_procesamiento.json
          test -s data/radar/seguimiento/estado.json
          test -s data/radar/seguimiento/seguimiento_temporal.json
          test -s data/radar/seguimiento/prediccion_evolucion.json

      - name: Actualizar observación SAZB
        continue-on-error: true
        run: |
          python -m pip install requests
          python scripts/smn_observaciones.py || true

      - name: Dependencias de inteligencia
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Conectar RMA10 con Storm Engine
        run: |
          python scripts/adaptar_rma10_intelligence.py
          test -s data/radar/radar_nowcast.json

      - name: Georreferenciar RMA10
        run: |
          python scripts/scripts/georreferenciar_rma10.py
          test -s data/radar/radar_nowcast.json

      - name: Fusionar meteorología
        run: |
          python scripts/meteorologia_fusion.py
          test -s data/ia/estado_meteorologico.json

      - name: Ejecutar Storm Engine
        run: |
          python scripts/tormenta_intelligence.py
          test -s data/ia/inteligencia_tormenta.json
          test -s data/ia/historial_inteligencia_tormenta.csv

      - name: Generar resultado final unificado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          radar = Path("data/radar/radar_nowcast.json")
          pred = Path("data/radar/seguimiento/prediccion_evolucion.json")
          intel = Path("data/ia/inteligencia_tormenta.json")
          fusion = Path("data/ia/estado_meteorologico.json")

          def read(path):
              return json.loads(path.read_text(encoding="utf-8"))

          r = read(radar)
          p = read(pred)
          i = read(intel)
          f = read(fusion)

          result = {
              "version": "ClimaAR-final-1.0",
              "actualizado_utc": i.get("actualizado_utc"),
              "fuente_radar": "SMN RMA10",
              "radar": r,
              "prediccion": {
                  "schema_version": p.get("schema_version"),
                  "radar_timestamp": p.get("radar_timestamp"),
                  "intervalo_minutos": p.get("intervalo_minutos"),
                  "resumen": p.get("resumen", {}),
                  "calibracion": p.get("calibracion", {}),
              },
              "inteligencia": i,
              "meteorologia": f,
          }

          out = Path("data/ia/resultado_final.json")

          out.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8",
          )

          print("RESULTADO FINAL GENERADO")
          print("Estado:", i.get("estado"))
          print("Severidad:", i.get("severidad"))
          print(
              "Prob. tormenta:",
              i.get("probabilidades", {}).get("tormenta")
          )
          print(
              "Prob. llegada:",
              i.get("probabilidades", {}).get("llegada_bahia")
          )
          print(
              "Prob. fortalecimiento:",
              i.get("probabilidades", {}).get("fortalecimiento")
          )
          print(
              "Prob. lluvia fuerte:",
              i.get("peligros", {}).get("lluvia_fuerte")
          )
          print(
              "Prob. viento fuerte:",
              i.get("peligros", {}).get("viento_fuerte")
          )
          print(
              "Prob. granizo:",
              i.get("peligros", {}).get("granizo")
          )
          print(
              "Prob. rayos:",
              i.get("peligros", {}).get("rayo")
          )
          print(
              "IA V8 disponible:",
              i.get("ia_v8", {}).get("disponible")
          )
          print(
              "Confianza:",
              i.get("confianza_modelo")
          )
          print("Salida:", out)
          PY

          test -s data/ia/resultado_final.json

      - name: Persistir resultados
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            data/radar/radar_nowcast.json \
            data/ia/estado_meteorologico.json \
            data/ia/inteligencia_tormenta.json \
            data/ia/historial_inteligencia_tormenta.csv \
            data/ia/resultado_final.json \
            data/meteorologia/ambiente_futuro.json \
            data/sazb/status.json \
            scripts/scripts/georreferenciar_rma10.py

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "ClimaAR: georreferenciar RMA10"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Publicar artefacto de resultado
        uses: actions/upload-artifact@v4
        with:
          name: climaar-resultado-final
          path: |
            data/radar/radar_nowcast.json
            data/radar/seguimiento/prediccion_evolucion.json
            data/radar/seguimiento/calibracion_prediccion.json
            data/ia/estado_meteorologico.json
            data/ia/inteligencia_tormenta.json
            data/ia/historial_inteligencia_tormenta.csv
            data/ia/resultado_final.json
            data/meteorologia/ambiente_futuro.json
            data/sazb/status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Mostrar resultado final
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/ia/resultado_final.json")

          d = json.loads(
              p.read_text(encoding="utf-8")
          )

          i = d.get("inteligencia", {})
          probs = i.get("probabilidades", {})
          hazards = i.get("peligros", {})
          radar = d.get("radar", {}).get("nowcast", {})
          bahia = radar.get("bahia_blanca", {})

          print("===== CLIMAAR RESULTADO FINAL =====")
          print("Actualizado:", d.get("actualizado_utc"))
          print("Estado:", i.get("estado"))
          print("Severidad:", i.get("severidad"))
          print("Tormenta:", probs.get("tormenta"))
          print(
              "Llegada Bahía Blanca:",
              probs.get("llegada_bahia")
          )
          print(
              "Fortalecimiento:",
              probs.get("fortalecimiento")
          )
          print(
              "Debilitamiento:",
              probs.get("debilitamiento")
          )
          print(
              "Lluvia fuerte:",
              hazards.get("lluvia_fuerte")
          )
          print(
              "Viento fuerte:",
              hazards.get("viento_fuerte")
          )
          print(
              "Granizo:",
              hazards.get("granizo")
          )
          print(
              "Rayos:",
              hazards.get("rayo")
          )
          print(
              "Índice severidad:",
              i.get("indice_hibrido_severidad")
          )
          print(
              "IA V8:",
              i.get("ia_v8", {}).get("disponible")
          )
          print(
              "Confianza:",
              i.get("confianza_modelo")
          )
          print("----- GEOREFERENCIACIÓN RMA10 -----")
          print(
              "Georreferenciación:",
              radar.get("georreferenciacion", {}).get("disponible")
          )
          print(
              "Movimiento hacia Bahía:",
              radar.get("movimiento_hacia_bahia")
          )
          print(
              "Distancia a Bahía km:",
              radar.get("distancia_km")
          )
          print(
              "Rumbo a Bahía:",
              radar.get("rumbo_bahia_grados")
          )
          print(
              "Error de rumbo:",
              radar.get("error_rumbo_bahia_grados")
          )
          print(
              "ETA minutos:",
              radar.get("eta_minutos")
          )
          print(
              "Bahía Blanca:",
              bahia
          )
          print("===================================")
          PY
