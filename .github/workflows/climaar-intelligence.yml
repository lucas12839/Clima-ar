name: ClimaAR Intelligence Central

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  intelligence:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR REPOSITORIO
      # ============================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            numpy \
            scipy \
            opencv-python \
            Pillow \
            joblib \
            scikit-learn

      # ============================================================
      # 4. DIRECTORIOS
      # ============================================================

      - name: Preparar directorios
        run: |
          mkdir -p data/radar
          mkdir -p data/radar/historico
          mkdir -p data/ia
          mkdir -p logs

      # ============================================================
      # 5. RAINVIEWER
      # ============================================================

      - name: Obtener radar RainViewer y generar nowcast
        run: |
          python scripts/radar_rainviewer.py

      # ============================================================
      # 6. VERIFICAR RADAR
      # ============================================================

      - name: Verificar radar RainViewer
        run: |
          echo "=========================================="
          echo " VERIFICACION RAINVIEWER"
          echo "=========================================="

          test -f data/radar/actual.png
          test -f data/radar/radar_nowcast.json

          echo ""
          echo "ARCHIVO ACTUAL:"
          ls -lh data/radar/actual.png

          echo ""
          echo "NOWCAST:"
          cat data/radar/radar_nowcast.json

          echo ""
          echo "FECHA DEL ARCHIVO:"
          stat data/radar/actual.png

      # ============================================================
      # 7.
