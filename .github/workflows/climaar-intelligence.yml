name: ClimaAR Intelligence

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climaar-intelligence-main
  cancel-in-progress: false

jobs:

  intelligence:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # REPOSITORIO
      # ======================================================

      - name: Descargar repositorio

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Preparar Python

        uses: actions/setup-python@v5

        with:
          python-version: '3.11'


      # ======================================================
      # DEPENDENCIAS
      # ======================================================

      - name: Instalar dependencias

        run: |

          set -e

          python -m pip install --upgrade pip

          pip install requests


      # ======================================================
      # 1. OBSERVACION SAZB
      # ======================================================

      - name: Actualizar SAZB

        id: sazb

        continue-on-error: true

        run: |

          set -e

          python scripts/smn_observaciones.py


      # ======================================================
      # 2. FUSION METEOROLOGICA
      # ======================================================

      - name: Actualizar meteorologia

        run: |

          set -e

          python scripts/meteorologia_fusion.py

          test -s data/ia/estado_meteorologico.json

          test -s data/meteorologia/ambiente_futuro.json

          python -m json.tool \
            data/ia/estado_meteorologico.json \
            >/dev/null

          python -m json.tool \
            data/meteorologia/ambiente_futuro.json \
            >/dev/null

          echo "Fusion meteorologica OK"


      # ======================================================
      # 3. INTELIGENCIA DE TORMENTAS
      # ======================================================

      - name: Ejecutar Storm Engine

        run: |

          set -e

          test -s data/radar/radar_nowcast.json

          test -s data/ia/estado_meteorologico.json

          python scripts/tormenta_intelligence.py

          test -s data/ia/inteligencia_tormenta.json

          test -s data/ia/historial_inteligencia_tormenta.csv

          python -m json.tool \
            data/ia/inteligencia_tormenta.json \
            >/dev/null

          echo "Storm Engine OK"


      # ======================================================
      # 4. VALIDACION INTEGRADA
      # ======================================================

      - name: Validar cadena ClimaAR

        run: |

          set -e

          python - <<'PY'

          import json
          from pathlib import Path


          archivos = [

              Path(
                  "data/radar/radar_nowcast.json"
              ),

              Path(
                  "data/sazb/status.json"
              ),

              Path(
                  "data/ia/estado_meteorologico.json"
              ),

              Path(
                  "data/meteorologia/ambiente_futuro.json"
              ),

              Path(
                  "data/ia/inteligencia_tormenta.json"
              ),

          ]


          # --------------------------------------------------
          # EXISTENCIA Y JSON VALIDO
          # --------------------------------------------------

          for path in archivos:

              if (
                  not path.exists()
                  or
                  path.stat().st_size == 0
              ):

                  raise SystemExit(
                      f"Falta archivo operativo: {path}"
                  )


              with path.open(
                  "r",
                  encoding="utf-8"
              ) as f:

                  json.load(f)


          # --------------------------------------------------
          # INTELLIGENCE
          # --------------------------------------------------

          with open(
              "data/ia/inteligencia_tormenta.json",
              encoding="utf-8"
          ) as f:

              intelligence = json.load(f)


          required = [

              "version",
              "motor",
              "estado",
              "severidad",
              "probabilidades",
              "peligros",
              "confianza_modelo",
              "razones",

          ]


          for key in required:

              if key not in intelligence:

                  raise SystemExit(
                      "Falta campo obligatorio "
                      f"en Intelligence: {key}"
                  )


          probabilities = (
              intelligence[
                  "probabilidades"
              ]
          )


          hazards = (
              intelligence[
                  "peligros"
              ]
          )


          # --------------------------------------------------
          # PROBABILIDADES
          # --------------------------------------------------

          for key in (
              "tormenta",
              "llegada_bahia"
          ):

              value = float(
                  probabilities[key]
              )


              if not (
                  0 <= value <= 1
              ):

                  raise SystemExit(
                      f"Probabilidad invalida: "
                      f"{key}={value}"
                  )


          # --------------------------------------------------
          # PELIGROS
          # --------------------------------------------------

          for key, value in hazards.items():

              value = float(value)


              if not (
                  0 <= value <= 1
              ):

                  raise SystemExit(
                      f"Peligro invalido: "
                      f"{key}={value}"
                  )


          # --------------------------------------------------
          # SEVERIDAD
          # --------------------------------------------------

          if intelligence[
              "severidad"
          ] not in (
              "verde",
              "amarillo",
              "naranja",
              "rojo"
          ):

              raise SystemExit(
                  "Severidad invalida"
              )


          # --------------------------------------------------
          # INFORMACION DE DIAGNOSTICO
          # --------------------------------------------------

          with open(
              "data/sazb/status.json",
              encoding="utf-8"
          ) as f:

              sazb = json.load(f)


          with open(
              "data/radar/radar_nowcast.json",
              encoding="utf-8"
          ) as f:

              radar = json.load(f)


          radar_nowcast = radar.get(
              "nowcast",
              {}
          )


          print("")
          print("================================")
          print("       CLIMAAR INTEGRADO")
          print("================================")

          print(
              "Estado:",
              intelligence["estado"]
          )

          print(
              "Severidad:",
              intelligence["severidad"]
          )

          print(
              "Probabilidad tormenta:",
              probabilities["tormenta"]
          )

          print(
              "Confianza:",
              intelligence["confianza_modelo"]
          )

          print(
              "SAZB:",
              sazb.get(
                  "obsTime_utc"
              )
          )

          print(
              "Estado SAZB:",
              sazb.get(
                  "estado"
              )
          )

          print(
              "Edad SAZB:",
              sazb.get(
                  "edad_minutos"
              )
          )

          print(
              "Radar:",
              radar_nowcast.get(
                  "frame_actual_utc"
              )
          )

          print(
              "Actividad radar:",
              radar_nowcast.get(
                  "actividad"
              )
          )

          print(
              "Confianza movimiento:",
              radar_nowcast.get(
                  "confianza_movimiento"
              )
          )

          print("================================")
          print("VALIDACION INTEGRADA OK")
          print("================================")

          PY


      # ======================================================
      # 5. PREPARAR RESULTADOS
      # ======================================================

      - name: Preparar commit

        run: |

          set -e

          git config \
            user.name \
            "climaar-bot"

          git config \
            user.email \
            "bot@climaar.com.ar"


          git add \
            data/sazb/status.json \
            data/ia/estado_meteorologico.json \
            data/meteorologia/ambiente_futuro.json \
            data/ia/inteligencia_tormenta.json \
            data/ia/historial_meteorologico.csv \
            data/ia/historial_inteligencia_tormenta.csv


          if git diff --cached --quiet; then

            echo "Sin cambios para publicar."

          else

            git commit \
              -m "ClimaAR inteligencia integrada"

          fi


      # ======================================================
      # 6. PUBLICAR CON REINTENTOS
      # ======================================================

      - name: Publicar resultados

        run: |

          set -e


          for intento in 1 2 3 4 5; do

            echo ""
            echo "Intento de push: $intento"


            git fetch origin main


            if git rebase origin/main; then

              if git push origin HEAD:main; then

                echo ""
                echo "Publicacion correcta."

                exit 0

              fi

            else

              echo "Rebase con conflicto."

              git rebase --abort || true

            fi


            echo "Esperando antes de reintentar..."

            sleep 10

          done


          echo ""
          echo "No se pudo publicar ClimaAR Intelligence."

          exit 1
