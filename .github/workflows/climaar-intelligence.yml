name: ClimaAR Intelligence Central

on:
  workflow_dispatch:
    inputs:
      radar_run_id:
        description: "ID del Radar RMA10 que disparó Intelligence (obligatorio salvo modo=refresco)"
        required: false
        default: ""
        type: string
      modo:
        description: "frame_nuevo: usa el artefacto exacto del Radar. refresco: entre frames, usa el último radar válido ya publicado."
        required: false
        default: "frame_nuevo"
        type: choice
        options:
          - frame_nuevo
          - refresco

permissions:
  actions: read
  contents: write

concurrency:
  group: climaar-production-writes
  cancel-in-progress: false

jobs:
  verificar-radar:
    runs-on: ubuntu-latest

    outputs:
      ejecutar: ${{ steps.verificar.outputs.ejecutar }}
      run_id: ${{ steps.verificar.outputs.run_id }}

    steps:
      - name: Verificar artefacto RMA10
        id: verificar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RADAR_RUN_ID: ${{ inputs.radar_run_id }}
          MODO: ${{ inputs.modo }}
        run: |
          set -euo pipefail

          RUN_ID="$INPUT_RADAR_RUN_ID"

          # Entre frames SINARAME la Inteligencia sigue con el ULTIMO radar
          # valido (el publicado en main). Se verifica mas adelante que ese
          # radar activo sea un frame completo y procesado.
          if [ "$MODO" = "refresco" ]; then
            echo "Refresco de Inteligencia con el último radar válido."
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Intelligence requiere el ID exacto de la ejecución Radar."
            exit 1
          fi

          echo "Usando exactamente el Radar indicado: $RUN_ID"

          ARTIFACTO="$(
            gh api \
              "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name=="radar-rma10" and .expired==false) | .id] | .[0] // empty'
          )"

          if [ -z "$ARTIFACTO" ]; then
            echo "ERROR: el Radar $RUN_ID no tiene artefacto radar-rma10 válido."
            exit 1
          fi

          echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  intelligence:
    needs: verificar-radar

    if: needs.verificar-radar.outputs.ejecutar == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Solo el último estado (antes bajaba los ~540 MB de historia: 25-36 s).
          fetch-depth: 1
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar/historico \
            data/radar/seguimiento \
            data/ia \
            data/meteorologia \
            data/sazb \
            logs \
            /tmp/radar-artifact

      - name: Verificar radar activo completo y validado (refresco)
        if: inputs.modo == 'refresco'
        run: |
          set -euo pipefail

          test -s data/radar/radar_timestamp.txt
          python scripts/radar_estado.py verificar-activo

      - name: Obtener artefacto del radar
        if: inputs.modo != 'refresco'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.verificar-radar.outputs.run_id }}
        run: |
          set -euo pipefail

          echo "Descargando artefacto del Radar: $RUN_ID"

          gh run download \
            "$RUN_ID" \
            --name radar-rma10 \
            --dir /tmp/radar-artifact

          if [ -d /tmp/radar-artifact/data/radar ]; then
            cp -a \
              /tmp/radar-artifact/data/radar/. \
              data/radar/
          else
            cp -a \
              /tmp/radar-artifact/. \
              data/radar/
          fi

          test -s data/radar/resultado_procesamiento.json
          test -s data/radar/seguimiento/estado.json
          test -s data/radar/seguimiento/seguimiento_temporal.json
          test -s data/radar/radar_timestamp.txt

      - name: Actualizar observación SAZB
        continue-on-error: true
        run: |
          python -m pip install requests
          python scripts/smn_observaciones.py || true

      - name: Dependencias
        run: |
          set -euo pipefail

          # Sin "pip install --upgrade pip" (re-auditoría 23/11/2026): no hace falta,
          # suma tiempo y un punto de falla más en cada ciclo.
          pip install --retries 5 -r requirements.txt

      - name: Capturar red de estaciones BCP
        timeout-minutes: 6
        run: |
          set -euo pipefail

          # 23/11/2026: las 5 del SMN quedaron desactivadas (llegan con horas o días de
          # atraso); su colector ya no corre. Se vuelve a activar si el SMN publica a tiempo.
          python scripts/estaciones/colector_bcp.py

          test -s data/ia/estaciones/observaciones/bcp_actual.json

      - name: Validar frescura y publicar estado de las estaciones
        run: |
          set -euo pipefail

          python scripts/estaciones/validar_red_observaciones.py
          test -s data/ia/estaciones/red_observaciones_estado.json

      - name: Señales de superficie de las estaciones (lluvia, ráfagas, frente de ráfagas)
        run: |
          set -euo pipefail
          # Nunca corta el ciclo: si falla, la clasificación sigue sin estaciones.
          python scripts/estaciones/senales_superficie.py \
            || echo "::warning::No se pudieron calcular las señales de superficie."

      - name: Canal 13 de GOES-19 a la hora del radar (control de ecos sin nube)
        run: |
          # Etapa F: el análisis por localidad saca los ecos sin ninguna nube encima
          # (terreno de noche). Falla segura: sin satélite sigue sin ese control.
          timeout 90 python -m goes19.c13_radar || echo "AVISO: canal 13 no disponible en este ciclo"

      - name: Nowcast por flujo óptico (física; da el movimiento al adaptador)
        run: |
          set -euo pipefail
          python scripts/nowcast_flujo_optico.py
          test -s data/radar/nowcast_flujo.json

      - name: Calidad de estaciones y calibración de la lluvia del radar
        run: |
          set -euo pipefail
          # Nunca corta el ciclo: sin esto se sigue con la calibración anterior.
          python scripts/estaciones/calidad_y_calibracion.py \
            || echo "::warning::No se pudo controlar la calidad de las estaciones."

      - name: Conectar RMA10 con Storm Engine
        run: |
          set -euo pipefail

          python scripts/adaptar_rma10_intelligence.py

          test -s data/radar/radar_nowcast.json

      - name: Georreferenciar núcleos RMA10
        run: |
          set -euo pipefail

          test -s data/radar/radar_nowcast.json
          test -s data/radar/actual.png

          python scripts/georreferenciar_rma10.py

          test -s data/radar/radar_nowcast.json

      - name: Validar georreferenciación RMA10
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("data/radar/radar_nowcast.json")

          if not path.is_file():
              raise SystemExit(
                  "ERROR: no existe data/radar/radar_nowcast.json"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          nowcast = data.get("nowcast")

          if not isinstance(nowcast, dict):
              raise SystemExit(
                  "ERROR: falta el objeto nowcast"
              )

          nuclei = nowcast.get("nucleos")

          if not isinstance(nuclei, list):
              raise SystemExit(
                  "ERROR: nowcast.nucleos no es una lista"
              )

          geo = nowcast.get(
              "nucleos_georreferenciados"
          )

          if not isinstance(geo, list):
              raise SystemExit(
                  "ERROR: falta nowcast.nucleos_georreferenciados"
              )

          if len(geo) != len(nuclei):
              raise SystemExit(
                  "ERROR: cantidad de núcleos georreferenciados "
                  f"({len(geo)}) distinta de núcleos detectados "
                  f"({len(nuclei)})"
              )

          resumen = nowcast.get(
              "georreferenciacion"
          )

          if not isinstance(resumen, dict):
              raise SystemExit(
                  "ERROR: falta nowcast.georreferenciacion"
              )

          if resumen.get("disponible") is not True:
              raise SystemExit(
                  "ERROR: georreferenciación marcada como no disponible"
              )

          if resumen.get("estado") != "VALIDADA_OPERATIVAMENTE":
              raise SystemExit(
                  "ERROR: estado de georreferenciación inválido: "
                  f"{resumen.get('estado')!r}"
              )

          for index, item in enumerate(geo, start=1):

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"ERROR: núcleo georreferenciado #{index} inválido"
                  )

              referencia = item.get(
                  "georreferencia"
              )

              if not isinstance(referencia, dict):
                  raise SystemExit(
                      f"ERROR: falta georreferencia "
                      f"en núcleo #{index}"
                  )

              lat = referencia.get(
                  "latitud"
              )

              lon = referencia.get(
                  "longitud"
              )

              if not isinstance(
                  lat,
                  (int, float)
              ):
                  raise SystemExit(
                      f"ERROR: latitud inválida "
                      f"en núcleo #{index}"
                  )

              if not isinstance(
                  lon,
                  (int, float)
              ):
                  raise SystemExit(
                      f"ERROR: longitud inválida "
                      f"en núcleo #{index}"
                  )

              if not math.isfinite(lat):
                  raise SystemExit(
                      f"ERROR: latitud no finita "
                      f"en núcleo #{index}"
                  )

              if not math.isfinite(lon):
                  raise SystemExit(
                      f"ERROR: longitud no finita "
                      f"en núcleo #{index}"
                  )

              if not -90 <= lat <= 90:
                  raise SystemExit(
                      f"ERROR: latitud fuera de rango "
                      f"en núcleo #{index}: {lat}"
                  )

              if not -180 <= lon <= 180:
                  raise SystemExit(
                      f"ERROR: longitud fuera de rango "
                      f"en núcleo #{index}: {lon}"
                  )

          print(
              f"OK: {len(geo)} / {len(nuclei)} "
              "núcleos georreferenciados"
          )

          print(
              "Estado:",
              resumen.get("estado")
          )

          print(
              "Georreferenciación validada correctamente."
          )
          PY

      - name: Validar timestamp del nowcast
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_utc(value):
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(
                      f"ERROR: timestamp inválido: {value!r}"
                  )

              text = value.strip()

              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              try:
                  dt = datetime.fromisoformat(text)
              except ValueError as exc:
                  raise SystemExit(
                      f"ERROR: timestamp inválido: {value!r}"
                  ) from exc

              if dt.tzinfo is None:
                  raise SystemExit(
                      f"ERROR: timestamp sin zona horaria: {value!r}"
                  )

              return dt.astimezone(timezone.utc)

          radar = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          data = json.loads(
              Path(
                  "data/radar/radar_nowcast.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          nc = data.get("nowcast", {})
          nowcast = nc.get("frame_actual_utc")

          radar_dt = parse_utc(radar)
          nowcast_dt = parse_utc(nowcast)

          if radar_dt != nowcast_dt:
              raise SystemExit(
                  "ERROR: nowcast desincronizado: "
                  f"{nowcast!r} != {radar!r}"
              )

          print(
              "Timestamp radar:",
              radar_dt.isoformat()
          )

          print(
              "Timestamp nowcast:",
              nowcast_dt.isoformat()
          )

          print("Timestamp sincronizado.")
          PY

      - name: Predicción RMA10 por track (reglas, sin ML)
        run: |
          set -euo pipefail

          python scripts/prediccion_rma10_ml.py

          test -s \
            data/radar/seguimiento/prediccion_ml_rma10.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path(
              "data/radar/seguimiento/prediccion_ml_rma10.json"
          )

          d = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          if d.get("ok") is not True:
              raise SystemExit(
                  "ERROR: predicción RMA10 no válida"
              )

          if not isinstance(
              d.get("predicciones"),
              list
          ):
              raise SystemExit(
                  "ERROR: predicciones inválidas"
              )

          if d.get("tracks_analizados") != len(d["predicciones"]):
              raise SystemExit(
                  "ERROR: tracks_analizados != predicciones"
              )

          radar = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          def normalize(value):
              if not isinstance(value, str) or not value.strip():
                  return None

              text = value.strip()

              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              dt = datetime.fromisoformat(text)

              if dt.tzinfo is None:
                  return None

              return dt.astimezone(timezone.utc)

          if normalize(
              d.get("frame_radar")
          ) != normalize(radar):
              raise SystemExit(
                  "ERROR: ML desincronizado"
              )
          PY

      - name: Evolución temporal
        run: |
          set -euo pipefail

          python scripts/prediccion_evolucion.py

          test -s \
            data/radar/seguimiento/prediccion_evolucion.json

      - name: Trayectoria de cada tormenta con el movimiento del 5b
        run: |
          set -euo pipefail
          # Desde el 20/11/2026 las proyecciones salen de acá (aciertan más que el
          # predictor viejo, herramientas/comparar_trayectorias.py). Falla segura:
          # sin este archivo, el paso siguiente usa el predictor viejo.
          # Re-auditoría 23/11/2026: un fallo grave (memoria, cuelgue) también se
          # ataja; el archivo queda de otra imagen y el paso siguiente lo descarta.
          timeout 120 python scripts/trayectorias_capas.py \
            || echo "::warning::Trayectorias del 5b no disponibles: sigue el predictor viejo."

      - name: Conectar evolución con trayectoria
        run: |
          set -euo pipefail

          test -s data/radar/radar_nowcast.json
          test -s data/radar/seguimiento/prediccion_evolucion.json

          python scripts/conectar_evolucion_trayectoria.py

          test -s data/radar/radar_nowcast.json

          python - <<'PY2'
          import json
          from pathlib import Path

          path = Path("data/radar/radar_nowcast.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          nowcast = data.get("nowcast", {})
          projections = nowcast.get("proyecciones")
          metadata = nowcast.get("proyecciones_metadata")

          if not isinstance(projections, dict):
              raise SystemExit("ERROR: nowcast.proyecciones no es un objeto")

          if not isinstance(metadata, dict):
              raise SystemExit(
                  "ERROR: nowcast.proyecciones_metadata no es un objeto"
              )

          principal = nowcast.get("nucleo_principal_id")
          if str(metadata.get("track_id")) != str(principal):
              raise SystemExit(
                  "ERROR: metadata de proyecciones no corresponde "
                  "al principal de Tracking"
              )

          if metadata.get("pronostico_disponible") is False:
              if metadata.get("motivo_no_disponible") not in ("SIN_MOVIMIENTO_VALIDO", "SIN_ACTIVIDAD"):
                  raise SystemExit(
                      "ERROR: motivo de proyección no disponible no reconocido"
                  )
              if projections:
                  raise SystemExit(
                      "ERROR: hay proyecciones a pesar de no existir "
                      "movimiento válido"
                  )
              print(
                  "OK: sin proyección por "
                  f"{metadata.get('motivo_no_disponible')}."
              )
              raise SystemExit(0)

          if metadata.get("pronostico_disponible") is not True:
              raise SystemExit(
                  "ERROR: disponibilidad de pronóstico no declarada"
              )

          required = ("5", "10", "20", "30")
          missing = [key for key in required if key not in projections]

          if missing:
              raise SystemExit(
                  "ERROR: faltan proyecciones: " + ", ".join(missing)
              )

          required_fields = (
              "minutos",
              "timestamp_utc",
              "x",
              "y",
              "latitud",
              "longitud",
          )

          for key in required:
              projection = projections[key]

              if not isinstance(projection, dict):
                  raise SystemExit(
                      f"ERROR: proyección {key} inválida"
                  )

              for field in required_fields:
                  if projection.get(field) is None:
                      raise SystemExit(
                          f"ERROR: falta {field} en proyección {key}"
                      )

          print(
              "OK: proyecciones 5/10/20/30 conectadas y georreferenciadas."
          )
          PY2

      - name: Fusionar meteorología
        run: |
          set -euo pipefail

          python scripts/meteorologia_fusion.py

          test -s \
            data/ia/estado_meteorologico.json

      - name: Ejecutar Storm Engine
        run: |
          set -euo pipefail

          python scripts/tormenta_intelligence_timestamp.py

          test -s \
            data/ia/inteligencia_tormenta.json

      - name: Validar ambiente en trayectoria
        run: |
          set -euo pipefail

          python - <<'PY2'
          import json
          from pathlib import Path

          path = Path("data/ia/inteligencia_tormenta.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          trajectory = data.get("ambiente_en_trayectoria")

          if not isinstance(trajectory, dict):
              raise SystemExit(
                  "ERROR: ambiente_en_trayectoria no es un objeto"
              )

          if not trajectory and (data.get("vigencia_radar") or {}).get("modo") == "radar_obsoleto":
              print(
                  "OK: radar con más de 60 min; sin proyección de celdas "
                  "(riesgo solo por ambiente)."
              )
              raise SystemExit(0)

          if not trajectory:
              radar_path = Path("data/radar/radar_nowcast.json")
              radar = json.loads(
                  radar_path.read_text(encoding="utf-8")
              )
              radar_nowcast = radar.get("nowcast", {})
              projection_meta = radar_nowcast.get(
                  "proyecciones_metadata",
                  {}
              )

              if (
                  projection_meta.get("pronostico_disponible") is False
                  and projection_meta.get("motivo_no_disponible")
                  in ("SIN_MOVIMIENTO_VALIDO", "SIN_ACTIVIDAD")
              ):
                  print(
                      "OK: sin ambiente en trayectoria por "
                      f"{projection_meta.get('motivo_no_disponible')}."
                  )
                  raise SystemExit(0)

              raise SystemExit(
                  "ERROR: Storm Engine terminó con ambiente_en_trayectoria vacío"
              )

          print(
              "OK: ambiente meteorológico asociado a "
              f"{len(trajectory)} proyecciones."
          )
          PY2

      - name: Nowcast en capas 5b (llegadas por localidad que se ven)
        run: |
          set -euo pipefail

          # Punto 5b. Corre antes de la decisión: sus llegadas a la zona de cada
          # localidad (hasta 10 km) son las que se ven desde el 20/11/2026.
          # Falla segura: sin él, la decisión usa el flujo óptico.
          # Re-auditoría 23/11/2026: un fallo grave (memoria, cuelgue) también se
          # ataja; la decisión descarta un archivo de otra imagen y usa el flujo óptico.
          timeout 240 python scripts/nowcast_capas.py \
            || echo "::warning::Nowcast en capas 5b no disponible: las llegadas salen del flujo óptico."

      - name: Tormenta sobre cada localidad, celda por celda con rayos (la tormenta eléctrica encima se ve; el resto en paralelo)
        run: |
          set -euo pipefail
          # Paso 2. Falla segura: el script nunca corta el ciclo. Se valida solo en vivo.
          timeout 120 python scripts/celdas_localidad.py || echo "AVISO: celdas por localidad no disponibles en este ciclo"

      - name: Indicios de tormenta severa sin Doppler (el eco en arco se ve en el viento de cada localidad)
        run: |
          set -euo pipefail
          # Etapa G (docs/ETAPA_G.md). Falla segura: el script nunca corta el ciclo.
          timeout 120 python scripts/indicios_severos.py || echo "AVISO: indicios de tormenta severa no disponibles en este ciclo"

      - name: Ejecutar Decision Engine
        run: |
          set -euo pipefail

          python scripts/motor_decision_climaar.py

          test -s \
            data/ia/resultado_final.json

      - name: Puntaje de gravedad por tormenta (en paralelo, no cambia lo que se ve)
        run: |
          set -euo pipefail

          # Punto 4 del plan. Falla segura: el script nunca corta el ciclo.
          timeout 120 python scripts/puntaje_gravedad.py || echo "::warning::Puntaje de gravedad no disponible en este ciclo."

      - name: Tormentas en formación antes del radar (en paralelo, no cambia lo que se ve)
        run: |
          set -euo pipefail

          # Punto 5 del plan. Falla segura: el script nunca corta el ciclo.
          timeout 120 python scripts/aviso_formacion.py || echo "::warning::Tormentas en formación no disponibles en este ciclo."

      - name: Modelos por localidad, WRF del SMN y ensambles (en paralelo, no cambia lo que se ve)
        run: |
          set -euo pipefail

          # Punto 7 del plan. Falla segura: el script nunca corta el ciclo y
          # se corta a los 5 min (una corrida nueva del WRF se baja una sola vez).
          timeout 300 python scripts/modelos_region.py || echo "AVISO: modelos por localidad no disponibles en este ciclo"

      - name: Ambiente medido por el satélite (en paralelo, no cambia lo que se ve)
        run: |
          set -euo pipefail
          # Punto 8 del plan. Falla segura: el script nunca corta el ciclo.
          # En los refrescos reutiliza lo ya leído (mismos archivos).
          timeout 180 python scripts/ambiente_satelite.py || echo "AVISO: ambiente del satélite no disponible en este ciclo"

      - name: Alarma "ya llega" por estaciones aguas arriba (en paralelo, no cambia lo que se ve)
        run: |
          set -euo pipefail
          # Idea 3. Frente de ráfagas en estaciones de <= 15 min -> llegada a las localidades
          # aguas abajo. Falla segura: el script nunca corta el ciclo. Se valida solo en vivo.
          timeout 90 python scripts/estaciones/alarma_llegada.py || echo "AVISO: alarma de estaciones no disponible en este ciclo"

      - name: Puntaje de gravedad contra lo medido e informe mensual de aciertos (en paralelo)
        run: |
          set -euo pipefail
          # Etapa B (punto 9). Falla segura: los scripts nunca cortan el ciclo.
          timeout 60 python scripts/verificar_puntaje.py || echo "AVISO: verificación del puntaje no disponible en este ciclo"
          timeout 60 python scripts/informe_aciertos.py || echo "AVISO: informe de aciertos no disponible en este ciclo"

      - name: Control de salud de la cadena (en paralelo, no cambia lo que se ve)
        env:
          CLIMAAR_DETECTOR_LATIDO: ${{ vars.CLIMAAR_DETECTOR_LATIDO }}
          CLIMAAR_DETECTOR_INFO: ${{ vars.CLIMAAR_DETECTOR_INFO }}
        run: |
          set -euo pipefail
          # Auditoría 20/11/2026: avisa lo que antes se pasaba por alto
          # (estaciones que no entran, relojes cortados, numeración, tamaños).
          # Falla segura: nunca corta el ciclo.
          python scripts/salud_cadena.py

      - name: Validar integridad completa de ClimaAR
        run: |
          set -euo pipefail
          python scripts/validar_integridad_climaar.py

      - name: Preparar artefacto final
        run: |
          set -euo pipefail

          rm -rf /tmp/climaar-final

          mkdir -p \
            /tmp/climaar-final/radar \
            /tmp/climaar-final/ia \
            /tmp/climaar-final/meteorologia \
            /tmp/climaar-final/sazb

          cp -a \
            data/radar/. \
            /tmp/climaar-final/radar/

          cp -a \
            data/ia/. \
            /tmp/climaar-final/ia/

          cp -a \
            data/meteorologia/. \
            /tmp/climaar-final/meteorologia/ \
            2>/dev/null || true

          cp -a \
            data/sazb/. \
            /tmp/climaar-final/sazb/ \
            2>/dev/null || true

      - name: Publicar artefacto final
        uses: actions/upload-artifact@v4
        with:
          name: climaar-resultado-final
          path: /tmp/climaar-final
          retention-days: 30

      - name: Persistir resultados con rebase y retry
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Restos viejos borrados en la auditoría del 20/11/2026: si una corrida
          # anterior los trae de vuelta desde el artefacto, no se vuelven a guardar.
          rm -f data/radar/status.json data/radar/latest.png data/radar/radar_features_rma10.csv \
            data/radar/captura_error_1.png data/radar/captura_error_2.png data/radar/captura_error_3.png \
            data/radar/continuidad.txt data/radar/ultimo_radar_sha256.txt

          # Casos guardados (regla 7): la carpeta aparece con la primera tormenta.
          historial_goes=""
          if [ -d data/goes19/historial ]; then
            historial_goes="data/goes19/historial"
          fi

          # Rayos de la última hora para el mapa de la app (aparece con la
          # primera lectura del GLM).
          rayos_mapa=""
          if [ -f data/goes19/rayos_mapa.json ]; then
            rayos_mapa="data/goes19/rayos_mapa.json"
          fi

          git add -A \
            data/radar \
            data/ia \
            data/meteorologia \
            data/sazb \
            data/goes19/goes19_state.json \
            $rayos_mapa \
            $historial_goes

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: integrar inteligencia RMA10"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "ERROR: quedaron cambios sin confirmar."
            git status --short
            exit 1
          fi

          # 5 intentos con espera creciente: el 23/11 un corte de red de GitHub
          # de 2 min (git fetch sin reintento) tiró la IA de un frame entero.
          for intento in 1 2 3 4 5; do
            echo "Intento de sincronización: $intento"

            if ! git fetch origin main; then
              echo "No se pudo bajar main (red)."
              if [ "$intento" -eq 5 ]; then exit 1; fi
              sleep $((intento * 10))
              continue
            fi

            if ! git rebase origin/main; then
              echo "Rebase falló."

              git rebase --abort 2>/dev/null || true
              git reset --hard HEAD

              if [ "$intento" -eq 5 ]; then
                git status --short
                exit 1
              fi

              sleep 2
              continue
            fi

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: el rebase dejó cambios locales."
              git status --short
              git reset --hard HEAD

              if [ "$intento" -eq 5 ]; then
                exit 1
              fi

              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push exitoso en intento $intento."
              exit 0
            fi

            echo "Push falló en intento $intento."

            if [ "$intento" -eq 5 ]; then
              git status --short
              exit 1
            fi

            sleep 2
          done
