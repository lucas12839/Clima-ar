name: Cruzar historico ClimaAR

on:
  workflow_dispatch:

jobs:
  cruzar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pandas

      - name: Crear catalogo de eventos
        run: |
          mkdir -p data/historico

          printf '%s\n' \
          'fecha,evento,tormenta_severa,viento_severo,precipitacion_extrema,inundacion,granizo,tornado,rafaga_kmh,lluvia_mm,ventana_lluvia_h,estado_verificacion' \
          '1981-03-14,Temporal grave,1,1,1,0,0,0,110,85,,pendiente_verificacion' \
          '1982-02-13,Tornado temporal Chile Pedro Pico,1,1,0,0,0,1,170,,,pendiente_verificacion' \
          '2019-12-30,Tornado F0 Paso Piedras,1,1,1,0,0,1,115,100,1,parcialmente_verificado' \
          '2023-12-16,Temporal destructivo,1,1,1,0,0,0,189,45,,parcialmente_verificado' \
          '2025-03-07,Inundacion historica,1,0,1,1,0,0,,290,12,verificado' \
          > data/historico/eventos_severos.csv

      - name: Crear ventanas de 24 horas
        run: |
          python - <<'PY'
          import pandas as pd

          clima = pd.read_csv(
              "data/historico/clima_horario_1980_2026.csv"
          )

          eventos = pd.read_csv(
              "data/historico/eventos_severos.csv"
          )

          clima["time"] = pd.to_datetime(
              clima["time"],
              errors="coerce"
          )

          eventos["fecha"] = pd.to_datetime(
              eventos["fecha"],
              errors="coerce"
          )

          clima = clima.dropna(
              subset=["time"]
          )

          eventos = eventos.dropna(
              subset=["fecha"]
          )

          ventanas = []

          for _, evento in eventos.iterrows():

              fecha = evento["fecha"]

              inicio = fecha - pd.Timedelta(
                  hours=24
              )

              fin = fecha

              ventana = clima[
                  (clima["time"] >= inicio) &
                  (clima["time"] <= fin)
              ].copy()

              if ventana.empty:
                  print(
                      "Sin datos para:",
                      fecha
                  )
                  continue

              ventana["evento_fecha"] = fecha
              ventana["evento"] = evento["evento"]

              etiquetas = [
                  "tormenta_severa",
                  "viento_severo",
                  "precipitacion_extrema",
                  "inundacion",
                  "granizo",
                  "tornado"
              ]

              for etiqueta in etiquetas:
                  ventana[etiqueta] = evento[
                      etiqueta
                  ]

              ventanas.append(
                  ventana
              )

          if not ventanas:
              raise SystemExit(
                  "ERROR: no se pudieron crear ventanas"
              )

          resultado = pd.concat(
              ventanas,
              ignore_index=True
          )

          resultado.to_csv(
              "data/historico/ventanas_eventos_24h.csv",
              index=False
          )

          print(
              "Registros:",
              len(resultado)
          )

          print(
              "Eventos:",
              resultado["evento_fecha"].nunique()
          )
          PY

      - name: Crear resumen
        run: |
          python - <<'PY'
          import pandas as pd

          archivo = (
              "data/historico/"
              "ventanas_eventos_24h.csv"
          )

          df = pd.read_csv(archivo)

          columnas = [
              "temperature_2m",
              "relative_humidity_2m",
              "pressure_msl",
              "precipitation",
              "wind_speed_10m",
              "wind_gusts_10m"
          ]

          columnas = [
              c for c in columnas
              if c in df.columns
          ]

          df[columnas].describe().to_csv(
              "data/historico/"
              "resumen_ventanas.csv"
          )

          print(
              df[columnas].describe()
          )
          PY

      - name: Guardar resultados
        run: |
          git config user.name "climaar-bot"
          git config user.email "bot@climaar.com.ar"

          git add data/historico/

          git commit \
            -m "Crear dataset historico ClimaAR" \
            || echo "sin cambios"

          git push
