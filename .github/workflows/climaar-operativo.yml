name: ClimaAR Operativo

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  operativo:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy opencv-python pandas joblib scikit-learn

      - name: Ejecutar ClimaAR
        run: |
          python scripts/climaar_operativo.py

      - name: Verificar resultado
        run: |
          set -e

          test -s data/radar/actual.png
          test -s data/radar/status.json

          python -m json.tool \
            data/radar/status.json \
            >/dev/null

          echo "Radar OK"
          echo "Estado operativo OK"

      - name: Guardar resultado
        run: |
          git config user.name "climaar-bot"
          git config user.email "bot@climaar.com.ar"

          git add \
            data/radar/actual.png \
            data/radar/status.json

          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "ClimaAR actualizacion operativa"
            git push
          fi
