name: ClimaAR Operativo Manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  operativo:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow numpy opencv-python-headless pandas joblib scikit-learn

      - name: Ejecutar
        run: |
          python scripts/climaar_operativo.py

      - name: Verificar
        run: |
          test -s data/radar/actual.png
          test -s data/radar/status.json

          python -m json.tool \
            data/radar/status.json \
            >/dev/null

          echo "Radar OK"

      - name: Guardar
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/radar/actual.png \
            data/radar/status.json

          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit \
              -m "ClimaAR: actualización operativa"

            git push origin main
          fi
