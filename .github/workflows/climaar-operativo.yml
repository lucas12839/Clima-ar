name: ClimaAR Operativo Manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  operativo:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar ClimaAR Operativo
        run: |
          if [ -f scripts/climaar_operativo.py ]; then
            python scripts/climaar_operativo.py
          else
            echo "climaar_operativo.py no existe"
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data logs ia

          git diff --cached --quiet || \
            git commit -m "ClimaAR operativo actualizado"

          git push
