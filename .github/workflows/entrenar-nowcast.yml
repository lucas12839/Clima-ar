name: Entrenamiento Nowcast ClimaAR

on:

  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:

  entrenar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Verificar dataset
        run: |

          test -f \
            data/radar/radar_features_rainviewer.csv

          echo "Dataset:"

          wc -l \
            data/radar/radar_features_rainviewer.csv

      - name: Entrenar modelo
        run: |
          python scripts/entrenar_nowcast.py

      - name: Verificar modelo
        run: |

          test -f \
            modelo/climaar_nowcast_features.joblib

          test -f \
            modelo/metricas_nowcast.json

          echo "Modelo generado."

          ls -lh \
            modelo/climaar_nowcast_features.joblib

          ls -lh \
            modelo/metricas_nowcast.json

      - name: Mostrar métricas
        run: |
          cat modelo/metricas_nowcast.json

      - name: Guardar modelo
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            modelo/climaar_nowcast_features.joblib

          git add \
            modelo/metricas_nowcast.json

          if git diff --cached --quiet; then
            echo "Sin cambios."
          else

            git commit \
              -m "ai: actualizar modelo nowcast"

            git push origin main

          fi
