name: Entrenar nowcast RMA10

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install --quiet pandas numpy scikit-learn joblib

      - name: Verificar datos RMA10
        run: |
          if [ ! -f data/radar/radar_features.csv ]; then
            echo "ERROR: no existe data/radar/radar_features.csv"
            exit 1
          fi

          echo "Frames disponibles:"
          python - <<'PY'
          import pandas as pd

          path = "data/radar/radar_features.csv"
          df = pd.read_csv(path)

          print(f"Cantidad de frames: {len(df)}")

          if len(df) < 50:
              raise SystemExit(
                  f"ERROR: hay {len(df)} frames. "
                  "Se necesitan al menos 50 para entrenar."
              )
          PY

      - name: Entrenar primer modelo RMA10
        run: python scripts/entrenar_nowcast.py

      - name: Verificar modelo generado
        run: |
          test -s modelo/climaar_nowcast_features.joblib
          test -s modelo/metricas_nowcast.json

          echo "Modelo generado correctamente."
          cat modelo/metricas_nowcast.json

      - name: Guardar modelo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add modelo/climaar_nowcast_features.joblib modelo/metricas_nowcast.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "model: actualizar nowcast RMA10"
          git push
