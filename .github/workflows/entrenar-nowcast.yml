name: Entrenar Nowcast

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: entrenar-nowcast
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          pip install -r requirements.txt

      - name: Verificar dataset
        run: |
          test -s data/radar/radar_features_rainviewer.csv

      - name: Entrenar
        run: |
          python scripts/entrenar_nowcast.py

      - name: Commit modelo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ia data/radar logs

          git diff --cached --quiet || \
            git commit -m "ClimaAR: actualización modelo nowcast"

      - name: Publicar
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
