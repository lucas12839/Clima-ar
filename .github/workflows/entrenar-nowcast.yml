name: Entrenamiento Nowcast ClimaAR

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/entrenar_nowcast.py"
      - "data/radar/radar_features_rainviewer.csv"

jobs:
  entrenar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Verificar dataset radar
        run: |
          test -f data/radar/radar_features_rainviewer.csv
          echo "Dataset encontrado:"
          wc -l data/radar/radar_features_rainviewer.csv

      - name: Entrenar modelo nowcast
        run: |
          python scripts/entrenar_nowcast.py

      - name: Verificar modelo generado
        run: |
          test -f modelo/climaar_nowcast_features.joblib
          test -f modelo/metricas_nowcast.json

          echo "Modelo generado correctamente."
          ls -lh modelo/climaar_nowcast_features.joblib
          ls -lh modelo/metricas_nowcast.json

      - name: Mostrar métricas
        run: |
          cat modelo/metricas_nowcast.json

      - name: Guardar modelo en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add modelo/climaar_nowcast_features.joblib
          git add modelo/metricas_nowcast.json

          git diff --cached --quiet || git commit -m "ai: actualizar modelo nowcast"

          git push
