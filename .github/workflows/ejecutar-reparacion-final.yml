name: Auditoría ClimaAR (solo lectura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxis Python
        run: |
          set -euo pipefail
          python -m compileall -q .

      - name: Verificar archivos operativos
        run: |
          set -euo pipefail

          archivos=(
            "data/radar/radar_timestamp.txt"
            "data/radar/radar_nowcast.json"
            "data/radar/resultado_procesamiento.json"
            "data/radar/seguimiento/seguimiento_temporal.json"
            "data/radar/seguimiento/prediccion_ml_rma10.json"
            "data/radar/seguimiento/prediccion_evolucion.json"
            "data/ia/estado_meteorologico.json"
            "data/ia/inteligencia_tormenta.json"
            "data/ia/resultado_final.json"
          )

          for archivo in "${archivos[@]}"; do
            test -s "$archivo" || {
              echo "Falta o está vacío: $archivo"
              exit 1
            }
          done

      - name: Verificar JSON operativos
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          archivos = [
              "data/radar/radar_nowcast.json",
              "data/radar/resultado_procesamiento.json",
              "data/radar/seguimiento/seguimiento_temporal.json",
              "data/radar/seguimiento/prediccion_ml_rma10.json",
              "data/radar/seguimiento/prediccion_evolucion.json",
              "data/ia/estado_meteorologico.json",
              "data/ia/inteligencia_tormenta.json",
              "data/ia/resultado_final.json",
          ]

          for archivo in archivos:
              data = json.loads(
                  Path(archivo).read_text(encoding="utf-8")
              )
              if not isinstance(data, dict):
                  raise SystemExit(
                      f"{archivo}: no es un objeto JSON"
                  )

          print("JSON operativos OK")
          PY

      - name: Verificar sincronización Radar Nowcast ML
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_utc(value, nombre):
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(
                      f"ERROR: {nombre} inválido: {value!r}"
                  )

              text = value.strip()

              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"

              try:
                  dt = datetime.fromisoformat(text)
              except ValueError as exc:
                  raise SystemExit(
                      f"ERROR: {nombre} inválido: {value!r}"
                  ) from exc

              if dt.tzinfo is None:
                  raise SystemExit(
                      f"ERROR: {nombre} sin zona horaria"
                  )

              return dt.astimezone(timezone.utc)

          radar = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(encoding="utf-8").strip()

          nowcast = json.loads(
              Path(
                  "data/radar/radar_nowcast.json"
              ).read_text(encoding="utf-8")
          )

          ml = json.loads(
              Path(
                  "data/radar/seguimiento/prediccion_ml_rma10.json"
              ).read_text(encoding="utf-8")
          )

          radar_dt = parse_utc(
              radar,
              "radar_timestamp",
          )

          nowcast_dt = parse_utc(
              nowcast.get("nowcast", {}).get(
                  "frame_actual_utc"
              ),
              "nowcast.frame_actual_utc",
          )

          ml_dt = parse_utc(
              ml.get("frame_radar"),
              "ML.frame_radar",
          )

          if not (radar_dt == nowcast_dt == ml_dt):
              raise SystemExit(
                  "ERROR: Radar / Nowcast / ML desincronizados"
              )

          if ml.get("ok") is not True:
              raise SystemExit(
                  "ERROR: ML no válido"
              )

          print("Radar / Nowcast / ML sincronizados")
          print(
              "Frame UTC:",
              radar_dt.isoformat(),
          )
          PY

      - name: Verificar API sin modificar producción
        run: |
          set -euo pipefail

          nohup uvicorn app:app \
            --host 127.0.0.1 \
            --port 8000 \
            > app.log 2>&1 &

          echo $! > app.pid

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:8000/health \
              > /tmp/health.json; then
              break
            fi

            if [ "$i" -eq 30 ]; then
              cat app.log
              exit 1
            fi

            sleep 1
          done

          python - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8000"

          with urllib.request.urlopen(
              base + "/health",
              timeout=10,
          ) as response:
              health = json.load(response)

          required = (
              "status",
              "frame_actual_utc",
              "frame_edad_minutos",
              "estado_radar",
              "sincronizacion",
          )

          for key in required:
              if key not in health:
                  raise SystemExit(
                      f"Falta {key} en /health"
                  )

          for endpoint in (
              "/radar",
              "/prediccion/en-vivo",
              "/tormenta",
              "/inteligencia",
              "/secuencia",
          ):
              with urllib.request.urlopen(
                  base + endpoint,
                  timeout=10,
              ) as response:
                  if response.status != 200:
                      raise SystemExit(
                          f"{endpoint}: HTTP {response.status}"
                      )

          print("API básica OK")
          PY

      - name: Detener API
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi

      - name: Mostrar log API si falló
        if: failure()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

      - name: Resultado final
        run: |
          echo "CLIMAAR AUDITORÍA: OK"
