name: Ejecutar reparacion final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reparar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar auditoria final
        run: python auditoria_final_climaar.py

      - name: Validar cambios
        run: |
          python -m py_compile auditoria_final_climaar.py
          python -m py_compile app.py
          python -m py_compile scripts/prediccion_rma10_ml.py
          python -m py_compile seguimiento_temporal.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/climaar-auto-radar.yml \
            .github/workflows/probar-radar-smn.yml \
            .github/workflows/climaar-intelligence.yml \
            scripts/prediccion_rma10_ml.py \
            seguimiento_temporal.py \
            app.py

          git diff --cached --quiet || git commit -m "ClimaAR: auditoria y reparacion final"

          git push
