name: ClimaAR Reparación Final

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: climaar-production-writes
  cancel-in-progress: false

jobs:
  reparacion-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar entorno
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar \
            data/radar/historico \
            data/radar/seguimiento \
            data/ia \
            data/meteorologia \
            data/sazb \
            logs

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar estructura crítica
        run: |
          set -euo pipefail

          archivos=(
            "scripts/validar_integridad_climaar.py"
            "scripts/adaptar_rma10_intelligence.py"
            "scripts/georreferenciar_rma10.py"
            "scripts/acumular_features_rma10.py"
            "scripts/prediccion_rma10_ml.py"
            "scripts/meteorologia_fusion.py"
            "scripts/tormenta_intelligence_timestamp.py"
            "scripts/motor_decision_climaar.py"
          )

          for archivo in "${archivos[@]}"; do
            if [ ! -f "$archivo" ]; then
              echo "ERROR: falta $archivo"
              exit 1
            fi

            echo "OK: $archivo"
          done

      - name: Validar sintaxis Python
        run: |
          set -euo pipefail

          python -m compileall -q scripts

          echo "Sintaxis Python validada."

      - name: Ejecutar auditoría de integridad
        run: |
          set -euo pipefail

          python scripts/validar_integridad_climaar.py

      - name: Buscar archivos duplicados críticos
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          raiz = Path(".")

          grupos = {
              "validadores": [
                  "validar_integridad_climaar.py",
              ],
              "adaptadores_radar": [
                  "adaptar_rma10_intelligence.py",
              ],
              "georreferenciacion": [
                  "georreferenciar_rma10.py",
              ],
              "decision": [
                  "motor_decision_climaar.py",
              ],
          }

          for nombre_grupo, nombres in grupos.items():
              encontrados = []

              for nombre in nombres:
                  encontrados.extend(
                      str(p)
                      for p in raiz.rglob(nombre)
                      if ".git" not in p.parts
                  )

              if len(encontrados) != len(set(encontrados)):
                  raise SystemExit(
                      f"ERROR: duplicados detectados en {nombre_grupo}"
                  )

              if len(encontrados) == 0:
                  raise SystemExit(
                      f"ERROR: no se encontró ningún archivo para {nombre_grupo}"
                  )

              print(
                  f"{nombre_grupo}:",
                  ", ".join(encontrados)
              )

          print("Archivos críticos sin duplicados exactos.")
          PY

      - name: Validar workflows
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          workflows = Path(".github/workflows")

          if not workflows.is_dir():
              raise SystemExit(
                  "ERROR: no existe .github/workflows"
              )

          archivos = sorted(
              workflows.glob("*.yml")
          ) + sorted(
              workflows.glob("*.yaml")
          )

          if not archivos:
              raise SystemExit(
                  "ERROR: no existen workflows"
              )

          nombres = [p.name for p in archivos]

          print("Workflows encontrados:")

          for nombre in nombres:
              print(" -", nombre)

          prefijos_prohibidos = (
              "WORKFLOW__",
              "REPARADO__",
              "FIXED__",
              "COPY__",
          )

          for nombre in nombres:
              if nombre.startswith(prefijos_prohibidos):
                  raise SystemExit(
                      f"ERROR: workflow duplicado/reparado detectado: {nombre}"
                  )

          print("Nombres de workflows válidos.")
          PY

      - name: Validar archivos JSON existentes
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          directorios = (
              Path("data/radar"),
              Path("data/ia"),
              Path("data/meteorologia"),
              Path("data/sazb"),
          )

          total = 0

          for directorio in directorios:
              if not directorio.exists():
                  continue

              for path in directorio.rglob("*.json"):
                  if path.stat().st_size == 0:
                      raise SystemExit(
                          f"ERROR: JSON vacío: {path}"
                      )

                  try:
                      json.loads(
                          path.read_text(encoding="utf-8")
                      )
                  except Exception as exc:
                      raise SystemExit(
                          f"ERROR: JSON inválido: {path}: {exc}"
                      ) from exc

                  total += 1

          print(
              f"JSON válidos inspeccionados: {total}"
          )
          PY

      - name: Validar integridad final
        run: |
          set -euo pipefail

          python scripts/validar_integridad_climaar.py

      - name: Mostrar estado Git
        run: |
          set -euo pipefail

          git status --short

      - name: Confirmar cambios pendientes
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            echo "Hay cambios sin confirmar."
          else
            echo "No hay cambios de contenido pendientes."
          fi

      - name: Publicar reparación final
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: reparación final y validación integral"

          for intento in 1 2 3; do
            echo "Intento de sincronización: $intento"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true

              if [ "$intento" -eq 3 ]; then
                echo "ERROR: no se pudo completar el rebase."
                exit 1
              fi

              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push exitoso."
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              echo "ERROR: no se pudo publicar la reparación."
              exit 1
            fi

            sleep 2
          done
