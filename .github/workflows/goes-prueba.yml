name: Prueba GOES Bahia Blanca

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba-goes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install awscli xarray netCDF4 pyproj matplotlib

      - name: Buscar archivo GOES
        run: |
          mkdir -p data/goes/prueba

          aws s3 ls \
            s3://noaa-goes16/ABI-L2-CMIPF/2022/001/10/ \
            --no-sign-request \
            | grep 'C13_G16' \
            | head -1 \
            | awk '{print $4}' > data/goes/prueba/file.txt

          test -s data/goes/prueba/file.txt

          FILE=$(cat data/goes/prueba/file.txt)

          echo "Archivo encontrado:"
          echo "$FILE"

          aws s3 cp \
            "s3://noaa-goes16/ABI-L2-CMIPF/2022/001/10/$FILE" \
            data/goes/prueba/goes.nc \
            --no-sign-request

          test -s data/goes/prueba/goes.nc

      - name: Recortar zona Bahia Blanca
        run: |
          python - <<'PY'
          import xarray as xr
          import numpy as np
          from pyproj import Proj
          import matplotlib.pyplot as plt

          src = "data/goes/prueba/goes.nc"
          out = "data/goes/prueba/bahia_blanca_goes_c13.png"

          ds = xr.open_dataset(src)
          cmi = ds["CMI"]

          p = ds.goes_imager_projection

          proj = Proj(
              proj="geos",
              h=float(p.perspective_point_height),
