name: Prueba GOES Nubosidad Bahia Blanca

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prueba-goes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install awscli xarray netCDF4 numpy matplotlib

      - name: Descargar GOES-19 CCL actual
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data/goes

          FOUND=""

          for OFFSET in 0 1 2 3 4 5 6; do

            TARGET=$(date -u -d "-${OFFSET} hour" "+%Y %j %H")

            YEAR=$(echo "$TARGET" | awk '{print $1}')
            DOY=$(echo "$TARGET" | awk '{print $2}')
            HOUR=$(echo "$TARGET" | awk '{print $3}')

            echo "Buscando GOES-19 CCLF: ${YEAR}/${DOY}/${HOUR}"

            FILE=$(
              aws s3 ls \
                "s3://noaa-goes19/ABI-L2-CCLF/${YEAR}/${DOY}/${HOUR}/" \
                --no-sign-request \
                2>/dev/null \
                | awk '{print $4}' \
                | grep '^OR_ABI-L2-CCLF' \
                | sort \
                | tail -1 \
                || true
            )

            if [ -n "$FILE" ]; then
              FOUND="s3://noaa-goes19/ABI-L2-CCLF/${YEAR}/${DOY}/${HOUR}/${FILE}"

              echo "Encontrado:"
              echo "$FOUND"

              break
            fi

          done

          if [ -z "$FOUND" ]; then
            echo "ERROR: no se encontró ningún archivo GOES-19 CCLF."
            exit 1
          fi

          aws s3 cp \
            "$FOUND" \
            data/goes/goes_ccl.nc \
            --no-sign-request

          test -s data/goes/goes_ccl.nc

          echo "Archivo descargado correctamente."

      - name: Inspeccionar producto GOES
        run: |
          python - <<'PY'
          import xarray as xr

          ds = xr.open_dataset(
              "data/goes/goes_ccl.nc",
              decode_cf=False
          )

          print("========================================")
          print("GOES-19 CCLF")
          print("========================================")

          print("Variables:")

          for name in ds.variables:
              var = ds[name]

              print(
                  name,
                  "| dims=", var.dims,
                  "| shape=", var.shape,
                  "| dtype=", var.dtype,
                  "| units=", var.attrs.get("units"),
                  "| long_name=", var.attrs.get("long_name"),
              )

          print("========================================")
          print("TCF")
          print("========================================")

          if "TCF" in ds.variables:

              tcf = ds["TCF"]

              for key in [
                  "_FillValue",
                  "valid_range",
                  "scale_factor",
                  "add_offset",
                  "units",
                  "long_name",
                  "standard_name",
              ]:
                  print(
                      key,
                      "=",
                      tcf.attrs.get(key)
                  )

          print("========================================")
          print("DQF")
          print("========================================")

          if "DQF" in ds.variables:

              dqf = ds["DQF"]

              for key in [
                  "_FillValue",
                  "valid_range",
                  "flag_values",
                  "flag_meanings",
                  "units",
                  "long_name",
                  "standard_name",
              ]:
                  print(
                      key,
                      "=",
                      dqf.attrs.get(key)
                  )

          print("========================================")
          print("PROYECCION")
          print("========================================")

          projection = ds["goes_imager_projection"]

          for key in [
              "semi_major_axis",
              "semi_minor_axis",
              "perspective_point_height",
              "longitude_of_projection_origin",
              "sweep_angle_axis",
          ]:
              print(
                  key,
                  "=",
                  projection.attrs.get(key)
              )

          print("========================================")
          print("ATRIBUTOS")
          print("========================================")

          for key in [
              "platform_ID",
              "scene_id",
              "spatial_resolution",
              "time_coverage_start",
              "time_coverage_end",
          ]:
              print(
                  key,
                  "=",
                  ds.attrs.get(key)
              )

          ds.close()
          PY

      - name: Procesar nubosidad Bahia Blanca
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import datetime, timezone

          import matplotlib.pyplot as plt
          import numpy as np
          import xarray as xr

          ARCHIVO = "data/goes/goes_ccl.nc"
          IMAGEN = "data/goes/nubosidad_bahia_blanca.png"
          JSON_OUT = "data/goes/nubosidad.json"

          LAT = -38.72
          LON = -62.27

          ds = xr.open_dataset(
              ARCHIVO,
              decode_cf=False
          )

          # ============================================================
          # 1. VARIABLES OBLIGATORIAS
          # ============================================================

          if "TCF" not in ds.variables:
              raise RuntimeError(
                  "No existe la variable TCF en el producto CCLF."
              )

          if "DQF" not in ds.variables:
              raise RuntimeError(
                  "No existe la variable DQF en el producto CCLF."
              )

          if "x" not in ds.variables:
              raise RuntimeError(
                  "No existe coordenada x."
              )

          if "y" not in ds.variables:
              raise RuntimeError(
                  "No existe coordenada y."
              )

          if "goes_imager_projection" not in ds.variables:
              raise RuntimeError(
                  "No existe la proyección GOES."
              )

          # ============================================================
          # 2. LEER TCF SIN DECODIFICACION AUTOMATICA
          # ============================================================

          tcf_var = ds["TCF"]

          while tcf_var.ndim > 2:
              tcf_var = tcf_var.isel(
                  {tcf_var.dims[0]: 0}
              )

          raw_tcf = np.asarray(
              tcf_var.values
          )

          raw_tcf = raw_tcf.astype(
              np.float64
          )

          tcf_attrs = tcf_var.attrs

          fill_value = tcf_attrs.get(
              "_FillValue",
              None
          )

          if fill_value is not None:
              raw_tcf[
                  raw_tcf == float(fill_value)
              ] = np.nan

          valid_range = tcf_attrs.get(
              "valid_range",
              None
          )

          if valid_range is not None:

              valid_min = float(
                  valid_range[0]
              )

              valid_max = float(
                  valid_range[1]
              )

              raw_tcf[
                  (raw_tcf < valid_min)
                  |
                  (raw_tcf > valid_max)
              ] = np.nan

          scale_factor = float(
              tcf_attrs.get(
                  "scale_factor",
                  1.0
              )
          )

          add_offset = float(
              tcf_attrs.get(
                  "add_offset",
                  0.0
              )
          )

          tcf = (
              raw_tcf
              * scale_factor
              + add_offset
          )

          tcf[
              ~np.isfinite(tcf)
          ] = np.nan

          # CCLF TCF debe estar entre 0 y 1.
          tcf[
              (tcf < 0.0)
              |
              (tcf > 1.0)
          ] = np.nan

          tcf_percent = tcf * 100.0

          # ============================================================
          # 3. LEER DQF
          # ============================================================

          dqf_var = ds["DQF"]

          while dqf_var.ndim > 2:
              dqf_var = dqf_var.isel(
                  {dqf_var.dims[0]: 0}
              )

          dqf = np.asarray(
              dqf_var.values
          ).astype(
              np.int16
          )

          dqf_attrs = dqf_var.attrs

          dqf_fill = dqf_attrs.get(
              "_FillValue",
              None
          )

          if dqf_fill is not None:
              dqf[
                  dqf == int(dqf_fill)
              ] = -1

          # Para el cálculo cuantitativo usamos
          # exclusivamente DQF=0.
          good_quality = (
              dqf == 0
          )

          # ============================================================
          # 4. APLICAR CALIDAD AL TCF
          # ============================================================

          tcf_quality = tcf_percent.copy()

          tcf_quality[
              ~good_quality
          ] = np.nan

          # ============================================================
          # 5. COORDENADAS GOES
          # ============================================================

          x = np.asarray(
              ds["x"].values,
              dtype=np.float64
          )

          y = np.asarray(
              ds["y"].values,
              dtype=np.float64
          )

          projection = ds[
              "goes_imager_projection"
          ]

          semi_major = float(
              projection.attrs[
                  "semi_major_axis"
              ]
          )

          semi_minor = float(
              projection.attrs[
                  "semi_minor_axis"
              ]
          )

          perspective_height = float(
              projection.attrs[
                  "perspective_point_height"
              ]
          )

          longitude_origin = math.radians(
              float(
                  projection.attrs[
                      "longitude_of_projection_origin"
                  ]
              )
          )

          # ============================================================
          # 6. CONVERSION LAT/LON -> GOES FIXED GRID
          # ============================================================

          H = (
              perspective_height
              + semi_major
          )

          lat = math.radians(LAT)
          lon = math.radians(LON)

          eccentricity2 = (
              semi_major**2
              - semi_minor**2
          ) / (
              semi_major**2
          )

          sin_lat = math.sin(lat)
          cos_lat = math.cos(lat)

          rc = (
              semi_major
              / math.sqrt(
                  1.0
                  - eccentricity2
                  * sin_lat**2
              )
          )

          sx = (
              rc
              * cos_lat
              * math.cos(
                  lon - longitude_origin
              )
          )

          sy = (
              rc
              * cos_lat
              * math.sin(
                  lon - longitude_origin
              )
          )

          sz = (
              rc
              * sin_lat
          )

          x_angle = math.atan2(
              -sy,
              H - sx
          )

          y_angle = math.atan2(
              sz,
              math.sqrt(
                  (H - sx)**2
                  + sy**2
              )
          )

          ix = int(
              np.argmin(
                  np.abs(
                      x - x_angle
                  )
              )
          )

          iy = int(
              np.argmin(
                  np.abs(
                      y - y_angle
                  )
              )
          )

          print("")
          print("================================")
          print("GEOLOCALIZACION")
          print("================================")

          print(
              "Bahia Blanca lat:",
              LAT
          )

          print(
              "Bahia Blanca lon:",
              LON
          )

          print(
              "GOES x:",
              x_angle
          )

          print(
              "GOES y:",
              y_angle
          )

          print(
              "Indice x:",
              ix
          )

          print(
              "Indice y:",
              iy
          )

          print(
              "x real:",
              x[ix]
          )

          print(
              "y real:",
              y[iy]
          )

          # ============================================================
          # 7. PIXEL EXACTO
          # ============================================================

          punto = tcf_quality[
              iy,
              ix
          ]

          punto_dqf = int(
              dqf[iy, ix]
          )

          print("")
          print("================================")
          print("PUNTO BAHIA BLANCA")
          print("================================")

          print(
              "TCF:",
              punto,
              "%"
          )

          print(
              "DQF:",
              punto_dqf
          )

          # ============================================================
          # 8. VENTANA 3x3
          # ============================================================

          radius = 1

          y0 = max(
              0,
              iy - radius
          )

          y1 = min(
              tcf_quality.shape[0],
              iy + radius + 1
          )

          x0 = max(
              0,
              ix - radius
          )

          x1 = min(
              tcf_quality.shape[1],
              ix + radius + 1
          )

          window = tcf_quality[
              y0:y1,
              x0:x1
          ]

          valid_pixels = window[
              np.isfinite(window)
          ]

          if valid_pixels.size == 0:
              raise RuntimeError(
                  "No existen pixeles TCF con DQF=0 "
                  "en la ventana 3x3."
              )

          nubosidad_3x3 = float(
              np.nanmean(
                  valid_pixels
              )
          )

          nubosidad_3x3 = round(
              max(
                  0.0,
                  min(
                      100.0,
                      nubosidad_3x3
                  )
              ),
              1
          )

          punto_valido = (
              np.isfinite(punto)
          )

          if punto_valido:
              nubosidad_punto = round(
                  float(punto),
                  1
              )
          else:
              nubosidad_punto = None

          # ============================================================
          # 9. ESTADO DE NUBOSIDAD
          # ============================================================

          # Para esta prueba el estado se basa en la ventana 3x3.
          nubosidad_estado = (
              nubosidad_3x3
          )

          if nubosidad_estado < 10:
              estado = "despejado"

          elif nubosidad_estado < 30:
              estado = "poco_nublado"

          elif nubosidad_estado < 60:
              estado = "parcialmente_nublado"

          elif nubosidad_estado < 85:
              estado = "muy_nublado"

          else:
              estado = "cubierto"

          # ============================================================
          # 10. INFORMACION TEMPORAL
          # ============================================================

          frame_utc = (
              ds.attrs.get(
                  "time_coverage_end"
              )
              or ds.attrs.get(
                  "time_coverage_start"
              )
          )

          generado_utc = (
              datetime.now(
                  timezone.utc
              ).isoformat()
          )

          # ============================================================
          # 11. RESULTADO
          # ============================================================

          resultado = {
              "ok": True,
              "fuente": "GOES-19",
              "producto": "ABI-L2-CCLF",
              "descripcion": (
                  "Cloud Cover Layers - Full Disk"
              ),
              "ciudad": "Bahía Blanca",
              "latitud": LAT,
              "longitud": LON,
              "frame_goes_utc": frame_utc,

              "nubosidad_punto_porcentaje":
                  nubosidad_punto,

              "nubosidad_local_3x3_porcentaje":
                  nubosidad_3x3,

              "estado_nubosidad":
                  estado,

              "dqf_punto":
                  punto_dqf,

              "solo_dqf_0":
                  True,

              "pixeles_validos_3x3":
                  int(
                      valid_pixels.size
                  ),

              "pixeles_totales_3x3":
                  int(
                      window.size
                  ),

              "resolucion_producto":
                  ds.attrs.get(
                      "spatial_resolution"
                  ),

              "variable_utilizada":
                  "TCF",

              "variable_calidad":
                  "DQF",

              "ventana_pixeles": {
                  "x": [
                      x0,
                      x1
                  ],
                  "y": [
                      y0,
                      y1
                  ]
              },

              "indice_bahia_blanca": {
                  "x": ix,
                  "y": iy
              },

              "generado_utc":
                  generado_utc
          }

          with open(
              JSON_OUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # 12. IMAGEN DE CONTROL
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(8, 6)
          )

          image = ax.imshow(
              tcf_quality,
              origin="upper",
              cmap="gray",
              vmin=0,
              vmax=100
          )

          ax.scatter(
              [ix],
              [iy],
              s=150,
              facecolors="none",
              edgecolors="red",
              linewidths=2
          )

          ax.set_title(
              "GOES-19 CCLF - Bahía Blanca\n"
              f"Punto: "
              f"{'N/D' if nubosidad_punto is None else f'{nubosidad_punto:.1f}%'}"
              f" | 3x3: {nubosidad_3x3:.1f}%"
          )

          ax.set_xlabel(
              "X GOES"
          )

          ax.set_ylabel(
              "Y GOES"
          )

          fig.colorbar(
              image,
              ax=ax,
              label="Nubosidad (%)"
          )

          plt.tight_layout()

          plt.savefig(
              IMAGEN,
              dpi=120,
              bbox_inches="tight"
          )

          plt.close(fig)

          # ============================================================
          # 13. SALIDA
          # ============================================================

          print("")
          print("================================")
          print("RESULTADO GOES")
          print("================================")

          print(
              "Nubosidad punto:",
              nubosidad_punto,
              "%"
          )

          print(
              "Nubosidad 3x3:",
              nubosidad_3x3,
              "%"
          )

          print(
              "Estado:",
              estado
          )

          print(
              "DQF punto:",
              punto_dqf
          )

          print(
              "Pixeles validos:",
              valid_pixels.size,
              "/",
              window.size
          )

          print(
              "Frame:",
              frame_utc
          )

          print(
              "Variable:",
              "TCF"
          )

          print("================================")

          ds.close()
          PY

      - name: Verificar resultado
        run: |
          test -s data/goes/nubosidad.json
          test -s data/goes/nubosidad_bahia_blanca.png

          python - <<'PY'
          import json

          with open(
              "data/goes/nubosidad.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          assert data["ok"] is True
          assert data["fuente"] == "GOES-19"
          assert data["producto"] == "ABI-L2-CCLF"
          assert data["variable_utilizada"] == "TCF"
          assert data["variable_calidad"] == "DQF"
          assert data["solo_dqf_0"] is True

          value = data[
              "nubosidad_local_3x3_porcentaje"
          ]

          assert isinstance(
              value,
              (int, float)
          )

          assert 0 <= value <= 100

          assert data[
              "pixeles_validos_3x3"
          ] > 0

          print("")
          print("GOES OK")
          print(
              "Nubosidad punto:",
              data[
                  "nubosidad_punto_porcentaje"
              ],
              "%"
          )
          print(
              "Nubosidad 3x3:",
              value,
              "%"
          )
          print(
              "Estado:",
              data[
                  "estado_nubosidad"
              ]
          )
          print(
              "DQF punto:",
              data[
                  "dqf_punto"
              ]
          )
          print(
              "Pixeles validos:",
              data[
                  "pixeles_validos_3x3"
              ]
          )
          print(
              "Frame:",
              data[
                  "frame_goes_utc"
              ]
          )
          PY

      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/goes

          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "GOES: corregir calculo nubosidad Bahia Blanca"
            git push
          fi
