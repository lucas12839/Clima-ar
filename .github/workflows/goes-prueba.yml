name: Prueba GOES Bahia Blanca

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba-goes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install awscli xarray netCDF4 matplotlib

      - name: Buscar archivo GOES
        run: |
          mkdir -p data/goes/prueba

          aws s3 ls \
            s3://noaa-goes16/ABI-L2-CMIPF/2022/001/10/ \
            --no-sign-request \
            | grep 'C13_G16' \
            | head -1 \
            | awk '{print $4}' \
            > data/goes/prueba/file.txt

          test -s data/goes/prueba/file.txt

          FILE=$(cat data/goes/prueba/file.txt)

          echo "Archivo encontrado:"
          echo "$FILE"

          aws s3 cp \
            "s3://noaa-goes16/ABI-L2-CMIPF/2022/001/10/$FILE" \
            data/goes/prueba/goes.nc \
            --no-sign-request

          test -s data/goes/prueba/goes.nc

      - name: Recortar Bahia Blanca
        run: |
          python - <<'PY'
          import xarray as xr
          import numpy as np
          import matplotlib.pyplot as plt

          archivo = "data/goes/prueba/goes.nc"
          salida = "data/goes/prueba/bahia_blanca.png"

          ds = xr.open_dataset(archivo)

          x = ds["x"].values
          y = ds["y"].values

          print("Archivo abierto correctamente")
          print("Dimensiones X:", len(x))
          print("Dimensiones Y:", len(y))

          # Coordenadas de Bahia Blanca
          lat = -38.72
          lon = -62.27

          # Parámetros GOES
          p = ds["goes_imager_projection"]

          lon0 = float(p.longitude_of_projection_origin) * np.pi / 180.0
          lat0 = float(p.latitude_of_projection_origin) * np.pi / 180.0

          # Conversión lat/lon -> ángulos de la grilla GOES
          lat_rad = lat * np.pi / 180.0
          lon_rad = lon * np.pi / 180.0

          req = float(p.semi_major_axis)
          rpol = float(p.semi_minor_axis)
          h = float(p.perspective_point_height)

          e2 = 1.0 -
