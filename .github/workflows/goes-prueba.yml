name: Prueba GOES Nubosidad Bahia Blanca

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prueba-goes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install awscli xarray netCDF4 numpy matplotlib

      - name: Descargar GOES-19 CCL actual
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data/goes

          FOUND=""

          for OFFSET in 0 1 2 3 4 5 6; do
            TARGET=$(date -u -d "-${OFFSET} hour" "+%Y %j %H")

            YEAR=$(echo "$TARGET" | awk '{print $1}')
            DOY=$(echo "$TARGET" | awk '{print $2}')
            HOUR=$(echo "$TARGET" | awk '{print $3}')

            echo "Buscando GOES-19 CCLF: ${YEAR}/${DOY}/${HOUR}"

            FILE=$(
              aws s3 ls \
                "s3://noaa-goes19/ABI-L2-CCLF/${YEAR}/${DOY}/${HOUR}/" \
                --no-sign-request \
                2>/dev/null \
                | awk '{print $4}' \
                | grep '^OR_ABI-L2-CCLF' \
                | sort \
                | tail -1 \
                || true
            )

            if [ -n "$FILE" ]; then
              FOUND="s3://noaa-goes19/ABI-L2-CCLF/${YEAR}/${DOY}/${HOUR}/${FILE}"
              echo "Encontrado: $FOUND"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "ERROR: no se encontró ningún archivo GOES-19 CCLF."
            exit 1
          fi

          aws s3 cp \
            "$FOUND" \
            data/goes/goes_ccl.nc \
            --no-sign-request

          test -s data/goes/goes_ccl.nc

      - name: Inspeccionar producto GOES
        run: |
          python - <<'PY'
          import xarray as xr

          ds = xr.open_dataset(
              "data/goes/goes_ccl.nc",
              decode_cf=False
          )

          print("========================================")
          print("GOES-19 CCLF")
          print("========================================")

          for name in ds.variables:
              var = ds[name]
              print(
                  name,
                  "| dims=", var.dims,
                  "| shape=", var.shape,
                  "| dtype=", var.dtype,
                  "| units=", var.attrs.get("units"),
                  "| long_name=", var.attrs.get("long_name"),
              )

          print("========================================")
          print("TCF ATTRS")
          print("========================================")

          tcf = ds["TCF"]

          for key in [
              "_FillValue",
              "valid_range",
              "scale_factor",
              "add_offset",
              "units",
              "long_name",
              "standard_name",
          ]:
              print(key, "=", tcf.attrs.get(key))

          print("========================================")
          print("DQF ATTRS")
          print("========================================")

          dqf = ds["DQF"]

          for key in [
              "_FillValue",
              "valid_range",
              "flag_values",
              "flag_meanings",
              "units",
              "long_name",
              "standard_name",
          ]:
              print(key, "=", dqf.attrs.get(key))

          print("========================================")
          print("PROYECCION")
          print("========================================")

          projection = ds["goes_imager_projection"]

          for key in [
              "semi_major_axis",
              "semi_minor_axis",
              "perspective_point_height",
              "longitude_of_projection_origin",
              "sweep_angle_axis",
          ]:
              print(
                  key,
                  "=",
                  projection.attrs.get(key)
              )

          print("========================================")
          print("TIEMPO")
          print("========================================")

          for key in [
              "platform_ID",
              "scene_id",
              "spatial_resolution",
              "time_coverage_start",
              "time_coverage_end",
          ]:
              print(
                  key,
                  "=",
                  ds.attrs.get(key)
              )

          ds.close()
          PY

      - name: Procesar nubosidad Bahia Blanca
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import datetime, timezone

          import matplotlib.pyplot as plt
          import numpy as np
          import xarray as xr

          ARCHIVO = "data/goes/goes_ccl.nc"
          IMAGEN = "data/goes/nubosidad_bahia_blanca.png"
          JSON_OUT = "data/goes/nubosidad.json"

          LAT = -38.72
          LON = -62.27

          # ============================================================
          # DATASET RAW
          # ============================================================

          ds_raw = xr.open_dataset(
              ARCHIVO,
              decode_cf=False
          )

          # ============================================================
          # DATASET DECODED
          # SOLO PARA COORDENADAS x/y
          # ============================================================

          ds = xr.open_dataset(
              ARCHIVO,
              decode_cf=True,
              mask_and_scale=True
          )

          required = [
              "TCF",
              "DQF",
              "x",
              "y",
              "goes_imager_projection",
          ]

          for name in required:
              if name not in ds_raw.variables:
                  raise RuntimeError(
                      f"No existe variable requerida: {name}"
                  )

          # ============================================================
          # TCF RAW
          # ============================================================

          tcf_var = ds_raw["TCF"]

          while tcf_var.ndim > 2:
              tcf_var = tcf_var.isel(
                  {tcf_var.dims[0]: 0}
              )

          raw_tcf = np.asarray(
              tcf_var.values,
              dtype=np.float64
          )

          attrs = tcf_var.attrs

          fill_value = attrs.get(
              "_FillValue"
          )

          if fill_value is not None:
              raw_tcf[
                  raw_tcf == float(fill_value)
              ] = np.nan

          valid_range = attrs.get(
              "valid_range"
          )

          if valid_range is not None:
              vmin = float(valid_range[0])
              vmax = float(valid_range[1])

              raw_tcf[
                  (raw_tcf < vmin)
                  | (raw_tcf > vmax)
              ] = np.nan

          scale_factor = float(
              attrs.get(
                  "scale_factor",
                  1.0
              )
          )

          add_offset = float(
              attrs.get(
                  "add_offset",
                  0.0
              )
          )

          tcf = (
              raw_tcf
              * scale_factor
              + add_offset
          )

          tcf[
              (tcf < 0.0)
              | (tcf > 1.0)
          ] = np.nan

          tcf_percent = tcf * 100.0

          # ============================================================
          # DQF
          # ============================================================

          dqf_var = ds_raw["DQF"]

          while dqf_var.ndim > 2:
              dqf_var = dqf_var.isel(
                  {dqf_var.dims[0]: 0}
              )

          # IMPORTANTE:
          # Convertimos ANTES a entero con signo.
          # DQF puede ser uint8 y no acepta -1.
          raw_dqf = np.asarray(
              dqf_var.values,
              dtype=np.int16
          )

          dqf_fill = dqf_var.attrs.get(
              "_FillValue"
          )

          if dqf_fill is not None:
              raw_dqf[
                  raw_dqf == int(dqf_fill)
              ] = -1

          dqf = raw_dqf

          good_quality = (
              dqf == 0
          )

          tcf_quality = tcf_percent.copy()

          tcf_quality[
              ~good_quality
          ] = np.nan

          # ============================================================
          # COORDENADAS DECODIFICADAS
          # ============================================================

          x = np.asarray(
              ds["x"].values,
              dtype=np.float64
          )

          y = np.asarray(
              ds["y"].values,
              dtype=np.float64
          )

          if x.ndim != 1 or y.ndim != 1:
              raise RuntimeError(
                  "Las coordenadas x/y no son vectores 1D."
              )

          if not np.all(np.isfinite(x)):
              raise RuntimeError(
                  "La coordenada x contiene valores invalidos."
              )

          if not np.all(np.isfinite(y)):
              raise RuntimeError(
                  "La coordenada y contiene valores invalidos."
              )

          print("")
          print("========================================")
          print("COORDENADAS GOES DECODIFICADAS")
          print("========================================")

          print("x min:", float(np.min(x)))
          print("x max:", float(np.max(x)))
          print(
              "x centro:",
              float(x[len(x) // 2])
          )

          print("y min:", float(np.min(y)))
          print("y max:", float(np.max(y)))
          print(
              "y centro:",
              float(y[len(y) // 2])
          )

          # ============================================================
          # PROYECCION
          # ============================================================

          projection = ds_raw[
              "goes_imager_projection"
          ]

          semi_major = float(
              projection.attrs[
                  "semi_major_axis"
              ]
          )

          semi_minor = float(
              projection.attrs[
                  "semi_minor_axis"
              ]
          )

          perspective_height = float(
              projection.attrs[
                  "perspective_point_height"
              ]
          )

          longitude_origin = math.radians(
              float(
                  projection.attrs[
                      "longitude_of_projection_origin"
                  ]
              )
          )

          sweep_axis = projection.attrs.get(
              "sweep_angle_axis",
              "x"
          )

          if sweep_axis != "x":
              raise RuntimeError(
                  f"sweep_angle_axis inesperado: {sweep_axis}"
              )

          # ============================================================
          # LAT/LON -> GOES FIXED GRID
          # ============================================================

          H = (
              perspective_height
              + semi_major
          )

          lat = math.radians(LAT)
          lon = math.radians(LON)

          eccentricity2 = (
              semi_major ** 2
              - semi_minor ** 2
          ) / (
              semi_major ** 2
          )

          sin_lat = math.sin(lat)
          cos_lat = math.cos(lat)

          rc = (
              semi_major
              / math.sqrt(
                  1.0
                  - eccentricity2
                  * sin_lat ** 2
              )
          )

          sx = (
              rc
              * cos_lat
              * math.cos(
                  lon - longitude_origin
              )
          )

          sy = (
              rc
              * cos_lat
              * math.sin(
                  lon - longitude_origin
              )
          )

          sz = (
              rc
              * sin_lat
          )

          x_angle = math.atan2(
              -sy,
              H - sx
          )

          y_angle = math.atan2(
              sz,
              math.sqrt(
                  (H - sx) ** 2
                  + sy ** 2
              )
          )

          # ============================================================
          # BUSQUEDA DEL PIXEL MAS CERCANO
          # ============================================================

          ix = int(
              np.argmin(
                  np.abs(
                      x - x_angle
                  )
              )
          )

          iy = int(
              np.argmin(
                  np.abs(
                      y - y_angle
                  )
              )
          )

          x_real = float(
              x[ix]
          )

          y_real = float(
              y[iy]
          )

          distancia_grid = math.sqrt(
              (x_real - x_angle) ** 2
              + (y_real - y_angle) ** 2
          )

          print("")
          print("========================================")
          print("GEOLOCALIZACION")
          print("========================================")

          print("Latitud:", LAT)
          print("Longitud:", LON)

          print("x objetivo:", x_angle)
          print("y objetivo:", y_angle)

          print("Indice x:", ix)
          print("Indice y:", iy)

          print("x real:", x_real)
          print("y real:", y_real)

          print(
              "Distancia grid:",
              distancia_grid
          )

          # ============================================================
          # VALIDACION DE INDICE
          # ============================================================

          if ix <= 0 or ix >= len(x) - 1:
              raise RuntimeError(
                  "Indice x fuera de zona valida."
              )

          if iy <= 0 or iy >= len(y) - 1:
              raise RuntimeError(
                  "Indice y fuera de zona valida."
              )

          # ============================================================
          # PIXEL EXACTO
          # ============================================================

          punto_raw = tcf_quality[
              iy,
              ix
          ]

          punto_dqf = int(
              dqf[
                  iy,
                  ix
              ]
          )

          print("")
          print("========================================")
          print("PUNTO BAHIA BLANCA")
          print("========================================")

          print(
              "TCF:",
              punto_raw,
              "%"
          )

          print(
              "DQF:",
              punto_dqf
          )

          # ============================================================
          # VENTANA 3x3
          # ============================================================

          radius = 1

          y0 = max(
              0,
              iy - radius
          )

          y1 = min(
              tcf_quality.shape[0],
              iy + radius + 1
          )

          x0 = max(
              0,
              ix - radius
          )

          x1 = min(
              tcf_quality.shape[1],
              ix + radius + 1
          )

          window = tcf_quality[
              y0:y1,
              x0:x1
          ]

          valid_pixels = window[
              np.isfinite(window)
          ]

          total_pixels = int(
              window.size
          )

          valid_count = int(
              valid_pixels.size
          )

          print(
              "Pixeles validos 3x3:",
              valid_count,
              "/",
              total_pixels
          )

          if valid_count == 0:
              raise RuntimeError(
                  "No existen pixeles TCF con DQF=0 "
                  "en la ventana 3x3."
              )

          nubosidad_3x3 = float(
              np.mean(valid_pixels)
          )

          nubosidad_3x3 = round(
              max(
                  0.0,
                  min(
                      100.0,
                      nubosidad_3x3
                  )
              ),
              1
          )

          if np.isfinite(
              punto_raw
          ):
              nubosidad_punto = round(
                  float(punto_raw),
                  1
              )
          else:
              nubosidad_punto = None

          # ============================================================
          # ESTADO
          # ============================================================

          if nubosidad_3x3 < 10:
              estado = "despejado"

          elif nubosidad_3x3 < 30:
              estado = "poco_nublado"

          elif nubosidad_3x3 < 60:
              estado = "parcialmente_nublado"

          elif nubosidad_3x3 < 85:
              estado = "muy_nublado"

          else:
              estado = "cubierto"

          # ============================================================
          # TIEMPO
          # ============================================================

          frame_utc = (
              ds_raw.attrs.get(
                  "time_coverage_end"
              )
              or ds_raw.attrs.get(
                  "time_coverage_start"
              )
          )

          if frame_utc is None:
              raise RuntimeError(
                  "GOES no contiene timestamp."
              )

          generado = datetime.now(
              timezone.utc
          ).isoformat()

          # ============================================================
          # JSON
          # ============================================================

          resultado = {
              "ok": True,
              "fuente": "GOES-19",
              "producto": "ABI-L2-CCLF",
              "descripcion": (
                  "Cloud Cover Layers - Full Disk"
              ),
              "ciudad": "Bahía Blanca",
              "latitud": LAT,
              "longitud": LON,
              "frame_goes_utc": frame_utc,
              "nubosidad_total_porcentaje": (
                  nubosidad_3x3
              ),
              "nubosidad_punto_porcentaje": (
                  nubosidad_punto
              ),
              "nubosidad_local_3x3_porcentaje": (
                  nubosidad_3x3
              ),
              "estado_nubosidad": estado,
              "dqf_punto": punto_dqf,
              "pixeles_validos_3x3": valid_count,
              "pixeles_totales_3x3": total_pixels,
              "indice_x": ix,
              "indice_y": iy,
              "x_objetivo": x_angle,
              "y_objetivo": y_angle,
              "x_real": x_real,
              "y_real": y_real,
              "distancia_grid": distancia_grid,
              "resolucion_producto": (
                  ds_raw.attrs.get(
                      "spatial_resolution"
                  )
              ),
              "variable_utilizada": "TCF",
              "ventana_pixeles": {
                  "x": [
                      x0,
                      x1 - 1
                  ],
                  "y": [
                      y0,
                      y1 - 1
                  ]
              },
              "generado_utc": generado
          }

          with open(
              JSON_OUT,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # PNG DE CONTROL
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(8, 8)
          )

          mostrar = tcf_quality.copy()

          im = ax.imshow(
              mostrar,
              origin="upper",
              cmap="gray",
              vmin=0,
              vmax=100
          )

          ax.scatter(
              [ix],
              [iy],
              s=80,
              marker="+"
          )

          ax.set_title(
              "GOES-19 CCLF - Bahía Blanca"
          )

          ax.set_xlabel("X")
          ax.set_ylabel("Y")

          fig.colorbar(
              im,
              ax=ax,
              label="Nubosidad (%)"
          )

          fig.tight_layout()

          fig.savefig(
              IMAGEN,
              dpi=150
          )

          plt.close(fig)

          ds.close()
          ds_raw.close()

          print("")
          print("========================================")
          print("RESULTADO FINAL")
          print("========================================")
          print(
              "Nubosidad 3x3:",
              nubosidad_3x3,
              "%"
          )
          print(
              "Estado:",
              estado
          )
          print(
              "Frame:",
              frame_utc
          )
          print(
              "JSON:",
              JSON_OUT
          )
          print(
              "PNG:",
              IMAGEN
          )
          PY

      - name: Verificar resultado
        run: |
          set -euo pipefail

          test -s data/goes/nubosidad.json
          test -s data/goes/nubosidad_bahia_blanca.png

          python - <<'PY'
          import json
          import math

          with open(
              "data/goes/nubosidad.json",
              encoding="utf-8"
          ) as f:
              d = json.load(f)

          assert d["ok"] is True
          assert d["fuente"] == "GOES-19"
          assert d["variable_utilizada"] == "TCF"

          assert d["indice_x"] > 0
          assert d["indice_y"] > 0

          assert 0 <= d[
              "nubosidad_local_3x3_porcentaje"
          ] <= 100

          assert d[
              "pixeles_validos_3x3"
          ] > 0

          assert d[
              "dqf_punto"
          ] >= 0

          assert math.isfinite(
              float(d["x_real"])
          )

          assert math.isfinite(
              float(d["y_real"])
          )

          print("RESULTADO VALIDADO")

          print(
              "Nubosidad:",
              d[
                  "nubosidad_local_3x3_porcentaje"
              ],
              "%"
          )

          print(
              "Pixel:",
              d["indice_x"],
              d["indice_y"]
          )

          print(
              "DQF:",
              d["dqf_punto"]
          )

          print(
              "Pixeles validos:",
              d[
                  "pixeles_validos_3x3"
              ]
          )
          PY

      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/goes/goes_ccl.nc
          git add data/goes/nubosidad.json
          git add data/goes/nubosidad_bahia_blanca.png

          git diff --cached --quiet || \
            git commit -m "Actualizar nubosidad GOES-19 Bahia Blanca"

          git push
