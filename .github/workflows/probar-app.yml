name: Probar ClimaAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxis Python
        run: |
          set -euo pipefail
          python -m compileall -q .

      - name: Verificar archivos operativos
        run: |
          set -euo pipefail

          archivos=(
            "data/radar/radar_timestamp.txt"
            "data/radar/radar_nowcast.json"
            "data/radar/resultado_procesamiento.json"
            "data/radar/seguimiento/prediccion_ml_rma10.json"
            "data/ia/resultado_final.json"
          )

          for archivo in "${archivos[@]}"; do
            test -s "$archivo" || {
              echo "Falta o está vacío: $archivo"
              exit 1
            }
          done

      - name: Verificar sincronización temporal
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          radar = Path(
              "data/radar/radar_timestamp.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          nowcast = json.loads(
              Path(
                  "data/radar/radar_nowcast.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          ml = json.loads(
              Path(
                  "data/radar/seguimiento/prediccion_ml_rma10.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          frame_nowcast = nowcast.get(
              "nowcast", {}
          ).get(
              "frame_actual_utc"
          )

          frame_ml = ml.get(
              "frame_radar"
          )

          if frame_nowcast != radar:
              raise SystemExit(
                  "ERROR: radar_nowcast desincronizado"
              )

          if frame_ml != radar:
              raise SystemExit(
                  "ERROR: prediccion_ml_rma10 desincronizada"
              )

          print("Radar / Nowcast / ML sincronizados")
          PY

      - name: Iniciar ClimaAR
        run: |
          set -euo pipefail

          nohup uvicorn app:app \
            --host 127.0.0.1 \
            --port 8000 \
            > app.log 2>&1 &

          echo $! > app.pid

          for intento in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:8000/health \
              > /tmp/health.json; then
              exit 0
            fi

            sleep 1
          done

          cat app.log
          exit 1

      - name: Verificar health
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/health.json").read_text(
                  encoding="utf-8"
              )
          )

          required = (
              "status",
              "frame_actual_utc",
              "frame_edad_minutos",
              "estado_radar",
          )

          for key in required:
              if key not in data:
                  raise SystemExit(
                      f"Falta {key} en /health"
                  )

          print("Health OK")
          print(
              "Estado:",
              data["status"]
          )
          print(
              "Radar:",
              data["estado_radar"]
          )
          print(
              "Frame:",
              data["frame_actual_utc"]
          )
          PY

      - name: Probar API principal
        run: |
          set -euo pipefail

          endpoints=(
            "/"
            "/health"
            "/estado"
            "/radar"
            "/nowcast"
            "/prediccion"
            "/prediccion/en-vivo"
            "/tormenta"
            "/modelo"
            "/modelo/nowcast"
            "/inteligencia"
            "/secuencia"
            "/debug"
          )

          for endpoint in "${endpoints[@]}"; do
            echo "Probando $endpoint"

            curl -fsS \
              -H "Accept: application/json" \
              "http://127.0.0.1:8000$endpoint" \
              > /tmp/response.json

            python - <<'PY'
          import json

          with open(
              "/tmp/response.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "La respuesta no es un objeto JSON"
              )
          PY
          done

      - name: Verificar contratos API
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import urllib.request

          BASE = "http://127.0.0.1:8000"

          def get(path):
              with urllib.request.urlopen(
                  BASE + path,
                  timeout=10
              ) as response:
                  if response.status != 200:
                      raise SystemExit(
                          f"{path}: HTTP {response.status}"
                      )
                  return json.load(response)

          health = get("/health")

          for key in (
              "status",
              "frame_actual_utc",
              "frame_edad_minutos",
              "estado_radar",
          ):
              if key not in health:
                  raise SystemExit(
                      f"/health: falta {key}"
                  )

          radar = get("/radar")

          if radar.get("radar") != "RMA10":
              raise SystemExit(
                  "/radar: radar != RMA10"
              )

          live = get("/prediccion/en-vivo")

          if live.get(
              "modo"
          ) != "PREDICCION_ENTRE_FRAMES":
              raise SystemExit(
                  "/prediccion/en-vivo: modo incorrecto"
              )

          inteligencia = get("/inteligencia")

          for key in (
              "radar_nowcast",
              "resultado_final",
              "inteligencia_tormenta",
          ):
              if key not in inteligencia:
                  raise SystemExit(
                      f"/inteligencia: falta {key}"
                  )

          secuencia = get("/secuencia")

          if not isinstance(
              secuencia.get("frames"),
              list
          ):
              raise SystemExit(
                  "/secuencia: frames no es lista"
              )

          print("Contratos API OK")
          PY

      - name: Probar imagen radar
        run: |
          set -euo pipefail

          status="$(
            curl -sS \
              -o /tmp/radar.png \
              -w "%{http_code}" \
              http://127.0.0.1:8000/radar/imagen
          )"

          test "$status" = "200"
          test -s /tmp/radar.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path("/tmp/radar.png")

          if path.stat().st_size <= 1024:
              raise SystemExit(
                  "PNG demasiado pequeño"
              )

          with Image.open(path) as image:
              if image.format != "PNG":
                  raise SystemExit(
                      f"Formato incorrecto: {image.format}"
                  )

              image.verify()

          print("Imagen radar PNG válida")
          PY

      - name: Logs si falla
        if: failure()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

      - name: Detener ClimaAR
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi
