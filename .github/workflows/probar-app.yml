name: Probar ClimaAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Iniciar ClimaAR
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
          sleep 10

      - name: Probar endpoints
        run: |
          curl -f http://127.0.0.1:8000/health
          curl -f http://127.0.0.1:8000/modelo
          curl -f http://127.0.0.1:8000/prediccion
          curl -f http://127.0.0.1:8000/tormenta
          curl -f http://127.0.0.1:8000/estado
