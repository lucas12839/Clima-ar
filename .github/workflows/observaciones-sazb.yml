name: Observaciones SAZB

# Sin schedule propio: la observación SAZB se actualiza en cada ejecución de
# Intelligence (frame nuevo o refresco entre frames), así ningún cron
# independiente puede desincronizarse del reloj radar ni cancelar un Radar
# pendiente del grupo de concurrencia.
on:
  workflow_dispatch:

permissions:
  contents: write

# Debe coincidir con el workflow que escribe el estado RMA10 para evitar
# dos pushes simultáneos sobre main.
concurrency:
  group: climaar-production-writes
  cancel-in-progress: false

jobs:
  observacion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencia
        run: python -m pip install requests

      - name: Obtener observacion SAZB
        id: observacion
        continue-on-error: true
        run: python scripts/smn_observaciones.py

      - name: Publicar evidencia con rebase y retry
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "climaar-bot"
          git config user.email "bot@climaar.local"

          git add data/sazb/

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit -m "obs: actualizar SAZB"

          for intento in 1 2 3; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Rebase falló en intento $intento."
              if [ "$intento" -eq 3 ]; then exit 1; fi
              sleep 2
              continue
            }

            if git push origin HEAD:main; then
              echo "Push exitoso en intento $intento."
              exit 0
            fi

            echo "Push falló en intento $intento."
            if [ "$intento" -eq 3 ]; then exit 1; fi
            sleep 2
          done

      - name: Resultado
        if: steps.observacion.outcome == 'failure'
        run: |
          echo "La observacion SAZB no supero la validacion."
          exit 1
