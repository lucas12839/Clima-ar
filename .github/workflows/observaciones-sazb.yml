name: Observaciones SAZB

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observaciones-sazb
  cancel-in-progress: true

jobs:
  observacion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencia
        run: python -m pip install requests

      - name: Obtener observacion SAZB
        id: observacion
        continue-on-error: true
        run: python scripts/smn_observaciones.py

      - name: Publicar evidencia
        if: always()
        run: |
          git config user.name "climaar-bot"
          git config user.email "bot@climaar.local"

          git add data/sazb/

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit -m "obs: actualizar SAZB"
          git push

      - name: Resultado
        if: steps.observacion.outcome == 'failure'
        run: |
          echo "La observacion SAZB no supero la validacion."
          exit 1
