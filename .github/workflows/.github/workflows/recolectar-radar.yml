name: Recolectar radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: recolector-radar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: python -m pip install --quiet requests pillow

      - name: Recolectar radar
        run: |
          python - <<'PY'
          import csv
          import io
          from pathlib import Path
          from datetime import datetime, timezone

          import requests
          from PIL import Image

          API_URL = "https://api.rainviewer.com/public/weather-maps.json"

          LAT = -38.7196
          LON = -62.2724

          OUT = Path("data/radar/radar_features.csv")
          OUT.parent.mkdir(parents=True, exist_ok=True)

          session = requests.Session()

          print("Consultando RainViewer...")
          response = session.get(API_URL, timeout=30)
          response.raise_for_status()

          data = response.json()

          frames = data.get("radar", {}).get("past", [])

          if not frames:
              raise SystemExit("No hay frames de radar disponibles")

          host = data["host"]

          print("Frames disponibles:", len(frames))

          # Frames ya guardados
          existing = set()

          if OUT.exists():
              with OUT.open("r", encoding="utf-8", newline="") as f:
                  for row in csv.DictReader(f):
                      if row.get("frame_time"):
                          existing.add(row["frame_time"])

          nuevos = []

          for frame in frames:
              frame_time = str(frame["time"])

              if frame_time in existing:
                  continue

              path = frame["path"]

              image_url = (
                  f"{host}{path}/512/7/"
                  f"{LAT}/{LON}/2/0_0.png"
              )

              print("Descargando frame:", frame_time)

              img_response = session.get(
                  image_url,
                  timeout=30
              )

              img_response.raise_for_status()

              image = Image.open(
                  io.BytesIO(img_response.content)
              ).convert("RGBA")

              width, height = image.size
              pixels = image.load()

              valid = 0
              colored = 0
              strong = 0

              max_red = 0
              max_green = 0
              max_blue = 0

              for y in range(height):
                  for x in range(width):

                      r, g, b, a = pixels[x, y]

                      if a == 0:
                          continue

                      valid += 1

                      # Ignoramos píxeles prácticamente transparentes
                      if a > 30 and (r + g + b) > 40:
                          colored += 1

                      # Zona de mayor reflectividad visual
                      if r > 180 and g < 150:
                          strong += 1

                      max_red = max(max_red, r)
                      max_green = max(max_green, g)
                      max_blue = max(max_blue, b)

              nuevos.append({
                  "frame_time": frame_time,
                  "frame_utc": datetime.fromtimestamp(
                      int(frame_time),
                      tz=timezone.utc
                  ).isoformat(),
                  "generated_utc": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "image_url": image_url,
                  "width": width,
                  "height": height,
                  "valid_pixels": valid,
                  "colored_pixels": colored,
                  "strong_pixels": strong,
                  "max_red": max_red,
                  "max_green": max_green,
                  "max_blue": max_blue
              })

          if not nuevos:
              print("No hay frames nuevos.")
              raise SystemExit(0)

          fields = [
              "frame_time",
              "frame_utc",
              "generated_utc",
              "image_url",
              "width",
              "height",
              "valid_pixels",
              "colored_pixels",
              "strong_pixels",
              "max_red",
              "max_green",
              "max_blue"
          ]

          write_header = not OUT.exists()

          with OUT.open(
              "a",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              if write_header:
                  writer.writeheader()

              writer.writerows(nuevos)

          print("")
          print("================================")
          print("RADAR RECOLECTADO CORRECTAMENTE")
          print("Nuevos frames:", len(nuevos))
          print("Archivo:", OUT)
          print("================================")
          PY

      - name: Guardar histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/radar/radar_features.csv

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Actualizar histórico radar"
          git push
