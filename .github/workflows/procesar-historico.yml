name: Entrenar primer modelo ClimaAR

on:
  workflow_dispatch:

jobs:
  entrenar-modelo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas scikit-learn joblib

      - name: Preparar datos y entrenar modelo
        run: |
          python - <<'PY'
          import zipfile
          import json
          import joblib
          import pandas as pd

          from sklearn.ensemble import HistGradientBoostingRegressor
          from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

          ZIP = "climaar_smn_2017_2025_procesado.zip"

          # =========================
          # CARGAR HISTÓRICO
          # =========================

          with zipfile.ZipFile(ZIP, "r") as z:
              csvs = [x for x in z.namelist() if x.endswith(".csv")]
              csv = csvs[0]

              with z.open(csv) as f:
                  df = pd.read_csv(f)

          df["fecha_hora"] = pd.to_datetime(df["fecha_hora"])

          # =========================
          # BAHÍA BLANCA
          # =========================

          df = df[
              df["estacion"]
              .astype(str)
              .str.upper()
              .str.contains("BAHIA BLANCA", na=False)
          ].copy()

          df = (
              df.sort_values("fecha_hora")
              .drop_duplicates("fecha_hora")
              .reset_index(drop=True)
          )

          print("======================================")
          print("CLIMAAR - ENTRENAMIENTO MODELO V1")
          print("======================================")
          print(f"Registros iniciales: {len(df):,}")

          # =========================
          # VARIABLES
          # =========================

          variables = [
              "temperatura",
              "humedad",
              "presion",
              "direccion_viento",
              "velocidad_viento",
              "viento_u",
              "viento_v",
              "punto_rocio",
              "hora_sin",
              "hora_cos"
          ]

          features = df[
              ["fecha_hora"] + variables
          ].copy()

          # =========================
          # VARIABLES HISTÓRICAS
          # =========================

          for variable in variables:
              for horas in [1, 3, 6, 24]:

                  historico = df[
                      ["fecha_hora", variable]
                  ].copy()

                  historico["fecha_hora"] = (
                      historico["fecha_hora"]
                      + pd.Timedelta(hours=horas)
                  )

                  historico = historico.rename(
                      columns={
                          variable: f"{variable}_lag{horas}"
                      }
                  )

                  features = features.merge(
                      historico,
                      on="fecha_hora",
                      how="left"
                  )

          # =========================
          # OBJETIVO: TEMPERATURA +1 HORA
          # =========================

          objetivo = df[
              ["fecha_hora", "temperatura"]
          ].copy()

          objetivo["fecha_hora"] = (
              objetivo["fecha_hora"]
              - pd.Timedelta(hours=1)
          )

          objetivo = objetivo.rename(
              columns={
                  "temperatura": "temperatura_objetivo"
              }
          )

          features = features.merge(
              objetivo,
              on="fecha_hora",
              how="left"
          )

          # =========================
          # LIMPIAR
          # =========================

          features = features.dropna().reset_index(drop=True)

          print(f"Registros utilizables: {len(features):,}")

          # =========================
          # DIVISIÓN TEMPORAL
          # =========================

          corte = int(len(features) * 0.80)

          train = features.iloc[:corte]
          test = features.iloc[corte:]

          X_train = train.drop(
              columns=["fecha_hora", "temperatura_objetivo"]
          )

          y_train = train["temperatura_objetivo"]

          X_test = test.drop(
              columns=["fecha_hora", "temperatura_objetivo"]
          )

          y_test = test["temperatura_objetivo"]

          print(f"Entrenamiento: {len(train):,}")
          print(f"Prueba: {len(test):,}")

          # =========================
          # MODELO
          # =========================

          modelo = HistGradientBoostingRegressor(
              max_iter=300,
              learning_rate=0.05,
              max_leaf_nodes=31,
              l2_regularization=1.0,
              random_state=42
          )

          modelo.fit(X_train, y_train)

          # =========================
          # EVALUACIÓN
          # =========================

          pred = modelo.predict(X_test)

          mae = mean_absolute_error(y_test, pred)
          rmse = mean_squared_error(y_test, pred) ** 0.5
          r2 = r2_score(y_test, pred)

          print("")
          print("========== RESULTADOS ==========")
          print(f"MAE:  {mae:.3f} °C")
          print(f"RMSE: {rmse:.3f} °C")
          print(f"R²:   {r2:.4f}")
          print("================================")

          # =========================
          # GUARDAR MODELO
          # =========================

          joblib.dump(
              modelo,
              "climaar_modelo_temperatura_1h.joblib"
          )

          metricas = {
              "modelo": "HistGradientBoostingRegressor",
              "objetivo": "temperatura_1_hora_adelante",
              "registros_iniciales": len(df),
              "registros_utilizables": len(features),
              "entrenamiento": len(train),
              "prueba": len(test),
              "MAE_C": float(mae),
              "RMSE_C": float(rmse),
              "R2": float(r2),
              "periodo_inicio": str(df["fecha_hora"].min()),
              "periodo_fin": str(df["fecha_hora"].max())
          }

          with open("metricas_modelo.json", "w") as f:
              json.dump(metricas, f, indent=2)

          print("")
          print("MODELO GUARDADO:")
          print("climaar_modelo_temperatura_1h.joblib")
          print("metricas_modelo.json")
          PY

      - name: Guardar modelo
        uses: actions/upload-artifact@v4
        with:
          name: modelo-climaar-v1
          path: |
            climaar_modelo_temperatura_1h.joblib
            metricas_modelo.json
          retention-days: 90
