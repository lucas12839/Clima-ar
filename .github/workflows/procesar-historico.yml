name: ClimaAR Procesar Histórico

on:
  workflow_dispatch:
    inputs:
      fecha_inicio:
        description: "Fecha inicial YYYY-MM-DD"
        required: true
        type: string
      fecha_fin:
        description: "Fecha final YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: climaar-historico-procesamiento
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar fechas
        env:
          FECHA_INICIO: ${{ inputs.fecha_inicio }}
          FECHA_FIN: ${{ inputs.fecha_fin }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from datetime import date

          inicio = os.environ["FECHA_INICIO"]
          fin = os.environ["FECHA_FIN"]

          try:
              fecha_inicio = date.fromisoformat(inicio)
              fecha_fin = date.fromisoformat(fin)
          except ValueError as exc:
              raise SystemExit(
                  "ERROR: las fechas deben tener formato YYYY-MM-DD"
              ) from exc

          if fecha_inicio > fecha_fin:
              raise SystemExit(
                  "ERROR: fecha_inicio es posterior a fecha_fin"
              )

          print("Fecha inicial:", fecha_inicio)
          print("Fecha final:", fecha_fin)
          PY

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar directorios
        run: |
          set -euo pipefail

          mkdir -p \
            data/radar \
            data/radar/historico \
            data/radar/seguimiento \
            data/ia \
            data/meteorologia \
            logs

      - name: Ejecutar procesamiento histórico
        env:
          FECHA_INICIO: ${{ inputs.fecha_inicio }}
          FECHA_FIN: ${{ inputs.fecha_fin }}
        run: |
          set -euo pipefail

          if [ -f scripts/procesar_historico.py ]; then
            python scripts/procesar_historico.py \
              --fecha-inicio "$FECHA_INICIO" \
              --fecha-fin "$FECHA_FIN"

          elif [ -f scripts/procesar_historico_radar.py ]; then
            python scripts/procesar_historico_radar.py \
              --fecha-inicio "$FECHA_INICIO" \
              --fecha-fin "$FECHA_FIN"

          else
            echo "ERROR: no se encontró un procesador histórico."
            exit 1
          fi

      - name: Verificar resultados
        run: |
          set -euo pipefail

          total=0

          for directorio in \
            data/radar/historico \
            data/radar/seguimiento \
            data/ia
          do
            if [ ! -d "$directorio" ]; then
              continue
            fi

            while IFS= read -r -d '' archivo; do
              echo "Resultado: $archivo"
              total=$((total + 1))
            done < <(
              find "$directorio" \
                -type f \
                \( \
                  -name "*.json" \
                  -o -name "*.csv" \
                \) \
                -print0
            )
          done

          if [ "$total" -eq 0 ]; then
            echo "ERROR: el procesamiento histórico no generó resultados."
            exit 1
          fi

          echo "Resultados encontrados: $total"

      - name: Validar JSON históricos
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          total = 0

          for directorio in (
              Path("data/radar/historico"),
              Path("data/radar/seguimiento"),
              Path("data/ia"),
          ):
              if not directorio.exists():
                  continue

              for path in directorio.rglob("*.json"):
                  if path.stat().st_size == 0:
                      raise SystemExit(
                          f"ERROR: JSON vacío: {path}"
                      )

                  try:
                      data = json.loads(
                          path.read_text(
                              encoding="utf-8"
                          )
                      )
                  except Exception as exc:
                      raise SystemExit(
                          f"ERROR: JSON inválido: {path}: {exc}"
                      ) from exc

                  if not isinstance(data, (dict, list)):
                      raise SystemExit(
                          f"ERROR: estructura inválida: {path}"
                      )

                  total += 1

          print(
              f"JSON históricos válidos: {total}"
          )
          PY

      - name: Validar integridad ClimaAR
        run: |
          set -euo pipefail

          if [ ! -f scripts/validar_integridad_climaar.py ]; then
            echo "ERROR: falta scripts/validar_integridad_climaar.py"
            exit 1
          fi

          python scripts/validar_integridad_climaar.py

      - name: Preparar artefacto
        run: |
          set -euo pipefail

          rm -rf /tmp/climaar-historico

          mkdir -p /tmp/climaar-historico

          cp -a \
            data/radar/historico \
            /tmp/climaar-historico/

          if [ -d data/radar/seguimiento ]; then
            cp -a \
              data/radar/seguimiento \
              /tmp/climaar-historico/
          fi

          if [ -d data/ia ]; then
            cp -a \
              data/ia \
              /tmp/climaar-historico/
          fi

          if [ -d data/meteorologia ]; then
            cp -a \
              data/meteorologia \
              /tmp/climaar-historico/
          fi

      - name: Publicar artefacto histórico
        uses: actions/upload-artifact@v4
        with:
          name: climaar-procesamiento-historico
          path: /tmp/climaar-historico
          retention-days: 30

      - name: Persistir resultados
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/radar/historico \
            data/radar/seguimiento \
            data/ia \
            data/meteorologia

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit \
            -m "ClimaAR: actualizar procesamiento histórico"

          for intento in 1 2 3; do
            echo "Intento de sincronización: $intento"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true

              if [ "$intento" -eq 3 ]; then
                echo "ERROR: rebase falló definitivamente."
                exit 1
              fi

              sleep 2
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push exitoso."
              exit 0
            fi

            if [ "$intento" -eq 3 ]; then
              echo "ERROR: push falló definitivamente."
              exit 1
            fi

            sleep 2
          done
