name: Entrenar modelo ClimaAR

on:
  workflow_dispatch:

jobs:
  entrenar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas scikit-learn joblib

      - name: Entrenar modelo
        run: |
          python - <<'PY'
          import zipfile
          import json
          import joblib
          import pandas as pd

          from sklearn.ensemble import HistGradientBoostingRegressor
          from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score

          ZIP = "climaar_smn_2017_2025_procesado.zip"

          with zipfile.ZipFile(ZIP) as z:
              csvs = [x for x in z.namelist() if x.endswith(".csv")]
              if not csvs:
                  raise SystemExit("No se encontró CSV dentro del ZIP")

              with z.open(csvs[0]) as f:
                  df = pd.read_csv(f)

          print("Columnas:", list(df.columns))

          if "fecha_hora" not in df.columns:
              if "fecha" in df.columns and "hora" in df.columns:
                  df["fecha_hora"] = pd.to_datetime(
                      df["fecha"].astype(str) + " " + df["hora"].astype(str),
                      errors="coerce"
                  )
              else:
                  raise SystemExit("No se encontró fecha_hora")

          df["fecha_hora"] = pd.to_datetime(
              df["fecha_hora"],
              errors="coerce"
          )

          df = df.dropna(subset=["fecha_hora"])

          df = df[
              df["estacion"]
              .astype(str)
              .str.upper()
              .str.contains("BAHIA BLANCA", na=False)
          ].copy()

          df = df.sort_values("fecha_hora")
          df = df.drop_duplicates("fecha_hora")
          df = df.reset_index(drop=True)

          print("Registros Bahía Blanca:", len(df))

          variables = [
              "temperatura",
              "humedad",
              "presion",
              "direccion_viento",
              "velocidad_viento"
          ]

          variables = [
              x for x in variables
              if x in df.columns
          ]

          for v in variables:
              df[v] = pd.to_numeric(df[v], errors="coerce")

          if "velocidad_viento" in df.columns and "direccion_viento" in df.columns:
              import numpy as np

              direccion = np.deg2rad(df["direccion_viento"])

              df["viento_u"] = (
                  -df["velocidad_viento"] * np.sin(direccion)
              )

              df["viento_v"] = (
                  -df["velocidad_viento"] * np.cos(direccion)
              )

              variables += ["viento_u", "viento_v"]

          if "humedad" in df.columns and "temperatura" in df.columns:
              import numpy as np

              rh = df["humedad"].clip(1, 100)
              t = df["temperatura"]

              gamma = (
                  np.log(rh / 100)
                  + (17.625 * t) / (243.04 + t)
              )

              df["punto_rocio"] = (
                  243.04 * gamma / (17.625 - gamma)
              )

              variables += ["punto_rocio"]

          df["hora_sin"] = np.sin(
              2 * np.pi * df["fecha_hora"].dt.hour / 24
          )

          df["hora_cos"] = np.cos(
              2 * np.pi * df["fecha_hora"].dt.hour / 24
          )

          variables += ["hora_sin", "hora_cos"]

          if "temperatura" not in df.columns:
              raise SystemExit("No existe temperatura")

          for horas in [1, 3, 6, 24]:
              for v in variables:
                  df[f"{v}_lag{horas}"] = df[v].shift(horas)

          df["temperatura_objetivo"] = df["temperatura"].shift(-1)

          features = [
              x for x in df.columns
              if "_lag" in x
          ]

          features += variables

          train_df = df[
              features + ["temperatura_objetivo"]
          ].dropna().reset_index(drop=True)

          print("Registros utilizables:", len(train_df))

          corte = int(len(train_df) * 0.80)

          train = train_df.iloc[:corte]
          test = train_df.iloc[corte:]

          X_train = train[features]
          y_train = train["temperatura_objetivo"]

          X_test = test[features]
          y_test = test["temperatura_objetivo"]

          modelo = HistGradientBoostingRegressor(
              max_iter=300,
              learning_rate=0.05,
              max_leaf_nodes=31,
              l2_regularization=1.0,
              random_state=42
          )

          modelo.fit(X_train, y_train)

          pred = modelo.predict(X_test)

          mae = mean_absolute_error(y_test, pred)
          rmse = mean_squared_error(y_test, pred) ** 0.5
          r2 = r2_score(y_test, pred)

          print("")
          print("========== RESULTADOS ==========")
          print(f"MAE:  {mae:.3f} °C")
          print(f"RMSE: {rmse:.3f} °C")
          print(f"R²:   {r2:.4f}")
          print("================================")

          import os
          os.makedirs("modelo", exist_ok=True)

          joblib.dump(
              modelo,
              "modelo/climaar_modelo_temperatura_1h.joblib"
          )

          metricas = {
              "modelo": "HistGradientBoostingRegressor",
              "objetivo": "temperatura_1_hora_adelante",
              "registros": int(len(train_df)),
              "entrenamiento": int(len(train)),
              "prueba": int(len(test)),
              "MAE_C": float(mae),
              "RMSE_C": float(rmse),
              "R2": float(r2)
          }

          with open(
              "modelo/metricas_modelo.json",
              "w"
          ) as f:
              json.dump(
                  metricas,
                  f,
                  indent=2
              )

          print("")
          print("MODELO GENERADO CORRECTAMENTE")
          PY

      - name: Guardar modelo
        uses: actions/upload-artifact@v4
        with:
          name: modelo-climaar-v1
          path: modelo/
          retention-days: 90
