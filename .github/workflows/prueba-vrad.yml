name: Prueba VRAD RMA10 - Profunda

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Buscar elevaciones y tilesets VRAD
        shell: bash
        run: |
          set -e

          BASE="https://data.mapasmn.com"
          OUT="/tmp/vrad"

          mkdir -p "$OUT"

          echo "=============================================="
          echo "   DIAGNOSTICO PROFUNDO VRAD RMA10"
          echo "=============================================="

          echo
          echo "1) OPENAPI"
          echo "----------------------------------------------"

          curl -L --max-time 30 -sS \
            "$BASE/openapi.json" \
            -o "$OUT/openapi.json"

          python - <<'PY'
          import json

          p="/tmp/vrad/openapi.json"

          with open(p,encoding="utf-8") as f:
              data=json.load(f)

          print("RUTAS RADAR EN OPENAPI:")
          print()

          for path, methods in data.get("paths",{}).items():
              if "radar-sinarame" not in path.lower():
                  continue

              print(path)

              for method, spec in methods.items():
                  if method.lower() not in {
                      "get","post","put","delete","patch"
                  }:
                      continue

                  print("  METHOD:", method.upper())

                  for par in spec.get("parameters",[]):
                      name=par.get("name")
                      loc=par.get("in")
                      required=par.get("required",False)

                      print(
                          "   PARAM:",
                          name,
                          "IN:",
                          loc,
                          "REQUIRED:",
                          required
                      )

                  print()
          PY

          echo
          echo "2) VARIABLES DE RMA10"
          echo "----------------------------------------------"

          curl -L --max-time 20 -sS \
            "$BASE/products/radar-sinarame/RMA10" \
            -o "$OUT/rma10.json"

          cat "$OUT/rma10.json"

          echo
          echo
          echo "3) INFORMACION VRAD"
          echo "----------------------------------------------"

          curl -L --max-time 20 -sS \
            "$BASE/products/radar-sinarame/RMA10/VRAD" \
            -o "$OUT/vrad.json"

          cat "$OUT/vrad.json"

          echo
          echo
          echo "4) PROBAR ELEVACIONES"
          echo "----------------------------------------------"

          for ELEV in \
            elev0 \
            elev1 \
            elev2 \
            0 \
            1 \
            2
          do

            URL="$BASE/products/radar-sinarame/RMA10/VRAD/$ELEV"

            echo
            echo "----------------------------------------------"
            echo "ELEVACION: $ELEV"
            echo "URL: $URL"
            echo "----------------------------------------------"

            FILE="$OUT/elev_${ELEV}.json"

            HTTP=$(curl -L --max-time 20 -sS \
              -o "$FILE" \
              -w "%{http_code}" \
              "$URL" || true)

            echo "HTTP=$HTTP"

            if [ -s "$FILE" ]; then
              cat "$FILE"
            else
              echo "SIN_RESPUESTA"
            fi

          done

          echo
          echo
          echo "5) PROBAR DBZH PARA COMPARAR"
          echo "----------------------------------------------"

          for ELEV in elev0 elev1 elev2 0 1 2
          do

            URL="$BASE/products/radar-sinarame/RMA10/dbzh/$ELEV"

            echo
            echo "ELEVACION DBZH: $ELEV"
            echo "URL: $URL"

            curl -L --max-time 20 -sS \
              -w "\nHTTP=%{http_code}\n" \
              "$URL" || true

          done

          echo
          echo
          echo "6) EXTRAER POSIBLES TILESETS"
          echo "----------------------------------------------"

          python - <<'PY'
          import json
          import glob
          import re

          encontrados=set()

          for fn in glob.glob("/tmp/vrad/*.json"):

              try:
                  with open(fn,encoding="utf-8") as f:
                      txt=f.read()
              except:
                  continue

              # Buscar timestamps
              for x in re.findall(
                  r'\d{8}T\d{4,6}Z',
                  txt
              ):
                  encontrados.add(x)

              # Buscar campos típicos
              try:
                  obj=json.loads(txt)
              except:
                  continue

              def walk(x):

                  if isinstance(x,dict):

                      for k,v in x.items():

                          kl=str(k).lower()

                          if (
                              "tileset" in kl
                              or "timestamp" in kl
                              or "time" == kl
                              or "date" in kl
                          ):
                              print(
                                  "ARCHIVO:",
                                  fn,
                                  "CAMPO:",
                                  k,
                                  "VALOR:",
                                  v
                              )

                          walk(v)

                  elif isinstance(x,list):

                      for v in x:
                          walk(v)

              walk(obj)

          print()
          print("TIMESTAMPS ENCONTRADOS:")

          for x in sorted(encontrados):
              print(x)
          PY

          echo
          echo
          echo "7) RESULTADO"
          echo "=============================================="
          echo
          echo "Si aparece:"
          echo " - elevation"
          echo " - tileset_id"
          echo " - timestamp"
          echo " - o una URL .webp"
          echo
          echo "ENTONCES TENEMOS UNA VIA REAL PARA OBTENER VRAD."
          echo
          echo "Si VRAD sigue devolviendo elevations=[] mientras"
          echo "DBZH tiene elevaciones/tilesets, entonces el servicio"
          echo "publico actualmente no esta entregando VRAD para RMA10."
          echo
          echo "=============================================="
