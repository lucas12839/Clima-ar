name: Auditoria red RMA10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Playwright
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Auditar conexiones de SINARAME
        run: |
          set -e

          mkdir -p auditoria_rma10

          python <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          import re
          import time

          URL = "https://radares.hidricosargentina.gob.ar/"

          OUT = Path("auditoria_rma10")
          OUT.mkdir(exist_ok=True)

          requests_data = []
          responses_data = []
          scripts = {}

          def guardar_json(path, data):
              path.write_text(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1920,
                      "height": 1080
                  }
              )

              page = context.new_page()

              def on_request(request):
                  url = request.url

                  requests_data.append({
                      "method": request.method,
                      "url": url,
                      "resource_type": request.resource_type,
                      "headers": dict(request.headers)
                  })

              def on_response(response):
                  url = response.url

                  item = {
                      "status": response.status,
                      "url": url,
                      "content_type": response.headers.get(
                          "content-type",
                          ""
                      ),
                      "headers": dict(response.headers)
                  }

                  responses_data.append(item)

                  # Guardar solamente respuestas de texto
                  # potencialmente útiles para descubrir endpoints.
                  content_type = (
                      response.headers.get(
                          "content-type",
                          ""
                      ).lower()
                  )

                  if (
                      "javascript" in content_type
                      or
                      "json" in content_type
                      or
                      "text/" in content_type
                  ):
                      try:
                          body = response.body()

                          if len(body) <= 5_000_000:
                              text = body.decode(
                                  "utf-8",
                                  errors="replace"
                              )

                              if (
                                  "RMA10" in text
                                  or
                                  "VRAD" in text
                                  or
                                  "H5" in text
                                  or
                                  "BUFR" in text
                                  or
                                  "sinarame" in text.lower()
                                  or
                                  "/cache/" in text
                              ):
                                  nombre = (
                                      f"script_{len(scripts):04d}.txt"
                                  )

                                  (OUT / nombre).write_text(
                                      text,
                                      encoding="utf-8"
                                  )

                                  scripts[nombre] = {
                                      "url": url,
                                      "content_type": content_type,
                                      "size": len(text)
                                  }

                      except Exception:
                          pass

              page.on(
                  "request",
                  on_request
              )

              page.on(
                  "response",
                  on_response
              )

              print("=" * 70)
              print("ABRIENDO SINARAME")
              print("=" * 70)

              try:
                  page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=60_000
                  )
              except Exception as exc:
                  print(
                      "ERROR DE CARGA:",
                      repr(exc)
                  )

              # Dar tiempo a que JavaScript establezca conexiones.
              time.sleep(45)

              # Intentar esperar actividad adicional.
              try:
                  page.wait_for_load_state(
                      "networkidle",
                      timeout=15_000
                  )
              except Exception:
                  pass

              time.sleep(15)

              # HTML final.
              try:
                  (OUT / "pagina_final.html").write_text(
                      page.content(),
                      encoding="utf-8"
                  )
              except Exception:
                  pass

              # URLs de scripts cargados.
              try:
                  script_urls = page.locator(
                      "script"
                  ).evaluate_all(
                      """
                      els => els.map(
                          e => e.src || ''
                      ).filter(Boolean)
                      """
                  )

                  guardar_json(
                      OUT / "scripts_cargados.json",
                      script_urls
                  )

              except Exception:
                  pass

              browser.close()

          # ==================================================
          # FILTRAR TODO LO INTERESANTE
          # ==================================================

          patrones = [
              r"RMA10",
              r"VRAD",
              r"WRAD",
              r"DBZH",
              r"H5",
              r"HDF5",
              r"BUFR",
              r"SINARAME",
              r"cache/",
              r"radar",
              r"api",
              r"json",
              r"geo",
              r"tile",
              r"wms",
              r"wmts",
              r"cog",
              r"geotiff",
              r"tif",
              r"websocket",
              r"\.bin",
              r"\.dat",
              r"\.nc",
          ]

          regex = re.compile(
              "|".join(patrones),
              re.I
          )

          urls_interesantes = []

          for item in requests_data:
              if regex.search(item["url"]):
                  urls_interesantes.append(item)

          respuestas_interesantes = []

          for item in responses_data:
              if regex.search(item["url"]):
                  respuestas_interesantes.append(item)

          guardar_json(
              OUT / "todas_las_requests.json",
              requests_data
          )

          guardar_json(
              OUT / "todas_las_responses.json",
              responses_data
          )

          guardar_json(
              OUT / "requests_interesantes.json",
              urls_interesantes
          )

          guardar_json(
              OUT / "responses_interesantes.json",
              respuestas_interesantes
          )

          guardar_json(
              OUT / "scripts_interesantes.json",
              scripts
          )

          # Informe de texto rápido.
          with open(
              OUT / "RESUMEN.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "AUDITORIA RED RMA10 - SINARAME\n"
              )
              f.write("=" * 70 + "\n\n")

              f.write(
                  f"Total requests: "
                  f"{len(requests_data)}\n"
              )

              f.write(
                  f"Requests interesantes: "
                  f"{len(urls_interesantes)}\n"
              )

              f.write(
                  f"Total responses: "
                  f"{len(responses_data)}\n"
              )

              f.write(
                  f"Responses interesantes: "
                  f"{len(respuestas_interesantes)}\n"
              )

              f.write(
                  f"Scripts/recursos de texto interesantes: "
                  f"{len(scripts)}\n\n"
              )

              f.write(
                  "REQUESTS INTERESANTES\n"
              )
              f.write("-" * 70 + "\n")

              for item in urls_interesantes:
                  f.write(
                      f"{item['method']} "
                      f"{item['resource_type']} "
                      f"{item['url']}\n"
                  )

              f.write(
                  "\nRESPONSES INTERESANTES\n"
              )
              f.write("-" * 70 + "\n")

              for item in respuestas_interesantes:
                  f.write(
                      f"{item['status']} "
                      f"{item['content_type']} "
                      f"{item['url']}\n"
                  )

              f.write(
                  "\nSCRIPTS/RECURSOS CON PALABRAS CLAVE\n"
              )
              f.write("-" * 70 + "\n")

              for nombre, info in scripts.items():
                  f.write(
                      f"{nombre} | "
                      f"{info['url']} | "
                      f"{info['content_type']} | "
                      f"{info['size']} bytes\n"
                  )

          print()
          print("=" * 70)
          print("AUDITORIA TERMINADA")
          print("=" * 70)
          print(
              f"Requests: {len(requests_data)}"
          )
          print(
              f"Interesantes: {len(urls_interesantes)}"
          )
          print(
              f"Responses: {len(responses_data)}"
          )
          print(
              f"Scripts interesantes: {len(scripts)}"
          )

      - name: Subir auditoria
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-red-rma10
          path: auditoria_rma10/
          if-no-files-found: warn
