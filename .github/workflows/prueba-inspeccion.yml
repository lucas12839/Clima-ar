name: Prueba inspeccion fuentes (temporal)
on:
  push:
    branches: [prueba-inspeccion]
jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Ciclo Intelligence completo con datos reales (paso 2)
        run: |
          cp -r . /tmp/copia
          python herramientas/emular_workflow.py /tmp/copia .github/workflows/climaar-intelligence.yml $(which python) --desde "Señales de superficie" --hasta "Validar integridad" 2>&1 | grep -E "^(OK|FALLA)|Celdas|Error|error" | head -60
          cd /tmp/copia
          python scripts/validar_integridad_climaar.py | grep -E "Celdas|INTEGRIDAD"
          echo "---- refresco"
          time python scripts/celdas_localidad.py
          python3 - <<'PY'
          import json
          d = json.load(open('data/ia/celdas_localidad.json'))
          print({k: d.get(k) for k in ('disponible', 'motivo', 'edad_radar_min', 'rayos', 'movimiento')})
          for k, v in (d.get('localidades') or {}).items():
              print(' ', k, json.dumps(v, ensure_ascii=False))
          print('pendientes', len(d.get('pendientes') or []), 'resumen', d.get('resumen'))
          PY
