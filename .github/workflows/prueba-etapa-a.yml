name: Prueba etapa A (temporal)
on:
  push:
    branches: [prueba-etapa-a]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt
      - run: python herramientas/sondear_redes.py | gzip | base64 -w0 | sed 's/^/RESULTADO_GZ /'; echo
