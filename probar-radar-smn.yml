name: Probar Radar SMN RMA10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturar-radar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar ClimaAR
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Capturar radar SMN
        run: |
          python scraper/capturar_radar_smn.py

      - name: Mostrar resultado
        run: |
          echo "Archivos generados:"
          ls -lh data/radar/
          echo ""
          echo "Histórico:"
          ls -lh data/radar/historico/ | tail -10

      - name: Guardar captura como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-radar-smn
          path: |
            data/radar/actual.png
            data/radar/historico/
          if-no-files-found: warn

      - name: Guardar cambios en GitHub
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/radar

          git diff --cached --quiet || \
            git commit -m "Prueba captura radar SMN RMA10"

          git push
